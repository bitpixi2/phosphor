<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1520"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.7  0 0 0 0 1  0 0 0 .12 0"/>
    </filter>
  </defs>

  <rect width="640" height="432" fill="url(#bg)"/>
  <rect width="640" height="432" filter="url(#grain)" opacity="0.35"/>

  <!-- ledger grid -->
  <g opacity="0.18" stroke="#b4c8ff" stroke-width="1">
    <path d="M40 112H600"/>
    <path d="M40 152H600"/>
    <path d="M40 192H600"/>
    <path d="M40 232H600"/>
    <path d="M40 272H600"/>
    <path d="M40 312H600"/>
    <path d="M120 96V336"/>
    <path d="M240 96V336"/>
    <path d="M360 96V336"/>
    <path d="M480 96V336"/>
  </g>

  <!-- CRT box -->
  <rect x="62" y="74" width="220" height="62" rx="8" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.18)"/>
  <path d="M78 106H266" stroke="rgba(120,255,200,0.55)" stroke-width="2"/>
  <path d="M78 92H200" stroke="rgba(120,255,200,0.35)" stroke-width="2"/>

  <!-- week flow -->
  <g stroke="rgba(212,168,85,0.45)" stroke-width="2" fill="none">
    <path d="M150 372H192"/>
    <path d="M286 372H328"/>
    <path d="M422 372H464"/>
    <path d="M192 372l-10-6v12z" fill="rgba(212,168,85,0.45)"/>
    <path d="M328 372l-10-6v12z" fill="rgba(212,168,85,0.45)"/>
    <path d="M464 372l-10-6v12z" fill="rgba(212,168,85,0.45)"/>
  </g>
  <g fill="rgba(212,168,85,0.75)" opacity="0.9">
    <rect x="64" y="366" width="10" height="10" rx="2"/>
    <rect x="200" y="366" width="10" height="10" rx="2"/>
    <rect x="336" y="366" width="10" height="10" rx="2"/>
    <rect x="468" y="366" width="10" height="10" rx="2"/>
  </g>

  <!-- anchor mark -->
  <g opacity="0.95" stroke="rgba(180,200,255,0.55)" fill="none" stroke-width="2">
    <circle cx="520" cy="106" r="18"/>
    <path d="M502 106H538"/>
  </g>
  <circle cx="520" cy="106" r="6" fill="rgba(120,255,200,0.55)"/>
</svg>
