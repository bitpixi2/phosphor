<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1520"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.7  0 0 0 0 1  0 0 0 .12 0"/>
    </filter>
  </defs>

  <rect width="640" height="432" fill="url(#bg)"/>
  <rect width="640" height="432" filter="url(#grain)" opacity="0.33"/>

  <!-- left: symmetry -->
  <rect x="70" y="128" width="200" height="176" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(180,200,255,0.20)"/>
  <g stroke="rgba(120,255,200,0.50)" stroke-width="2" opacity="0.9">
    <path d="M110 168h120"/>
    <path d="M110 204h120"/>
    <path d="M110 240h120"/>
  </g>
  <g opacity="0.8" fill="rgba(120,255,200,0.55)">
    <circle cx="102" cy="296" r="4"/>
    <circle cx="118" cy="296" r="4" opacity="0.7"/>
    <circle cx="134" cy="296" r="4" opacity="0.5"/>
  </g>

  <!-- right: spectrum -->
  <rect x="370" y="128" width="200" height="176" rx="12" fill="rgba(0,0,0,0.28)" stroke="rgba(180,200,255,0.20)"/>
  <g stroke="rgba(212,168,85,0.55)" stroke-width="2" opacity="0.9">
    <path d="M408 260V170"/>
    <path d="M444 260V154"/>
    <path d="M480 260V182"/>
    <path d="M516 260V138"/>
  </g>
  <g opacity="0.85" fill="rgba(212,168,85,0.55)">
    <rect x="404" y="288" width="10" height="10" rx="2"/>
    <rect x="420" y="292" width="10" height="6" rx="2" opacity="0.7"/>
    <rect x="436" y="294" width="10" height="4" rx="2" opacity="0.55"/>
  </g>

  <!-- bridge -->
  <g fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2">
    <path d="M270 216C300 170 340 170 370 216"/>
    <path d="M270 216C300 262 340 262 370 216"/>
  </g>
  <g fill="rgba(120,255,200,0.65)">
    <circle cx="270" cy="216" r="4"/>
  </g>
  <g fill="rgba(212,168,85,0.65)">
    <circle cx="370" cy="216" r="4"/>
  </g>

  <!-- crest mark -->
  <g opacity="0.85" fill="none" stroke="rgba(180,200,255,0.28)" stroke-width="2">
    <circle cx="120" cy="104" r="28"/>
    <path d="M120 76V132"/>
  </g>
  <g opacity="0.9" fill="rgba(120,255,200,0.55)">
    <circle cx="120" cy="104" r="5"/>
  </g>
</svg>
