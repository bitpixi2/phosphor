    <path d="M210 202H250" stroke="rgba(212,168,85,0.45)"/>
    <path d="M390 202H430" stroke="rgba(212,168,85,0.45)"/>
    <path d="M250 202l-10-6v12z" fill="rgba(212,168,85,0.45)" stroke="none"/>
    <path d="M430 202l-10-6v12z" fill="rgba(212,168,85,0.45)" stroke="none"/>
