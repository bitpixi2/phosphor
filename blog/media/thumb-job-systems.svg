<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1520"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.7  0 0 0 0 1  0 0 0 .12 0"/>
    </filter>
  </defs>

  <rect width="640" height="432" fill="url(#bg)"/>
  <rect width="640" height="432" filter="url(#grain)" opacity="0.34"/>

  <!-- pipeline -->
  <g fill="none" stroke-width="2" opacity="0.95">
    <rect x="70" y="160" width="140" height="84" rx="10" stroke="rgba(180,200,255,0.22)" fill="rgba(0,0,0,0.24)"/>
    <rect x="250" y="160" width="140" height="84" rx="10" stroke="rgba(180,200,255,0.22)" fill="rgba(0,0,0,0.24)"/>
    <rect x="430" y="160" width="140" height="84" rx="10" stroke="rgba(180,200,255,0.22)" fill="rgba(0,0,0,0.24)"/>
    <path d="M210 202H250" stroke="rgba(212,168,85,0.45)"/>
    <path d="M390 202H430" stroke="rgba(212,168,85,0.45)"/>
    <path d="M250 202l-10-6v12z" fill="rgba(212,168,85,0.45)" stroke="none"/>
    <path d="M430 202l-10-6v12z" fill="rgba(212,168,85,0.45)" stroke="none"/>
  </g>

  <!-- labels -->
  <g font-family="Space Mono, monospace" font-size="14" fill="rgba(180,200,255,0.70)">
    <text x="96" y="196">APPLY</text>
    <text x="274" y="196">SYSTEMS</text>
    <text x="454" y="196">YES</text>
  </g>

  <!-- checkmark -->
  <path d="M474 226l18 18 38-44" fill="none" stroke="rgba(120,255,200,0.62)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Space Mono, monospace" font-size="22" fill="#d4dff0" opacity="0.95">
    <text x="72" y="96">JOB SEEKING</text>
    <text x="72" y="124">AS SYSTEMS</text>
  </g>
  <g font-family="Space Mono, monospace" font-size="14" fill="rgba(180,200,255,0.65)">
    <text x="72" y="154">consolidation • continuity</text>
  </g>
</svg>
