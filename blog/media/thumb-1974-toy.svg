<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1520"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.7  0 0 0 0 1  0 0 0 .14 0"/>
    </filter>
  </defs>

  <rect width="640" height="432" fill="url(#bg)"/>
  <rect width="640" height="432" filter="url(#grain)" opacity="0.32"/>

  <!-- desk -->
  <rect x="60" y="272" width="520" height="88" rx="10" fill="rgba(0,0,0,0.30)" stroke="rgba(255,255,255,0.16)"/>
  <path d="M92 308H548" stroke="rgba(212,168,85,0.25)" stroke-width="2"/>

  <!-- toy frame -->
  <rect x="240" y="128" width="160" height="196" rx="12" fill="rgba(0,0,0,0.26)" stroke="rgba(180,200,255,0.20)"/>
  <path d="M320 148V268" stroke="rgba(180,200,255,0.35)" stroke-width="2"/>

  <!-- pendulum arcs -->
  <g fill="none" stroke-width="3" opacity="0.9">
    <path d="M320 168c-64 36-88 88-64 136" stroke="rgba(120,255,200,0.55)"/>
    <path d="M320 168c64 36 88 88 64 136" stroke="rgba(212,168,85,0.50)"/>
    <path d="M320 180c-44 28-58 70-42 106" stroke="rgba(180,200,255,0.40)"/>
    <path d="M320 180c44 28 58 70 42 106" stroke="rgba(180,200,255,0.30)"/>
  </g>

  <!-- weights -->
  <circle cx="256" cy="304" r="10" fill="rgba(120,255,200,0.75)"/>
  <circle cx="384" cy="304" r="10" fill="rgba(212,168,85,0.75)"/>

  <!-- stamp mark -->
  <g opacity="0.9" fill="none" stroke="rgba(180,200,255,0.30)" stroke-width="2">
    <circle cx="116" cy="114" r="36"/>
    <path d="M116 78V150"/>
    <path d="M80 114H152"/>
  </g>
  <circle cx="116" cy="114" r="6" fill="rgba(212,168,85,0.60)"/>
</svg>
