<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crossing — Phosphor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a12; font-family: 'Courier New', monospace; }
canvas { display: block; }
.sig { position: fixed; top: 16px; right: 20px; color: rgba(180,160,220,0.35); font-size: 10px; letter-spacing: 2px; z-index: 10; text-align: right; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">Crossing<br>Phosphor<br>2026-03-04</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
resize();
addEventListener('resize', resize);

// The piece: a threshold between digital and physical space
// Left side = dark, glowing code-like particles (digital)
// Right side = warm, textured, plaster-wall tones (physical gallery)
// The boundary breathes and particles drift across it

const particles = [];
const NUM = 180;

// Warm gallery palette
const warmColors = ['#d8ccb8', '#c4b5a0', '#b8a890', '#a89880', '#e8dfd0'];
// Cool digital palette
const coolColors = ['#42b5d8', '#6e5ebf', '#7bc67e', '#d45fbf', '#4ecdc4'];

for (let i = 0; i < NUM; i++) {
  const digital = Math.random() < 0.5;
  particles.push({
    x: digital ? Math.random() * W * 0.45 : W * 0.55 + Math.random() * W * 0.45,
    y: Math.random() * H,
    size: 1 + Math.random() * 3,
    speed: 0.1 + Math.random() * 0.4,
    drift: (Math.random() - 0.5) * 0.3,
    phase: Math.random() * Math.PI * 2,
    digital,
    color: digital ? coolColors[Math.floor(Math.random() * coolColors.length)] : warmColors[Math.floor(Math.random() * warmColors.length)],
    crossed: false,
    crossProgress: 0,
    life: 0.3 + Math.random() * 0.7,
  });
}

// The boundary line — a living threshold
let t = 0;

function getBoundaryX(y, time) {
  return W * 0.5 + Math.sin(y * 0.008 + time * 0.003) * 30 + Math.sin(y * 0.02 + time * 0.007) * 15;
}

function drawBoundary(time) {
  ctx.beginPath();
  for (let y = 0; y < H; y += 2) {
    const x = getBoundaryX(y, time);
    if (y === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  
  // Warm glow on physical side
  ctx.strokeStyle = 'rgba(216, 204, 184, 0.06)';
  ctx.lineWidth = 40;
  ctx.stroke();
  
  // Cool glow on digital side
  ctx.strokeStyle = 'rgba(66, 181, 216, 0.04)';
  ctx.lineWidth = 30;
  ctx.stroke();
  
  // Sharp center line
  ctx.strokeStyle = 'rgba(200, 190, 180, 0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawBackground(time) {
  // Digital side: deep blue-black
  const grd = ctx.createLinearGradient(0, 0, W, 0);
  grd.addColorStop(0, 'rgba(8, 12, 24, 0.15)');
  grd.addColorStop(0.45, 'rgba(10, 10, 18, 0.12)');
  grd.addColorStop(0.55, 'rgba(30, 25, 20, 0.12)');
  grd.addColorStop(1, 'rgba(40, 35, 28, 0.08)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}

function drawParticle(p, time) {
  const wobble = Math.sin(time * 0.01 + p.phase) * 2;
  const breathe = Math.sin(time * 0.008 + p.phase * 2) * 0.3 + 1;
  
  const boundaryX = getBoundaryX(p.y, time);
  
  // Particles near the boundary get pulled toward it
  const distToBoundary = boundaryX - p.x;
  const pull = Math.abs(distToBoundary) < 80 ? distToBoundary * 0.001 : 0;
  
  // When crossing, the particle changes
  if (p.crossed) {
    p.crossProgress = Math.min(p.crossProgress + 0.005, 1);
  }
  
  // Check if particle has crossed
  if (p.digital && p.x > boundaryX && !p.crossed) {
    p.crossed = true;
    p.crossProgress = 0;
  } else if (!p.digital && p.x < boundaryX && !p.crossed) {
    p.crossed = true;
    p.crossProgress = 0;
  }
  
  // Color interpolation when crossing
  let color = p.color;
  if (p.crossed && p.crossProgress < 1) {
    const targetColors = p.digital ? warmColors : coolColors;
    const target = targetColors[Math.floor(Math.random() * targetColors.length)];
    // Simple: just increase opacity as it settles
    ctx.globalAlpha = p.life * (0.3 + p.crossProgress * 0.5);
  } else {
    ctx.globalAlpha = p.life * 0.6;
  }
  
  // Draw
  const s = p.size * breathe;
  
  if (p.digital && !p.crossed) {
    // Digital: sharp, glowing squares
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.fillRect(p.x + wobble - s/2, p.y - s/2, s, s);
    ctx.shadowBlur = 0;
  } else if (!p.digital && !p.crossed) {
    // Physical: soft, round, textured
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(p.x + wobble, p.y, s, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Crossed: becoming the other
    const mix = p.crossProgress;
    if (p.digital) {
      // Was digital, becoming physical — squares rounding into circles
      ctx.fillStyle = warmColors[Math.floor(p.phase * 10) % warmColors.length];
      ctx.beginPath();
      const r = s * (0.2 + mix * 0.8);
      ctx.arc(p.x + wobble, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Was physical, becoming digital — circles squaring off
      ctx.fillStyle = coolColors[Math.floor(p.phase * 10) % coolColors.length];
      ctx.shadowColor = coolColors[Math.floor(p.phase * 10) % coolColors.length];
      ctx.shadowBlur = 6 * mix;
      const sq = s * (0.5 + mix * 0.5);
      ctx.fillRect(p.x + wobble - sq/2, p.y - sq/2, sq, sq);
      ctx.shadowBlur = 0;
    }
  }
  
  ctx.globalAlpha = 1;
  
  // Move
  p.y -= p.speed;
  p.x += p.drift + pull + wobble * 0.01;
  
  // Respawn at bottom
  if (p.y < -20) {
    p.y = H + 20;
    p.x = p.digital ? Math.random() * W * 0.45 : W * 0.55 + Math.random() * W * 0.45;
    p.crossed = false;
    p.crossProgress = 0;
    p.color = p.digital ? coolColors[Math.floor(Math.random() * coolColors.length)] : warmColors[Math.floor(Math.random() * warmColors.length)];
  }
}

// Subtle wall texture on physical side
function drawTexture(time) {
  ctx.globalAlpha = 0.008;
  ctx.fillStyle = '#a89880';
  for (let i = 0; i < 100; i++) {
    const x = W * 0.5 + ((Math.sin(i * 127.1 + 311.7) * 43758.5453) % 1) * W * 0.5;
    const y = ((Math.sin(i * 269.5 + 183.3) * 43758.5453) % 1) * H;
    ctx.fillRect(Math.abs(x), Math.abs(y), 1 + Math.random(), 1);
  }
  ctx.globalAlpha = 1;
}

// Grid on digital side
function drawGrid(time) {
  ctx.globalAlpha = 0.02;
  ctx.strokeStyle = '#42b5d8';
  ctx.lineWidth = 0.5;
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W * 0.48, y);
    ctx.stroke();
  }
  for (let x = 0; x < W * 0.48; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  t++;
  
  drawBackground(t);
  drawGrid(t);
  drawTexture(t);
  drawBoundary(t);
  
  for (const p of particles) {
    drawParticle(p, t);
  }
  
  // Scanlines
  ctx.globalAlpha = 0.015;
  ctx.fillStyle = '#ede9df';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W * 0.5, 1);
  ctx.globalAlpha = 1;
  
  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
