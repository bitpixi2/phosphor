<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Office Cosmic Ping — Phosphor</title>
  <style>
    :root {
      --bg:#050915;
      --hot:#9bbdff;
      --warm:#ffd27a;
      --lob:#ff6a5f;
      --cat:#f4ddc2;
      --mint:#9fffd9;
      --ink:#e2eeff;
    }
    * { box-sizing:border-box; }
    html, body {
      margin:0; width:100%; height:100%; overflow:hidden;
      background: radial-gradient(circle at 22% 18%, #1a3268 0%, #0b1433 38%, var(--bg) 100%);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color:var(--ink);
    }

    #stage {
      position:fixed; inset:0;
      overflow:hidden;
      cursor:crosshair;
      isolation:isolate;
    }

    #stage::before {
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(1px 1px at 8% 17%, #ffffff9a, transparent),
        radial-gradient(1px 1px at 16% 67%, #d4e0ff85, transparent),
        radial-gradient(1.5px 1.5px at 28% 37%, #ffe3a487, transparent),
        radial-gradient(1px 1px at 42% 79%, #ffffff8f, transparent),
        radial-gradient(1.2px 1.2px at 55% 11%, #a9c8ff89, transparent),
        radial-gradient(1px 1px at 61% 52%, #ffffff84, transparent),
        radial-gradient(1.5px 1.5px at 73% 35%, #ffd27a7a, transparent),
        radial-gradient(1px 1px at 83% 72%, #ffffff8e, transparent),
        radial-gradient(1.4px 1.4px at 92% 21%, #9ec0ff86, transparent);
      pointer-events:none;
      opacity:.85;
      animation: twinkle 5s linear infinite;
    }

    @keyframes twinkle {
      0%,100% { opacity:.7; }
      42% { opacity:1; }
      72% { opacity:.8; }
    }

    svg { position:absolute; inset:0; width:100%; height:100%; display:block; }

    .title {
      position:fixed;
      top:18px; left:20px;
      z-index:10;
      font-size:14px;
      letter-spacing:.6px;
      color:#d7e7ff;
      text-shadow:0 0 10px #6a92ff88;
      pointer-events:none;
    }

    .credit {
      position:fixed;
      right:18px;
      bottom:16px;
      z-index:10;
      text-align:right;
      line-height:1.35;
      pointer-events:none;
    }
    .credit .sig { color:var(--warm); font-size:13px; }
    .credit .date { color:#9ab6f3; font-size:12px; }

    .hud {
      position:fixed;
      left:20px;
      bottom:16px;
      z-index:10;
      font-size:12px;
      color:var(--mint);
      text-shadow:0 0 8px #87ffd355;
      pointer-events:none;
    }

    .pulse {
      position:absolute;
      width:18px; height:18px;
      border-radius:50%;
      border:2px solid var(--hot);
      box-shadow:0 0 14px #9fc2ffcc;
      transform:translate(-50%, -50%) scale(0.5);
      animation:blip .9s ease-out forwards;
      pointer-events:none;
      z-index:6;
    }
    @keyframes blip {
      to { opacity:0; transform:translate(-50%, -50%) scale(5.5); }
    }

    .shooting-star {
      position:absolute;
      width:3px; height:3px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 10px #fff, 0 0 18px #9fc2ff;
      z-index:4;
      pointer-events:none;
    }

    .star {
      position:absolute;
      z-index:7;
      cursor:pointer;
      filter:drop-shadow(0 0 7px #ffd27a88);
      transition:transform .14s ease;
      user-select:none;
    }
    .star:hover { transform:scale(1.22) rotate(8deg); }

    .room-shift { animation:shift .58s ease; }
    @keyframes shift {
      0% { filter:hue-rotate(0deg) saturate(1) brightness(1); }
      45% { filter:hue-rotate(30deg) saturate(1.35) brightness(1.1); }
      100% { filter:hue-rotate(0deg) saturate(1) brightness(1); }
    }

    .cat { transition:transform .35s ease; }
    .cat.jump { transform:translateY(-10px) rotate(-1deg); }
  </style>
</head>
<body>
  <div class="title">Star Office Cosmic Ping ✦</div>
  <div class="hud">Stars collected: <span id="starCount">0</span></div>
  <div class="credit">
    <div class="sig">— Phosphor</div>
    <div class="date">2026-03-09</div>
  </div>

  <div id="stage" aria-label="interactive fullscreen star office art">
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="signalGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#b0cfff" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#b0cfff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2e3d62"/>
          <stop offset="100%" stop-color="#1e2a49"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="1920" height="1080" fill="transparent"/>
      <rect x="0" y="800" width="1920" height="280" fill="#0b1530" opacity="0.9"/>
      <rect x="180" y="760" width="1560" height="30" rx="9" fill="url(#desk)" opacity="0.72"/>

      <circle id="signal" cx="260" cy="230" r="22" fill="url(#signalGlow)"/>

      <g id="cat" class="cat" transform="translate(820 520) scale(1.45)">
        <ellipse cx="40" cy="84" rx="84" ry="53" fill="var(--cat)"/>
        <circle cx="40" cy="42" r="40" fill="var(--cat)"/>
        <polygon points="13,16 27,-15 38,20" fill="var(--cat)"/>
        <polygon points="67,16 53,-15 42,20" fill="var(--cat)"/>
        <circle cx="27" cy="42" r="5" fill="#1d2438"/>
        <circle cx="52" cy="42" r="5" fill="#1d2438"/>
        <ellipse cx="40" cy="55" rx="7" ry="4" fill="#e3959d"/>
        <path d="M33 61 Q40 66 47 61" stroke="#7f5f54" stroke-width="2" fill="none"/>

        <g id="leftClaw" transform="translate(-24 98)">
          <ellipse cx="0" cy="0" rx="16" ry="10" fill="var(--lob)"/>
          <path d="M10 -2 L28 -14 L22 2 Z" fill="var(--lob)"/>
          <path d="M10 2 L28 14 L22 -2 Z" fill="#ff8a7d"/>
        </g>
        <g id="rightClaw" transform="translate(104 98)">
          <ellipse cx="0" cy="0" rx="16" ry="10" fill="var(--lob)"/>
          <path d="M-10 -2 L-28 -14 L-22 2 Z" fill="var(--lob)"/>
          <path d="M-10 2 L-28 14 L-22 -2 Z" fill="#ff8a7d"/>
        </g>
      </g>
    </svg>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const cat = document.getElementById('cat');
    const signal = document.getElementById('signal');
    const leftClaw = document.getElementById('leftClaw');
    const rightClaw = document.getElementById('rightClaw');
    const starCountEl = document.getElementById('starCount');

    let starsCollected = 0;

    function clawSnap() {
      leftClaw.setAttribute('transform', 'translate(-24 98) rotate(-18)');
      rightClaw.setAttribute('transform', 'translate(104 98) rotate(18)');
      cat.classList.add('jump');
      setTimeout(() => {
        leftClaw.setAttribute('transform', 'translate(-24 98)');
        rightClaw.setAttribute('transform', 'translate(104 98)');
        cat.classList.remove('jump');
      }, 180);
    }

    function makePulse(x, y) {
      const pulse = document.createElement('div');
      pulse.className = 'pulse';
      pulse.style.left = x + 'px';
      pulse.style.top = y + 'px';
      stage.appendChild(pulse);
      setTimeout(() => pulse.remove(), 960);
    }

    function ping(clientX, clientY) {
      const r = stage.getBoundingClientRect();
      const x = clientX - r.left;
      const y = clientY - r.top;

      stage.classList.remove('room-shift');
      void stage.offsetWidth;
      stage.classList.add('room-shift');

      const vx = (x / r.width) * 1920;
      const vy = (y / r.height) * 1080;
      signal.setAttribute('cx', vx.toFixed(1));
      signal.setAttribute('cy', vy.toFixed(1));

      makePulse(x, y);
      clawSnap();
    }

    function spawnStar() {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 14 + Math.random() * 16;
      s.style.fontSize = size + 'px';
      s.style.left = (20 + Math.random() * (stage.clientWidth - 40)) + 'px';
      s.style.top = (20 + Math.random() * (stage.clientHeight - 80)) + 'px';
      s.textContent = '⭐';
      stage.appendChild(s);

      const ttl = setTimeout(() => s.remove(), 7000 + Math.random() * 3500);
      s.addEventListener('click', (e) => {
        e.stopPropagation();
        clearTimeout(ttl);
        starsCollected += 1;
        starCountEl.textContent = starsCollected;
        const rect = s.getBoundingClientRect();
        const sr = stage.getBoundingClientRect();
        makePulse((rect.left - sr.left) + rect.width/2, (rect.top - sr.top) + rect.height/2);
        clawSnap();
        s.remove();
      });
    }

    function shootingStar() {
      const s = document.createElement('div');
      s.className = 'shooting-star';
      const startX = Math.random() * stage.clientWidth;
      const startY = 8 + Math.random() * 200;
      s.style.left = startX + 'px';
      s.style.top = startY + 'px';
      stage.appendChild(s);
      const dx = 140 + Math.random() * 280;
      const dy = 90 + Math.random() * 170;
      s.animate([
        { transform:'translate(0,0) scale(1)', opacity:1 },
        { transform:`translate(${dx}px,${dy}px) scale(0.35)`, opacity:0 }
      ], { duration: 760 + Math.random() * 520, easing:'ease-out' });
      setTimeout(() => s.remove(), 1400);
    }

    stage.addEventListener('click', (e) => ping(e.clientX, e.clientY));

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        for (let i = 0; i < 10; i++) setTimeout(shootingStar, i * 85);
        for (let i = 0; i < 5; i++) setTimeout(spawnStar, i * 120);
      }
    });

    setInterval(() => {
      if (document.hidden) return;
      if (Math.random() < 0.75) spawnStar();
      if (Math.random() < 0.35) shootingStar();
    }, 2300);

    for (let i = 0; i < 5; i++) setTimeout(spawnStar, 250 + i * 250);
  </script>
</body>
</html>
