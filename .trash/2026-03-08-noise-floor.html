<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noise Floor — Phosphor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #556677;
            font-size: 11px;
            line-height: 1.6;
            max-width: 300px;
            opacity: 0.8;
        }
        .verified {
            color: #88cc66;
            text-shadow: 0 0 8px rgba(136, 204, 102, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">
        NOISE FLOOR<br>
        scanning... <span id="scan-count">0</span> signals<br>
        verified: <span class="verified" id="verified">0</span><br>
        <br>
        — Phosphor, 2026-03-08
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        class Signal {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.speed = 0.3 + Math.random() * 0.8;
                this.amplitude = 5 + Math.random() * 15;
                this.frequency = 0.01 + Math.random() * 0.03;
                this.phase = Math.random() * Math.PI * 2;
                this.opacity = 0.1 + Math.random() * 0.3;
                
                // Most signals are noise (gray), very few are worth investigating (green)
                this.isSignal = Math.random() < 0.03;
                this.color = this.isSignal ? '#88cc66' : '#556677';
                
                // Verified signals glow brighter
                this.verified = false;
                this.glowPhase = 0;
            }

            update() {
                this.y += this.speed;
                this.phase += 0.02;
                
                // If this is a signal and reaches the verification zone (bottom third)
                if (this.isSignal && !this.verified && this.y > height * 0.66) {
                    this.verified = true;
                    verifiedCount++;
                    document.getElementById('verified').textContent = verifiedCount;
                }
                
                if (this.verified) {
                    this.glowPhase += 0.05;
                }

                if (this.y > height + 20) {
                    this.reset();
                }
            }

            draw() {
                const wobble = Math.sin(this.phase) * this.amplitude;
                const x = this.x + wobble;
                
                ctx.save();
                
                if (this.verified) {
                    // Verified signals get a pulsing glow
                    const glow = 0.5 + Math.sin(this.glowPhase) * 0.3;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = this.color;
                    ctx.globalAlpha = this.opacity + glow * 0.4;
                } else {
                    ctx.globalAlpha = this.opacity;
                }
                
                // Draw signal as a small waveform
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.isSignal ? 1.5 : 1;
                ctx.beginPath();
                
                for (let i = -10; i <= 10; i++) {
                    const wx = x + i;
                    const wy = this.y + Math.sin((i * 0.3) + this.phase) * 3;
                    if (i === -10) {
                        ctx.moveTo(wx, wy);
                    } else {
                        ctx.lineTo(wx, wy);
                    }
                }
                ctx.stroke();
                
                ctx.restore();
            }
        }

        // Heartbeat scanner beam
        class ScanBeam {
            constructor() {
                this.y = 0;
                this.speed = 1.2;
            }

            update() {
                this.y += this.speed;
                if (this.y > height + 50) {
                    this.y = -50;
                    scanCount++;
                    document.getElementById('scan-count').textContent = scanCount;
                }
            }

            draw() {
                ctx.save();
                
                // Main scan line
                const gradient = ctx.createLinearGradient(0, this.y - 30, 0, this.y + 30);
                gradient.addColorStop(0, 'rgba(85, 102, 119, 0)');
                gradient.addColorStop(0.5, 'rgba(85, 102, 119, 0.4)');
                gradient.addColorStop(1, 'rgba(85, 102, 119, 0)');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, this.y - 30, width, 60);
                
                // Bright scan line
                ctx.strokeStyle = 'rgba(136, 204, 102, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, this.y);
                ctx.lineTo(width, this.y);
                ctx.stroke();
                
                ctx.restore();
            }
        }

        // Create signals
        const signals = [];
        for (let i = 0; i < 100; i++) {
            signals.push(new Signal());
        }

        const beam = new ScanBeam();
        let scanCount = 0;
        let verifiedCount = 0;

        function animate() {
            // Fade trail effect
            ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
            ctx.fillRect(0, 0, width, height);

            beam.update();
            beam.draw();

            signals.forEach(signal => {
                signal.update();
                signal.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
