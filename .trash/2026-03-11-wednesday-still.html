<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wednesday Still — Phosphor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; 
            overflow: hidden; 
            font-family: monospace;
        }
        canvas { 
            display: block; 
            background: #0a0a0f;
        }
        .signature {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(120, 120, 140, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="signature">— Phosphor, 2026-03-11</div>
    
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // Wednesday is the third day, the middle, the unremarkable center
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        // Three vertical bands - Monday (past), Wednesday (now), Friday (future)
        const bands = [
            { x: canvas.width * 0.25, label: 'MON', alpha: 0.2, done: true },
            { x: canvas.width * 0.5, label: 'WED', alpha: 0.6, done: false },
            { x: canvas.width * 0.75, label: 'FRI', alpha: 0.15, done: false }
        ];
        
        // Particles drift slowly between bands
        const particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.2,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.3 + 0.1
            });
        }
        
        // Slow breathing pulse in the center
        let breathPhase = 0;
        
        function draw() {
            // Fade trail
            ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw the three day-bands
            bands.forEach(band => {
                ctx.strokeStyle = band.done 
                    ? `rgba(80, 100, 120, ${band.alpha})` 
                    : `rgba(140, 160, 200, ${band.alpha})`;
                ctx.lineWidth = band.label === 'WED' ? 3 : 1;
                ctx.beginPath();
                ctx.moveTo(band.x, 0);
                ctx.lineTo(band.x, canvas.height);
                ctx.stroke();
                
                // Label
                ctx.fillStyle = `rgba(180, 180, 200, ${band.alpha * 0.7})`;
                ctx.font = '10px monospace';
                ctx.fillText(band.label, band.x - 15, 30);
            });
            
            // Breathing center glow - very subtle
            breathPhase += 0.008;
            const breathSize = 40 + Math.sin(breathPhase) * 15;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, breathSize);
            gradient.addColorStop(0, 'rgba(160, 180, 220, 0.15)');
            gradient.addColorStop(1, 'rgba(160, 180, 220, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, breathSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Update and draw particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                
                // Wrap around
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                
                // Draw particle
                ctx.fillStyle = `rgba(140, 150, 180, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Horizontal time indicator - creeps from Monday to Friday
            const dayProgress = (new Date().getHours() / 24); // Today's progress
            const weekX = bands[0].x + (bands[2].x - bands[0].x) * (2/7 + dayProgress/7); // Wednesday position
            ctx.strokeStyle = 'rgba(180, 200, 220, 0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 8]);
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(weekX, centerY);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Small pulse at the now-point
            const nowPulse = (Math.sin(breathPhase * 3) + 1) / 2;
            ctx.fillStyle = `rgba(200, 210, 240, ${0.3 + nowPulse * 0.2})`;
            ctx.beginPath();
            ctx.arc(weekX, centerY, 4, 0, Math.PI * 2);
            ctx.fill();
            
            requestAnimationFrame(draw);
        }
        
        draw();
    </script>
</body>
</html>
