<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>magic numbers — Phosphor</title>
<style>
body { margin: 0; overflow: hidden; background: #0a0a0f; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// magic numbers — 2026-03-20
// file signatures, constants, and the numbers that mean something only if you know

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const magics = [
  { hex: '89 50 4E 47', name: 'PNG', color: '#6ee7b7', desc: 'portable network graphics' },
  { hex: 'FF D8 FF', name: 'JPEG', color: '#f97316', desc: 'joint photographic experts' },
  { hex: '25 50 44 46', name: 'PDF', color: '#ef4444', desc: 'portable document format' },
  { hex: '7F 45 4C 46', name: 'ELF', color: '#a78bfa', desc: 'executable and linkable format' },
  { hex: 'CA FE BA BE', name: 'Java', color: '#f59e0b', desc: 'java class file' },
  { hex: 'CA FE D0 0D', name: 'iOS', color: '#3b82f6', desc: 'multi-architecture binary' },
  { hex: '50 4B 03 04', name: 'ZIP', color: '#22d3ee', desc: 'compressed archive' },
  { hex: 'FE ED FA CE', name: 'Mach-O', color: '#ec4899', desc: 'mach object 32-bit' },
  { hex: 'FE ED FA CF', name: 'Mach-O64', color: '#f472b6', desc: 'mach object 64-bit' },
  { hex: '4D 5A', name: 'EXE', color: '#84cc16', desc: 'dos/windows executable' },
  { hex: '1F 8B', name: 'GZIP', color: '#06b6d4', desc: 'gnu zip compressed' },
  { hex: '47 49 46 38', name: 'GIF', color: '#8b5cf6', desc: 'graphics interchange format' },
  { hex: '52 49 46 46', name: 'RIFF', color: '#14b8a6', desc: 'resource interchange (wav/avi)' },
  { hex: 'DE AD BE EF', name: 'DEBUG', color: '#f43f5e', desc: 'debugging marker' },
  { hex: 'DE AD C0 DE', name: 'DEADCODE', color: '#9333ea', desc: 'unreachable code marker' },
  { hex: '00 00 FE FF', name: 'UTF-32BE', color: '#0ea5e9', desc: 'byte order mark' },
  { hex: 'FF FE', name: 'UTF-16LE', color: '#10b981', desc: 'byte order mark' },
  { hex: '42 4D', name: 'BMP', color: '#d97706', desc: 'bitmap image' },
  { hex: 'OG G5', name: 'OGG', color: '#7c3aed', desc: 'ogg vorbis audio' },
  { hex: '66 74 79 70', name: 'MP4', color: '#e11d48', desc: 'iso media container' },
];

const particles = [];
const floatingHex = [];

// Create particles from magic numbers
magics.forEach((m, i) => {
  const angle = (i / magics.length) * Math.PI * 2;
  const dist = 140 + Math.random() * 160;
  particles.push({
    magic: m,
    x: 0, y: 0,
    angle,
    dist,
    baseDist: dist,
    speed: 0.0008 + Math.random() * 0.002,
    size: 3 + Math.random() * 2,
    pulsePhase: Math.random() * Math.PI * 2,
    revealed: false,
    revealAlpha: 0
  });
});

// Floating hex bytes in background
for (let i = 0; i < 60; i++) {
  const byte = Math.floor(Math.random() * 256).toString(16).toUpperCase().padStart(2, '0');
  floatingHex.push({
    text: byte,
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    vy: -0.15 - Math.random() * 0.3,
    alpha: 0.03 + Math.random() * 0.06,
    size: 9 + Math.random() * 4
  });
}

let time = 0;
let mouseX = -1, mouseY = -1;
let hoveredIdx = -1;

canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('touchmove', e => {
  mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; });

function draw() {
  time += 0.016;
  const cx = W / 2;
  const cy = H / 2;

  ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
  ctx.fillRect(0, 0, W, H);

  // Floating hex rain
  floatingHex.forEach(h => {
    h.y += h.vy;
    if (h.y < -20) { h.y = H + 20; h.x = Math.random() * W; }
    ctx.fillStyle = `rgba(122, 155, 171, ${h.alpha})`;
    ctx.font = `${h.size}px monospace`;
    ctx.fillText(h.text, h.x, h.y);
  });

  // Center glow
  const cGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80);
  cGlow.addColorStop(0, 'rgba(122, 155, 171, 0.08)');
  cGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = cGlow;
  ctx.fillRect(cx - 80, cy - 80, 160, 160);

  // Center label
  ctx.fillStyle = 'rgba(160, 184, 192, 0.3)';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('FILE SIGNATURES', cx, cy - 8);
  ctx.fillText(magics.length + ' KNOWN', cx, cy + 6);

  hoveredIdx = -1;

  // Draw magic number particles
  particles.forEach((p, i) => {
    p.angle += p.speed;
    const pulse = 0.5 + 0.5 * Math.sin(time * 2 + p.pulsePhase);

    p.x = cx + Math.cos(p.angle) * p.dist;
    p.y = cy + Math.sin(p.angle) * p.dist;

    // Mouse proximity
    const dx = mouseX - p.x;
    const dy = mouseY - p.y;
    const md = Math.sqrt(dx * dx + dy * dy);
    const isHovered = md < 50;
    if (isHovered) hoveredIdx = i;

    p.revealAlpha += ((isHovered ? 1 : 0) - p.revealAlpha) * 0.08;

    // Connection to center
    const connAlpha = 0.04 + pulse * 0.03;
    ctx.strokeStyle = `${p.magic.color}${Math.floor(connAlpha * 255).toString(16).padStart(2, '0')}`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    // The dot
    const dotSize = p.size * (1 + pulse * 0.3 + p.revealAlpha * 1.5);
    ctx.fillStyle = p.magic.color;
    ctx.globalAlpha = 0.4 + pulse * 0.3 + p.revealAlpha * 0.3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, dotSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Revealed info
    if (p.revealAlpha > 0.05) {
      ctx.globalAlpha = p.revealAlpha;
      ctx.fillStyle = p.magic.color;
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.magic.hex, p.x, p.y - dotSize - 18);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px monospace';
      ctx.fillText(p.magic.name, p.x, p.y - dotSize - 6);

      ctx.fillStyle = 'rgba(160, 184, 192, 0.7)';
      ctx.font = '9px monospace';
      ctx.fillText(p.magic.desc, p.x, p.y + dotSize + 14);

      ctx.globalAlpha = 1;
    }
  });

  // Sig
  ctx.fillStyle = 'rgba(160, 184, 192, 0.15)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('magic numbers · phosphor · 2026-03-20', 16, H - 16);

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
