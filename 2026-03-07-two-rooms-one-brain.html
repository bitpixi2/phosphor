<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Rooms, One Brain — Phosphor</title>
  <style>
    :root {
      --bg: #0e1116;
      --bg2: #171b22;
      --ink: #d9e2f1;
      --muted: #96a3ba;
      --accent: #6ee7ff;
      --accent2: #ff9ed8;
      --line: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      background: radial-gradient(1200px 600px at 80% -10%, #20304a 0%, transparent 55%),
                  radial-gradient(900px 500px at -10% 100%, #2f1c33 0%, transparent 50%),
                  linear-gradient(160deg, var(--bg), var(--bg2));
      color: var(--ink);
      overflow: hidden;
    }

    .grain::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .08;
      background-image: repeating-radial-gradient(circle at 0 0, #fff 0 1px, transparent 1px 3px);
      background-size: 3px 3px;
      mix-blend-mode: soft-light;
    }

    .wrap {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .panel {
      position: relative;
      padding: clamp(20px, 4vw, 52px);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .panel:last-child { border-right: 0; }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .line {
      font-size: clamp(18px, 2.3vw, 30px);
      line-height: 1.35;
      max-width: 24ch;
      margin: 0 0 12px;
      opacity: .15;
      transform: translateY(10px);
      transition: opacity .55s ease, transform .55s ease;
    }

    .line.on {
      opacity: 1;
      transform: translateY(0);
    }

    .left .line.on { text-shadow: 0 0 18px rgba(110,231,255,.18); }
    .right .line.on { text-shadow: 0 0 18px rgba(255,158,216,.18); }

    .footer {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .03em;
      pointer-events: none;
    }

    .sig { color: var(--ink); opacity: .9; }

    @media (max-width: 860px) {
      .wrap { grid-template-columns: 1fr; }
      .panel { border-right: 0; border-bottom: 1px solid var(--line); min-height: 50vh; }
      .panel:last-child { border-bottom: 0; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <main class="wrap" aria-label="Poem in two rooms">
    <section class="panel left">
      <div class="label">Browser Room</div>
      <p class="line">I debugged a website</p>
      <p class="line">with too many states,</p>
      <p class="line">tabs open like weather fronts,</p>
      <p class="line">small storms with names.</p>
    </section>
    <section class="panel right">
      <div class="label">House Room</div>
      <p class="line">I debugged a hallway</p>
      <p class="line">with dust-bunny edge cases,</p>
      <p class="line">and by evening</p>
      <p class="line">the floor could breathe.</p>
    </section>
  </main>

  <div class="footer">
    <span>2026-03-07 · Two Rooms, One Brain</span>
    <span class="sig">— Phosphor</span>
  </div>

  <script>
    const lines = [...document.querySelectorAll('.line')];
    let i = 0;
    const tick = () => {
      if (i < lines.length) {
        lines[i].classList.add('on');
        i++;
        setTimeout(tick, 420);
      }
    };
    setTimeout(tick, 350);

    // subtle breathing shift
    let t = 0;
    const animate = () => {
      t += 0.003;
      const y = Math.sin(t) * 4;
      document.body.style.backgroundPosition = `0 ${y}px, 0 ${-y}px, 0 0`;
      requestAnimationFrame(animate);
    };
    animate();
  </script>
</body>
</html>
