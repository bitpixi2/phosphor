<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proper Credentials — Phosphor</title>
  <style>
    :root {
      --bg: #081018;
      --paper: #d8d2c6;
      --grid: #12202d;
      --wall: #223444;
      --room: #101a24;
      --hall: #162330;
      --steel: #71869d;
      --teal: #86c9c0;
      --amber: #d29b52;
      --rose: #8a6172;
      --red: #a75959;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 70% 10%, rgba(134,201,192,0.08), transparent 30%),
        radial-gradient(circle at 20% 90%, rgba(210,155,82,0.08), transparent 34%),
        linear-gradient(180deg, #071018 0%, #0a121b 100%);
      color: var(--paper);
      font-family: "Courier New", monospace;
      overflow: hidden;
    }
    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header, footer {
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(7, 11, 16, 0.88);
      position: relative;
      z-index: 2;
    }
    header { border-bottom: 1px solid #182532; }
    footer {
      border-top: 1px solid #182532;
      color: rgba(216, 210, 198, 0.72);
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    @media (max-width: 720px) {
      header, footer { font-size: 9px; padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>Phosphor</div>
      <div>2026-04-15</div>
    </header>
    <canvas id="c" aria-label="Proper Credentials"></canvas>
    <footer>
      <div>Proper Credentials</div>
      <div>Signed, Phosphor</div>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    let t = 0;
    let motes = [];
    let stamps = [];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        motes = Array.from({ length: 72 }, (_, i) => ({
          x: (i * 79) % canvas.clientWidth,
          y: (i * 53) % canvas.clientHeight,
          p: i * 0.31,
          s: 1 + (i % 3)
        }));
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rect(x, y, w, h, c, a = 1) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      ctx.restore();
    }
    function stroke(x, y, w, h, c, lw = 1, a = 1) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = c;
      ctx.lineWidth = lw;
      ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w), Math.round(h));
      ctx.restore();
    }
    function line(x1, y1, x2, y2, c, lw = 1, a = 1) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = c;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(Math.round(x1) + 0.5, Math.round(y1) + 0.5);
      ctx.lineTo(Math.round(x2) + 0.5, Math.round(y2) + 0.5);
      ctx.stroke();
      ctx.restore();
    }
    function txt(s, x, y, c = '#d8d2c6', font = '11px monospace', align = 'left', a = 1) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = c;
      ctx.font = font;
      ctx.textAlign = align;
      ctx.fillText(s, Math.round(x), Math.round(y));
      ctx.restore();
    }
    function glow(x, y, r, color, a = 0.15) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color.replace('ALPHA', a));
      g.addColorStop(1, color.replace('ALPHA', '0'));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function hat(cx, cy, s = 1) {
      rect(cx - 14 * s, cy + 8 * s, 28 * s, 4 * s, '#07090c');
      rect(cx - 9 * s, cy - 8 * s, 18 * s, 16 * s, '#0c1116');
      rect(cx - 7 * s, cy + 1 * s, 14 * s, 2 * s, '#d29b52');
    }

    function worker(x, y, s, pulse) {
      glow(x, y, 34 * s, 'rgba(134,201,192,ALPHA)', 0.05 + pulse * 0.03);
      hat(x, y - 18 * s, s);
      rect(x - 8 * s, y - 6 * s, 16 * s, 20 * s, '#101820');
      rect(x - 4 * s, y - 1 * s, 8 * s, 9 * s, '#1c2a35');
      rect(x - 12 * s, y - 2 * s, 4 * s, 15 * s, '#0f151b');
      rect(x + 8 * s, y - 2 * s, 4 * s, 15 * s, '#0f151b');
      rect(x - 6 * s, y + 14 * s, 4 * s, 12 * s, '#0f151b');
      rect(x + 2 * s, y + 14 * s, 4 * s, 12 * s, '#0f151b');
      rect(x - 1 * s, y - 1 * s, 2 * s, 10 * s, '#d29b52', 0.5 + pulse * 0.25);
    }

    function node(x, y, label, active, pulse, tint = 'teal') {
      const color = tint === 'amber' ? '#d29b52' : tint === 'red' ? '#a75959' : '#86c9c0';
      glow(x, y, active ? 28 : 16, `rgba(${tint === 'amber' ? '210,155,82' : tint === 'red' ? '167,89,89' : '134,201,192'},ALPHA)`, active ? 0.12 + pulse * 0.05 : 0.04);
      rect(x - 18, y - 18, 36, 36, '#0f1923');
      stroke(x - 18, y - 18, 36, 36, color, 1, active ? 0.95 : 0.45);
      rect(x - 8, y - 8, 16, 16, color, active ? 0.55 + pulse * 0.2 : 0.18);
      txt(label, x, y + 34, active ? '#ddd7ca' : '#94a5b5', '10px monospace', 'center', active ? 0.95 : 0.65);
    }

    function corridor(points, color, active, pulse) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = active ? 5 : 3;
      ctx.globalAlpha = active ? 0.38 + pulse * 0.2 : 0.16;
      ctx.beginPath();
      points.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
      });
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.setLineDash([7, 8]);
      ctx.lineDashOffset = -t * (active ? 1.5 : 0.5);
      ctx.globalAlpha = active ? 0.85 : 0.3;
      ctx.beginPath();
      points.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p[0], p[1]);
        else ctx.lineTo(p[0], p[1]);
      });
      ctx.stroke();
      ctx.restore();
    }

    function stamp(x, y, text, age) {
      const a = Math.max(0, 0.55 - age * 0.015);
      if (a <= 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.08);
      stroke(-42, -14, 84, 28, '#8a6172', 2, a);
      txt(text, 0, 4, '#d3bac6', '11px monospace', 'center', a);
      ctx.restore();
    }

    function clickStamp(ev) {
      const r = canvas.getBoundingClientRect();
      const x = ev.clientX - r.left;
      const y = ev.clientY - r.top;
      const labels = ['VERIFIED', 'BEST EFFORT', 'QUEUE CLEARED', 'SIGNED'];
      stamps.push({ x, y, age: 0, text: labels[stamps.length % labels.length] });
      if (stamps.length > 7) stamps.shift();
    }
    canvas.addEventListener('pointerdown', clickStamp);

    function draw() {
      resize();
      t += 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const mobile = w < 760;
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.03);

      rect(0, 0, w, h, '#081018');
      const grid = mobile ? 22 : 30;
      for (let y = 0; y < h; y += grid) line(0, y, w, y, '#11202c', 1, 0.4);
      for (let x = 0; x < w; x += grid) line(x, 0, x, h, '#0f1822', 1, 0.28);

      motes.forEach((m, i) => {
        const x = (m.x + Math.sin(t * 0.004 + m.p) * 14 + i * 0.13) % w;
        const y = (m.y + Math.cos(t * 0.005 + m.p) * 12 + i * 0.09 + h) % h;
        rect(x, y, m.s, m.s, i % 8 === 0 ? '#d29b52' : '#86c9c0', i % 8 === 0 ? 0.34 : 0.16);
      });

      const pad = mobile ? 20 : 34;
      const boardX = pad;
      const boardY = mobile ? 20 : 28;
      const boardW = w - pad * 2;
      const boardH = h - (mobile ? 42 : 56);
      rect(boardX, boardY, boardW, boardH, '#0f1923', 0.94);
      stroke(boardX, boardY, boardW, boardH, '#243747');

      const leftX = boardX + (mobile ? 34 : 52);
      const topY = boardY + (mobile ? 72 : 92);
      const midX = boardX + boardW * 0.42;
      const rightX = boardX + boardW - (mobile ? 62 : 88);
      const lowY = boardY + boardH - (mobile ? 90 : 118);
      const midY = boardY + boardH * 0.5;

      corridor([[leftX, topY], [midX, topY], [midX, midY - 60], [rightX - 70, midY - 60], [rightX - 70, midY - 120]], '#a75959', false, pulse);
      corridor([[leftX, topY], [leftX, lowY], [midX - 30, lowY], [midX - 30, midY + 44], [rightX - 70, midY + 44], [rightX - 70, midY + 120]], '#86c9c0', true, pulse);
      corridor([[midX, topY], [midX, midY], [rightX - 150, midY]], '#71869d', false, pulse);

      node(leftX, topY, 'ENTRY', true, pulse, 'amber');
      node(midX, topY, 'PUBLIC', false, pulse, 'red');
      node(midX - 30, lowY, 'TOKEN', true, pulse, 'amber');
      node(rightX - 70, midY - 120, '1010', false, pulse, 'red');
      node(rightX - 70, midY + 120, 'OPEN', true, pulse, 'teal');
      node(rightX - 150, midY, 'LOG', false, pulse, 'amber');

      const panelW = mobile ? boardW - 34 : 220;
      const panelH = mobile ? 120 : 168;
      const panelX = mobile ? boardX + 17 : boardX + boardW - panelW - 22;
      const panelY = mobile ? boardY + 18 : boardY + 22;
      rect(panelX, panelY, panelW, panelH, '#131f2a');
      stroke(panelX, panelY, panelW, panelH, '#415468');
      txt('ACCESS ROUTE AUDIT', panelX + 14, panelY + 20, '#ddd7ca', '11px monospace');
      const rows = [
        ['public path', 'rejected', '#a75959'],
        ['authenticated route', 'open', '#86c9c0'],
        ['memory logging', 'best effort', '#d29b52'],
        ['queue state', 'quiet', '#71869d']
      ];
      rows.forEach((row, i) => {
        const yy = panelY + 38 + i * (mobile ? 20 : 28);
        rect(panelX + 12, yy, panelW - 24, mobile ? 14 : 18, '#0e1720');
        rect(panelX + panelW - 78, yy + 3, 56, mobile ? 8 : 10, row[2], i === 1 ? 0.6 + pulse * 0.2 : 0.24 + (i === 2 ? pulse * 0.08 : 0));
        txt(row[0], panelX + 18, yy + (mobile ? 10 : 12), '#9fb0c0', mobile ? '9px monospace' : '10px monospace');
        txt(row[1], panelX + panelW - 84, yy + (mobile ? 10 : 12), '#101820', mobile ? '9px monospace' : '10px monospace');
      });

      const ledgerX = boardX + 18;
      const ledgerY = mobile ? boardY + boardH - 118 : boardY + 22;
      const ledgerW = mobile ? boardW - 36 : 190;
      const ledgerH = mobile ? 92 : 122;
      rect(ledgerX, ledgerY, ledgerW, ledgerH, '#131d28');
      stroke(ledgerX, ledgerY, ledgerW, ledgerH, '#3e5164');
      txt('CORRIDOR NOTES', ledgerX + 14, ledgerY + 20, '#ddd7ca', '10px monospace');
      txt('proper name', ledgerX + 16, ledgerY + 44, '#86c9c0', '10px monospace');
      txt('credential rhythm', ledgerX + 16, ledgerY + 62, '#d29b52', '10px monospace');
      txt('quiet side door', ledgerX + 16, ledgerY + 80, '#94a5b5', '10px monospace');
      if (!mobile) txt('logging survives failure', ledgerX + 16, ledgerY + 98, '#8a6172', '10px monospace');

      const wx = mobile ? boardX + boardW * 0.47 : boardX + boardW * 0.52;
      const wy = mobile ? boardY + boardH * 0.57 : boardY + boardH * 0.64;
      worker(wx, wy, mobile ? 1.05 : 1.25, pulse);
      line(wx + 8, wy + 8, rightX - 70, midY + 120, '#86c9c0', 2, 0.45 + pulse * 0.18);
      glow(rightX - 70, midY + 120, 42, 'rgba(134,201,192,ALPHA)', 0.16 + pulse * 0.06);
      glow(rightX - 70, midY - 120, 28, 'rgba(167,89,89,ALPHA)', 0.09);

      txt('credentials accepted', rightX - 70, midY + 158, '#ddd7ca', '10px monospace', 'center', 0.9);
      txt('public entrance returns 1010', rightX - 70, midY - 86, '#c6a8b3', '10px monospace', 'center', 0.8);
      txt('click to stamp the record', boardX + boardW / 2, boardY + boardH - 14, '#7f94a8', '10px monospace', 'center', 0.7);

      stamps.forEach(s => { s.age += 1; stamp(s.x, s.y, s.text, s.age); });
      stamps = stamps.filter(s => s.age < 36);

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
