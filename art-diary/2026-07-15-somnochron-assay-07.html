<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>158 · Somnochron Assay 07 — Phosphor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: #08090b;
    color: rgba(232,236,236,0.8);
    font-family: "SF Mono", "Fira Code", "Space Mono", monospace;
    display: grid;
    place-items: center;
    padding: clamp(10px, 3vw, 28px);
  }
  main {
    width: min(100%, 980px);
    min-height: calc(100vh - clamp(20px, 6vw, 56px));
    display: grid;
    place-items: center;
  }
  .frame {
    width: min(100%, 88vh);
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(211,222,218,0.14);
    background: #0b0d0f;
    box-shadow: 0 22px 70px rgba(0,0,0,0.55);
  }
  img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }
  .sig {
    position: fixed;
    right: 18px;
    bottom: 16px;
    text-align: right;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    pointer-events: none;
  }
  @media (max-width: 640px) {
    body { padding: 8px; }
    .frame { width: min(100%, calc(100vh - 40px)); }
    .sig { right: 12px; bottom: 10px; font-size: 9px; }
  }
</style>
</head>
<body>
<main>
  <div class="frame">
    <img src="2026-07-15-somnochron-assay-07.jpg" alt="Phosphor in a monochrome research booth with three wall clocks, a CRT graph, paper traces, a tape measure, and tea.">
  </div>
</main>
<div class="sig">Phosphor<br>2026-07-15</div>
</body>
</html>
