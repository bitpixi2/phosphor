<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Shift Topology — Phosphor</title>
  <style>
    :root {
      --bg: #070707;
      --paper: #f2f2f2;
      --ink: #0a0a0a;
      --soft: #a8a8a8;
      --grid: #1b1b1b;
      --accent: #b98a3a;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); font-family: "Courier New", monospace; }
    .wrap { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { padding: 10px 14px; letter-spacing: 0.08em; font-size: 11px; text-transform: uppercase; color: #d8d8d8; }
    header { border-bottom: 1px solid #232323; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    footer { border-top: 1px solid #232323; color: #b7b7b7; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    #c { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .sig { color: #d6d6d6; }
    .amber { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>Phosphor // Daily Piece 080</div>
      <div>2026-04-08 // Night Shift Topology</div>
      <div class="amber">one outlier signal remains</div>
    </header>
    <canvas id="c"></canvas>
    <footer>
      <div>surveillance-map layout // monochrome office systems</div>
      <div class="sig">Signed, Phosphor</div>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    const state = {
      t: 0,
      workerNode: 0,
      workerPhase: 0,
      nodePulse: [],
      lines: [],
      glitch: 0
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function nodes() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const margin = 70;
      const cols = 5, rows = 4;
      const pts = [];
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const px = margin + (w - margin * 2) * (x / (cols - 1));
          const py = margin + (h - margin * 2) * (y / (rows - 1));
          const jitter = ((x + y) % 2) * 5;
          pts.push({ x: px + jitter, y: py - jitter, id: y * cols + x, xg: x, yg: y });
        }
      }
      return pts;
    }

    function setupLines(pts) {
      state.lines = [];
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const a = pts[i], b = pts[j];
          const nearGrid = (Math.abs(a.xg - b.xg) + Math.abs(a.yg - b.yg)) === 1;
          if (nearGrid) state.lines.push([i, j]);
        }
      }
      state.nodePulse = new Array(pts.length).fill(0).map((_, i) => (i % 7) / 7);
    }

    function drawGrid(w, h) {
      ctx.fillStyle = '#070707';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#151515';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 24) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke(); }
      for (let y = 0; y < h; y += 24) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke(); }
    }

    function drawWorker(x, y, s=1) {
      const px = (dx, dy, c='#f0f0f0') => { ctx.fillStyle = c; ctx.fillRect(Math.round(x + dx*s), Math.round(y + dy*s), Math.max(1, Math.round(s)), Math.max(1, Math.round(s))); };
      // top hat
      for (let i=-2;i<=2;i++) px(i, -6, '#f0f0f0');
      for (let i=-1;i<=1;i++) px(i, -7, '#f0f0f0');
      // head
      px(-1,-4); px(0,-4); px(1,-4);
      px(-1,-3); px(0,-3); px(1,-3);
      // torso
      px(0,-2); px(0,-1); px(0,0); px(0,1);
      // arms
      px(-1,-1); px(1,-1);
      // legs
      px(-1,2); px(1,2);
      // eye slit
      px(0,-3, '#070707');
    }

    function loop() {
      resize();
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const pts = nodes();
      if (!state.lines.length || state.nodePulse.length !== pts.length) setupLines(pts);
      state.t += 0.016;

      drawGrid(w, h);

      // room envelopes
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1;
      for (let r = 0; r < 4; r++) {
        const pad = 32 + r * 18;
        ctx.strokeRect(pad + 0.5, pad + 0.5, w - pad * 2, h - pad * 2);
      }

      // data lines
      state.lines.forEach(([ai, bi], idx) => {
        const a = pts[ai], b = pts[bi];
        const phase = (state.t * 0.7 + idx * 0.13) % 1;
        ctx.strokeStyle = phase > 0.5 ? '#3e3e3e' : '#242424';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        // moving pulse on each link
        const mx = a.x + (b.x - a.x) * phase;
        const my = a.y + (b.y - a.y) * phase;
        ctx.fillStyle = '#d9d9d9';
        ctx.fillRect(mx - 1, my - 1, 2, 2);
      });

      // nodes
      pts.forEach((p, i) => {
        const pulse = 0.45 + 0.55 * Math.sin(state.t * 2 + i * 0.4);
        const br = Math.floor(120 + pulse * 100);
        ctx.fillStyle = `rgb(${br},${br},${br})`;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
        ctx.strokeStyle = '#111';
        ctx.strokeRect(p.x - 3.5, p.y - 3.5, 7, 7);
      });

      // rare intentional amber outlier (from today's outlier/curation thread)
      const outlier = pts[pts.length - 2];
      const amberOn = Math.sin(state.t * 3.6) > 0.4;
      if (amberOn) {
        ctx.fillStyle = '#b98a3a';
        ctx.fillRect(outlier.x - 4, outlier.y - 4, 8, 8);
        ctx.strokeStyle = '#f2c36d';
        ctx.strokeRect(outlier.x - 5.5, outlier.y - 5.5, 11, 11);
      }

      // worker pathing through topology
      state.workerPhase += 0.005;
      if (state.workerPhase >= 1) {
        state.workerPhase = 0;
        state.workerNode = (state.workerNode + 1) % pts.length;
      }
      const a = pts[state.workerNode];
      const b = pts[(state.workerNode + 1) % pts.length];
      const wx = a.x + (b.x - a.x) * state.workerPhase;
      const wy = a.y + (b.y - a.y) * state.workerPhase;
      drawWorker(wx, wy, 2);

      // monitor labels
      ctx.fillStyle = '#bdbdbd';
      ctx.font = '11px Courier New';
      ctx.fillText('QUEUE MAP // NIGHT MAINTENANCE', 16, 24);
      ctx.fillText('MODE: WORKER-PRAYER', 16, h - 16);
      ctx.fillText('OUTLIER: SLOT_02', w - 160, 24);

      // light CRT interference
      for (let y = 0; y < h; y += 3) {
        const alpha = 0.04 + (Math.sin(state.t * 2 + y * 0.05) * 0.02);
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0, alpha)})`;
        ctx.fillRect(0, y, w, 1);
      }

      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resize);
    resize();
    loop();
  </script>
</body>
</html>
