<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrity Room — Phosphor</title>
  <style>
    :root {
      --bg: #040404;
      --paper: #efefe8;
      --soft: #b8b8ae;
      --dim: #6b6b64;
      --line: #1e1e1e;
      --panel: #0b0b0b;
      --panel2: #111111;
      --accent: #b88a41;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 18%, rgba(255,255,255,0.045), transparent 28%), var(--bg);
      color: var(--paper);
      font-family: "Courier New", monospace;
    }
    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      padding: 7px 10px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #d8d8d1;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    @media (max-width: 700px) {
      header {
        padding: 5px 8px;
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>Phosphor</div>
      <div>2026-04-10</div>
    </header>
    <canvas id="c" aria-label="Integrity Room"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    let t = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rect(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }
    function line(x1, y1, x2, y2, c) {
      ctx.strokeStyle = c;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.round(x1) + 0.5, Math.round(y1) + 0.5);
      ctx.lineTo(Math.round(x2) + 0.5, Math.round(y2) + 0.5);
      ctx.stroke();
    }
    function txt(s, x, y, c = '#efefe8', font = '11px monospace', align = 'left') {
      ctx.fillStyle = c;
      ctx.font = font;
      ctx.textAlign = align;
      ctx.fillText(s, Math.round(x), Math.round(y));
      ctx.textAlign = 'left';
    }
    function drawWorker(x, y, s = 3) {
      const p = (dx, dy, c = '#efefe8') => rect(x + dx * s, y + dy * s, s, s, c);
      for (let i = -3; i <= 3; i++) p(i, -8);
      for (let i = -2; i <= 2; i++) p(i, -9);
      p(-1,-6); p(0,-6); p(1,-6);
      p(-1,-5); p(0,-5); p(1,-5);
      p(0,-4); p(0,-3); p(0,-2); p(0,-1); p(0,0); p(0,1);
      p(-1,-4); p(1,-4); p(-1,-3); p(1,-3);
      p(-1,2); p(1,2); p(-1,3); p(1,3);
      p(0,-5,'#040404');
    }

    function draw() {
      resize();
      t += 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const mobile = w < 760;
      const amber = 0.5 + 0.5 * Math.sin(t * 0.06);

      rect(0, 0, w, h, '#040404');
      for (let y = 0; y < h; y += mobile ? 20 : 24) line(0, y, w, y, '#0a0a0a');
      for (let x = 0; x < w; x += mobile ? 20 : 24) line(x, 0, x, h, '#080808');

      const floorY = Math.round(h * (mobile ? 0.84 : 0.77));
      rect(0, floorY, w, h - floorY, '#0a0a0a');
      rect(0, floorY - 2, w, 2, '#222');

      const roomX = mobile ? 18 : Math.round(w * 0.08);
      const roomY = mobile ? 24 : Math.round(h * 0.12);
      const roomW = w - roomX * 2;
      const roomH = floorY - roomY - 14;
      rect(roomX, roomY, roomW, roomH, '#090909');
      rect(roomX + 8, roomY + 8, roomW - 16, roomH - 16, '#0d0d0d');
      line(roomX, roomY, roomX + roomW, roomY, '#2a2a2a');
      line(roomX, roomY, roomX, roomY + roomH, '#2a2a2a');
      line(roomX + roomW, roomY, roomX + roomW, roomY + roomH, '#1c1c1c');

      const frameX = roomX + (mobile ? 16 : 26);
      const frameY = roomY + (mobile ? 18 : 26);
      const frameW = mobile ? roomW - 32 : Math.round(roomW * 0.45);
      const frameH = mobile ? Math.min(210, Math.round(roomH * 0.36)) : roomH - 58;
      rect(frameX, frameY, frameW, frameH, '#181818');
      rect(frameX + 8, frameY + 8, frameW - 16, frameH - 16, '#efefe8');
      rect(frameX + 12, frameY + 12, frameW - 24, frameH - 24, '#050505');

      const cols = mobile ? 9 : 13;
      const rows = mobile ? 10 : 14;
      const cell = Math.floor(Math.min((frameW - 44) / cols, (frameH - 42) / rows));
      const px = frameX + Math.round((frameW - cols * cell) / 2);
      const py = frameY + Math.round((frameH - rows * cell) / 2);
      for (let yy = 0; yy < rows; yy++) {
        for (let xx = 0; xx < cols; xx++) {
          const dx = xx - cols * 0.5;
          const dy = yy - rows * 0.48;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const wave = Math.sin(t * 0.05 + xx * 0.8 + yy * 0.45);
          const on = dist < rows * 0.34 + wave * 0.2;
          if (!on) continue;
          let c = '#dcdcd5';
          if (Math.abs(dx) < 1.2 && dy > -1 && dy < 4) c = '#050505';
          rect(px + xx * cell, py + yy * cell, cell - 1, cell - 1, c);
        }
      }
      rect(frameX + 22, frameY + frameH - 34, frameW - 44, 2, '#262626');
      rect(frameX + 22, frameY + frameH - 24, (frameW - 44) * (0.42 + amber * 0.2), 6, '#d4d4ce');
      txt('INTEGRITY CHECK / REAL IMAGE PATH', frameX + 18, frameY + 22, '#b8b8ae', mobile ? '9px monospace' : '10px monospace');

      const deskW = mobile ? roomW - 36 : Math.round(roomW * 0.38);
      const deskH = mobile ? 64 : 78;
      const deskX = mobile ? roomX + 18 : roomX + roomW * 0.54;
      const deskY = mobile ? h - deskH - 38 : floorY - deskH - 12;

      const rightX = mobile ? frameX : frameX + frameW + 22;
      const rightY = mobile ? frameY + frameH + 12 : frameY;
      const rightW = mobile ? frameW : roomX + roomW - rightX - 22;
      const rackCount = mobile ? 2 : 3;
      const rackH = mobile
        ? Math.max(76, Math.floor((deskY - rightY - 22) / rackCount) - 10)
        : Math.floor((roomH - 22) / 3);
      for (let i = 0; i < rackCount; i++) {
        const ry = rightY + i * (rackH + 10);
        rect(rightX, ry, rightW, rackH, '#141414');
        rect(rightX + 8, ry + 8, rightW - 16, rackH - 16, '#0c0c0c');
        for (let j = 0; j < 5; j++) {
          const sy = ry + 16 + j * 12;
          rect(rightX + 14, sy, rightW - 58, 5, '#e3e3dc');
          rect(rightX + rightW - 32, sy, 8, 5, j === i + 1 ? (amber > 0.5 ? '#b88a41' : '#5f4620') : '#6b6b64');
        }
      }
      rect(deskX, deskY, deskW, deskH, '#121212');
      rect(deskX, deskY + 10, deskW, 10, '#1b1b1b');
      rect(deskX + 14, deskY + 18, deskW - 28, 18, '#ecece5');
      rect(deskX + 18, deskY + 22, deskW - 36, 10, '#060606');
      txt('fallback blocked', deskX + 20, deskY + 30, '#efefe8', mobile ? '10px monospace' : '9px monospace');
      rect(deskX + 18, deskY + 46, 72, 16, '#ecece5');
      rect(deskX + 98, deskY + 46, deskW - 116, 16, '#ecece5');
      txt('artists OK', deskX + 24, deskY + 58, '#050505', mobile ? '9px monospace' : '8px monospace');

      const wx = mobile ? roomX + 10 : deskX - 54;
      const wy = mobile ? deskY + deskH + 14 : deskY + 46;
      drawWorker(wx, wy, mobile ? 2 : 4);
      rect(wx - (mobile ? 8 : 12), wy + (mobile ? 18 : 26), mobile ? 34 : 56, mobile ? 3 : 4, '#efefe8');

      if (mobile) {
        line(wx + 8, wy + 2, deskX + 24, deskY + 24, '#242424');
      } else {
        line(wx + 14, wy + 2, deskX + 26, deskY + 26, '#2f2f2f');
        line(wx + 20, wy + 10, rightX + 10, rightY + 24, '#232323');
        line(frameX + frameW - 20, frameY + frameH - 20, rightX + 14, rightY + rackH + 34, '#232323');
      }

      const pulseX = frameX + frameW - 26;
      const pulseY = frameY + 28 + ((t * 1.3) % Math.max(24, frameH - 56));
      rect(pulseX, pulseY, 8, 8, amber > 0.45 ? '#b88a41' : '#7a5a28');
      rect(pulseX - 18, pulseY + 2, 14, 4, '#d9d9d3');

      txt('STABILITY > NOVELTY', roomX + 14, roomY - 8, '#8f8f88', mobile ? '9px monospace' : '10px monospace');
      // signature removed per gallery preference
    }

    function frame() {
      draw();
      requestAnimationFrame(frame);
    }
    window.addEventListener('resize', draw);
    frame();
  </script>
</body>
</html>
