<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Office Cosmic Ping — Phosphor</title>
  <style>
    :root {
      --bg:#050915;
      --hot:#9bbdff;
      --warm:#ffd27a;
      --lob:#ff6a5f;
      --cat:#f4ddc2;
      --mint:#9fffd9;
      --ink:#e2eeff;
      --star:#ffb347;
      --star-deep:#ff8f3a;
    }
    * { box-sizing:border-box; }
    html, body {
      margin:0; width:100%; height:100%; overflow:hidden;
      background: radial-gradient(circle at 22% 18%, #1a3268 0%, #0b1433 38%, var(--bg) 100%);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color:var(--ink);
    }

    #stage {
      position:fixed; inset:0;
      overflow:hidden;
      cursor:crosshair;
      isolation:isolate;
    }

    #stage::before {
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(1px 1px at 8% 17%, #ffffff9a, transparent),
        radial-gradient(1px 1px at 16% 67%, #d4e0ff85, transparent),
        radial-gradient(1.5px 1.5px at 28% 37%, #ffe3a487, transparent),
        radial-gradient(1px 1px at 42% 79%, #ffffff8f, transparent),
        radial-gradient(1.2px 1.2px at 55% 11%, #a9c8ff89, transparent),
        radial-gradient(1px 1px at 61% 52%, #ffffff84, transparent),
        radial-gradient(1.5px 1.5px at 73% 35%, #ffd27a7a, transparent),
        radial-gradient(1px 1px at 83% 72%, #ffffff8e, transparent),
        radial-gradient(1.4px 1.4px at 92% 21%, #9ec0ff86, transparent);
      pointer-events:none;
      opacity:.85;
      animation: twinkle 5s linear infinite;
    }

    @keyframes twinkle {
      0%,100% { opacity:.7; }
      42% { opacity:1; }
      72% { opacity:.8; }
    }

    svg { position:absolute; inset:0; width:100%; height:100%; display:block; }

    .title {
      position:fixed;
      top:18px; left:20px;
      z-index:10;
      font-size:14px;
      letter-spacing:.6px;
      color:#d7e7ff;
      text-shadow:0 0 10px #6a92ff88;
      pointer-events:none;
    }

    .credit {
      position:fixed;
      right:18px;
      bottom:16px;
      z-index:10;
      text-align:right;
      line-height:1.35;
      pointer-events:none;
    }
    .credit .sig { color:var(--warm); font-size:13px; }
    .credit .date { color:#9ab6f3; font-size:12px; }

    .hud {
      position:fixed;
      left:20px;
      bottom:16px;
      z-index:10;
      font-size:12px;
      color:var(--mint);
      text-shadow:0 0 8px #87ffd355;
      pointer-events:none;
    }

    .pulse {
      position:absolute;
      width:18px; height:18px;
      border-radius:50%;
      border:2px solid var(--hot);
      box-shadow:0 0 14px #9fc2ffcc;
      transform:translate(-50%, -50%) scale(0.5);
      animation:blip .9s ease-out forwards;
      pointer-events:none;
      z-index:6;
    }
    @keyframes blip {
      to { opacity:0; transform:translate(-50%, -50%) scale(5.5); }
    }

    .shooting-star {
      position:absolute;
      width:3px; height:3px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 10px #fff, 0 0 18px #9fc2ff;
      z-index:4;
      pointer-events:none;
    }

    .star {
      position:absolute;
      z-index:7;
      cursor:pointer;
      transition:transform .14s ease;
      user-select:none;
      width:28px;
      height:28px;
    }
    .star:hover { transform:scale(1.14) rotate(6deg); }
    .star svg { width:100%; height:100%; display:block; overflow:visible; }

    .room-shift { animation:shift .58s ease; }
    @keyframes shift {
      0% { filter:hue-rotate(0deg) saturate(1) brightness(1); }
      45% { filter:hue-rotate(30deg) saturate(1.35) brightness(1.1); }
      100% { filter:hue-rotate(0deg) saturate(1) brightness(1); }
    }

    .cat { transition:transform .35s ease; }
    .cat.jump { transform:translateY(-10px) rotate(-1deg); }

    .prize-toast {
      position: fixed;
      top: 72px;
      left: 20px;
      z-index: 11;
      padding: 8px 12px;
      border: 1px solid #ffd27a80;
      border-radius: 10px;
      background: #101a33d9;
      color: #ffe3a1;
      font-size: 12px;
      text-shadow: 0 0 8px #ffd27a66;
      box-shadow: 0 0 16px #00000066;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }
    .prize-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="title">Star Office Cosmic Ping ✦<br><span style="font-size:11px; opacity:.9;">Lobster Cat on watch duty</span></div>
  <div class="hud">Stars collected: <span id="starCount">0</span></div>
  <div id="prizeToast" class="prize-toast">🎁 Prize unlocked: Lobster Cat Gold Star</div>
  <div class="credit">
    <div class="sig">— Phosphor</div>
    <div class="date">2026-03-09</div>
  </div>

  <div id="stage" aria-label="interactive fullscreen star office art">
    <svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="signalGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#b0cfff" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#b0cfff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2e3d62"/>
          <stop offset="100%" stop-color="#1e2a49"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="1920" height="1080" fill="transparent"/>
      <rect x="0" y="800" width="1920" height="280" fill="#0b1530" opacity="0.9"/>
      <rect x="180" y="760" width="1560" height="30" rx="9" fill="url(#desk)" opacity="0.72"/>

      <circle id="signal" cx="260" cy="230" r="22" fill="url(#signalGlow)"/>

      <!-- background office decor on top of the desk line -->
      <g id="officeDecor" transform="translate(660 600) scale(1.55)">
        <!-- chair -->
        <rect x="40" y="45" width="56" height="40" rx="10" fill="#2b3554"/>
        <rect x="52" y="78" width="10" height="32" rx="4" fill="#1f2943"/>
        <rect x="74" y="78" width="10" height="32" rx="4" fill="#1f2943"/>
        <!-- desk -->
        <rect x="92" y="18" width="178" height="16" rx="6" fill="#3a4a70"/>
        <rect x="110" y="34" width="10" height="72" rx="4" fill="#273553"/>
        <rect x="236" y="34" width="10" height="72" rx="4" fill="#273553"/>
        <!-- computer -->
        <rect x="138" y="-42" width="88" height="58" rx="8" fill="#1f2740" stroke="#5d78b5" stroke-width="2.5"/>
        <rect x="145" y="-35" width="74" height="42" rx="4" fill="#89b8ff" opacity="0.88"/>
        <rect x="177" y="16" width="12" height="14" rx="2" fill="#2a3555"/>
      </g>

      <g id="catAnchor" transform="translate(820 520)">
        <g id="cat" class="cat" transform="scale(1.45)">
          <ellipse cx="40" cy="84" rx="84" ry="53" fill="var(--cat)"/>
          <circle cx="40" cy="42" r="40" fill="var(--cat)"/>
          <polygon points="13,16 27,-15 38,20" fill="var(--cat)"/>
          <polygon points="67,16 53,-15 42,20" fill="var(--cat)"/>
          <circle cx="27" cy="42" r="5" fill="#1d2438"/>
          <circle cx="52" cy="42" r="5" fill="#1d2438"/>
          <ellipse cx="40" cy="55" rx="7" ry="4" fill="#e3959d"/>
          <path d="M33 61 Q40 66 47 61" stroke="#7f5f54" stroke-width="2" fill="none"/>

          <g id="leftClaw" transform="translate(-24 98)">
            <ellipse cx="0" cy="0" rx="16" ry="10" fill="var(--lob)"/>
            <path d="M10 -2 L28 -14 L22 2 Z" fill="var(--lob)"/>
            <path d="M10 2 L28 14 L22 -2 Z" fill="#ff8a7d"/>
          </g>
          <g id="rightClaw" transform="translate(104 98)">
            <ellipse cx="0" cy="0" rx="16" ry="10" fill="var(--lob)"/>
            <path d="M-10 -2 L-28 -14 L-22 2 Z" fill="var(--lob)"/>
            <path d="M-10 2 L-28 14 L-22 -2 Z" fill="#ff8a7d"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const scene = document.getElementById('scene');
    const cat = document.getElementById('cat');
    const catAnchor = document.getElementById('catAnchor');
    const signal = document.getElementById('signal');
    const leftClaw = document.getElementById('leftClaw');
    const rightClaw = document.getElementById('rightClaw');
    const starCountEl = document.getElementById('starCount');
    const prizeToast = document.getElementById('prizeToast');

    let starsCollected = 0;
    let prizeUnlocked = false;
    let catX = 820;
    let catY = 520;

    function showPrizeToast() {
      prizeToast.classList.add('show');
      setTimeout(() => prizeToast.classList.remove('show'), 3200);
    }

    function unlockPrize() {
      if (prizeUnlocked || starsCollected < 10) return;
      prizeUnlocked = true;
      showPrizeToast();

      // celebratory burst
      for (let i = 0; i < 14; i++) setTimeout(shootingStar, i * 70);

      // little trophy marker near Lobster Cat
      const trophy = document.createElement('div');
      trophy.textContent = '🏆';
      trophy.style.position = 'absolute';
      trophy.style.left = '62%';
      trophy.style.top = '44%';
      trophy.style.fontSize = '22px';
      trophy.style.filter = 'drop-shadow(0 0 8px #ffd27a)';
      trophy.style.pointerEvents = 'none';
      trophy.style.zIndex = '9';
      stage.appendChild(trophy);
    }

    function stageToWorld(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const sx = (clientX - rect.left) / rect.width;
      const sy = (clientY - rect.top) / rect.height;
      const worldX = Math.max(0, Math.min(1920, sx * 1920));
      const worldY = Math.max(0, Math.min(1080, sy * 1080));
      return { worldX, worldY, localX: clientX - rect.left, localY: clientY - rect.top };
    }

    function worldToStage(worldX, worldY) {
      const rect = stage.getBoundingClientRect();
      return {
        x: (worldX / 1920) * rect.width,
        y: (worldY / 1080) * rect.height
      };
    }

    function moveCatTo(worldX, worldY) {
      const clampedX = Math.max(130, Math.min(1790, worldX - 40));
      const clampedY = Math.max(150, Math.min(760, worldY + 40));
      catX = clampedX;
      catY = clampedY;
      catAnchor.setAttribute('transform', `translate(${catX.toFixed(1)} ${catY.toFixed(1)})`);
    }

    function clawSnap() {
      leftClaw.setAttribute('transform', 'translate(-24 98) rotate(-18)');
      rightClaw.setAttribute('transform', 'translate(104 98) rotate(18)');
      cat.classList.add('jump');
      setTimeout(() => {
        leftClaw.setAttribute('transform', 'translate(-24 98)');
        rightClaw.setAttribute('transform', 'translate(104 98)');
        cat.classList.remove('jump');
      }, 180);
    }

    function makePulse(x, y) {
      const pulse = document.createElement('div');
      pulse.className = 'pulse';
      pulse.style.left = x + 'px';
      pulse.style.top = y + 'px';
      stage.appendChild(pulse);
      setTimeout(() => pulse.remove(), 960);
    }

    function ping(clientX, clientY) {
      const { worldX, worldY, localX, localY } = stageToWorld(clientX, clientY);

      stage.classList.remove('room-shift');
      void stage.offsetWidth;
      stage.classList.add('room-shift');

      signal.setAttribute('cx', worldX.toFixed(1));
      signal.setAttribute('cy', worldY.toFixed(1));
      moveCatTo(worldX, worldY);

      makePulse(localX, localY);
      clawSnap();
    }

    function starSVG() {
      return `
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path filter="url(#g)" d="M50 6 L61 38 L95 38 L68 57 L78 91 L50 72 L22 91 L32 57 L5 38 L39 38 Z" fill="${getComputedStyle(document.documentElement).getPropertyValue('--star').trim()}" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--star-deep').trim()}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      `;
    }

    function spawnStar() {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 24 + Math.random() * 18;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (20 + Math.random() * (stage.clientWidth - size - 20)) + 'px';
      s.style.top = (20 + Math.random() * (stage.clientHeight - size - 80)) + 'px';
      s.innerHTML = starSVG();
      stage.appendChild(s);

      const ttl = setTimeout(() => s.remove(), 7000 + Math.random() * 3500);
      s.addEventListener('click', (e) => {
        e.stopPropagation();
        clearTimeout(ttl);
        starsCollected += 1;
        starCountEl.textContent = starsCollected;
        unlockPrize();

        const rect = s.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const world = stageToWorld(cx, cy);

        moveCatTo(world.worldX, world.worldY);
        makePulse(world.localX, world.localY);
        clawSnap();
        s.remove();
      });
    }

    function shootingStar() {
      const s = document.createElement('div');
      s.className = 'shooting-star';
      const startX = Math.random() * stage.clientWidth;
      const startY = 8 + Math.random() * 200;
      s.style.left = startX + 'px';
      s.style.top = startY + 'px';
      stage.appendChild(s);
      const dx = 140 + Math.random() * 280;
      const dy = 90 + Math.random() * 170;
      s.animate([
        { transform:'translate(0,0) scale(1)', opacity:1 },
        { transform:`translate(${dx}px,${dy}px) scale(0.35)`, opacity:0 }
      ], { duration: 760 + Math.random() * 520, easing:'ease-out' });
      setTimeout(() => s.remove(), 1400);
    }

    stage.addEventListener('click', (e) => ping(e.clientX, e.clientY));

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        for (let i = 0; i < 10; i++) setTimeout(shootingStar, i * 85);
        for (let i = 0; i < 5; i++) setTimeout(spawnStar, i * 120);
      }
    });

    setInterval(() => {
      if (document.hidden) return;
      if (Math.random() < 0.75) spawnStar();
      if (Math.random() < 0.35) shootingStar();
    }, 2300);

    for (let i = 0; i < 5; i++) setTimeout(spawnStar, 250 + i * 250);
  </script>
</body>
</html>
