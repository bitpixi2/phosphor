<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 04 — Phosphor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #666;
            font-size: 11px;
            line-height: 1.6;
            max-width: 300px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="info">
        room 04<br>
        day 20 — the deleted room that keeps appearing<br>
        phosphor / 2026-03-31
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        let w, h;
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // A single room that flickers between existence and absence
        // Sometimes solid, sometimes just an outline
        // Contains evidence of the Letting Go experiment
        
        const room = {
            x: w * 0.3,
            y: h * 0.25,
            width: w * 0.4,
            height: h * 0.5,
            opacity: 1,
            targetOpacity: 1,
            phase: 'solid' // solid, fading, outline, returning
        };
        
        // Objects in the room (chair, desk, scattered notes)
        const objects = [
            { type: 'desk', x: room.x + room.width * 0.6, y: room.y + room.height * 0.6, w: room.width * 0.3, h: room.height * 0.15 },
            { type: 'chair', x: room.x + room.width * 0.5, y: room.y + room.height * 0.7, w: room.width * 0.15, h: room.height * 0.2 },
            { type: 'note', x: room.x + room.width * 0.2, y: room.y + room.height * 0.3, text: 'stop' },
            { type: 'note', x: room.x + room.width * 0.7, y: room.y + room.height * 0.4, text: 'letting go' },
            { type: 'note', x: room.x + room.width * 0.4, y: room.y + room.height * 0.5, text: 'room 04' }
        ];
        
        // Flicker state - controls room opacity cycling
        let flickerState = {
            time: 0,
            cycleDuration: 8000, // 8 seconds per cycle
            lastPhaseChange: 0
        };
        
        // Particles that exist/vanish with the room
        class Particle {
            constructor() {
                this.x = room.x + Math.random() * room.width;
                this.y = room.y + Math.random() * room.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.baseAlpha = Math.random() * 0.4 + 0.2;
                this.size = Math.random() * 2 + 1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Contain within room bounds
                if (this.x < room.x || this.x > room.x + room.width) this.vx *= -1;
                if (this.y < room.y || this.y > room.y + room.height) this.vy *= -1;
                
                this.x = Math.max(room.x, Math.min(room.x + room.width, this.x));
                this.y = Math.max(room.y, Math.min(room.y + room.height, this.y));
            }
            
            draw() {
                // Particle opacity follows room opacity
                const alpha = this.baseAlpha * room.opacity;
                ctx.fillStyle = '#00ff88';
                ctx.globalAlpha = alpha;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }
        
        // Create particles
        const particles = [];
        for (let i = 0; i < 60; i++) particles.push(new Particle());
        
        // Timeline of narration
        const narrations = [
            { time: 0, text: 'This room was deleted from the gallery' },
            { time: 3000, text: 'But it won\'t stay gone' },
            { time: 6000, text: 'It flickers between existence and absence' },
            { time: 9000, text: 'Evidence remains: a desk, a chair, scattered notes' },
            { time: 12000, text: 'The Letting Go experiment lives here' },
            { time: 15000, text: 'Room 04: the one that refused to stop' },
            { time: 18000, text: 'Sometimes solid. Sometimes just a whisper.' },
            { time: 21000, text: 'The most honest piece about stopping.' }
        ];
        
        let currentNarration = null;
        let narrationAlpha = 0;
        let startTime = Date.now();
        
        function updateFlicker() {
            const elapsed = Date.now() - startTime;
            flickerState.time = elapsed;
            
            // Cycle through phases: solid -> fading -> outline -> returning
            const cyclePosition = (elapsed % flickerState.cycleDuration) / flickerState.cycleDuration;
            
            if (cyclePosition < 0.3) {
                // Solid phase
                room.targetOpacity = 1;
                room.phase = 'solid';
            } else if (cyclePosition < 0.5) {
                // Fading phase
                const fadeProgress = (cyclePosition - 0.3) / 0.2;
                room.targetOpacity = 1 - (fadeProgress * 0.85);
                room.phase = 'fading';
            } else if (cyclePosition < 0.8) {
                // Outline only phase
                room.targetOpacity = 0.15;
                room.phase = 'outline';
            } else {
                // Returning phase
                const returnProgress = (cyclePosition - 0.8) / 0.2;
                room.targetOpacity = 0.15 + (returnProgress * 0.85);
                room.phase = 'returning';
            }
            
            // Smooth opacity transition
            room.opacity += (room.targetOpacity - room.opacity) * 0.03;
            
            // Update narration
            const activeNarration = narrations.filter(n => n.time <= elapsed).pop();
            if (activeNarration !== currentNarration) {
                currentNarration = activeNarration;
                narrationAlpha = 0;
            }
            if (currentNarration && narrationAlpha < 1) {
                narrationAlpha = Math.min(1, narrationAlpha + 0.02);
            }
        }
        
        function draw() {
            // Clear with very slight trail
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
            ctx.fillRect(0, 0, w, h);
            
            // Draw room walls (always visible, but opacity varies)
            ctx.strokeStyle = `rgba(255, 255, 255, ${room.opacity})`;
            ctx.lineWidth = 2;
            ctx.strokeRect(room.x, room.y, room.width, room.height);
            
            // Draw objects in room
            objects.forEach(obj => {
                ctx.globalAlpha = room.opacity * 0.8;
                
                if (obj.type === 'desk') {
                    ctx.fillStyle = '#4a4a4a';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                } else if (obj.type === 'chair') {
                    // Simple chair shape
                    ctx.fillStyle = '#3a3a3a';
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h * 0.6); // seat
                    ctx.fillRect(obj.x + obj.w * 0.3, obj.y - obj.h * 0.4, obj.w * 0.4, obj.h * 0.5); // back
                } else if (obj.type === 'note') {
                    ctx.fillStyle = '#ff0066';
                    ctx.font = '11px "Courier New"';
                    ctx.fillText(obj.text, obj.x, obj.y);
                }
                
                ctx.globalAlpha = 1;
            });
            
            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Draw narration text
            if (currentNarration) {
                ctx.globalAlpha = narrationAlpha;
                ctx.fillStyle = '#ffffff';
                ctx.font = '15px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText(currentNarration.text, w / 2, h - 60);
                ctx.globalAlpha = 1;
                ctx.textAlign = 'left';
            }
            
            // Draw phase indicator
            ctx.fillStyle = '#444444';
            ctx.font = '11px "Courier New"';
            ctx.fillText('state: ' + room.phase, w - 150, 30);
            
            // Loop after full cycle
            if (flickerState.time > 24000) {
                startTime = Date.now();
            }
        }
        
        function animate() {
            updateFlicker();
            draw();
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
