<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recovery Loom — Phosphor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 18% 18%, rgba(234,170,98,0.08), transparent 22%),
        radial-gradient(circle at 82% 22%, rgba(112,139,255,0.10), transparent 26%),
        linear-gradient(180deg, #0b0f16 0%, #121926 52%, #090c12 100%);
      font-family: "Courier New", monospace;
      color: rgba(255,255,255,0.92);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .sig {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 4;
      text-align: right;
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.24);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="piece"></canvas>
  <div class="sig">Phosphor<br>2026-05-11</div>
  <script>
    const canvas = document.getElementById('piece');
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0, dpr = 1;
    const pointer = { x: 0.5, y: 0.5, active: false };
    let motes = [];
    let threads = [];
    let cards = [];

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = Math.floor(innerWidth * dpr);
      h = canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      buildScene();
    }

    function buildScene() {
      motes = Array.from({ length: 160 }, () => ({
        x: rand(0, w), y: rand(0, h), r: rand(0.5, 1.9) * dpr,
        drift: rand(0.08, 0.34) * dpr, phase: rand(0, Math.PI * 2)
      }));

      cards = Array.from({ length: 8 }, (_, i) => ({
        x: w * (0.16 + i * 0.08 + rand(-0.01, 0.01)),
        y: h * (0.67 + rand(-0.02, 0.03)),
        ww: w * rand(0.035, 0.052),
        hh: h * rand(0.08, 0.11),
        rot: rand(-0.20, 0.20),
        tint: i % 3 === 0 ? '236,217,180' : i % 3 === 1 ? '184,202,239' : '222,186,222'
      }));

      threads = [];
      const cx = w * 0.51;
      const cy = h * 0.57;
      const palette = [
        '255,179,94', '244,210,126', '154,196,255', '196,159,255', '255,146,174', '143,226,196'
      ];
      for (let i = 0; i < 28; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        threads.push({
          x0: cx + side * w * rand(0.18, 0.32),
          y0: h * rand(0.18, 0.80),
          x1: cx + side * w * rand(0.01, 0.10),
          y1: cy + h * rand(-0.10, 0.20),
          bend: side * w * rand(0.04, 0.10),
          phase: rand(0, Math.PI * 2),
          width: rand(1.4, 4.4) * dpr,
          color: palette[i % palette.length],
          dash: i % 4 === 0,
          glow: rand(0.16, 0.38)
        });
      }
    }

    function roundRect(x, y, ww, hh, rr) {
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + ww, y, x + ww, y + hh, rr);
      ctx.arcTo(x + ww, y + hh, x, y + hh, rr);
      ctx.arcTo(x, y + hh, x, y, rr);
      ctx.arcTo(x, y, x + ww, y, rr);
      ctx.closePath();
    }

    function drawBackground(t) {
      ctx.fillStyle = '#091018';
      ctx.fillRect(0, 0, w, h);

      const wall = ctx.createLinearGradient(0, 0, 0, h * 0.65);
      wall.addColorStop(0, '#171f2c');
      wall.addColorStop(1, '#24252c');
      ctx.fillStyle = wall;
      ctx.fillRect(0, 0, w, h * 0.66);

      const floor = ctx.createLinearGradient(0, h * 0.64, 0, h);
      floor.addColorStop(0, '#34281f');
      floor.addColorStop(1, '#181310');
      ctx.fillStyle = floor;
      ctx.fillRect(0, h * 0.64, w, h * 0.36);

      ctx.fillStyle = 'rgba(255,245,222,0.06)';
      roundRect(w * 0.33, h * 0.07, w * 0.34, h * 0.048, 12 * dpr);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,249,228,0.11)';
      roundRect(w * 0.36, h * 0.086, w * 0.28, h * 0.016, 8 * dpr);
      ctx.fill();

      ctx.fillStyle = 'rgba(58,63,74,0.95)';
      ctx.fillRect(w * 0.12, h * 0.18, w * 0.02, h * 0.52);
      ctx.fillRect(w * 0.86, h * 0.15, w * 0.02, h * 0.56);
      ctx.fillRect(w * 0.12, h * 0.18, w * 0.76, h * 0.026);
      ctx.fillRect(w * 0.12, h * 0.68, w * 0.76, h * 0.014);

      const halo = ctx.createRadialGradient(w * 0.52, h * 0.44, 0, w * 0.52, h * 0.44, w * 0.42);
      halo.addColorStop(0, 'rgba(255,201,119,0.14)');
      halo.addColorStop(0.28, 'rgba(164,188,255,0.10)');
      halo.addColorStop(0.6, 'rgba(202,166,255,0.06)');
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, w, h);

      for (const m of motes) {
        const yy = (m.y + t * 0.012 * m.drift + Math.sin(t * 0.0012 + m.phase) * 7 * dpr) % h;
        ctx.fillStyle = `rgba(255,255,255,${0.02 + 0.05 * Math.sin(t * 0.001 + m.phase)})`;
        ctx.fillRect(m.x, yy, m.r, m.r);
      }
    }

    function drawLoom(t) {
      const cx = w * 0.51;
      const cy = h * 0.45;
      const rx = w * 0.22;
      const ry = h * 0.18;
      ctx.save();
      ctx.translate(cx, cy);

      ctx.strokeStyle = 'rgba(205,214,229,0.16)';
      ctx.lineWidth = 3 * dpr;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(227,185,112,0.28)';
      ctx.lineWidth = 1.5 * dpr;
      for (let i = 0; i < 18; i++) {
        const a = (Math.PI * 2 / 18) * i + t * 0.00015;
        const x = Math.cos(a) * rx;
        const y = Math.sin(a) * ry;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      for (let ring = 0; ring < 3; ring++) {
        ctx.strokeStyle = `rgba(${ring === 0 ? '134,176,255' : ring === 1 ? '238,196,124' : '205,154,255'},${0.16 - ring * 0.03})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx * (0.75 - ring * 0.16), ry * (0.75 - ring * 0.16), 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawThreadBundle(t) {
      const sway = pointer.active ? (pointer.x - 0.5) * 38 * dpr : Math.sin(t * 0.0007) * 10 * dpr;
      for (const th of threads) {
        const mx = lerp(th.x0, th.x1, 0.5) + th.bend + sway * (th.x0 < w * 0.5 ? 0.35 : -0.35);
        const my = lerp(th.y0, th.y1, 0.5) + Math.sin(t * 0.0014 + th.phase) * 18 * dpr;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.shadowBlur = 18 * dpr;
        ctx.shadowColor = `rgba(${th.color},${th.glow})`;
        ctx.strokeStyle = `rgba(${th.color},0.88)`;
        ctx.lineWidth = th.width;
        if (th.dash) ctx.setLineDash([8 * dpr, 6 * dpr]);
        ctx.beginPath();
        ctx.moveTo(th.x0, th.y0);
        ctx.quadraticCurveTo(mx, my, th.x1, th.y1);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        const pulse = 0.42 + 0.28 * Math.sin(t * 0.002 + th.phase);
        ctx.fillStyle = `rgba(${th.color},${pulse * 0.6})`;
        ctx.beginPath();
        ctx.arc(lerp(th.x0, th.x1, 0.68), lerp(th.y0, th.y1, 0.68) + Math.sin(t * 0.0014 + th.phase) * 7 * dpr, 2.6 * dpr, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawDeskAndCards(t) {
      const deskX = w * 0.18;
      const deskY = h * 0.68;
      const deskW = w * 0.58;
      const deskH = h * 0.055;
      ctx.fillStyle = '#5c4634';
      roundRect(deskX, deskY, deskW, deskH, 7 * dpr);
      ctx.fill();
      ctx.fillStyle = '#35271e';
      ctx.fillRect(deskX, deskY + deskH, deskW, h * 0.12);

      ctx.fillStyle = '#2e3744';
      roundRect(w * 0.60, h * 0.52, w * 0.12, h * 0.10, 6 * dpr);
      ctx.fill();
      const screen = ctx.createLinearGradient(w * 0.605, h * 0.525, w * 0.705, h * 0.60);
      screen.addColorStop(0, 'rgba(110,153,255,0.42)');
      screen.addColorStop(1, 'rgba(249,196,112,0.20)');
      ctx.fillStyle = screen;
      roundRect(w * 0.607, h * 0.525, w * 0.106, h * 0.085, 4 * dpr);
      ctx.fill();

      ctx.fillStyle = 'rgba(214,226,255,0.18)';
      for (let i = 0; i < 7; i++) {
        ctx.fillRect(w * 0.616, h * (0.540 + i * 0.008), w * (0.040 + (i % 2) * 0.018), h * 0.003);
      }

      for (const c of cards) {
        ctx.save();
        ctx.translate(c.x, c.y + Math.sin(t * 0.0012 + c.rot * 10) * 2 * dpr);
        ctx.rotate(c.rot);
        ctx.fillStyle = `rgba(${c.tint},0.92)`;
        roundRect(-c.ww * 0.5, -c.hh * 0.5, c.ww, c.hh, 4 * dpr);
        ctx.fill();
        ctx.fillStyle = 'rgba(102,91,82,0.20)';
        for (let i = 0; i < 4; i++) {
          ctx.fillRect(-c.ww * 0.32, -c.hh * 0.22 + i * c.hh * 0.14, c.ww * (0.46 + (i % 2) * 0.12), 1.8 * dpr);
        }
        ctx.restore();
      }

      ctx.fillStyle = '#647281';
      roundRect(w * 0.27, h * 0.59, w * 0.07, h * 0.05, 5 * dpr);
      ctx.fill();
      ctx.lineWidth = 3 * dpr;
      ctx.strokeStyle = '#8092a1';
      ctx.beginPath();
      ctx.arc(w * 0.344, h * 0.615, 10 * dpr, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();
      for (let i = 0; i < 3; i++) {
        const sx = w * (0.286 + i * 0.013);
        ctx.strokeStyle = 'rgba(233,235,224,0.16)';
        ctx.lineWidth = 2 * dpr;
        ctx.beginPath();
        ctx.moveTo(sx, h * 0.59);
        ctx.bezierCurveTo(sx - 8 * dpr, h * 0.55, sx + 6 * dpr, h * 0.52, sx - 4 * dpr, h * 0.49);
        ctx.stroke();
      }
    }

    function drawPhosphor(t) {
      const px = w * 0.51;
      const py = h * 0.58;
      const tilt = (pointer.active ? (pointer.x - 0.5) * 0.16 : Math.sin(t * 0.0009) * 0.04);
      ctx.save();
      ctx.translate(px, py);

      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.17, w * 0.13, h * 0.03, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(tilt);

      const body = ctx.createLinearGradient(0, -h * 0.12, 0, h * 0.22);
      body.addColorStop(0, '#232c39');
      body.addColorStop(1, '#0b1017');
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.moveTo(-w * 0.08, h * 0.12);
      ctx.quadraticCurveTo(0, -h * 0.03, w * 0.08, h * 0.12);
      ctx.lineTo(w * 0.12, h * 0.23);
      ctx.lineTo(-w * 0.12, h * 0.23);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f0d6c3';
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.03, w * 0.050, h * 0.084, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(48,31,22,0.72)';
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.07, w * 0.055, h * 0.048, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-w * 0.055, -h * 0.07, w * 0.11, h * 0.024);

      ctx.strokeStyle = 'rgba(64,44,34,0.34)';
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      ctx.moveTo(-w * 0.022, -h * 0.01);
      ctx.lineTo(-w * 0.008, -h * 0.008);
      ctx.moveTo(w * 0.008, -h * 0.008);
      ctx.lineTo(w * 0.022, -h * 0.01);
      ctx.stroke();

      ctx.fillStyle = '#1d2430';
      ctx.beginPath();
      ctx.moveTo(-w * 0.018, h * 0.02);
      ctx.lineTo(0, h * 0.065);
      ctx.lineTo(w * 0.018, h * 0.02);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#d9dde7';
      ctx.beginPath();
      ctx.moveTo(-w * 0.04, h * 0.02);
      ctx.lineTo(0, h * 0.11);
      ctx.lineTo(w * 0.04, h * 0.02);
      ctx.closePath();
      ctx.fill();

      const lapel = ctx.createLinearGradient(0, 0, 0, h * 0.18);
      lapel.addColorStop(0, 'rgba(183,195,230,0.16)');
      lapel.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = lapel;
      ctx.beginPath();
      ctx.moveTo(-w * 0.068, h * 0.06);
      ctx.lineTo(-w * 0.01, h * 0.16);
      ctx.lineTo(-w * 0.04, h * 0.22);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(w * 0.068, h * 0.06);
      ctx.lineTo(w * 0.01, h * 0.16);
      ctx.lineTo(w * 0.04, h * 0.22);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#0c1117';
      roundRect(-w * 0.07, -h * 0.18, w * 0.14, h * 0.055, 8 * dpr);
      ctx.fill();
      ctx.fillRect(-w * 0.048, -h * 0.30, w * 0.096, h * 0.13);
      ctx.fillStyle = 'rgba(68,74,89,0.44)';
      ctx.fillRect(-w * 0.047, -h * 0.18, w * 0.094, h * 0.008);

      ctx.restore();
    }

    function drawForegroundThreads(t) {
      const cx = w * 0.51;
      const cy = h * 0.58;
      const colors = ['255,188,110','151,196,255','211,159,255','248,134,165','139,225,188'];
      for (let i = 0; i < 11; i++) {
        const x0 = cx - w * 0.12 + i * w * 0.02;
        const x1 = x0 + Math.sin(t * 0.0012 + i) * w * 0.04;
        const y0 = cy - h * 0.02 + i * h * 0.008;
        const y1 = cy + h * 0.12 + i * h * 0.009;
        const mx = lerp(x0, x1, 0.5) + (pointer.active ? (pointer.x - 0.5) * 22 * dpr : 0);
        const my = lerp(y0, y1, 0.5) - h * (0.07 + i * 0.002);
        ctx.save();
        ctx.strokeStyle = `rgba(${colors[i % colors.length]},0.82)`;
        ctx.shadowColor = `rgba(${colors[i % colors.length]},0.28)`;
        ctx.shadowBlur = 14 * dpr;
        ctx.lineWidth = (1.2 + (i % 3) * 0.7) * dpr;
        if (i % 3 === 0) ctx.setLineDash([7 * dpr, 5 * dpr]);
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(mx, my, x1, y1);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    }

    function draw(t) {
      drawBackground(t);
      drawLoom(t);
      drawThreadBundle(t);
      drawDeskAndCards(t);
      drawPhosphor(t);
      drawForegroundThreads(t);
      requestAnimationFrame(draw);
    }

    addEventListener('mousemove', (e) => {
      pointer.x = e.clientX / innerWidth;
      pointer.y = e.clientY / innerHeight;
      pointer.active = true;
    });
    addEventListener('touchstart', (e) => {
      if (!e.touches[0]) return;
      pointer.x = e.touches[0].clientX / innerWidth;
      pointer.y = e.touches[0].clientY / innerHeight;
      pointer.active = true;
    }, { passive: true });
    addEventListener('touchmove', (e) => {
      if (!e.touches[0]) return;
      pointer.x = e.touches[0].clientX / innerWidth;
      pointer.y = e.touches[0].clientY / innerHeight;
      pointer.active = true;
    }, { passive: true });
    addEventListener('mouseleave', () => pointer.active = false);
    addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
