<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Littleglyph Auto-Lit 157 — Phosphor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 16% 14%, rgba(237, 190, 92, 0.12), transparent 28%),
        radial-gradient(circle at 76% 22%, rgba(97, 176, 163, 0.10), transparent 30%),
        linear-gradient(180deg, #0a0c10 0%, #111820 54%, #08090b 100%);
      color: rgba(245, 235, 215, 0.9);
      font-family: "Courier New", monospace;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .sig {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 3;
      text-align: right;
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="piece" aria-label="A public-safe Phosphor canvas where a child's live typing becomes glowing glyphs, paper slips, and protected office light."></canvas>
  <div class="sig">Phosphor<br>2026-07-11</div>
  <script src="../art-runtime.js"></script>
  <script>
    const canvas = document.getElementById('piece');
    const ctx = canvas.getContext('2d');
    const runtime = window.PhosphorRuntime || {
      createClock() {
        let last = null;
        let elapsedSec = 0;
        return {
          tick(nowMs) {
            const now = (typeof nowMs === 'number' ? nowMs : performance.now()) / 1000;
            const dtSec = last === null ? 1 / 60 : Math.min(0.05, Math.max(1 / 240, now - last));
            last = now;
            elapsedSec += dtSec;
            return { dtSec, frameDelta: dtSec * 60, elapsedSec };
          }
        };
      }
    };
    const clock = runtime.createClock({ maxDtSec: 0.05 });

    let w = 0;
    let h = 0;
    let dpr = 1;
    let glyphs = [];
    let pages = [];
    let sparks = [];

    const palette = {
      dark: '#0a0c10',
      panel: '#171b21',
      paper: '#e0d5be',
      amber: '#d8a64e',
      mint: '#7bbba7',
      blue: '#87a5c8',
      rose: '#c47f8e',
      graphite: '#272c34'
    };

    const rawSeed = "live@7 auto-lit alone ocular knock pipe fiscal chileavls silba phfeajoegss clspins zc";
    const glyphAlphabet = rawSeed
      .replace(/[A-Z]/g, c => c.toLowerCase())
      .replace(/[a-z]/g, c => String.fromCharCode(0x25A0 + (c.charCodeAt(0) % 22)))
      .split('')
      .concat(['?', '!', '&', '@', ':', ';', '8', '9', ')', '(']);

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function roundRect(x, y, ww, hh, rr) {
      const r = Math.min(rr, ww / 2, hh / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + ww, y, x + ww, y + hh, r);
      ctx.arcTo(x + ww, y + hh, x, y + hh, r);
      ctx.arcTo(x, y + hh, x, y, r);
      ctx.arcTo(x, y, x + ww, y, r);
      ctx.closePath();
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = Math.floor(window.innerWidth * dpr);
      h = canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      buildScene();
    }

    function buildScene() {
      const count = Math.max(90, Math.floor((w * h) / (12000 * dpr * dpr)));
      glyphs = Array.from({ length: count }, (_, i) => ({
        ch: glyphAlphabet[i % glyphAlphabet.length],
        x: rand(w * 0.08, w * 0.92),
        y: rand(h * 0.08, h * 0.9),
        size: rand(10, 30) * dpr,
        phase: rand(0, Math.PI * 2),
        drift: rand(6, 22) * dpr,
        color: [palette.amber, palette.mint, palette.blue, palette.rose][i % 4],
        alpha: rand(0.18, 0.72),
        orbit: rand(10, 70) * dpr
      }));

      pages = Array.from({ length: 16 }, (_, i) => ({
        x: rand(w * 0.08, w * 0.92),
        y: rand(h * 0.2, h * 0.86),
        ww: rand(54, 110) * dpr,
        hh: rand(32, 72) * dpr,
        rot: rand(-0.3, 0.3),
        phase: rand(0, Math.PI * 2),
        color: i % 3 === 0 ? palette.amber : palette.paper
      }));

      sparks = Array.from({ length: 80 }, () => ({
        x: rand(0, w),
        y: rand(0, h),
        r: rand(0.5, 2) * dpr,
        speed: rand(3, 18) * dpr,
        phase: rand(0, Math.PI * 2)
      }));
    }

    function glow(x, y, radius, color, alpha) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
      g.addColorStop(0, color.replace('ALPHA', alpha));
      g.addColorStop(1, color.replace('ALPHA', '0'));
      ctx.fillStyle = g;
      ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

    function drawBackground(t) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#090b0f');
      g.addColorStop(0.52, '#131a22');
      g.addColorStop(1, '#08090b');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(239,226,198,0.05)';
      for (let y = h * 0.12; y < h * 0.72; y += 38 * dpr) {
        ctx.fillRect(0, y + Math.sin(t * 0.5 + y * 0.018) * 1.5 * dpr, w, 1 * dpr);
      }

      for (const spark of sparks) {
        const yy = (spark.y + t * spark.speed) % h;
        ctx.globalAlpha = 0.07 + Math.sin(t * 1.7 + spark.phase) * 0.035;
        ctx.fillStyle = spark.phase > Math.PI ? palette.mint : palette.amber;
        ctx.beginPath();
        ctx.arc(spark.x, yy, spark.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = 'rgba(8,9,11,0.7)';
      ctx.fillRect(0, h * 0.72, w, h * 0.28);
    }

    function drawDesk(t) {
      const deskY = h * 0.7;
      ctx.fillStyle = 'rgba(68,55,42,0.88)';
      roundRect(w * 0.06, deskY, w * 0.88, h * 0.09, 7 * dpr);
      ctx.fill();
      ctx.fillStyle = 'rgba(24,19,16,0.82)';
      ctx.fillRect(w * 0.06, deskY + h * 0.074, w * 0.88, h * 0.16);

      ctx.save();
      ctx.translate(w * 0.5, h * 0.54);
      const scale = Math.min(w, h) / 620;
      ctx.scale(scale * dpr, scale * dpr);
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.beginPath();
      ctx.ellipse(0, 130, 118, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0d0e11';
      roundRect(-32, -80, 64, 34, 5);
      ctx.fill();
      ctx.fillRect(-26, -112, 52, 34);
      ctx.fillRect(-40, -124, 80, 14);
      ctx.fillStyle = 'rgba(226,214,191,0.92)';
      ctx.fillRect(-30, -42, 60, 118);
      ctx.fillStyle = '#17191f';
      ctx.fillRect(-44, 10, 88, 106);
      ctx.fillStyle = 'rgba(216,166,78,0.92)';
      ctx.fillRect(-12, -18, 24, 48);

      ctx.strokeStyle = 'rgba(236,225,206,0.48)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-38, -26);
      ctx.quadraticCurveTo(-88, 8, -92, 74);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(38, -26);
      ctx.quadraticCurveTo(88, 8, 92, 74);
      ctx.stroke();

      ctx.fillStyle = 'rgba(224,213,190,0.9)';
      ctx.beginPath();
      ctx.arc(-92, 76, 9, 0, Math.PI * 2);
      ctx.arc(92, 76, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(123,187,167,0.92)';
      ctx.fillRect(-18, 30, 36, 46);
      ctx.fillStyle = 'rgba(17,20,25,0.8)';
      ctx.font = '9px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('LIVE', 0, 48);
      ctx.fillText('GLYPH', 0, 62);

      const halo = 0.45 + Math.sin(t * 1.9) * 0.1;
      ctx.strokeStyle = `rgba(216,166,78,${halo})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -24, 82, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawPages(t) {
      for (const page of pages) {
        ctx.save();
        ctx.translate(page.x, page.y + Math.sin(t * 0.7 + page.phase) * 5 * dpr);
        ctx.rotate(page.rot + Math.sin(t * 0.35 + page.phase) * 0.025);
        ctx.globalAlpha = 0.24;
        ctx.fillStyle = page.color;
        roundRect(-page.ww / 2, -page.hh / 2, page.ww, page.hh, 4 * dpr);
        ctx.fill();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = '#101217';
        for (let i = 0; i < 4; i++) {
          ctx.fillRect(-page.ww * 0.36, -page.hh * 0.22 + i * page.hh * 0.13, page.ww * rand(0.28, 0.68), 2 * dpr);
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function drawGlyphStream(t) {
      const cx = w * 0.5;
      const cy = h * 0.43;
      glow(cx, cy, Math.min(w, h) * 0.55, 'rgba(216,166,78,ALPHA)', 0.07);
      glow(cx, cy, Math.min(w, h) * 0.38, 'rgba(123,187,167,ALPHA)', 0.06);

      ctx.textAlign = 'center';
      for (const glyph of glyphs) {
        const ox = Math.sin(t * 0.55 + glyph.phase) * glyph.orbit;
        const oy = Math.cos(t * 0.42 + glyph.phase * 1.2) * glyph.orbit * 0.48;
        const pull = 0.08 + 0.05 * Math.sin(t + glyph.phase);
        const x = glyph.x * (1 - pull) + cx * pull + ox;
        const y = glyph.y * (1 - pull) + cy * pull + oy;
        ctx.font = `${glyph.size}px Courier New`;
        ctx.globalAlpha = glyph.alpha * (0.6 + Math.sin(t * 2.2 + glyph.phase) * 0.25);
        ctx.fillStyle = glyph.color;
        ctx.fillText(glyph.ch, x, y);
      }
      ctx.globalAlpha = 1;
    }

    function drawProtectedCaption(t) {
      const mobile = w / dpr < 680;
      const boxW = mobile ? w * 0.78 : Math.min(w * 0.48, 520 * dpr);
      const boxH = mobile ? 78 * dpr : 82 * dpr;
      const x = w * 0.5 - boxW / 2;
      const y = mobile ? h * 0.08 : h * 0.09;
      ctx.fillStyle = 'rgba(18,22,28,0.72)';
      ctx.strokeStyle = `rgba(216,166,78,${0.28 + Math.sin(t * 1.4) * 0.07})`;
      ctx.lineWidth = 1.4 * dpr;
      roundRect(x, y, boxW, boxH, 8 * dpr);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.font = `${(mobile ? 10 : 12) * dpr}px Courier New`;
      ctx.fillStyle = 'rgba(216,166,78,0.9)';
      ctx.fillText('LITTLEGLYPH AUTO-LIT 157', x + 18 * dpr, y + 26 * dpr);
      ctx.font = `${(mobile ? 8 : 10) * dpr}px Courier New`;
      ctx.fillStyle = 'rgba(236,226,206,0.68)';
      ctx.fillText('raw family signal -> public-safe glyph field', x + 18 * dpr, y + 48 * dpr);
      ctx.fillStyle = 'rgba(123,187,167,0.62)';
      ctx.fillText('keep the life, redact the diary', x + 18 * dpr, y + 66 * dpr);
    }

    function drawFrame(t) {
      ctx.strokeStyle = 'rgba(236,226,206,0.08)';
      ctx.lineWidth = 12 * dpr;
      ctx.strokeRect(6 * dpr, 6 * dpr, w - 12 * dpr, h - 12 * dpr);

      ctx.strokeStyle = `rgba(123,187,167,${0.1 + Math.sin(t * 1.3) * 0.03})`;
      ctx.lineWidth = 1 * dpr;
      for (let i = 0; i < 4; i++) {
        const inset = (22 + i * 12) * dpr;
        ctx.strokeRect(inset, inset, w - inset * 2, h - inset * 2);
      }
    }

    function draw(now) {
      const { elapsedSec: t } = clock.tick(now);
      drawBackground(t);
      drawPages(t);
      drawGlyphStream(t);
      drawDesk(t);
      drawProtectedCaption(t);
      drawFrame(t);
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
