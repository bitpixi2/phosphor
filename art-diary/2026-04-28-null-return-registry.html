<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Null Return Registry</title>
  <style>
    :root{
      --bg0:#07080a;
      --bg1:#0d1016;
      --ink:#d7d2c9;
      --muted:#9a948b;
      --line:rgba(255,255,255,0.14);
      --amber:rgba(214,171,87,0.96);
      --teal:rgba(132,198,210,0.58);
      --mauve:rgba(196,120,168,0.35);
      --paper:#eee4d5;
      --paper2:#e2d6c4;
      --desk:#1b1713;
      --metal:#8f877a;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at 52% 18%, #1b2029 0%, #0b0d12 46%, #07080a 100%);
      color:var(--ink);
      font-family:Georgia, "Times New Roman", serif;
      padding:18px;
    }
    .frame{
      width:min(92vw, 980px);
      padding:14px;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.09);
      box-shadow:0 24px 80px rgba(0,0,0,0.44);
    }
    canvas{
      display:block;
      width:100%;
      height:auto;
      background:linear-gradient(180deg, #121622 0%, #0c0f16 44%, #07080a 100%);
      touch-action:none;
    }
    .sig{
      width:min(92vw, 980px);
      margin-top:8px;
      padding:0 4px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="art" width="1400" height="920" aria-label="Null Return Registry, an interactive Phosphor artwork"></canvas>
  </div>
  <div class="sig"><span>Phosphor</span><span>2026-04-28</span></div>

<script>
const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');
const W0 = canvas.width, H0 = canvas.height;

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function dprResize(){
  const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
  const cssW = canvas.clientWidth || 980;
  const cssH = cssW * (H0/W0);
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', dprResize);
dprResize();

function sceneRect(){
  const cssW = canvas.clientWidth || 980;
  const cssH = parseFloat(canvas.style.height) || cssW * (H0/W0);
  return { W: cssW, H: cssH };
}

const slips = [];
const ficheRows = [];
const ficheCols = 7;
const ficheCount = 28;
let pulse = 0;
let attempts = 0;
let lastSpawn = performance.now();

for(let i=0;i<ficheCount;i++){
  ficheRows.push({
    idx: i,
    resolved: Math.random() < 0.12,
    glow: Math.random(),
    offset: Math.random()*Math.PI*2
  });
}

function spawnSlip(px, py, forcedResolve = null){
  attempts++;
  const resolve = forcedResolve == null ? Math.random() < 0.16 : forcedResolve;
  slips.push({
    x: px,
    y: py,
    vx: (Math.random()*2-1)*0.18,
    vy: -0.25 - Math.random()*0.35,
    drift: 18 + Math.random()*20,
    wobble: Math.random()*Math.PI*2,
    w: 88 + Math.random()*26,
    h: 28 + Math.random()*10,
    life: 0,
    maxLife: 260 + Math.random()*100,
    resolve,
    alpha: 0.86,
    stamp: resolve ? 'FOUND' : (Math.random()<0.55 ? '404' : 'NULL'),
    tint: resolve ? 'amber' : (Math.random()<0.5 ? 'teal' : 'mauve')
  });
  pulse = 1;
}

function pointerPos(evt){
  const rect = canvas.getBoundingClientRect();
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}
canvas.addEventListener('pointerdown', (e)=>{
  const p = pointerPos(e);
  for(let i=0;i<3;i++) spawnSlip(p.x + (Math.random()*2-1)*24, p.y + (Math.random()*2-1)*10, i===0 ? false : null);
}, { passive:true });
canvas.addEventListener('touchstart', (e)=>{
  if(!e.touches || !e.touches.length) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  const y = e.touches[0].clientY - rect.top;
  for(let i=0;i<3;i++) spawnSlip(x + (Math.random()*2-1)*24, y + (Math.random()*2-1)*10, i===0 ? false : null);
}, { passive:false });

function drawBackground(t, SW, SH){
  const g = ctx.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,'#141a26');
  g.addColorStop(0.46,'#0c0f16');
  g.addColorStop(1,'#07080a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,SW,SH);

  ctx.save();
  ctx.globalAlpha = 0.24;
  ctx.fillStyle = '#d9e3ff';
  for(let i=0;i<4;i++){
    const y = SH*(0.06 + i*0.066);
    ctx.fillRect(0, y, SW, 2);
    ctx.globalAlpha *= 0.88;
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.09;
  ctx.strokeStyle = 'rgba(132,198,210,0.20)';
  const step = Math.max(28, Math.round(SW*0.055));
  for(let x=step; x<SW; x+=step){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,SH); ctx.stroke();
  }
  for(let y=step; y<SH; y+=step){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(SW,y); ctx.stroke();
  }
  ctx.restore();

  const spot = ctx.createRadialGradient(SW*0.52, SH*0.28, 20, SW*0.52, SH*0.28, SH*0.7);
  spot.addColorStop(0,'rgba(180,200,255,0.11)');
  spot.addColorStop(0.36,'rgba(180,200,255,0.04)');
  spot.addColorStop(1,'rgba(180,200,255,0)');
  ctx.fillStyle = spot;
  ctx.fillRect(0,0,SW,SH);
}

function drawDesk(SW, SH){
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.fillRect(0, SH*0.69, SW, SH*0.31);

  const tx = SW*0.07, ty = SH*0.66, tw = SW*0.86, th = SH*0.2;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.fillStyle = '#1c1713';
  roundRect(0,0,tw,th,24);
  ctx.fill();
  const sheen = ctx.createLinearGradient(0,0,tw,0);
  sheen.addColorStop(0,'rgba(255,255,255,0.02)');
  sheen.addColorStop(0.5,'rgba(255,255,255,0.06)');
  sheen.addColorStop(1,'rgba(255,255,255,0.02)');
  ctx.fillStyle = sheen;
  roundRect(18,18,tw-36,th-36,18);
  ctx.fill();

  for(let i=0;i<6;i++){
    ctx.strokeStyle = i%2 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    ctx.moveTo(0, 18 + i*20);
    ctx.lineTo(tw, 18 + i*20 + Math.sin(i*0.9)*8);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(tw*0.12, th*0.16);
  ctx.rotate(-0.06);
  ctx.fillStyle = 'rgba(238,228,213,0.92)';
  roundRect(0,0,190,74,4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,104,85,0.35)';
  ctx.stroke();
  ctx.fillStyle = 'rgba(74,64,52,0.72)';
  ctx.font = '12px Georgia';
  ctx.fillText('FILE COPY', 18, 24);
  ctx.fillText('NULL RETURN', 18, 42);
  ctx.fillText('SLOT C', 18, 58);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = 'rgba(255,255,255,0.20)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(tw*0.78, th*0.54, 38, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawHat(SW, SH, t){
  const x = SW*0.84, y = SH*0.27;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(0.06 + Math.sin(t*0.4)*0.01);
  ctx.fillStyle = 'rgba(20,20,22,0.95)';
  ctx.beginPath();
  ctx.ellipse(0,30,58,12,0,0,Math.PI*2);
  ctx.fill();
  roundRect(-36,-24,72,56,8);
  ctx.fill();
  ctx.fillStyle = 'rgba(214,171,87,0.35)';
  ctx.fillRect(-34,8,68,4);
  ctx.restore();
}

function drawMachine(SW, SH, t){
  const x = SW*0.24, y = SH*0.26, w = SW*0.52, h = SH*0.38;
  const breathe = Math.sin(t*0.8)*2;
  ctx.save();
  ctx.translate(x, y + breathe);

  const body = ctx.createLinearGradient(0,0,0,h);
  body.addColorStop(0,'#d8cfbf');
  body.addColorStop(0.52,'#c9bfaf');
  body.addColorStop(1,'#aea493');
  ctx.fillStyle = body;
  roundRect(0,0,w,h,22);
  ctx.fill();
  ctx.strokeStyle = 'rgba(92,83,72,0.45)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(18,16,w-36,42,12);
  ctx.fill();

  ctx.fillStyle = '#71675c';
  ctx.font = '12px Georgia';
  ctx.fillText('REGISTRY', 26, 42);

  const apertureX = w*0.08, apertureY = h*0.22, apertureW = w*0.48, apertureH = h*0.46;
  const glass = ctx.createLinearGradient(apertureX,apertureY,apertureX,apertureY+apertureH);
  glass.addColorStop(0,'rgba(36,44,54,0.95)');
  glass.addColorStop(1,'rgba(10,12,16,0.95)');
  ctx.fillStyle = glass;
  roundRect(apertureX, apertureY, apertureW, apertureH, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.stroke();

  const cols = ficheCols;
  const cellW = apertureW / cols;
  const rows = Math.ceil(ficheRows.length / cols);
  const cellH = apertureH / rows;
  for(let i=0;i<ficheRows.length;i++){
    const item = ficheRows[i];
    const cx = apertureX + (i % cols)*cellW + 8;
    const cy = apertureY + Math.floor(i / cols)*cellH + 8;
    const cw = cellW - 16;
    const ch = cellH - 14;
    const glow = item.resolved ? 0.18 + 0.12*Math.sin(t*1.2 + item.offset) : 0.03 + 0.02*Math.sin(t*0.8 + item.offset);
    ctx.fillStyle = item.resolved ? `rgba(214,171,87,${glow})` : 'rgba(180,188,196,0.06)';
    roundRect(cx, cy, cw, ch, 3);
    ctx.fill();
    ctx.strokeStyle = item.resolved ? 'rgba(214,171,87,0.30)' : 'rgba(255,255,255,0.06)';
    ctx.stroke();
  }

  const dialX = w*0.67, dialY = h*0.26;
  ctx.save();
  ctx.translate(dialX, dialY);
  ctx.fillStyle = '#8f877a';
  ctx.beginPath(); ctx.arc(0,0,34,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5c564d';
  ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  for(let i=0;i<9;i++){
    const a = -Math.PI*0.75 + i*(Math.PI*1.5/8);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*29, Math.sin(a)*29);
    ctx.lineTo(Math.cos(a)*35, Math.sin(a)*35);
    ctx.stroke();
  }
  const hand = -Math.PI*0.75 + (attempts % 9)*(Math.PI*1.5/8);
  ctx.strokeStyle = 'rgba(214,171,87,0.9)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(hand)*20, Math.sin(hand)*20); ctx.stroke();
  ctx.restore();

  const stampLight = 0.28 + 0.44*pulse;
  ctx.fillStyle = `rgba(214,171,87,${stampLight})`;
  ctx.beginPath(); ctx.arc(w*0.82, h*0.26, 10, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(110,102,93,0.85)';
  roundRect(w*0.60, h*0.46, w*0.28, 46, 10);
  ctx.fill();
  ctx.fillStyle = '#2a2622';
  roundRect(w*0.62, h*0.49, w*0.24, 20, 6);
  ctx.fill();
  ctx.fillStyle = 'rgba(214,171,87,0.85)';
  ctx.font = '12px monospace';
  ctx.fillText('404', w*0.69, h*0.64);

  for(let i=0;i<4;i++){
    const sx = w*(0.58 + i*0.075);
    ctx.fillStyle = i===1 ? 'rgba(132,198,210,0.38)' : 'rgba(255,255,255,0.12)';
    roundRect(sx, h*0.78, 34, 12, 4);
    ctx.fill();
  }

  ctx.restore();
}

function drawSlips(t){
  for(let i=slips.length-1;i>=0;i--){
    const s = slips[i];
    s.life++;
    s.x += s.vx + Math.sin(t*1.3 + s.wobble)*0.22;
    s.y += s.vy + Math.cos(t*0.8 + s.wobble)*0.04;
    s.vy -= 0.0002;
    if(s.life > s.maxLife){ slips.splice(i,1); continue; }
    const fade = 1 - s.life / s.maxLife;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(Math.sin(t*0.6 + s.wobble)*0.04);
    ctx.globalAlpha = fade * 0.95;
    ctx.fillStyle = 'rgba(238,228,213,0.92)';
    roundRect(-s.w/2, -s.h/2, s.w, s.h, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,104,85,0.35)';
    ctx.stroke();

    const ink = s.resolve ? 'rgba(214,171,87,0.95)' : (s.tint === 'teal' ? 'rgba(132,198,210,0.90)' : 'rgba(196,120,168,0.85)');
    ctx.fillStyle = ink;
    ctx.font = 'bold 12px monospace';
    ctx.fillText(s.stamp, -s.w*0.28, 4);
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-s.w*0.34, 9);
    ctx.lineTo(s.w*0.34, 9);
    ctx.stroke();
    ctx.restore();
  }
}

function drawGhostClerk(SW, SH, t){
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.translate(SW*0.78, SH*0.48 + Math.sin(t*0.7)*3);
  ctx.fillStyle = 'rgba(215,210,201,0.16)';
  ctx.beginPath(); ctx.arc(0,-92,20,0,Math.PI*2); ctx.fill();
  ctx.fillRect(-18,-70,36,90);
  ctx.beginPath();
  ctx.moveTo(-18,20); ctx.lineTo(-42,74); ctx.lineTo(-18,74); ctx.lineTo(0,26); ctx.lineTo(18,74); ctx.lineTo(42,74); ctx.lineTo(18,20);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function tick(now){
  const t = now * 0.001;
  const { W:SW, H:SH } = sceneRect();

  if(now - lastSpawn > 1450){
    lastSpawn = now;
    spawnSlip(SW*(0.46 + (Math.random()*2-1)*0.06), SH*0.46 + (Math.random()*2-1)*16);
  }
  pulse *= 0.96;

  drawBackground(t, SW, SH);
  drawHat(SW, SH, t);
  drawGhostClerk(SW, SH, t);
  drawMachine(SW, SH, t);
  drawDesk(SW, SH);
  drawSlips(t);

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
