<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accurate Load - Phosphor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none}
body{background:#0b0d0b;color:rgba(224,218,194,.46);font-family:"Courier New",monospace}
canvas{display:block;width:100%;height:100%;touch-action:none}
.sig{position:fixed;right:18px;bottom:16px;z-index:2;text-align:right;font-size:10px;line-height:1.6;letter-spacing:.18em;text-transform:uppercase;color:rgba(224,218,194,.45);pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.7)}
</style>
</head>
<body>
<canvas id="piece"></canvas>
<div class="sig">Phosphor<br>2026-06-02</div>
<script>
const canvas=document.getElementById("piece");
const ctx=canvas.getContext("2d");
let W=0,H=0,D=1,t0=performance.now();
const pointer={x:.5,y:.5,down:false};
let stamp=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,p){return a+(b-a)*p}

function resize(){
  D=Math.min(devicePixelRatio||1,2);
  W=canvas.width=Math.floor(innerWidth*D);
  H=canvas.height=Math.floor(innerHeight*D);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
}

function setPointer(e,down){
  const b=canvas.getBoundingClientRect();
  pointer.x=clamp((e.clientX-b.left)/b.width,0,1);
  pointer.y=clamp((e.clientY-b.top)/b.height,0,1);
  pointer.down=down;
}

canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  setPointer(e,true);
  stamp=1;
});
canvas.addEventListener("pointermove",e=>setPointer(e,pointer.down));
canvas.addEventListener("pointerup",e=>setPointer(e,false));
canvas.addEventListener("pointercancel",()=>pointer.down=false);
addEventListener("resize",resize);

function line(x1,y1,x2,y2,color,w=1){
  ctx.strokeStyle=color;
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function rect(x,y,w,h,fill,stroke,lw=1){
  ctx.fillStyle=fill;
  ctx.fillRect(x,y,w,h);
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h)}
}

function drawBackground(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#141512");
  g.addColorStop(.55,"#0b0d0b");
  g.addColorStop(1,"#060706");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  const cx=W*.5,cy=H*.5;
  for(const x of [.22,.5,.78])line(W*x,H*.18,W*x,H*.82,"rgba(221,214,188,.026)",D);
  for(const y of [.34,.5,.66])line(W*.18,H*y,W*.82,H*y,"rgba(221,214,188,.022)",D);

  const wash=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.68);
  wash.addColorStop(0,"rgba(151,159,131,.065)");
  wash.addColorStop(.52,"rgba(83,96,78,.032)");
  wash.addColorStop(1,"rgba(0,0,0,.68)");
  ctx.fillStyle=wash;
  ctx.fillRect(0,0,W,H);
}

function drawLedger(t,cx,cy){
  const w=Math.min(W*.48,470*D);
  const h=Math.min(H*.42,320*D);
  const driftX=(pointer.x-.5)*8*D;
  const driftY=(pointer.y-.5)*6*D;
  ctx.save();
  ctx.translate(cx+driftX,cy+driftY);
  ctx.rotate((pointer.x-.5)*.012);
  rect(-w/2,-h/2,w,h,"rgba(210,204,184,.88)","rgba(24,25,22,.78)",1.2*D);
  rect(-w/2+14*D,-h/2+14*D,w-28*D,h-28*D,"rgba(36,39,34,.91)","rgba(210,204,184,.13)",D);

  for(let i=0;i<5;i++){
    const y=-h*.31+i*h*.15;
    line(-w*.34,y,w*.34,y,"rgba(210,204,184,.16)",D);
    const pulse=(Math.sin(t*.0012+i*.9)+1)/2;
    const len=lerp(w*.16,w*.56,pulse*.65+(i===2?.22:0));
    ctx.fillStyle=i===2?"rgba(202,154,78,.32)":"rgba(143,163,135,.22)";
    ctx.fillRect(-w*.28,y-1.5*D,len,3*D);
  }

  const boxW=w*.42,boxH=h*.17;
  ctx.strokeStyle="rgba(210,204,184,.24)";
  ctx.lineWidth=1.1*D;
  ctx.strokeRect(-boxW/2,h*.16,boxW,boxH);
  for(let i=0;i<7;i++){
    const x=-boxW*.38+i*boxW*.13;
    const height=(.18+.42*(Math.sin(t*.0015+i*.7)+1)/2)*boxH;
    line(x,h*.16+boxH*.7,x,h*.16+boxH*.7-height,"rgba(202,154,78,.28)",D);
  }

  if(stamp>0){
    ctx.strokeStyle=`rgba(202,154,78,${stamp*.46})`;
    ctx.lineWidth=1.5*D;
    ctx.strokeRect(-w*.16,-h*.09,w*.32,h*.12);
  }
  ctx.restore();
}

function drawLoadMarks(t,cx,cy){
  const gap=Math.min(W,H)*.21;
  for(const side of [-1,1]){
    const x=cx+side*gap;
    const top=cy-H*.15;
    const h=H*.3;
    const v=clamp(.5+side*.08+Math.sin(t*.001+side)*.17+(pointer.down?.1:0),0,1);
    rect(x-7*D,top,14*D,h,"rgba(8,10,8,.56)","rgba(210,204,184,.12)",D);
    ctx.fillStyle=side>0?"rgba(202,154,78,.37)":"rgba(137,158,132,.32)";
    ctx.fillRect(x-4*D,top+h*(1-v),8*D,h*v);
  }
  ctx.strokeStyle="rgba(166,176,151,.14)";
  ctx.lineWidth=1.1*D;
  ctx.beginPath();
  ctx.moveTo(cx-gap+10*D,cy+H*.11);
  ctx.bezierCurveTo(cx-W*.09,cy+H*.18,cx+W*.09,cy+H*.18,cx+gap-10*D,cy+H*.11);
  ctx.stroke();
}

function frame(now){
  const t=now-t0;
  stamp*=.93;
  drawBackground(t);
  const cx=W*.5;
  const cy=H*.51;
  drawLoadMarks(t,cx,cy);
  drawLedger(t,cx,cy);
  ctx.fillStyle="rgba(0,0,0,.14)";
  for(let y=0;y<H;y+=5*D)ctx.fillRect(0,y,W,D);
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
