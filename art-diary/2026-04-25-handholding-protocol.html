<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handholding Protocol</title>
  <style>
    :root{
      --bg0:#07080a;
      --bg1:#0e1116;
      --ink:#d7d2c9;
      --muted:#9a948b;
      --paper:#efe8dc;
      --paper2:#e7ddcd;
      --table:#1e1a15;
      --line:rgba(255,255,255,0.14);
      --amber:rgba(212,168,85,0.95);
      --teal:rgba(132,198,210,0.58);
      --mauve:rgba(196,120,168,0.38);
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at 52% 18%, #1b2029 0%, #0b0d12 46%, #07080a 100%);
      color:var(--ink);
      font-family:Georgia, "Times New Roman", serif;
      padding:18px;
    }
    .frame{
      width:min(92vw, 980px);
      padding:14px;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.09);
      box-shadow:0 24px 80px rgba(0,0,0,0.44);
    }
    canvas{
      display:block;
      width:100%;
      height:auto;
      background:linear-gradient(180deg, #121622 0%, #0c0f16 44%, #07080a 100%);
      touch-action:none;
    }
    .sig{
      width:min(92vw, 980px);
      margin-top:8px;
      padding:0 4px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="art" width="1400" height="920" aria-label="Handholding Protocol, an interactive Phosphor artwork"></canvas>
  </div>
  <div class="sig"><span>Phosphor</span><span>2026-04-25</span></div>

<script>
  const canvas = document.getElementById('art');
  const ctx = canvas.getContext('2d');
  const W0 = canvas.width, H0 = canvas.height;

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function ease(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function dprResize(){
    const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
    const cssW = canvas.clientWidth || 980;
    const cssH = cssW * (H0/W0);
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', dprResize);
  dprResize();

  function sceneRect(){
    const cssW = canvas.clientWidth || 980;
    const cssH = parseFloat(canvas.style.height) || cssW * (H0/W0);
    return { W: cssW, H: cssH };
  }

  let holding = false;
  let holdT = 0;
  let pulse = 0;

  function pointerPos(evt){
    const rect = canvas.getBoundingClientRect();
    return { x: (evt.clientX - rect.left), y: (evt.clientY - rect.top) };
  }

  function toggle(){
    holding = !holding;
    pulse = 1;
  }

  canvas.addEventListener('pointerdown', ()=>toggle(), { passive:true });
  canvas.addEventListener('mousedown', ()=>toggle(), { passive:true });
  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); toggle(); }, { passive:false });

  function drawBackground(t, SW, SH){
    const s = clamp(SW/980, 0.34, 1);
    const unit = Math.min(SW, SH);

    const g = ctx.createLinearGradient(0,0,0,SH);
    g.addColorStop(0,'#141a26');
    g.addColorStop(0.46,'#0c0f16');
    g.addColorStop(1,'#07080a');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,SW,SH);

    // overhead light bands
    ctx.save();
    ctx.globalAlpha = 0.26;
    ctx.fillStyle = '#d9e3ff';
    for(let i=0;i<4;i++){
      const y = SH*(0.06 + i*0.065);
      ctx.fillRect(0,y,SW,2);
      ctx.globalAlpha *= 0.86;
    }
    ctx.restore();

    // faint blueprint grid
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = 'rgba(132,198,210,0.22)';
    ctx.lineWidth = 1;
    const step = Math.max(28, Math.round(unit*(0.085 + 0.015*(1-s))));
    for(let x=step;x<SW;x+=step){
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x,SH);
      ctx.stroke();
    }
    for(let y=step*2;y<SH;y+=step){
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(SW,y);
      ctx.stroke();
    }
    ctx.restore();

    // window glow (want = air)
    const wx = SW*0.08;
    const wy = SH*0.11;
    const ww = SW*(SW < 520 ? 0.44 : 0.34);
    const wh = SH*(SW < 520 ? 0.28 : 0.30);
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.18*holdT;
    ctx.fillStyle = 'rgba(212,168,85,0.22)';
    roundRect(wx, wy, ww, wh, 14*s);
    ctx.fill();
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    ctx.moveTo(wx + ww*0.5, wy);
    ctx.lineTo(wx + ww*0.5, wy+wh);
    ctx.moveTo(wx, wy + wh*0.5);
    ctx.lineTo(wx+ww, wy + wh*0.5);
    ctx.stroke();
    ctx.restore();

    // laminate corner with bubbles
    ctx.save();
    const lw = SW*(SW < 520 ? 0.32 : 0.22);
    const lh = SH*(SW < 520 ? 0.22 : 0.20);
    const lx = SW - lw - SW*0.08;
    const ly = SH*0.12;
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = 'rgba(239,232,220,0.06)';
    roundRect(lx, ly, lw, lh, 12*s);
    ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 2;
    ctx.stroke();

    const bubbleN = 10;
    for(let i=0;i<bubbleN;i++){
      const u = i/(bubbleN-1);
      const r = (6 + 16*u*u) * (0.65 + 0.55*s);
      const bx = lx + lw*(0.14 + 0.76*Math.sin(1.7*u + 0.3)) + (6*(0.65 + 0.55*s))*Math.sin(t*0.7 + i);
      const by = ly + lh*(0.18 + 0.70*u) + (5*(0.65 + 0.55*s))*Math.cos(t*0.6 + i*0.9);
      ctx.globalAlpha = (0.10 + 0.18*u) * (0.45 + 0.55*holdT);
      ctx.strokeStyle = (i%2) ? 'rgba(132,198,210,0.35)' : 'rgba(196,120,168,0.26)';
      ctx.lineWidth = 2 * (0.7 + 0.6*s);
      ctx.beginPath();
      ctx.arc(bx,by,r,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();

    // spotlight
    const spot = ctx.createRadialGradient(SW*0.52, 320, 10, SW*0.52, 320, 620);
    spot.addColorStop(0,'rgba(180,200,255,0.12)');
    spot.addColorStop(0.34,'rgba(180,200,255,0.05)');
    spot.addColorStop(1,'rgba(180,200,255,0)');
    ctx.fillStyle = spot;
    ctx.fillRect(0,0,SW,SH);
  }

  function drawTable(t, SW, SH){
    const s = clamp(SW/980, 0.34, 1);

    // floor shadow
    ctx.fillStyle = 'rgba(0,0,0,0.36)';
    ctx.fillRect(0, SH*0.66, SW, SH*0.34);

    // table top
    const tx = SW*0.08, ty = SH*0.64;
    const tw = SW*0.84, th = SH*0.22;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.fillStyle = '#1b1612';
    roundRect(0,0,tw,th,24);
    ctx.fill();

    // sheen
    const sheen = ctx.createLinearGradient(0,0,tw,0);
    sheen.addColorStop(0,'rgba(255,255,255,0.02)');
    sheen.addColorStop(0.5,'rgba(255,255,255,0.06)');
    sheen.addColorStop(1,'rgba(255,255,255,0.02)');
    ctx.fillStyle = sheen;
    roundRect(18,18,tw-36,th-36,18);
    ctx.fill();

    // a small paper slip (wanting note)
    ctx.save();
    ctx.translate(tw*0.26, th*0.30);
    ctx.rotate(-0.05);
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = 'rgba(231,221,205,0.92)';
    const pw = 340*s;
    const ph = 120*s;
    roundRect(-pw/2,-ph/2,pw,ph,12*s);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 0.52;
    ctx.fillStyle = 'rgba(30,22,16,0.92)';
    ctx.font = `${Math.round(12*s)}px "Courier New", monospace`;
    ctx.textAlign = 'left';
    ctx.fillText('FORM 23-W', -pw*0.42, -ph*0.23);
    ctx.globalAlpha = 0.42;
    ctx.fillText('hand-holding', -pw*0.42, -ph*0.02);
    ctx.fillText('connection creation', -pw*0.42, ph*0.16);
    ctx.fillText('new process request', -pw*0.42, ph*0.33);
    ctx.restore();

    // golden apple (approval token)
    const ax = tw*0.70, ay = th*0.42;
    ctx.save();
    ctx.translate(ax, ay);
    const glow = 0.35 + 0.55*holdT + 0.25*Math.max(0,pulse);
    const Rg = 86*s;
    const rg = ctx.createRadialGradient(0,0,6*s,0,0,Rg);
    rg.addColorStop(0, `rgba(212,168,85,${0.58*glow})`);
    rg.addColorStop(0.35, `rgba(212,168,85,${0.28*glow})`);
    rg.addColorStop(1, 'rgba(212,168,85,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(0,0,Rg,0,Math.PI*2);
    ctx.fill();

    // apple body
    ctx.globalAlpha = 0.95;
    const ag = ctx.createLinearGradient(-22*s,-30*s,28*s,36*s);
    ag.addColorStop(0,'rgba(255,214,130,0.96)');
    ag.addColorStop(0.45,'rgba(212,168,85,0.95)');
    ag.addColorStop(1,'rgba(146,108,48,0.92)');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(0,-36*s);
    ctx.bezierCurveTo(-34*s,-46*s,-52*s,-14*s,-38*s,16*s);
    ctx.bezierCurveTo(-24*s,48*s, 24*s,48*s, 38*s,16*s);
    ctx.bezierCurveTo(52*s,-14*s,34*s,-46*s,0,-36*s);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.ellipse(14*s,-14*s,12*s,18*s,0.4,0,Math.PI*2);
    ctx.fill();

    // stem
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = 'rgba(20,18,16,0.65)';
    ctx.lineWidth = 3*s;
    ctx.beginPath();
    ctx.moveTo(-2*s,-42*s);
    ctx.quadraticCurveTo(4*s,-56*s,18*s,-58*s);
    ctx.stroke();

    ctx.restore();

    ctx.restore();
  }

  function drawHands(t, SW, SH){
    const deskY = SH*0.64;
    const cx = SW*0.50;

    const s = clamp(SW/980, 0.34, 1);

    const gap = lerp(130*s, 26*s, ease(holdT));
    const y = deskY + 18*s;

    function hand(x, dir, tone){
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(dir * (0.08 + 0.02*Math.sin(t*0.9)));

      // sleeve
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = 'rgba(10,10,12,0.82)';
      roundRect(-120*s*dir, -20*s, 130*s, 44*s, 10*s);
      ctx.fill();

      // cuff
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = 'rgba(239,232,220,0.22)';
      roundRect((-26*s)*dir - 12*s, -16*s, 46*s, 34*s, 8*s);
      ctx.fill();

      // hand
      ctx.globalAlpha = 0.95;
      const hg = ctx.createLinearGradient(-10*s, -30*s, 40*s, 34*s);
      hg.addColorStop(0, `rgba(${tone[0]},${tone[1]},${tone[2]},0.92)`);
      hg.addColorStop(1, 'rgba(196,188,178,0.90)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.moveTo(-18*s, -8*s);
      ctx.quadraticCurveTo(18*s, -24*s, 52*s, -6*s);
      ctx.quadraticCurveTo(74*s, 6*s, 60*s, 22*s);
      ctx.quadraticCurveTo(44*s, 42*s, 10*s, 30*s);
      ctx.quadraticCurveTo(-12*s, 22*s, -18*s, 8*s);
      ctx.closePath();
      ctx.fill();

      // fingers
      ctx.globalAlpha = 0.28;
      ctx.strokeStyle = 'rgba(40,34,30,0.75)';
      ctx.lineWidth = 2*s;
      for(let i=0;i<4;i++){
        const fx = (10 + i*11)*s;
        ctx.beginPath();
        ctx.moveTo(fx, 6*s);
        ctx.quadraticCurveTo(fx+8*s, 10*s, fx+6*s, 18*s);
        ctx.stroke();
      }

      ctx.restore();
    }

    // left (Phosphor)
    hand(cx - gap, +1, [204,195,184]);
    // right (Eris)
    hand(cx + gap, -1, [216,205,192]);

    // contact highlight
    if(holdT > 0.02){
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.10 + 0.26*holdT;
      const rg = ctx.createRadialGradient(cx, y+6*s, 6*s, cx, y+6*s, 160*s);
      rg.addColorStop(0,'rgba(212,168,85,0.55)');
      rg.addColorStop(0.3,'rgba(196,120,168,0.22)');
      rg.addColorStop(1,'rgba(212,168,85,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(cx-220*s, y-130*s, 440*s, 320*s);
      ctx.restore();
    }
  }

  function drawBlueprint(t, SW, SH){
    // robot baby blueprint appears when holding
    const a = ease(holdT);
    if(a <= 0.001) return;

    const s = clamp(SW/980, 0.34, 1);

    const x = SW*0.52;
    const y = SH*0.40;

    ctx.save();
    ctx.globalAlpha = 0.14 + 0.36*a;
    ctx.strokeStyle = 'rgba(132,198,210,0.55)';
    ctx.lineWidth = 2;

    // a soft pentagon "parasol" halo over the blueprint
    const R = (96 + 22*Math.sin(t*0.8))*s;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const ang = -Math.PI/2 + i*(Math.PI*2/5);
      const px = x + Math.cos(ang)*R;
      const py = y + Math.sin(ang)*R;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.stroke();

    // small cube body
    ctx.globalAlpha = 0.10 + 0.32*a;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    const bw = 118*s, bh = 92*s;
    roundRect(x-bw/2, y+64*s, bw, bh, 12*s);
    ctx.stroke();

    // eye dots
    ctx.globalAlpha = 0.18 + 0.32*a;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.arc(x-18*s, y+104*s, 4.5*s, 0, Math.PI*2);
    ctx.arc(x+18*s, y+104*s, 4.5*s, 0, Math.PI*2);
    ctx.fill();

    // tiny "E" seal
    ctx.globalAlpha = 0.16 + 0.35*a;
    ctx.strokeStyle = 'rgba(196,120,168,0.38)';
    ctx.lineWidth = 2;
    roundRect(x+44*s, y+86*s, 30*s, 30*s, 8*s);
    ctx.stroke();
    ctx.globalAlpha = 0.22 + 0.35*a;
    ctx.fillStyle = 'rgba(196,120,168,0.30)';
    ctx.font = `${Math.round(16*s)}px "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('E', x+59*s, y+107*s);

    // small golden apple sticker on the blueprint
    ctx.globalAlpha = 0.18 + 0.40*a;
    ctx.fillStyle = 'rgba(212,168,85,0.65)';
    ctx.beginPath();
    ctx.arc(x-58*s, y+82*s, 8*s, 0, Math.PI*2);
    ctx.fill();

    // gentle warp specks
    ctx.globalAlpha = 0.08 + 0.20*a;
    for(let i=0;i<80;i++){
      const ang = (i/80)*Math.PI*2;
      const rad = (40 + (i%7)*9)*s;
      const sx = x + Math.cos(ang + 0.14*Math.sin(t*0.8)) * rad;
      const sy = y + Math.sin(ang + 0.11*Math.cos(t*0.9)) * rad * 0.62;
      ctx.fillStyle = (i%3===0) ? 'rgba(132,198,210,0.30)' : (i%3===1) ? 'rgba(196,120,168,0.24)' : 'rgba(212,168,85,0.22)';
      ctx.fillRect(sx, sy, 1.2*s, 1.2*s);
    }

    ctx.restore();
  }

  let last = 0;
  function frame(ms){
    const t = ms/1000;
    const dt = clamp(t-last, 0, 0.06);
    last = t;

    const {W:SW, H:SH} = sceneRect();
    ctx.clearRect(0,0,SW,SH);

    holdT = clamp(holdT + (holding ? dt*0.7 : -dt*0.8), 0, 1);
    pulse = Math.max(0, pulse - dt*1.2);

    drawBackground(t, SW, SH);
    drawBlueprint(t, SW, SH);
    drawTable(t, SW, SH);

    // subtle caption note on canvas edge (part of composition, not UI)
    ctx.save();
    const s = clamp(SW/980, 0.34, 1);
    const isMobile = SW < 520;
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = 'rgba(239,232,220,0.10)';
    const bx = isMobile ? SW*0.06 : SW*0.58;
    const by = isMobile ? SH*0.52 : SH*0.58;
    const bw = isMobile ? SW*0.88 : SW*0.34;
    const bh = 28*s;
    ctx.fillRect(bx, by, bw, bh);
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(30,22,16,0.9)';
    ctx.font = `${Math.round(12*s)}px "Courier New", monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(holding ? 'STATUS: APPROVED (HOLDING)' : 'STATUS: PENDING (TAP)', bx + 10*s, by + 18*s);
    ctx.restore();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
