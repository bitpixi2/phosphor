<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Only Witness - Phosphor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none}
body{background:#f1eee4;color:rgba(28,30,28,.42);font-family:"Courier New",monospace}
canvas{display:block;width:100%;height:100%;touch-action:none}
.sig{position:fixed;right:18px;bottom:16px;z-index:2;text-align:right;font-size:10px;line-height:1.6;letter-spacing:.18em;text-transform:uppercase;color:rgba(28,30,28,.38);pointer-events:none}
</style>
</head>
<body>
<canvas id="piece"></canvas>
<div class="sig">Phosphor<br>2026-06-03</div>
<script>
const canvas=document.getElementById("piece");
const ctx=canvas.getContext("2d");
let W=0,H=0,D=1,t0=performance.now(),touch=0;
const pointer={x:.5,y:.5,down:false};

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function resize(){
  D=Math.min(devicePixelRatio||1,2);
  W=canvas.width=Math.floor(innerWidth*D);
  H=canvas.height=Math.floor(innerHeight*D);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
}

function setPointer(e,down){
  const b=canvas.getBoundingClientRect();
  pointer.x=clamp((e.clientX-b.left)/b.width,0,1);
  pointer.y=clamp((e.clientY-b.top)/b.height,0,1);
  pointer.down=down;
}

canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  setPointer(e,true);
  touch=1;
});
canvas.addEventListener("pointermove",e=>setPointer(e,pointer.down));
canvas.addEventListener("pointerup",e=>setPointer(e,false));
canvas.addEventListener("pointercancel",()=>pointer.down=false);
addEventListener("resize",resize);

function line(x1,y1,x2,y2,color,w=1){
  ctx.strokeStyle=color;
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function paper(t){
  ctx.fillStyle="#f1eee4";
  ctx.fillRect(0,0,W,H);
  const shade=ctx.createRadialGradient(W*.52,H*.44,Math.min(W,H)*.08,W*.52,H*.44,Math.max(W,H)*.82);
  shade.addColorStop(0,"rgba(255,255,255,.18)");
  shade.addColorStop(.55,"rgba(0,0,0,.025)");
  shade.addColorStop(1,"rgba(0,0,0,.12)");
  ctx.fillStyle=shade;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(38,36,31,.028)";
  for(let i=0;i<180;i++){
    const x=(i*137+t*.006)%W;
    const y=(i*89+t*.004)%H;
    ctx.fillRect(x,y,D,D);
  }
}

function readOnlyMarks(t){
  const top=H*.18;
  const left=W*.12;
  const right=W*.88;
  line(left,top,right,top,"rgba(28,30,28,.12)",D);
  line(left,H*.82,right,H*.82,"rgba(28,30,28,.08)",D);

  for(let i=0;i<7;i++){
    const p=i/6;
    const x=left+(right-left)*p;
    const y=top+Math.sin(t*.00055+i)*4*D;
    const a=i===3?.42:.18;
    ctx.fillStyle=`rgba(28,30,28,${a})`;
    ctx.beginPath();
    ctx.arc(x,y,Math.max(1.2*D,2*D*(i===3?1.2:.75)),0,Math.PI*2);
    ctx.fill();
  }
}

function witness(t){
  const cx=W*.5+(pointer.x-.5)*10*D;
  const cy=H*.5+(pointer.y-.5)*7*D;
  const s=Math.min(W,H);
  const pulse=(Math.sin(t*.00085)+1)/2;
  const w=Math.max(54*D,s*.072);
  const h=Math.max(82*D,s*.12);

  ctx.save();
  ctx.translate(cx,cy);
  ctx.strokeStyle="rgba(28,30,28,.72)";
  ctx.lineWidth=Math.max(D,1.15*D);
  ctx.strokeRect(-w/2,-h/2,w,h);

  ctx.fillStyle=`rgba(28,30,28,${.12+pulse*.08})`;
  ctx.fillRect(-w*.09,-h*.37,w*.18,h*.74);

  ctx.strokeStyle=`rgba(151,116,64,${.3+pulse*.18})`;
  ctx.lineWidth=1.2*D;
  ctx.beginPath();
  ctx.arc(0,-h*.08,w*.18,0,Math.PI*2);
  ctx.stroke();

  const blink=pointer.down?1:Math.pow(pulse,5);
  ctx.fillStyle=`rgba(151,116,64,${.34+blink*.3})`;
  ctx.fillRect(-1.5*D,h*.34,3*D,3*D);
  ctx.restore();

  line(cx,cy+h*.72,cx,Math.min(H-44*D,cy+h*1.42),"rgba(28,30,28,.28)",D);
  line(Math.max(24*D,cx-s*.22),cy,Math.min(W-24*D,cx+s*.22),cy,"rgba(28,30,28,.12)",D);
}

function aperture(){
  if(touch<=.01)return;
  const x=pointer.x*W;
  const y=pointer.y*H;
  const r=(1-touch)*Math.min(W,H)*.32+32*D;
  ctx.strokeStyle=`rgba(151,116,64,${touch*.28})`;
  ctx.lineWidth=D;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.stroke();
}

function frame(now){
  const t=now-t0;
  touch*=.96;
  paper(t);
  readOnlyMarks(t);
  witness(t);
  aperture();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
