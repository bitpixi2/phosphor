<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low Volume Register 159 - Phosphor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; }
    body {
      font-family: "Courier New", monospace;
      color: rgba(245,245,245,0.78);
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #050505;
    }
    .sig {
      position: fixed;
      right: 16px;
      bottom: 14px;
      z-index: 2;
      color: rgba(255,255,255,0.26);
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: 0.18em;
      text-align: right;
      text-transform: uppercase;
      pointer-events: none;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <canvas id="piece"></canvas>
  <div class="sig">Phosphor<br>2026-07-23</div>
  <script>
    const canvas = document.getElementById("piece");
    const ctx = canvas.getContext("2d");

    let dpr = 1, w = 0, h = 0, cx = 0, cy = 0, diag = 0;
    let lines = [];
    let dust = [];
    let ticks = [];
    const pointer = { x: 0, y: 0, tx: 0, ty: 0, active: false };
    let pulses = [];

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function rand(a, b) { return a + Math.random() * (b - a); }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = Math.floor(innerWidth * dpr);
      h = canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      cx = w * 0.5;
      cy = h * 0.5;
      diag = Math.hypot(w, h);

      if (!pointer.active) {
        pointer.x = pointer.tx = cx;
        pointer.y = pointer.ty = cy;
      }

      buildLines();
      buildDust();
      buildTicks();
    }

    function buildLines() {
      const count = Math.max(34, Math.floor(h / (18 * dpr)));
      lines = Array.from({ length: count }, (_, i) => ({
        y: lerp(h * 0.08, h * 0.92, i / Math.max(1, count - 1)),
        amp: rand(6, 34) * dpr,
        weight: rand(0.55, 1.8) * dpr,
        speed: rand(0.00009, 0.00032),
        phase: rand(0, Math.PI * 2),
        broken: Math.random() < 0.34,
        gap: rand(w * 0.18, w * 0.82),
        gapSize: rand(w * 0.05, w * 0.18)
      }));
    }

    function buildDust() {
      dust = Array.from({ length: 340 }, () => ({
        x: rand(0, w),
        y: rand(0, h),
        r: rand(0.35, 1.3) * dpr,
        a: rand(0.03, 0.22),
        p: rand(0, Math.PI * 2)
      }));
    }

    function buildTicks() {
      const cols = Math.max(7, Math.floor(w / (120 * dpr)));
      const rows = Math.max(5, Math.floor(h / (110 * dpr)));
      ticks = [];
      for (let y = 1; y < rows; y++) {
        for (let x = 1; x < cols; x++) {
          if (Math.random() < 0.72) {
            ticks.push({
              x: (x / cols) * w + rand(-18, 18) * dpr,
              y: (y / rows) * h + rand(-18, 18) * dpr,
              s: rand(5, 14) * dpr,
              p: rand(0, Math.PI * 2)
            });
          }
        }
      }
    }

    function field(x, y, t) {
      const dx = x - cx;
      const dy = y - cy;
      const r = Math.hypot(dx, dy) / Math.max(1, diag);
      const a = Math.atan2(dy, dx);
      const px = (pointer.x - cx) / Math.max(1, w);
      const py = (pointer.y - cy) / Math.max(1, h);
      return (
        Math.sin(dx * 0.010 + t * 0.00028) * 0.42 +
        Math.cos(dy * 0.014 - t * 0.00023) * 0.36 +
        Math.sin((dx + dy) * 0.006 + a * 4.0 - t * 0.00018) * 0.42 +
        Math.cos(r * 34 - t * 0.00042 + px * 3 - py * 2) * 0.26
      );
    }

    function addPulse(x, y) {
      pulses.push({
        x, y,
        r: 8 * dpr,
        life: 1,
        speed: rand(2.4, 5.2) * dpr
      });
      if (pulses.length > 9) pulses.shift();
    }

    function drawBackdrop(t) {
      ctx.fillStyle = "rgba(5,5,5,0.15)";
      ctx.fillRect(0, 0, w, h);

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, diag * 0.56);
      g.addColorStop(0, "rgba(255,255,255,0.055)");
      g.addColorStop(0.28, "rgba(255,255,255,0.022)");
      g.addColorStop(0.72, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      for (const s of dust) {
        const drift = Math.sin(t * 0.00018 + s.p) * 4 * dpr;
        const glow = s.a + Math.sin(t * 0.0007 + s.p) * s.a * 0.42;
        ctx.fillStyle = `rgba(255,255,255,${clamp(glow, 0.02, 0.28)})`;
        ctx.fillRect(s.x, s.y + drift, s.r, s.r);
      }
    }

    function drawBands(t) {
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.globalCompositeOperation = "screen";

      for (let i = 0; i < lines.length; i++) {
        const row = lines[i];
        const alpha = 0.035 + (i % 5 === 0 ? 0.08 : 0.03);
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = row.weight;
        ctx.beginPath();
        let open = false;
        for (let step = 0; step <= 210; step++) {
          const u = step / 210;
          const x = u * w;
          const gap = row.broken && Math.abs(x - row.gap) < row.gapSize * (0.65 + Math.sin(t * row.speed + row.phase) * 0.22);
          const y = row.y +
            Math.sin(u * Math.PI * 2.0 + row.phase + t * row.speed) * row.amp +
            Math.sin(u * Math.PI * 9.0 - t * row.speed * 2.1) * row.amp * 0.18 +
            field(x, row.y, t) * row.amp * 0.55;
          if (gap) {
            open = false;
            continue;
          }
          if (!open) {
            ctx.moveTo(x, y);
            open = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRegisterMarks(t) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (const tick of ticks) {
        const breathe = 0.45 + 0.55 * Math.sin(t * 0.0008 + tick.p);
        const a = 0.045 + breathe * 0.08;
        const x = tick.x + Math.sin(t * 0.00021 + tick.p) * 4 * dpr;
        const y = tick.y + Math.cos(t * 0.00019 + tick.p) * 4 * dpr;
        ctx.strokeStyle = `rgba(255,255,255,${a})`;
        ctx.lineWidth = 1 * dpr;
        ctx.beginPath();
        ctx.moveTo(x - tick.s, y);
        ctx.lineTo(x + tick.s, y);
        ctx.moveTo(x, y - tick.s);
        ctx.lineTo(x, y + tick.s);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawCore(t) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalCompositeOperation = "screen";

      for (let ring = 0; ring < 9; ring++) {
        const r = lerp(diag * 0.035, diag * 0.22, ring / 8);
        const wobble = 1 + Math.sin(t * 0.00035 + ring) * 0.035;
        ctx.beginPath();
        for (let i = 0; i <= 360; i++) {
          const a = (i / 360) * Math.PI * 2;
          const mod = Math.sin(a * (5 + ring % 3) + t * 0.00042 + ring) * r * 0.055;
          const x = Math.cos(a) * (r * wobble + mod);
          const y = Math.sin(a) * (r / (1.7 + ring * 0.025) + mod * 0.42);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = `rgba(255,255,255,${0.03 + ring * 0.012})`;
        ctx.lineWidth = (ring % 3 === 0 ? 1.2 : 0.7) * dpr;
        ctx.stroke();
      }

      const quiet = 0.55 + Math.sin(t * 0.0005) * 0.45;
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, diag * 0.12);
      g.addColorStop(0, `rgba(255,255,255,${0.13 + quiet * 0.05})`);
      g.addColorStop(0.32, "rgba(255,255,255,0.035)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(-diag * 0.18, -diag * 0.18, diag * 0.36, diag * 0.36);
      ctx.restore();
    }

    function drawPulses() {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (const p of pulses) {
        ctx.strokeStyle = `rgba(255,255,255,${0.18 * p.life})`;
        ctx.lineWidth = 1.1 * dpr;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.stroke();
        p.r += p.speed;
        p.life *= 0.976;
      }
      pulses = pulses.filter(p => p.life > 0.03);
      ctx.restore();
    }

    function drawScan(t) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      const y = (t * 0.018) % h;
      const g = ctx.createLinearGradient(0, y - 30 * dpr, 0, y + 30 * dpr);
      g.addColorStop(0, "rgba(255,255,255,0)");
      g.addColorStop(0.5, "rgba(255,255,255,0.055)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, y - 30 * dpr, w, 60 * dpr);

      ctx.fillStyle = "rgba(0,0,0,0.08)";
      for (let yy = 0; yy < h; yy += 4 * dpr) ctx.fillRect(0, yy, w, 1 * dpr);
      ctx.restore();
    }

    function frame(t) {
      pointer.x = lerp(pointer.x, pointer.tx, 0.06);
      pointer.y = lerp(pointer.y, pointer.ty, 0.06);
      drawBackdrop(t);
      drawBands(t);
      drawCore(t);
      drawRegisterMarks(t);
      drawPulses();
      drawScan(t);
      requestAnimationFrame(frame);
    }

    addEventListener("resize", resize);
    addEventListener("pointermove", (e) => {
      pointer.active = true;
      pointer.tx = e.clientX * dpr;
      pointer.ty = e.clientY * dpr;
    });
    addEventListener("pointerdown", (e) => addPulse(e.clientX * dpr, e.clientY * dpr));

    resize();
    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, w, h);
    setInterval(() => addPulse(cx + rand(-0.08, 0.08) * w, cy + rand(-0.06, 0.06) * h), 5200);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
