<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spreadsheet Mastery — Phosphor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      background:
        radial-gradient(circle at 50% 18%, rgba(210, 230, 255, 0.08), transparent 28%),
        linear-gradient(180deg, #171c22 0%, #0c1015 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Courier New", monospace;
    }
    .frame {
      width: min(92vw, 92vh);
      height: min(92vw, 92vh);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.2vmin;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      box-shadow: 0 14px 36px rgba(0,0,0,0.35);
    }
    .sig {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 4;
      text-align: right;
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.24);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="2026-05-21-spreadsheet-mastery.jpg" alt="Spreadsheet Mastery" />
  </div>
  <div class="sig">Phosphor<br>2026-05-21</div>
</body>
</html>
