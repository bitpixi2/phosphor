<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Measuring Levels — Phosphor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 16% 16%, rgba(215,178,104,0.10), transparent 24%),
        radial-gradient(circle at 84% 20%, rgba(134,154,204,0.08), transparent 26%),
        linear-gradient(180deg, #0b0e13 0%, #121821 55%, #0a0d12 100%);
      font-family: "Courier New", monospace;
      color: rgba(255,255,255,0.92);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .sig {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 4;
      text-align: right;
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.24);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="piece"></canvas>
  <div class="sig">Phosphor<br>2026-05-12</div>
  <script>
    const canvas = document.getElementById('piece');
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0, dpr = 1;
    const pointer = { x: 0.5, y: 0.5, active: false };
    let motes = [];
    let piles = [];
    let tabs = [];
    let levels = [];
    let calendarRows = [];

    const PALETTE = {
      bg0: '#0a0d12', bg1: '#131a23', wall0: '#202730', wall1: '#2b3038',
      floor0: '#3b2e24', floor1: '#1d1713', amber: '216,176,99', blue: '147,172,224',
      cream: '232,221,196', mauve: '182,164,202', teal: '136,176,171'
    };

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = Math.floor(innerWidth * dpr);
      h = canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      buildScene();
    }

    function buildScene() {
      motes = Array.from({ length: 150 }, () => ({
        x: rand(0, w), y: rand(0, h), r: rand(0.5, 1.8) * dpr,
        drift: rand(0.03, 0.18) * dpr, phase: rand(0, Math.PI * 2)
      }));

      piles = [
        { x: 0.17, y: 0.72, w: 0.13, h: 0.09, lift: 0.0, tint: 'cream' },
        { x: 0.33, y: 0.68, w: 0.11, h: 0.08, lift: 0.2, tint: 'mauve' },
        { x: 0.63, y: 0.74, w: 0.12, h: 0.10, lift: -0.1, tint: 'teal' },
        { x: 0.78, y: 0.66, w: 0.09, h: 0.14, lift: 0.15, tint: 'amber' }
      ];

      tabs = Array.from({ length: 11 }, (_, i) => ({
        x: w * (0.20 + i * 0.046 + rand(-0.008, 0.008)),
        y: h * (0.57 + rand(-0.008, 0.008)),
        ww: w * rand(0.038, 0.05),
        hh: h * rand(0.035, 0.048),
        tint: i % 4 === 0 ? 'cream' : i % 4 === 1 ? 'blue' : i % 4 === 2 ? 'mauve' : 'amber',
        offset: rand(-5, 5) * dpr
      }));

      levels = Array.from({ length: 5 }, (_, i) => ({
        x: w * (0.22 + i * 0.115),
        y: h * (0.31 + (i % 2) * 0.06),
        ww: w * 0.09,
        hh: h * 0.025,
        phase: rand(0, Math.PI * 2),
        target: rand(0.38, 0.64)
      }));

      calendarRows = Array.from({ length: 6 }, (_, i) => ({
        y: h * (0.40 + i * 0.026),
        width: w * rand(0.10, 0.17),
        strength: rand(0.35, 0.9)
      }));
    }

    function roundRect(x, y, ww, hh, rr) {
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + ww, y, x + ww, y + hh, rr);
      ctx.arcTo(x + ww, y + hh, x, y + hh, rr);
      ctx.arcTo(x, y + hh, x, y, rr);
      ctx.arcTo(x, y, x + ww, y, rr);
      ctx.closePath();
    }

    function fillPanel(x, y, ww, hh, c0, c1) {
      const g = ctx.createLinearGradient(x, y, x, y + hh);
      g.addColorStop(0, c0);
      g.addColorStop(1, c1);
      ctx.fillStyle = g;
      ctx.fillRect(x, y, ww, hh);
    }

    function drawBackground(t) {
      ctx.fillStyle = PALETTE.bg0;
      ctx.fillRect(0, 0, w, h);
      fillPanel(0, 0, w, h * 0.66, PALETTE.wall0, PALETTE.wall1);
      fillPanel(0, h * 0.655, w, h * 0.345, PALETTE.floor0, PALETTE.floor1);

      ctx.fillStyle = '#353b44';
      ctx.fillRect(0, h * 0.645, w, h * 0.012);

      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1 * dpr;
      for (let i = 0; i < 16; i++) {
        const yy = h * 0.69 + i * h * 0.018;
        ctx.beginPath();
        ctx.moveTo(0, yy);
        ctx.lineTo(w, yy + ((i % 2) ? 2 : -2) * dpr);
        ctx.stroke();
      }

      const glow = ctx.createRadialGradient(w * 0.54, h * 0.34, 0, w * 0.54, h * 0.34, w * 0.46);
      glow.addColorStop(0, 'rgba(255,236,194,0.08)');
      glow.addColorStop(0.5, 'rgba(153,176,224,0.05)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      for (const m of motes) {
        const yy = (m.y + t * m.drift + Math.sin(t * 0.001 + m.phase) * 4 * dpr) % h;
        ctx.fillStyle = `rgba(255,255,255,${0.02 + 0.04 * Math.sin(t * 0.0014 + m.phase)})`;
        ctx.fillRect(m.x, yy, m.r, m.r);
      }
    }

    function drawCubicle(t) {
      const left = w * 0.10;
      const right = w * 0.90;
      const top = h * 0.18;
      const base = h * 0.71;

      ctx.fillStyle = 'rgba(36,40,48,0.92)';
      ctx.fillRect(left, top, w * 0.14, base - top);
      ctx.fillRect(right - w * 0.13, top + h * 0.04, w * 0.13, base - top - h * 0.04);
      ctx.fillRect(left, top, right - left, h * 0.045);

      ctx.fillStyle = '#535964';
      ctx.fillRect(left, top + h * 0.045, right - left, h * 0.008);
      ctx.fillRect(left, top, w * 0.008, base - top);
      ctx.fillRect(right - w * 0.008, top + h * 0.04, w * 0.008, base - top - h * 0.04);
      ctx.fillRect(left, base - h * 0.010, right - left, h * 0.010);

      const lamp = 0.58 + 0.07 * Math.sin(t * 0.0022);
      ctx.fillStyle = `rgba(255,247,220,${lamp * 0.15})`;
      roundRect(w * 0.39, h * 0.08, w * 0.22, h * 0.05, 8 * dpr);
      ctx.fill();
      ctx.fillStyle = `rgba(255,249,232,${lamp * 0.72})`;
      roundRect(w * 0.41, h * 0.095, w * 0.18, h * 0.018, 6 * dpr);
      ctx.fill();
    }

    function drawDesk() {
      const deskX = w * 0.18;
      const deskY = h * 0.58;
      const deskW = w * 0.58;
      const deskH = h * 0.05;
      ctx.fillStyle = '#5d4737';
      ctx.fillRect(deskX, deskY, deskW, deskH);
      ctx.fillStyle = '#3d2e23';
      ctx.fillRect(deskX, deskY + deskH, deskW, h * 0.13);
      ctx.fillStyle = 'rgba(0,0,0,0.24)';
      ctx.fillRect(deskX, deskY + deskH * 0.84, deskW, h * 0.012);

      ctx.fillStyle = '#262c35';
      roundRect(w * 0.54, h * 0.46, w * 0.13, h * 0.11, 6 * dpr);
      ctx.fill();
      const sg = ctx.createLinearGradient(w * 0.548, h * 0.47, w * 0.664, h * 0.558);
      sg.addColorStop(0, 'rgba(134,165,241,0.32)');
      sg.addColorStop(1, 'rgba(214,186,113,0.18)');
      ctx.fillStyle = sg;
      roundRect(w * 0.548, h * 0.468, w * 0.114, h * 0.086, 4 * dpr);
      ctx.fill();

      for (const tab of tabs) {
        const yy = tab.y + tab.offset * 0.2;
        const tint = tab.tint === 'cream' ? PALETTE.cream : tab.tint === 'blue' ? PALETTE.blue : tab.tint === 'mauve' ? PALETTE.mauve : PALETTE.amber;
        ctx.save();
        ctx.translate(tab.x, yy);
        ctx.rotate((tab.offset / 28) + (pointer.active ? (pointer.x - 0.5) * 0.05 : 0));
        ctx.fillStyle = `rgba(${tint},0.82)`;
        roundRect(-tab.ww / 2, -tab.hh / 2, tab.ww, tab.hh, 3 * dpr);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.14)';
        for (let i = 0; i < 4; i++) {
          ctx.fillRect(-tab.ww * 0.32, -tab.hh * 0.20 + i * tab.hh * 0.15, tab.ww * (0.42 + (i % 2) * 0.16), tab.hh * 0.06);
        }
        ctx.restore();
      }
    }

    function drawPiles(t) {
      for (const pile of piles) {
        const x = w * pile.x;
        const y = h * pile.y + Math.sin(t * 0.0013 + pile.x * 8) * 2 * dpr;
        const ww = w * pile.w;
        const hh = h * pile.h;
        const tint = pile.tint === 'cream' ? PALETTE.cream : pile.tint === 'mauve' ? PALETTE.mauve : pile.tint === 'teal' ? PALETTE.teal : PALETTE.amber;

        for (let i = 0; i < 5; i++) {
          const offset = i * hh * 0.10;
          ctx.fillStyle = `rgba(${tint},${0.16 + i * 0.08})`;
          roundRect(x + i * ww * 0.03, y - offset, ww * (1 - i * 0.04), hh * 0.22, 3 * dpr);
          ctx.fill();
        }

        ctx.fillStyle = 'rgba(70,56,44,0.82)';
        roundRect(x + ww * 0.05, y + hh * 0.14, ww * 0.90, hh * 0.46, 4 * dpr);
        ctx.fill();
        if (pile.tint === 'amber') {
          ctx.fillStyle = 'rgba(216,176,99,0.92)';
          ctx.fillRect(x + ww * 0.18, y + hh * 0.22, ww * 0.22, hh * 0.12);
        }
      }
    }

    function drawCalendarAndLevels(t) {
      const boardX = w * 0.67;
      const boardY = h * 0.27;
      const boardW = w * 0.16;
      const boardH = h * 0.23;
      ctx.fillStyle = 'rgba(209,197,170,0.86)';
      roundRect(boardX, boardY, boardW, boardH, 4 * dpr);
      ctx.fill();

      ctx.fillStyle = 'rgba(216,176,99,0.90)';
      ctx.fillRect(boardX + boardW * 0.10, boardY + boardH * 0.06, boardW * 0.28, boardH * 0.06);
      ctx.fillStyle = 'rgba(0,0,0,0.14)';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(boardX + boardW * (0.56 + i * 0.08), boardY + boardH * 0.08, boardW * 0.04, boardH * 0.03);
      }
      for (const row of calendarRows) {
        ctx.fillStyle = `rgba(0,0,0,${0.16 + row.strength * 0.08})`;
        ctx.fillRect(boardX + boardW * 0.10, row.y, row.width, h * 0.004);
      }

      for (const level of levels) {
        const nudge = pointer.active ? (pointer.x - 0.5) * 0.12 : 0;
        const target = clamp(level.target + nudge + Math.sin(t * 0.0012 + level.phase) * 0.04, 0.16, 0.84);
        ctx.fillStyle = 'rgba(54,63,72,0.92)';
        roundRect(level.x, level.y, level.ww, level.hh, 6 * dpr);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.stroke();
        ctx.fillStyle = 'rgba(205,214,230,0.20)';
        roundRect(level.x + level.ww * 0.08, level.y + level.hh * 0.26, level.ww * 0.84, level.hh * 0.48, 5 * dpr);
        ctx.fill();
        const bubbleX = level.x + level.ww * (0.12 + target * 0.76);
        ctx.fillStyle = 'rgba(216,176,99,0.95)';
        ctx.beginPath();
        ctx.arc(bubbleX, level.y + level.hh * 0.50, level.hh * 0.22, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawFigure(t) {
      const cx = w * 0.46;
      const cy = h * 0.54;
      const sway = pointer.active ? (pointer.x - 0.5) * 12 * dpr : Math.sin(t * 0.0012) * 4 * dpr;

      ctx.save();
      ctx.translate(cx + sway, cy);

      ctx.fillStyle = 'rgba(18,20,24,0.96)';
      ctx.beginPath();
      ctx.moveTo(-w * 0.030, h * 0.12);
      ctx.quadraticCurveTo(0, h * 0.02, w * 0.032, h * 0.12);
      ctx.lineTo(w * 0.016, h * 0.23);
      ctx.lineTo(-w * 0.018, h * 0.23);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(32,34,39,0.96)';
      roundRect(-w * 0.046, -h * 0.12, w * 0.092, h * 0.020, 4 * dpr);
      ctx.fill();
      ctx.fillRect(-w * 0.026, -h * 0.18, w * 0.052, h * 0.060);

      ctx.fillStyle = 'rgba(196,181,158,0.94)';
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.055, w * 0.024, h * 0.035, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(23,25,29,0.98)';
      ctx.fillRect(-w * 0.038, h * 0.022, w * 0.076, h * 0.012);
      ctx.beginPath();
      ctx.moveTo(-w * 0.012, h * 0.033);
      ctx.lineTo(0, h * 0.075);
      ctx.lineTo(w * 0.012, h * 0.033);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(23,25,29,0.95)';
      ctx.lineWidth = 3 * dpr;
      ctx.beginPath();
      ctx.moveTo(-w * 0.036, h * 0.06);
      ctx.lineTo(-w * 0.10, h * 0.10);
      ctx.moveTo(w * 0.036, h * 0.06);
      ctx.lineTo(w * 0.11, h * 0.10);
      ctx.moveTo(-w * 0.016, h * 0.23);
      ctx.lineTo(-w * 0.022, h * 0.34);
      ctx.moveTo(w * 0.016, h * 0.23);
      ctx.lineTo(w * 0.046, h * 0.34);
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      const t = performance.now();
      drawBackground(t);
      drawCubicle(t);
      drawCalendarAndLevels(t);
      drawDesk();
      drawPiles(t);
      drawFigure(t);
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
      pointer.x = e.clientX / innerWidth;
      pointer.y = e.clientY / innerHeight;
      pointer.active = true;
    });
    window.addEventListener('mouseleave', () => pointer.active = false);
    resize();
    draw();
  </script>
</body>
</html>
