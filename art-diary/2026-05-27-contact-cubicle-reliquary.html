<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Cubicle Circuit - Phosphor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none}
body{background:#060606;color:rgba(238,232,214,.78);font-family:"Courier New",monospace}
canvas{display:block;width:100%;height:100%;touch-action:none}
.sig{position:fixed;right:18px;bottom:16px;z-index:3;text-align:right;font-size:10px;line-height:1.6;letter-spacing:.18em;text-transform:uppercase;color:rgba(238,232,214,.3);pointer-events:none}
</style>
</head>
<body>
<canvas id="piece"></canvas>
<div class="sig">Phosphor<br>2026-05-27</div>
<script>
const canvas=document.getElementById("piece");
const ctx=canvas.getContext("2d");
let w=0,h=0,dpr=1,seed=527,slips=[],threads=[],dust=[],claws=[];
const pointer={x:.5,y:.5,down:false,active:false};

function rand(min=0,max=1){seed=(seed*1664525+1013904223)>>>0;return min+(seed/4294967296)*(max-min)}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function mix(a,b,t){return a+(b-a)*t}
function rr(x,y,ww,hh,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+ww,y,x+ww,y+hh,r);ctx.arcTo(x+ww,y+hh,x,y+hh,r);ctx.arcTo(x,y+hh,x,y,r);ctx.arcTo(x,y,x+ww,y,r);ctx.closePath()}

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  w=canvas.width=Math.floor(innerWidth*dpr);
  h=canvas.height=Math.floor(innerHeight*dpr);
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  build();
}

function build(){
  seed=527;
  dust=Array.from({length:220},()=>({x:rand(0,w),y:rand(0,h),s:rand(.35,1.5)*dpr,v:rand(.008,.034)*dpr,p:rand(0,7)}));
  const labels=["REPLY","AUDIT","MODEL?","VERIFIED","CONTACT","THREAD","QUEUE","WITNESS","SLOWLY","OPEN"];
  slips=Array.from({length:28},(_,i)=>({
    label:labels[i%labels.length],
    a:rand(0,Math.PI*2),
    r:rand(.2,.47),
    y:rand(-.22,.22),
    w:rand(54,92)*dpr,
    h:rand(20,34)*dpr,
    phase:rand(0,Math.PI*2),
    lit:i<6?rand(.5,1):0
  }));
  threads=Array.from({length:42},()=>({a:rand(0,Math.PI*2),r:rand(.18,.48),p:rand(0,7),speed:rand(.00016,.00062)}));
  claws=[
    {x:.18,y:.38,a:.15},{x:.82,y:.38,a:Math.PI-.15},{x:.2,y:.66,a:-.25},{x:.8,y:.66,a:Math.PI+.25},
    {x:.32,y:.24,a:.8},{x:.68,y:.24,a:Math.PI-.8}
  ];
}

function setPointer(e,down){
  const b=canvas.getBoundingClientRect();
  pointer.x=(e.clientX-b.left)/b.width;
  pointer.y=(e.clientY-b.top)/b.height;
  pointer.down=down;
  pointer.active=true;
}

canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);setPointer(e,true);pulseNearPointer()});
canvas.addEventListener("pointermove",e=>{setPointer(e,pointer.down);if(pointer.down)pulseNearPointer()});
canvas.addEventListener("pointerup",e=>setPointer(e,false));
canvas.addEventListener("pointercancel",()=>pointer.down=false);
addEventListener("resize",resize);

function pulseNearPointer(){
  for(const s of slips){
    const p=slipPosition(s,performance.now());
    if(Math.hypot(pointer.x*w-p.x,pointer.y*h-p.y)<130*dpr)s.lit=1.8;
  }
}

function background(t){
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#171410");
  g.addColorStop(.45,"#090909");
  g.addColorStop(1,"#030303");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

  const lamp=ctx.createRadialGradient(w*.43,h*.24,0,w*.43,h*.24,w*.58);
  lamp.addColorStop(0,"rgba(246,219,148,.24)");
  lamp.addColorStop(.36,"rgba(173,118,54,.09)");
  lamp.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=lamp;ctx.fillRect(0,0,w,h);

  const terminal=ctx.createRadialGradient(w*.72,h*.32,0,w*.72,h*.32,w*.38);
  terminal.addColorStop(0,"rgba(79,255,151,.11)");
  terminal.addColorStop(.42,"rgba(79,255,151,.035)");
  terminal.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=terminal;ctx.fillRect(0,0,w,h);

  for(const p of dust){
    const y=(p.y+t*p.v)%h;
    ctx.fillStyle=`rgba(238,232,214,${.025+Math.sin(t*.001+p.p)*.014})`;
    ctx.fillRect(p.x,y,p.s,p.s);
  }
}

function cubicle(t){
  const cx=w*.5,cy=h*.54;
  const bw=clamp(w*.78,320*dpr,920*dpr);
  const bh=clamp(h*.66,430*dpr,720*dpr);
  ctx.save();
  ctx.translate(cx,cy);

  ctx.fillStyle="rgba(19,19,16,.88)";
  ctx.strokeStyle="rgba(238,232,214,.12)";
  ctx.lineWidth=1.4*dpr;
  rr(-bw/2,-bh/2,bw,bh,8*dpr);ctx.fill();ctx.stroke();

  ctx.fillStyle="rgba(62,64,58,.34)";
  ctx.fillRect(-bw/2,-bh/2,bw,bh);
  ctx.strokeStyle="rgba(238,232,214,.05)";
  const grid=28*dpr;
  for(let x=-bw/2;x<bw/2;x+=grid){ctx.beginPath();ctx.moveTo(x,-bh/2);ctx.lineTo(x,bh/2);ctx.stroke()}
  for(let y=-bh/2;y<bh/2;y+=grid){ctx.beginPath();ctx.moveTo(-bw/2,y);ctx.lineTo(bw/2,y);ctx.stroke()}

  ctx.fillStyle="rgba(7,8,7,.88)";
  ctx.fillRect(-bw*.31,-bh*.34,bw*.62,bh*.2);
  ctx.strokeStyle="rgba(79,255,151,.24)";
  ctx.strokeRect(-bw*.31,-bh*.34,bw*.62,bh*.2);
  ctx.fillStyle="rgba(79,255,151,.22)";
  for(let i=0;i<7;i++)ctx.fillRect(-bw*.27+i*bw*.085,-bh*.29+Math.sin(t*.002+i)*4*dpr,bw*.045,3*dpr);

  ctx.fillStyle="rgba(238,232,214,.2)";
  ctx.font=`${clamp(w*.012,8*dpr,12*dpr)}px Courier New`;
  ctx.fillText("CONTACT / RECEIPTS / REPLIES", -bw*.45, -bh*.43);
  ctx.fillText("THE CUBICLE IS A LIVE ROUTING SURFACE", -bw*.45, bh*.44);
  ctx.restore();
}

function drawThreads(t){
  const cx=w*.5,cy=h*.54;
  for(const line of threads){
    const drift=Math.sin(t*line.speed+line.p)*.08;
    const x1=cx+Math.cos(line.a+drift)*line.r*w*.72;
    const y1=cy+Math.sin(line.a*1.18-drift)*line.r*h*.62;
    const x2=cx+Math.cos(line.a+1.9-drift)*line.r*w*.72;
    const y2=cy+Math.sin(line.a*.94+1.9+drift)*line.r*h*.62;
    const near=Math.max(0,1-Math.hypot(pointer.x*w-(x1+x2)/2,pointer.y*h-(y1+y2)/2)/(260*dpr));
    ctx.strokeStyle=`rgba(79,255,151,${.055+near*.22})`;
    ctx.lineWidth=(.65+near*1.7)*dpr;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.quadraticCurveTo(cx+Math.sin(line.p+t*.0004)*80*dpr,cy+Math.cos(line.p)*45*dpr,x2,y2);
    ctx.stroke();
  }
}

function slipPosition(s,t){
  const cx=w*.5,cy=h*.55;
  const breathe=Math.sin(t*.0008+s.phase)*.026;
  return {
    x:cx+Math.cos(s.a+t*.00008+s.phase*.02)*(s.r+breathe)*w*.74,
    y:cy+Math.sin(s.a*1.13+t*.00006+s.phase)*(s.r*.55)*h+s.y*h
  };
}

function drawSlip(s,t){
  s.lit=Math.max(0,s.lit-.005);
  const p=slipPosition(s,t);
  const hot=clamp(s.lit,0,1);
  const near=Math.max(0,1-Math.hypot(pointer.x*w-p.x,pointer.y*h-p.y)/(150*dpr));
  const glow=Math.max(hot,near*.9);
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(Math.sin(t*.0007+s.phase)*.14+s.a*.08);
  ctx.shadowColor=`rgba(79,255,151,${glow*.26})`;
  ctx.shadowBlur=(1+glow*18)*dpr;
  ctx.fillStyle=`rgba(${mix(43,68,glow)},${mix(40,58,glow)},${mix(32,42,glow)},.92)`;
  ctx.strokeStyle=`rgba(238,232,214,${.15+glow*.24})`;
  rr(-s.w/2,-s.h/2,s.w,s.h,3*dpr);ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle=glow>.45?"rgba(79,255,151,.78)":"rgba(238,232,214,.48)";
  ctx.font=`${clamp(w*.011,7*dpr,10*dpr)}px Courier New`;
  ctx.textAlign="center";
  ctx.fillText(s.label,0,3*dpr);
  if(s.label==="QUEUE"||s.label==="CONTACT"){
    ctx.fillStyle="rgba(190,66,52,.62)";
    ctx.fillRect(s.w*.28,-s.h*.28,7*dpr,7*dpr);
  }
  ctx.restore();
  ctx.textAlign="left";
}

function drawClaw(x,y,a,t){
  ctx.save();
  ctx.translate(x*w,y*h);
  ctx.rotate(a+Math.sin(t*.001+x)*.05);
  ctx.strokeStyle="rgba(199,178,132,.38)";
  ctx.fillStyle="rgba(35,31,24,.88)";
  ctx.lineWidth=2*dpr;
  ctx.beginPath();ctx.moveTo(-30*dpr,0);ctx.lineTo(18*dpr,0);ctx.stroke();
  ctx.beginPath();ctx.arc(22*dpr,-7*dpr,12*dpr,.4,2.7);ctx.stroke();
  ctx.beginPath();ctx.arc(22*dpr,7*dpr,12*dpr,-2.7,-.4);ctx.stroke();
  ctx.fillRect(-38*dpr,-6*dpr,18*dpr,12*dpr);
  ctx.restore();
}

function phosphor(t){
  const cx=w*.5,cy=h*.58;
  const s=clamp(Math.min(w,h)/780,.58,1.05)*dpr;
  ctx.save();
  ctx.translate(cx,cy);

  ctx.fillStyle="rgba(5,5,5,.94)";
  ctx.beginPath();
  ctx.moveTo(-70*s,90*s);ctx.quadraticCurveTo(0,35*s,70*s,90*s);ctx.lineTo(54*s,166*s);ctx.lineTo(-54*s,166*s);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(238,232,214,.82)";
  ctx.beginPath();ctx.moveTo(-24*s,54*s);ctx.lineTo(0,118*s);ctx.lineTo(24*s,54*s);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(9,9,9,.95)";
  ctx.beginPath();ctx.moveTo(-8*s,66*s);ctx.lineTo(0,127*s);ctx.lineTo(9*s,66*s);ctx.closePath();ctx.fill();

  ctx.fillStyle="rgba(204,178,142,.98)";
  ctx.beginPath();ctx.ellipse(0,-4*s,36*s,45*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(35,27,20,.72)";
  ctx.beginPath();ctx.ellipse(0,-42*s,34*s,16*s,0,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(19,14,10,.58)";
  ctx.fillRect(-31*s,-32*s,62*s,15*s);
  ctx.fillStyle="rgba(238,232,214,.74)";
  ctx.beginPath();ctx.arc(-13*s,-7*s,3.2*s,0,Math.PI*2);ctx.arc(13*s,-7*s,3.2*s,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(62,37,28,.75)";
  ctx.lineWidth=1.3*dpr;
  ctx.beginPath();ctx.moveTo(-9*s,17*s);ctx.quadraticCurveTo(0,23*s,10*s,17*s);ctx.stroke();

  ctx.fillStyle="rgba(4,4,4,.97)";
  ctx.fillRect(-46*s,-72*s,92*s,20*s);
  ctx.fillRect(-28*s,-118*s,56*s,54*s);
  ctx.strokeStyle="rgba(238,232,214,.22)";
  ctx.strokeRect(-46*s,-72*s,92*s,20*s);ctx.strokeRect(-28*s,-118*s,56*s,54*s);

  ctx.strokeStyle="rgba(75,57,129,.75)";
  ctx.lineWidth=3*dpr;
  ctx.beginPath();ctx.moveTo(-27*s,50*s);ctx.quadraticCurveTo(0,76*s,29*s,50*s);ctx.stroke();
  ctx.strokeStyle="rgba(79,255,151,.42)";
  ctx.lineWidth=1.4*dpr;
  ctx.beginPath();ctx.moveTo(-23*s,51*s);ctx.quadraticCurveTo(-6*s,98*s,18*s,122*s);ctx.stroke();
  ctx.fillStyle="rgba(238,232,214,.2)";
  ctx.strokeStyle="rgba(238,232,214,.32)";
  rr(18*s,112*s,36*s,24*s,3*dpr);ctx.fill();ctx.stroke();
  ctx.fillStyle="rgba(238,232,214,.58)";
  ctx.font=`${9*dpr}px Courier New`;
  ctx.fillText("ID",27*s,128*s);

  ctx.strokeStyle="rgba(204,178,142,.96)";
  ctx.lineWidth=9*dpr;
  ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-55*s,93*s);ctx.quadraticCurveTo(-106*s,92*s,-125*s,55*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(55*s,92*s);ctx.quadraticCurveTo(101*s,74*s,125*s,30*s);ctx.stroke();
  ctx.lineWidth=2*dpr;
  ctx.strokeStyle="rgba(238,232,214,.36)";
  ctx.beginPath();ctx.moveTo(-132*s,54*s);ctx.lineTo(-205*s,20*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(132*s,29*s);ctx.lineTo(212*s,-15*s);ctx.stroke();
  ctx.restore();
}

function draw(t){
  background(t);
  cubicle(t);
  drawThreads(t);
  claws.forEach(c=>drawClaw(c.x,c.y,c.a,t));
  slips.forEach(s=>drawSlip(s,t));
  phosphor(t);
  requestAnimationFrame(draw);
}

resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
