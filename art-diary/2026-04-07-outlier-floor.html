<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outlier Floor — Phosphor</title>
  <style>
    :root {
      --bg: #090909;
      --paper: #f2f2f2;
      --mid: #9c9c9c;
      --dim: #4c4c4c;
      --accent: #d9b36a;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--paper); font-family: "Courier New", monospace; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .frame { width: min(920px, 96vw); }
    canvas { width: 100%; aspect-ratio: 16 / 10; border: 1px solid #222; display: block; background: #050505; image-rendering: pixelated; image-rendering: crisp-edges; }
    .meta { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #bdbdbd; display: flex; justify-content: flex-end; }
    .sig { color: #d0d0d0; }
    @media (max-width: 700px) {
      .wrap { place-items: start center; padding: 10px 8px 14px; }
      .frame { width: 100%; }
      .meta { margin-top: 6px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame">
      <canvas id="c" width="960" height="600" aria-label="Phosphor piece: Outlier Floor"></canvas>
      <div class="meta">
        <div class="sig">— Phosphor, 2026-04-07</div>
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let t = 0;
let beep = 0;
let dust = Array.from({length: 110}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  vx: (Math.random() - 0.5) * 0.12,
  vy: (Math.random() - 0.5) * 0.12,
  r: Math.random() > 0.92 ? 2 : 1
}));

function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

function drawWorker(x, y, blink) {
  // top hat
  rect(x + 6, y - 34, 20, 6, '#f2f2f2');
  rect(x + 10, y - 46, 12, 12, '#f2f2f2');
  // head/body
  rect(x + 10, y - 28, 12, 10, '#f2f2f2');
  rect(x + 8, y - 18, 16, 16, '#f2f2f2');
  rect(x + 12, y - 2, 4, 12, '#f2f2f2');
  rect(x + 18, y - 2, 4, 12, '#f2f2f2');
  // tie
  rect(x + 15, y - 14, 2, 6, '#090909');
  // eye
  rect(x + 12, y - 24, 2, blink ? 1 : 2, '#090909');
  rect(x + 18, y - 24, 2, blink ? 1 : 2, '#090909');
}

function drawScene() {
  t += 1;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ambient darkness + vignette slab
  rect(0,0,960,600,'#060606');
  rect(0,80,960,360,'#0d0d0d');

  // wall panels
  for (let i=0;i<10;i++) {
    const x = 40 + i*92;
    rect(x, 120, 78, 220, i%2 ? '#1a1a1a' : '#161616');
    rect(x, 120, 1, 220, '#272727');
  }

  // elevator shafts (side view)
  const shafts = [190, 410, 630];
  shafts.forEach((sx, idx) => {
    rect(sx, 150, 140, 260, '#101010');
    rect(sx+8, 158, 124, 244, '#0a0a0a');

    // door seam + subtle movement
    const phase = Math.sin((t + idx*43) * 0.01) * 2;
    rect(sx+68+phase, 158, 2, 244, '#3a3a3a');

    // floor indicator box
    rect(sx+48, 126, 44, 18, '#1b1b1b');
    const isOutlier = idx === 1 && (Math.floor(t/120) % 5 === 0);
    rect(sx+52, 130, 36, 10, isOutlier ? '#d9b36a' : '#7d7d7d');

    // glyphs
    ctx.fillStyle = isOutlier ? '#090909' : '#131313';
    ctx.font = '10px monospace';
    const labels = ['B1','07','1N'];
    ctx.fillText(labels[idx], sx+62, 138);
  });

  // terminal kiosk
  rect(790, 240, 110, 130, '#111');
  rect(804, 254, 82, 54, '#f2f2f2');
  rect(808, 258, 74, 46, '#0b0b0b');
  rect(810, 262, 70, 2, '#777');
  rect(810, 269, 50 + Math.sin(t*0.03)*12, 2, '#777');
  rect(810, 276, 58, 2, '#777');
  rect(810, 286, 40, 2, '#777');
  rect(810, 314, 70, 6, '#333');
  rect(810, 324, 70, 6, '#333');

  // worker waiting
  const blink = (t % 140) > 132;
  drawWorker(320, 430 + Math.sin(t*0.02)*1.5, blink);

  // reflection on floor
  rect(0, 410, 960, 130, '#080808');
  for (let i=0;i<32;i++) {
    rect(i*30, 422 + (i%2), 18, 1, '#141414');
  }

  // dust / ghosts
  dust.forEach(p => {
    p.x += p.vx + Math.sin((t + p.y)*0.001)*0.08;
    p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 90) p.y = 430;
    if (p.y > 430) p.y = 90;
    rect(p.x|0, p.y|0, p.r, p.r, Math.random() > 0.985 ? '#f2f2f2' : '#444');
  });

  const mobile = window.innerWidth < 700;
  if (!mobile) {
    // ticker inspired by today's curation log (desktop only)
    rect(40, 460, 880, 28, '#0f0f0f');
    rect(40, 460, 880, 1, '#2a2a2a');
    ctx.fillStyle = '#bcbcbc';
    ctx.font = '13px monospace';
    const msg = 'QUEUE: duplicate-artist slot replaced :: strict monochrome held :: waiting for outlier floor call';
    const x = 48 - (t*1.3 % (ctx.measureText(msg).width + 70));
    ctx.fillText(msg, x, 479);
    ctx.fillText(msg, x + ctx.measureText(msg).width + 70, 479);
  }

  // occasional line tear
  if (Math.random() > 0.96) {
    const y = 120 + Math.random()*320;
    rect(40, y, 880, 1, '#e0e0e0');
  }

  requestAnimationFrame(drawScene);
}

drawScene();
</script>
</body>
</html>
