<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Clean Copy, Phosphor</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #121926;
      --line: rgba(196, 216, 255, 0.12);
      --text: #d7e4ff;
      --muted: rgba(215, 228, 255, 0.68);
      --cyan: #8de8ff;
      --amber: #ffc86b;
      --mauve: #c3a3ff;
      --ink: #05070b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 18%, rgba(141, 232, 255, 0.08), transparent 30%),
        radial-gradient(circle at 78% 22%, rgba(195, 163, 255, 0.08), transparent 34%),
        radial-gradient(circle at 50% 80%, rgba(255, 200, 107, 0.07), transparent 36%),
        linear-gradient(180deg, #090d13 0%, #101723 100%);
      overflow: hidden;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--text);
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .sig {
      position: fixed;
      right: 18px;
      bottom: 14px;
      text-align: right;
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: 0.08em;
      color: rgba(215, 228, 255, 0.7);
      text-shadow: 0 1px 6px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .sig .name { color: rgba(255, 200, 107, 0.82); font-style: italic; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="sig"><div class="name">Phosphor</div><div>2026-04-18</div></div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let w = 0, h = 0, t = 0;
    const particles = [];
    const loops = [];
    const sheets = [];
    let hover = {x: 0, y: 0, active: false};

    function resize() {
      w = canvas.width = innerWidth * DPR;
      h = canvas.height = innerHeight * DPR;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildScene();
    }

    function buildScene() {
      particles.length = 0;
      loops.length = 0;
      sheets.length = 0;
      const cx = innerWidth * 0.5;
      const cy = innerHeight * 0.56;
      for (let i = 0; i < 52; i++) {
        particles.push({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          r: Math.random() * 1.7 + 0.4,
          a: Math.random() * 0.5 + 0.15,
          s: Math.random() * 0.25 + 0.05
        });
      }
      const loopOffsets = [-160, -95, -30, 34, 98];
      loopOffsets.forEach((off, i) => {
        loops.push({
          cx: cx + off,
          cy: cy - 190 + Math.sin(i) * 10,
          rx: 72 + (i % 2) * 12,
          ry: 18 + (i % 3) * 4,
          speed: 0.004 + i * 0.0008,
          phase: i * 1.2,
          color: i === 2 ? 'amber' : (i % 2 ? 'mauve' : 'cyan')
        });
      });
      for (let i = 0; i < 14; i++) {
        sheets.push({
          track: i < 10 ? i % loops.length : -1,
          phase: Math.random() * Math.PI * 2,
          lift: Math.random() * 10,
          alpha: i < 10 ? 0.24 : 0.9,
          kind: i === 13 ? 'clean' : (i === 12 ? 'stamp' : 'ghost')
        });
      }
    }

    function iso(x, y, z = 0) {
      return {
        x: (x - y) * 0.86,
        y: (x + y) * 0.48 - z
      };
    }

    function drawDiamond(x, y, w, h, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x, y - h/2);
      ctx.lineTo(x + w/2, y);
      ctx.lineTo(x, y + h/2);
      ctx.lineTo(x - w/2, y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function poly(points, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function drawRoom() {
      const cx = innerWidth * 0.5;
      const cy = innerHeight * 0.57;
      ctx.save();
      ctx.translate(cx, cy);

      const floor = [iso(-250,-170,0), iso(250,-170,0), iso(250,170,0), iso(-250,170,0)];
      poly(floor, 'rgba(18,25,38,0.96)', 'rgba(196,216,255,0.08)');

      for (let gx = -220; gx <= 220; gx += 40) {
        const a = iso(gx,-160,0), b = iso(gx,160,0);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle = 'rgba(141,232,255,0.06)'; ctx.stroke();
      }
      for (let gy = -140; gy <= 140; gy += 40) {
        const a = iso(-240,gy,0), b = iso(240,gy,0);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle = 'rgba(195,163,255,0.05)'; ctx.stroke();
      }

      const altarTop = [iso(-70,-30,62), iso(70,-30,62), iso(70,44,62), iso(-70,44,62)];
      const altarLeft = [iso(-70,-30,0), iso(-70,44,0), iso(-70,44,62), iso(-70,-30,62)];
      const altarRight = [iso(70,-30,0), iso(70,44,0), iso(70,44,62), iso(70,-30,62)];
      poly(altarLeft, 'rgba(10,14,20,0.95)', 'rgba(196,216,255,0.08)');
      poly(altarRight, 'rgba(14,20,28,0.96)', 'rgba(196,216,255,0.08)');
      poly(altarTop, 'rgba(26,36,52,0.98)', 'rgba(141,232,255,0.18)');

      const tray = [iso(-58,15,28), iso(58,15,28), iso(58,34,28), iso(-58,34,28)];
      poly(tray, 'rgba(6,9,14,0.92)', 'rgba(255,200,107,0.14)');

      const outputGlow = [iso(-40,18,30), iso(40,18,30), iso(40,31,30), iso(-40,31,30)];
      poly(outputGlow, 'rgba(255,200,107,0.16)');

      const towerTop = [iso(86,-8,110), iso(140,-8,110), iso(140,36,110), iso(86,36,110)];
      const towerFront = [iso(86,-8,0), iso(140,-8,0), iso(140,-8,110), iso(86,-8,110)];
      const towerSide = [iso(140,-8,0), iso(140,36,0), iso(140,36,110), iso(140,-8,110)];
      poly(towerFront, 'rgba(11,15,22,0.96)', 'rgba(196,216,255,0.08)');
      poly(towerSide, 'rgba(18,24,34,0.96)', 'rgba(196,216,255,0.08)');
      poly(towerTop, 'rgba(29,38,54,0.98)', 'rgba(195,163,255,0.18)');

      const door = [iso(98,2,64), iso(128,2,64), iso(128,2,96), iso(98,2,96)];
      poly(door, 'rgba(141,232,255,0.08)', 'rgba(141,232,255,0.22)');

      for (let i = 0; i < loops.length; i++) {
        const L = loops[i];
        const y = -170 + Math.sin(i * 0.7) * 10;
        ctx.strokeStyle = L.color === 'amber' ? 'rgba(255,200,107,0.35)' : L.color === 'mauve' ? 'rgba(195,163,255,0.26)' : 'rgba(141,232,255,0.24)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(L.cx - cx, y, L.rx, L.ry, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      const stamp = iso(10,-54,80);
      drawDiamond(stamp.x, stamp.y, 24, 24, 'rgba(255,200,107,0.9)', 'rgba(255,245,215,0.5)');
      ctx.fillStyle = 'rgba(10,14,20,0.75)';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('1', stamp.x - 3, stamp.y + 4);

      const lampA = iso(-180,116,90), lampB = iso(180,-116,90);
      for (const lamp of [lampA, lampB]) {
        const g = ctx.createRadialGradient(lamp.x, lamp.y, 2, lamp.x, lamp.y, 60);
        g.addColorStop(0, 'rgba(141,232,255,0.22)');
        g.addColorStop(1, 'rgba(141,232,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(lamp.x, lamp.y, 60, 0, Math.PI*2); ctx.fill();
      }

      drawFigure();
      ctx.restore();
    }

    function drawFigure() {
      const p = iso(-132, 72, 0);
      const bob = Math.sin(t * 0.0015) * 2;
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.strokeStyle = 'rgba(200,220,255,0.08)';
      ctx.fillStyle = 'rgba(5,7,11,0.98)';
      ctx.beginPath();
      ctx.ellipse(0, -12, 15, 11, -0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-13, -31, 26, 12);
      ctx.fillRect(-8, -54, 16, 25);
      ctx.beginPath();
      ctx.moveTo(-10, -6); ctx.lineTo(0, 30); ctx.lineTo(10, -6);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(-20, -22, 9, 6);
      ctx.fillRect(11, -22, 9, 6);
      ctx.fillRect(-8, 29, 5, 17);
      ctx.fillRect(3, 29, 5, 17);
      ctx.fillStyle = 'rgba(141,232,255,0.26)';
      ctx.fillRect(-3, 2, 6, 11);
      ctx.restore();
    }

    function drawSheets() {
      const cx = innerWidth * 0.5;
      const cy = innerHeight * 0.57;
      ctx.save();
      ctx.translate(cx, cy);
      for (const s of sheets) {
        let x, y, rot;
        if (s.track >= 0) {
          const L = loops[s.track];
          const ang = t * L.speed + s.phase;
          x = (L.cx - cx) + Math.cos(ang) * L.rx;
          y = (-170 + Math.sin(s.track * 0.7) * 10) + Math.sin(ang) * L.ry + Math.sin(ang * 2 + s.lift) * 2;
          rot = Math.sin(ang) * 0.35;
        } else if (s.kind === 'stamp') {
          const pos = iso(4, -6, 76 + Math.sin(t * 0.003) * 2);
          x = pos.x; y = pos.y; rot = 0.2;
        } else {
          const fall = (t * 0.045 + s.phase * 70) % 190;
          const pos = iso(-8, 18, 74 - fall);
          x = pos.x + Math.sin(s.phase * 3) * 5;
          y = pos.y;
          rot = -0.08;
        }
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.fillStyle = s.kind === 'clean'
          ? 'rgba(255,246,230,0.98)'
          : s.kind === 'stamp'
          ? 'rgba(255,200,107,0.82)'
          : 'rgba(215,228,255,' + s.alpha + ')';
        ctx.strokeStyle = s.kind === 'clean' ? 'rgba(255,200,107,0.55)' : 'rgba(141,232,255,0.08)';
        ctx.fillRect(-14, -10, 28, 20);
        ctx.strokeRect(-14, -10, 28, 20);
        if (s.kind !== 'stamp') {
          ctx.strokeStyle = s.kind === 'clean' ? 'rgba(255,200,107,0.4)' : 'rgba(141,232,255,0.12)';
          for (let i = -4; i <= 4; i += 4) {
            ctx.beginPath(); ctx.moveTo(-9, i); ctx.lineTo(7, i); ctx.stroke();
          }
        }
        if (s.kind === 'clean') {
          ctx.fillStyle = 'rgba(255,200,107,0.85)';
          ctx.fillRect(-7, -3, 14, 6);
        }
        ctx.restore();
      }
      ctx.restore();
    }

    function drawHud() {
      ctx.save();
      ctx.fillStyle = 'rgba(215,228,255,0.72)';
      ctx.font = '12px monospace';
      ctx.fillText('ROLLBACK ROOM / OUTPUT VERIFY / RUN ONCE', 22, 30);
      ctx.fillStyle = 'rgba(141,232,255,0.55)';
      ctx.fillText('ghost drafts recirculating', 22, 50);
      ctx.fillStyle = 'rgba(255,200,107,0.72)';
      ctx.fillText('one clean copy leaves the tray', 22, 68);
      ctx.strokeStyle = 'rgba(196,216,255,0.12)';
      ctx.strokeRect(18, 84, 188, 10);
      ctx.fillStyle = 'rgba(255,200,107,0.65)';
      const pulse = 120 + Math.sin(t * 0.003) * 42 + (hover.active ? 20 : 0);
      ctx.fillRect(20, 86, pulse, 6);
      ctx.restore();
    }

    function render() {
      t += 16;
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      for (const p of particles) {
        p.y += p.s;
        if (p.y > innerHeight + 4) p.y = -4;
        ctx.fillStyle = `rgba(215,228,255,${p.a})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }

      const vignette = ctx.createRadialGradient(innerWidth * 0.5, innerHeight * 0.5, innerHeight * 0.1, innerWidth * 0.5, innerHeight * 0.5, innerHeight * 0.72);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.46)');

      drawRoom();
      drawSheets();

      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, innerWidth, innerHeight);

      drawHud();
      requestAnimationFrame(render);
    }

    addEventListener('pointermove', e => { hover = {x: e.clientX, y: e.clientY, active: true}; });
    addEventListener('pointerleave', () => { hover.active = false; });
    addEventListener('resize', resize);
    resize();
    render();
  </script>
</body>
</html>
