<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFCOMM — Phosphor 075</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; overflow: hidden; font-family: 'Courier New', monospace; }
canvas { display: block; }
#label {
  position: fixed; bottom: 20px; left: 20px;
  color: #334; font-size: 11px; letter-spacing: 2px;
  z-index: 10; pointer-events: none;
}
#label span { color: #4488cc; }
#info {
  position: fixed; top: 20px; right: 20px;
  color: #223; font-size: 10px; text-align: right;
  z-index: 10; pointer-events: none; line-height: 1.6;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">PHOSPHOR 075 · <span>RFCOMM</span> · 2026-04-04</div>
<div id="info">click to send bytes<br>they may arrive</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, midY;
const packets = [];
const landed = [];
const sparks = [];
let printerX;

function resize() {
  W = c.width = innerWidth;
  H = c.height = innerHeight;
  midY = H * 0.55;
  printerX = W * 0.82;
}
resize();
addEventListener('resize', resize);

// The gap — a shimmering vertical boundary where digital meets physical
const gapX = () => W * 0.5;

class Packet {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.bytes = [];
    // Generate fake ESC/POS-style hex bytes
    const len = 4 + Math.floor(Math.random() * 12);
    for (let i = 0; i < len; i++) {
      this.bytes.push(Math.floor(Math.random() * 256));
    }
    this.vx = 1.2 + Math.random() * 0.8;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.age = 0;
    this.alive = true;
    this.crossed = false;
    this.alpha = 1;
    this.wobble = Math.random() * Math.PI * 2;
    // Some packets don't make it
    this.willArrive = Math.random() > 0.15;
  }

  update() {
    this.age++;
    this.wobble += 0.03;
    this.y += Math.sin(this.wobble) * 0.4 + this.vy;

    if (!this.crossed && this.x < gapX()) {
      this.x += this.vx;
    } else if (!this.crossed) {
      // Crossing the gap
      this.crossed = true;
      if (!this.willArrive) {
        // Scatter into sparks
        for (let i = 0; i < 8; i++) {
          sparks.push({
            x: this.x, y: this.y,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            life: 40 + Math.random() * 30,
            age: 0,
            hex: this.bytes[Math.floor(Math.random() * this.bytes.length)]
          });
        }
        this.alive = false;
        return;
      }
      this.vx *= 0.6; // Slow after crossing
    }

    if (this.crossed && this.alive) {
      this.x += this.vx;
      if (this.x >= printerX) {
        // Landed — become a printed line
        landed.push({
          bytes: this.bytes,
          y: midY + (Math.random() - 0.5) * H * 0.3,
          x: printerX,
          alpha: 1,
          age: 0
        });
        this.alive = false;
      }
    }

    if (this.x > W + 50) this.alive = false;
  }

  draw() {
    if (!this.alive) return;
    const gx = gapX();
    const distToGap = Math.abs(this.x - gx);
    const nearGap = distToGap < 60;

    ctx.save();
    ctx.translate(this.x, this.y);

    // Byte visualization — tiny hex characters
    const hexStr = this.bytes.map(b => b.toString(16).padStart(2, '0')).join(' ');

    if (!this.crossed) {
      // Digital side — cool blue, crisp
      ctx.fillStyle = nearGap
        ? `rgba(68, 136, 220, ${0.5 + Math.random() * 0.3})`
        : `rgba(68, 136, 204, 0.7)`;
      ctx.font = '9px Courier New';
      ctx.fillText(hexStr.substring(0, 20), 0, 0);

      // Glow near the gap
      if (nearGap) {
        ctx.fillStyle = `rgba(100, 180, 255, ${0.1 + Math.random() * 0.15})`;
        ctx.fillRect(-2, -6, hexStr.length * 2.5, 10);
      }
    } else {
      // Physical side — warm amber, slightly rough
      const jitter = Math.random() * 1.5;
      ctx.fillStyle = `rgba(220, 170, 80, ${0.6 + Math.random() * 0.2})`;
      ctx.font = '9px Courier New';
      ctx.fillText(hexStr.substring(0, 20), jitter, jitter);
    }

    ctx.restore();
  }
}

// Click to send packets
addEventListener('click', (e) => {
  const count = 3 + Math.floor(Math.random() * 5);
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      packets.push(new Packet(
        30 + Math.random() * 60,
        e.y + (Math.random() - 0.5) * 40
      ));
    }, i * 80);
  }
});

// Auto-send occasional packets
function autoSend() {
  if (Math.random() > 0.7) {
    packets.push(new Packet(
      20 + Math.random() * 40,
      H * 0.2 + Math.random() * H * 0.6
    ));
  }
}

function drawGap() {
  const gx = gapX();
  // The Bluetooth gap — a shimmering, uncertain boundary
  for (let y = 0; y < H; y += 3) {
    const drift = Math.sin(y * 0.01 + Date.now() * 0.001) * 8;
    const alpha = 0.03 + Math.sin(y * 0.02 + Date.now() * 0.0005) * 0.02;
    ctx.fillStyle = `rgba(100, 140, 200, ${alpha})`;
    ctx.fillRect(gx + drift - 1, y, 2, 2);
  }

  // Label the sides
  ctx.save();
  ctx.font = '9px Courier New';
  ctx.fillStyle = 'rgba(68, 136, 204, 0.15)';
  ctx.fillText('DIGITAL', gx - 80, 30);
  ctx.fillStyle = 'rgba(220, 170, 80, 0.15)';
  ctx.fillText('PHYSICAL', gx + 20, 30);
  ctx.restore();
}

function drawPrinter() {
  // Simple printer outline on the right
  const px = printerX;
  const py = midY;
  ctx.save();
  ctx.strokeStyle = 'rgba(220, 170, 80, 0.12)';
  ctx.lineWidth = 1;
  ctx.strokeRect(px - 20, py - 40, 60, 80);
  // Slot
  ctx.strokeStyle = 'rgba(220, 170, 80, 0.08)';
  ctx.beginPath();
  ctx.moveTo(px - 15, py - 20);
  ctx.lineTo(px + 35, py - 20);
  ctx.stroke();
  // Label
  ctx.font = '8px Courier New';
  ctx.fillStyle = 'rgba(220, 170, 80, 0.1)';
  ctx.fillText('SK20', px - 5, py + 50);
  ctx.restore();
}

function drawLanded() {
  for (let i = landed.length - 1; i >= 0; i--) {
    const l = landed[i];
    l.age++;
    l.alpha = Math.max(0, 1 - l.age / 300);
    if (l.alpha <= 0) { landed.splice(i, 1); continue; }

    ctx.save();
    ctx.font = '8px Courier New';
    ctx.fillStyle = `rgba(220, 180, 100, ${l.alpha * 0.5})`;
    // Print as thermal receipt characters
    const receipt = l.bytes.map(b => String.fromCharCode(33 + (b % 94))).join('');
    ctx.fillText(receipt, l.x + 5, l.y);
    ctx.restore();
  }
}

function drawSparks() {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.age++;
    s.x += s.vx;
    s.y += s.vy;
    s.vx *= 0.97;
    s.vy *= 0.97;
    const a = Math.max(0, 1 - s.age / s.life);
    if (a <= 0) { sparks.splice(i, 1); continue; }

    ctx.save();
    ctx.font = '8px Courier New';
    ctx.fillStyle = `rgba(200, 80, 80, ${a * 0.6})`;
    ctx.fillText(s.hex.toString(16).padStart(2, '0'), s.x, s.y);
    ctx.restore();
  }
}

// Background: faint RFCOMM channel indicators
function drawChannels() {
  ctx.save();
  ctx.font = '8px Courier New';
  ctx.fillStyle = 'rgba(40, 60, 90, 0.06)';
  for (let ch = 1; ch <= 5; ch++) {
    const y = H * 0.15 + ch * H * 0.13;
    ctx.fillText(`CH ${ch}`, 10, y);
    ctx.strokeStyle = 'rgba(40, 60, 90, 0.03)';
    ctx.beginPath();
    ctx.moveTo(35, y - 3);
    ctx.lineTo(gapX() - 10, y - 3);
    ctx.stroke();
  }
  ctx.restore();
}

function frame() {
  ctx.fillStyle = 'rgba(10, 10, 15, 0.12)';
  ctx.fillRect(0, 0, W, H);

  drawChannels();
  drawGap();
  drawPrinter();
  drawLanded();
  drawSparks();

  autoSend();

  for (let i = packets.length - 1; i >= 0; i--) {
    packets[i].update();
    packets[i].draw();
    if (!packets[i].alive) packets.splice(i, 1);
  }

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
