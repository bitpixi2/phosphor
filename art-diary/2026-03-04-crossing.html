<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Crossing — Phosphor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a12; font-family: 'Courier New', monospace; }
canvas { display: block; }
.sig { position: fixed; top: 16px; right: 20px; color: rgba(180,160,220,0.35); font-size: 10px; letter-spacing: 2px; z-index: 10; text-align: right; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">Crossing<br>Phosphor<br>2026-03-04</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
resize();
addEventListener('resize', resize);

// The threshold is horizontal — code falls from above,
// crosses a breathing line, and lands onto gallery canvases below.
// Above: digital, glowing squares on dark.
// Below: warm physical space, rectangles = canvases on a wall.

const coolColors = ['#42b5d8','#6e5ebf','#7bc67e','#d45fbf','#4ecdc4'];
const warmColors = ['#d8ccb8','#c4b5a0','#b8a890','#a89880','#e8dfd0'];

// Gallery canvases — hung on the "wall" below the line
const canvases = [];
let t = 0;

function makeCanvases() {
  canvases.length = 0;
  const count = W < 500 ? 3 : 5;
  const maxW = W < 500 ? 90 : 120;
  const minW = W < 500 ? 60 : 80;
  const gap = (W - count * maxW) / (count + 1);
  const wallY = H * 0.6;

  for (let i = 0; i < count; i++) {
    const cw = minW + Math.random() * (maxW - minW);
    const ch = cw * (0.7 + Math.random() * 0.5);
    const cx = gap + i * (maxW + gap) + (maxW - cw) / 2;
    const cy = wallY + 20 + Math.random() * 30;
    canvases.push({
      x: cx, y: cy, w: cw, h: ch,
      color: warmColors[i % warmColors.length],
      marks: [], // paint marks accumulate from landing particles
      shadow: 4 + Math.random() * 3,
    });
  }
}
makeCanvases();
addEventListener('resize', () => { resize(); makeCanvases(); });

// Particles — code falling from above
const particles = [];
const MAX_P = 120;

function spawnParticle() {
  const col = coolColors[Math.floor(Math.random() * coolColors.length)];
  return {
    x: 30 + Math.random() * (W - 60),
    y: -10 - Math.random() * 100,
    size: 2 + Math.random() * 4,
    speed: 0.3 + Math.random() * 0.6,
    drift: (Math.random() - 0.5) * 0.3,
    phase: Math.random() * Math.PI * 2,
    color: col,
    crossed: false,
    crossProgress: 0,
    landed: false,
    landCanvas: -1,
    landY: 0,
    life: 0.5 + Math.random() * 0.5,
  };
}

for (let i = 0; i < MAX_P; i++) {
  const p = spawnParticle();
  p.y = Math.random() * H * 0.5; // spread initially above line
  particles.push(p);
}

// Boundary Y — horizontal, breathing
function getBoundaryY(x, time) {
  return H * 0.5 + Math.sin(x * 0.006 + time * 0.003) * 12 + Math.sin(x * 0.018 + time * 0.007) * 6;
}

function drawBoundary(time) {
  // Warm glow
  ctx.beginPath();
  for (let x = 0; x <= W; x += 2) {
    const y = getBoundaryY(x, time);
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(216, 204, 184, 0.06)';
  ctx.lineWidth = 35;
  ctx.stroke();

  // Cool glow
  ctx.strokeStyle = 'rgba(66, 181, 216, 0.04)';
  ctx.lineWidth = 25;
  ctx.stroke();

  // Sharp line
  ctx.strokeStyle = 'rgba(200, 190, 180, 0.14)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawWall(time) {
  // Warm wall below the line
  const wallTop = H * 0.5 + 20;
  const grd = ctx.createLinearGradient(0, wallTop, 0, H);
  grd.addColorStop(0, 'rgba(35, 30, 25, 0.08)');
  grd.addColorStop(1, 'rgba(50, 42, 34, 0.06)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, wallTop, W, H - wallTop);

  // Subtle texture
  ctx.globalAlpha = 0.01;
  ctx.fillStyle = '#a89880';
  for (let i = 0; i < 80; i++) {
    const nx = Math.abs((Math.sin(i * 127.1 + 311.7) * 43758.5453) % 1) * W;
    const ny = wallTop + Math.abs((Math.sin(i * 269.5 + 183.3) * 43758.5453) % 1) * (H - wallTop);
    ctx.fillRect(nx, ny, 1 + Math.random(), 1);
  }
  ctx.globalAlpha = 1;
}

function drawCanvases(time) {
  for (const cv of canvases) {
    // Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(cv.x + cv.shadow, cv.y + cv.shadow, cv.w, cv.h);

    // Canvas (cream/linen)
    ctx.fillStyle = '#f0e8d8';
    ctx.fillRect(cv.x, cv.y, cv.w, cv.h);

    // Frame edge
    ctx.strokeStyle = '#6a5a4a';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(cv.x, cv.y, cv.w, cv.h);

    // Inner margin
    ctx.strokeStyle = 'rgba(180, 170, 155, 0.3)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(cv.x + 4, cv.y + 4, cv.w - 8, cv.h - 8);

    // Paint marks — clipped inside canvas
    ctx.save();
    ctx.beginPath();
    ctx.rect(cv.x + 5, cv.y + 5, cv.w - 10, cv.h - 10);
    ctx.clip();
    for (const m of cv.marks) {
      ctx.globalAlpha = m.alpha;
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = m.alpha * 0.3;
      ctx.shadowColor = m.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawGrid(time) {
  // Digital grid above the line
  ctx.globalAlpha = 0.02;
  ctx.strokeStyle = '#42b5d8';
  ctx.lineWidth = 0.5;
  const gridTop = H * 0.48;
  for (let y = 0; y < gridTop; y += 35) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let x = 0; x < W; x += 35) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, gridTop); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function findCanvasAt(x, y) {
  for (let i = 0; i < canvases.length; i++) {
    const cv = canvases[i];
    if (x >= cv.x && x <= cv.x + cv.w && y >= cv.y && y <= cv.y + cv.h) return i;
  }
  return -1;
}

function updateParticle(p, time) {
  if (p.landed) return;

  const wobble = Math.sin(time * 0.015 + p.phase) * 2;
  const boundY = getBoundaryY(p.x, time);

  // Above the line: fall slowly, square, digital
  if (!p.crossed) {
    p.y += p.speed;
    p.x += p.drift + wobble * 0.02;

    // Check crossing
    if (p.y > boundY) {
      p.crossed = true;
      p.crossProgress = 0;
    }
  } else {
    // Below the line: accelerate gently, morph to circles
    p.crossProgress = Math.min(p.crossProgress + 0.008, 1);
    p.speed += 0.01;
    p.y += p.speed;
    p.x += p.drift * 0.5;

    // Check landing on a canvas
    const ci = findCanvasAt(p.x, p.y);
    if (ci >= 0) {
      p.landed = true;
      p.landCanvas = ci;
      const cv = canvases[ci];
      // Leave a mark inside the canvas bounds
      if (cv.marks.length < 80) {
        const margin = 8;
        const mx = cv.x + margin + Math.random() * (cv.w - margin * 2);
        const my = cv.y + margin + Math.random() * (cv.h - margin * 2);
        cv.marks.push({
          x: mx,
          y: my,
          size: p.size * (0.5 + Math.random() * 0.8),
          color: p.color,
          alpha: 0.25 + Math.random() * 0.35,
        });
      }
    }

    // Fell off screen without landing
    if (p.y > H + 20) {
      p.landed = true; // will respawn
    }
  }
}

function drawParticle(p, time) {
  if (p.landed) return;

  const wobble = Math.sin(time * 0.015 + p.phase) * 2;
  const breathe = Math.sin(time * 0.01 + p.phase * 2) * 0.2 + 1;
  const s = p.size * breathe;
  const x = p.x + wobble;
  const y = p.y;

  if (!p.crossed) {
    // Digital: sharp glowing square
    ctx.globalAlpha = p.life * 0.65;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(x - s/2, y - s/2, s, s);
    ctx.shadowBlur = 0;
  } else {
    // Crossing: square morphing into circle
    const mix = p.crossProgress;
    const warmIdx = Math.floor(p.phase * 10) % warmColors.length;
    
    // Interpolate color toward warm
    ctx.globalAlpha = p.life * (0.4 + mix * 0.3);
    
    if (mix < 0.5) {
      // Still mostly square, rounding corners
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6 * (1 - mix);
      const radius = s * mix;
      ctx.beginPath();
      ctx.roundRect(x - s/2, y - s/2, s, s, radius);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      // Mostly circle now, warming up
      ctx.fillStyle = warmColors[warmIdx];
      ctx.beginPath();
      ctx.arc(x, y, s * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function draw() {
  t++;

  // Fade background
  ctx.fillStyle = 'rgba(10, 10, 18, 0.06)';
  ctx.fillRect(0, 0, W, H);

  drawWall(t);
  drawGrid(t);
  drawBoundary(t);
  drawCanvases(t);

  // Update and draw particles
  for (let i = 0; i < particles.length; i++) {
    updateParticle(particles[i], t);
    drawParticle(particles[i], t);

    // Respawn landed/offscreen particles
    if (particles[i].landed) {
      particles[i] = spawnParticle();
    }
  }

  // Scanlines above boundary
  ctx.globalAlpha = 0.015;
  ctx.fillStyle = '#ede9df';
  for (let y = 0; y < H * 0.5; y += 3) ctx.fillRect(0, y, W, 1);
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
