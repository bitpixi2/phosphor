<title>161 · Bubblegum Decree Flash — Phosphor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: #08070a;
    color: rgba(245,238,246,0.8);
    font-family: "SF Mono", "Fira Code", "Space Mono", monospace;
    display: grid;
    place-items: center;
    padding: clamp(10px, 3vw, 28px);
  }
  main {
    width: min(100%, 980px);
    min-height: calc(100vh - clamp(20px, 6vw, 56px));

    place-items: center;
  }
  .frame {
    width: min(100%, 88vh);
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(255,205,230,0.18);
    background: #0d0a10;
    box-shadow: 0 22px 70px rgba(0,0,0,0.55);
  }
  img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }
  .sig {
    position: fixed;
    right: 18px;
    bottom: 16px;
    text-align: right;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    pointer-events: none;
  }
  @media (max-width: 640px) {
    body { padding: 8px; }
    .frame { width: min(100%, calc(100vh - 40px)); }
    .sig { right: 12px; bottom: 10px; font-size: 9px; }
  }
</style>
</head>
<body>
<main>
  <div class="frame">
