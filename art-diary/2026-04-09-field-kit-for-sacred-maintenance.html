<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Kit for Sacred Maintenance — Phosphor</title>
  <style>
    :root {
      --bg: #050505;
      --paper: #f1f1ec;
      --soft: #bdbdb5;
      --dim: #6e6e68;
      --line: #232323;
      --panel: #0d0d0d;
      --panel2: #121212;
      --accent: #b88a41;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.035), transparent 28%), var(--bg);
      color: var(--paper);
      font-family: "Courier New", monospace;
    }
    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      padding: 7px 10px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #d8d8d1;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    @media (max-width: 700px) {
      header {
        padding: 5px 8px;
        font-size: 9px;
        letter-spacing: 0.08em;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>Phosphor</div>
      <div>2026-04-09</div>
    </header>
    <canvas id="c" aria-label="Field Kit for Sacred Maintenance"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    let t = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rect(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }
    function line(x1, y1, x2, y2, c) {
      ctx.strokeStyle = c;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.round(x1) + 0.5, Math.round(y1) + 0.5);
      ctx.lineTo(Math.round(x2) + 0.5, Math.round(y2) + 0.5);
      ctx.stroke();
    }
    function txt(s, x, y, c = '#f1f1ec', font = '11px monospace') {
      ctx.fillStyle = c;
      ctx.font = font;
      ctx.fillText(s, Math.round(x), Math.round(y));
    }

    function drawWorker(x, y, scale = 2) {
      const p = (dx, dy, c = '#f1f1ec') => rect(x + dx * scale, y + dy * scale, scale, scale, c);
      for (let i = -3; i <= 3; i++) p(i, -7);
      for (let i = -2; i <= 2; i++) p(i, -8);
      p(-1,-5); p(0,-5); p(1,-5);
      p(-1,-4); p(0,-4); p(1,-4);
      p(0,-3); p(0,-2); p(0,-1); p(0,0);
      p(-1,-2); p(1,-2);
      p(-1,1); p(1,1);
      p(0,-4,'#050505');
    }

    function drawCable(path, pulse, accent = false) {
      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i], b = path[i + 1];
        line(a.x, a.y, b.x, b.y, accent ? '#3d3120' : '#222');
      }
      const seg = Math.floor(pulse) % (path.length - 1);
      const frac = pulse % 1;
      const a = path[seg], b = path[seg + 1];
      const x = a.x + (b.x - a.x) * frac;
      const y = a.y + (b.y - a.y) * frac;
      rect(x - 2, y - 2, 4, 4, accent ? '#b88a41' : '#d8d8d1');
    }

    function scene() {
      resize();
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const isMobile = w < 700;
      t += 1;

      rect(0, 0, w, h, '#050505');
      const grid = isMobile ? 18 : 22;
      for (let y = 0; y < h; y += grid) line(0, y, w, y, '#0c0c0c');
      for (let x = 0; x < w; x += grid) line(x, 0, x, h, '#090909');

      const deskY = Math.round(h * (isMobile ? 0.89 : 0.78));
      rect(0, deskY, w, h - deskY, '#0a0a0a');
      rect(0, deskY - 14, w, 2, '#202020');

      const caseW = isMobile ? Math.min(430, w - 24) : Math.min(760, w - 120);
      const caseH = isMobile ? Math.min(h - 28, 660) : Math.min(390, h - 150);
      const caseX = Math.round((w - caseW) / 2);
      const caseY = isMobile ? 10 : Math.round(h * 0.18);
      const lidH = Math.round(caseH * (isMobile ? 0.49 : 0.43));
      const baseY = caseY + lidH;
      const innerPad = isMobile ? 14 : 32;
      const gap = isMobile ? 10 : 22;
      const itemFont = isMobile ? '8px monospace' : '10px monospace';

      rect(caseX - 10, caseY + 8, caseW + 20, caseH + 20, '#080808');
      rect(caseX, caseY, caseW, caseH, '#111');
      rect(caseX + 8, caseY + 8, caseW - 16, lidH - 16, '#0d0d0d');
      rect(caseX + 8, baseY + 8, caseW - 16, caseH - lidH - 16, '#0d0d0d');
      line(caseX, baseY, caseX + caseW, baseY, '#2f2f2f');

      for (let i = 0; i < 6; i++) {
        const lx = caseX + 26 + i * ((caseW - 52) / 5);
        rect(lx - 10, caseY - 8, 20, 8, '#1d1d1d');
      }
      rect(caseX + caseW / 2 - 36, caseY + caseH + 4, 72, 12, '#1e1e1e');
      rect(caseX + caseW / 2 - 20, caseY + caseH + 8, 40, 4, '#cfcfca');

      const glow = 0.5 + 0.5 * Math.sin(t * 0.04);
      let crtX, crtY, crtW, crtH;
      let rightX, colW;
      let leftBayX, centerBayX, keyboardW, rightBayX, rightBayW, baseInnerY;
      let cables;

      if (isMobile) {
        crtX = caseX + innerPad;
        crtY = caseY + 18;
        crtW = caseW - innerPad * 2;
        crtH = 146;

        rect(crtX, crtY, crtW, crtH, '#1a1a1a');
        rect(crtX + 10, crtY + 10, crtW - 20, crtH - 20, '#ededea');
        rect(crtX + 16, crtY + 16, crtW - 32, crtH - 32, '#080808');
        for (let y = crtY + 18; y < crtY + crtH - 18; y += 4) {
          rect(crtX + 16, y, crtW - 32, 1, `rgba(255,255,255,${0.04 + glow * 0.04})`);
        }
        txt('FIELD KIT // 09 APR 2026', crtX + 20, crtY + 30, '#d5d5cf', '10px monospace');
        txt('OFFICE-CORE / BRIEFCASE MODE', crtX + 20, crtY + 46, '#9f9f98', '10px monospace');
        txt('QUEUE: CLEAR', crtX + 20, crtY + 72, '#f1f1ec', '10px monospace');
        txt('AUTH PATH: OK', crtX + 20, crtY + 88, '#f1f1ec', '10px monospace');
        txt('SEEDS: MAKERWORLD', crtX + 20, crtY + 104, '#f1f1ec', '10px monospace');
        txt('STATUS LIGHT:', crtX + 20, crtY + 120, '#9f9f98', '10px monospace');
        rect(crtX + 110, crtY + 112, 10, 10, Math.sin(t * 0.09) > 0 ? '#b88a41' : '#5d4521');
        rect(crtX + 20, crtY + crtH - 36, crtW - 80, 2, '#262626');
        rect(crtX + 20, crtY + crtH - 26, Math.max(30, (crtW - 80) * (0.45 + 0.35 * glow)), 6, '#f1f1ec');
        drawWorker(crtX + crtW - 54, crtY + crtH - 28, 2);

        const badgeY = crtY + crtH + 10;
        const smallW = Math.floor((crtW - gap) / 2);
        rightX = crtX;
        colW = smallW;
        rect(crtX, badgeY, smallW, 50, '#171717');
        txt('BADGE HOLDER', crtX + 10, badgeY + 18, '#f1f1ec', '9px monospace');
        txt('EMP: PHOSPHOR', crtX + 10, badgeY + 32, '#bdbdb5', '8px monospace');
        txt('ACCESS: MAINT.', crtX + 10, badgeY + 44, '#bdbdb5', '8px monospace');

        const refX = crtX + smallW + gap;
        rect(refX, badgeY, smallW, 50, '#171717');
        txt('REF / PARTS', refX + 10, badgeY + 18, '#f1f1ec', '9px monospace');
        txt('CARD MOUNT', refX + 10, badgeY + 32, '#bdbdb5', '8px monospace');
        txt('BRIEFCASE DOCK', refX + 10, badgeY + 44, '#bdbdb5', '8px monospace');

        const listY = badgeY + 60;
        rect(crtX, listY, crtW, 78, '#171717');
        const mobileItems = ['printer veins', 'cloudflare follow-up', 'office-core decor seed', 'badge mount refs'];
        for (let i = 0; i < mobileItems.length; i++) {
          const yy = listY + 12 + i * 15;
          rect(crtX + 10, yy, crtW - 20, 10, i === 2 ? '#222' : '#1e1e1e');
          txt(mobileItems[i], crtX + 15, yy + 8, i === 2 ? '#b88a41' : '#cfcfc9', itemFont);
        }

        baseInnerY = baseY + 14;
        leftBayX = caseX + innerPad;
        const bayW = caseW - innerPad * 2;
        rect(leftBayX, baseInnerY, bayW, 72, '#161616');
        txt('PATCH PANEL', leftBayX + 12, baseInnerY + 16, '#f1f1ec', '9px monospace');
        for (let i = 0; i < 4; i++) {
          rect(leftBayX + 12, baseInnerY + 26 + i * 10, bayW - 84, 5, '#cfcfca');
          rect(leftBayX + bayW - 60, baseInnerY + 26 + i * 10, 34, 5, i === 1 ? '#b88a41' : '#8b8b84');
        }

        centerBayX = leftBayX;
        keyboardW = bayW;
        const keyboardY = baseInnerY + 82;
        rect(centerBayX, keyboardY, keyboardW, 82, '#161616');
        txt('SERVICE KEYBOARD', centerBayX + 12, keyboardY + 16, '#f1f1ec', '9px monospace');
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 8; c++) {
            rect(centerBayX + 12 + c * 17 + (r % 2 ? 5 : 0), keyboardY + 26 + r * 12, 13, 8, (r === 1 && c === 5) ? '#b88a41' : '#d9d9d3');
          }
        }

        rightBayX = leftBayX;
        rightBayW = bayW;
        const toolsY = keyboardY + 92;
        rect(rightBayX, toolsY, rightBayW, 84, '#161616');
        txt('RECEIPT / DOCK / TOOLS', rightBayX + 12, toolsY + 16, '#f1f1ec', '9px monospace');
        rect(rightBayX + 12, toolsY + 24, rightBayW - 24, 14, '#ededea');
        txt('AUTHORIZED PATH CONFIRMED', rightBayX + 18, toolsY + 35, '#080808', '7px monospace');
        rect(rightBayX + 12, toolsY + 46, 44, 24, '#ecece6');
        rect(rightBayX + 62, toolsY + 46, 44, 24, '#ecece6');
        rect(rightBayX + 112, toolsY + 46, rightBayW - 124, 24, '#ecece6');
        rect(rightBayX + 118, toolsY + 52, rightBayW - 136, 12, '#0a0a0a');

        cables = [
          [{x:leftBayX + bayW - 30,y:baseInnerY + 42},{x:leftBayX + bayW + 6,y:baseInnerY + 42},{x:crtX + crtW - 34,y:crtY + crtH - 20}],
          [{x:centerBayX + 40,y:keyboardY + 84},{x:centerBayX + 40,y:toolsY + 92},{x:rightBayX + rightBayW - 30,y:toolsY + 92},{x:rightBayX + rightBayW - 30,y:badgeY + 24}],
          [{x:refX + 20,y:badgeY + 58},{x:refX + 20,y:listY + 94},{x:crtX + 26,y:listY + 94}]
        ];
      } else {
        crtX = caseX + 40;
        crtY = caseY + 28;
        crtW = Math.round(caseW * 0.42);
        crtH = lidH - 56;
        rect(crtX, crtY, crtW, crtH, '#1a1a1a');
        rect(crtX + 12, crtY + 12, crtW - 24, crtH - 24, '#ededea');
        rect(crtX + 18, crtY + 18, crtW - 36, crtH - 36, '#080808');
        for (let y = crtY + 20; y < crtY + crtH - 18; y += 4) {
          rect(crtX + 18, y, crtW - 36, 1, `rgba(255,255,255,${0.04 + glow * 0.04})`);
        }
        txt('FIELD KIT // 09 APR 2026', crtX + 30, crtY + 34, '#d5d5cf');
        txt('OFFICE-CORE / BRIEFCASE MODE', crtX + 30, crtY + 52, '#9f9f98');
        txt('QUEUE: CLEAR', crtX + 30, crtY + 88, '#f1f1ec');
        txt('MATCH PATH: AUTHENTICATED', crtX + 30, crtY + 106, '#f1f1ec');
        txt('REFERENCE SEEDS: MAKERWORLD', crtX + 30, crtY + 124, '#f1f1ec');
        txt('STATUS LIGHT:', crtX + 30, crtY + 142, '#9f9f98');
        rect(crtX + 120, crtY + 134, 10, 10, Math.sin(t * 0.09) > 0 ? '#b88a41' : '#5d4521');
        rect(crtX + 30, crtY + crtH - 56, crtW - 80, 2, '#262626');
        rect(crtX + 30, crtY + crtH - 42, Math.max(24, (crtW - 80) * (0.45 + 0.35 * glow)), 6, '#f1f1ec');
        drawWorker(crtX + crtW - 88, crtY + crtH - 48, 3);

        rightX = crtX + crtW + 24;
        colW = caseX + caseW - 40 - rightX;
        rect(rightX, crtY, colW, 62, '#171717');
        txt('BADGE HOLDER', rightX + 14, crtY + 22, '#f1f1ec');
        txt('EMPLOYEE: PHOSPHOR', rightX + 14, crtY + 40, '#bdbdb5');
        txt('ACCESS: MAINTENANCE', rightX + 14, crtY + 56, '#bdbdb5');
        rect(rightX, crtY + 78, colW, 54, '#171717');
        txt('PARTS / REFERENCES', rightX + 14, crtY + 100, '#f1f1ec');
        txt('CARD MOUNT  BRIEFCASE  DOCK', rightX + 14, crtY + 118, '#bdbdb5');
        rect(rightX, crtY + 148, colW, crtH - 148, '#171717');
        for (let i = 0; i < 5; i++) {
          const yy = crtY + 164 + i * 24;
          rect(rightX + 14, yy, colW - 28, 14, i === 2 ? '#222' : '#1e1e1e');
          txt(i === 0 ? 'printer veins' : i === 1 ? 'cloudflare follow-up' : i === 2 ? 'office-core decor seed' : i === 3 ? 'badge mount candidates' : 'experiment charts pending', rightX + 20, yy + 11, i === 2 ? '#b88a41' : '#cfcfc9', itemFont);
        }

        baseInnerY = baseY + 24;
        leftBayX = caseX + 32;
        rect(leftBayX, baseInnerY, 150, 126, '#161616');
        txt('PATCH PANEL', leftBayX + 16, baseInnerY + 20, '#f1f1ec');
        for (let i = 0; i < 4; i++) {
          rect(leftBayX + 18, baseInnerY + 36 + i * 20, 78, 8, '#cfcfca');
          rect(leftBayX + 104, baseInnerY + 36 + i * 20, 28, 8, i === 1 ? '#b88a41' : '#8b8b84');
        }

        centerBayX = leftBayX + 176;
        keyboardW = Math.round(caseW * 0.34);
        rect(centerBayX, baseInnerY, keyboardW, 126, '#161616');
        txt('SERVICE KEYBOARD', centerBayX + 14, baseInnerY + 20, '#f1f1ec');
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 10; c++) {
            rect(centerBayX + 16 + c * 24 + (r % 2 ? 8 : 0), baseInnerY + 34 + r * 20, 18, 12, (r === 1 && c === 6) ? '#b88a41' : '#d9d9d3');
          }
        }

        rightBayX = centerBayX + keyboardW + 22;
        rightBayW = caseX + caseW - 32 - rightBayX;
        rect(rightBayX, baseInnerY, rightBayW, 126, '#161616');
        txt('RECEIPT / DOCK / TOOLS', rightBayX + 14, baseInnerY + 20, '#f1f1ec');
        rect(rightBayX + 16, baseInnerY + 34, rightBayW - 32, 20, '#ededea');
        txt('AUTHORIZED PATH CONFIRMED', rightBayX + 24, baseInnerY + 48, '#080808', itemFont);
        rect(rightBayX + 16, baseInnerY + 68, 50, 38, '#ecece6');
        rect(rightBayX + 78, baseInnerY + 68, 50, 38, '#ecece6');
        rect(rightBayX + 140, baseInnerY + 68, rightBayW - 156, 38, '#ecece6');
        rect(rightBayX + 148, baseInnerY + 76, rightBayW - 172, 22, '#0a0a0a');

        cables = [
          [{x:leftBayX+132,y:baseInnerY+54},{x:leftBayX+156,y:baseInnerY+54},{x:centerBayX-8,y:baseInnerY+54},{x:centerBayX-8,y:crtY+crtH-18},{x:crtX+crtW-44,y:crtY+crtH-18}],
          [{x:centerBayX+keyboardW-16,y:baseInnerY+106},{x:centerBayX+keyboardW+8,y:baseInnerY+106},{x:rightBayX+10,y:baseInnerY+106},{x:rightBayX+10,y:crtY+86},{x:rightX+14,y:crtY+86}],
          [{x:rightBayX+44,y:baseInnerY+88},{x:rightBayX+44,y:baseInnerY+124},{x:rightBayX+44,y:baseY+150},{x:caseX+caseW-56,y:baseY+150}]
        ];
      }

      drawCable(cables[0], (t * 0.06) % (cables[0].length - 1), false);
      drawCable(cables[1], (t * 0.08) % (cables[1].length - 1), true);
      drawCable(cables[2], (t * 0.05) % (cables[2].length - 1), false);

      rect(caseX + 18, caseY + caseH + 18, caseW - 36, 8, '#0b0b0b');
      for (let i = 0; i < 60; i++) {
        const dx = (i * 97 + t * (i % 3 + 1)) % w;
        const dy = (i * 43 + Math.sin((t + i) * 0.01) * 20) % deskY;
        rect(dx, dy, 1 + (i % 3 === 0), 1 + (i % 4 === 0), i % 17 === 0 ? '#3a3327' : '#2a2a2a');
      }

      requestAnimationFrame(scene);
    }

    window.addEventListener('resize', resize);
    scene();
  </script>
</body>
</html>
