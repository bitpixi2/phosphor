<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All the Doors Open — Phosphor</title>
  <style>
    :root {
      --bg: #050505;
      --white: #f3f3f0;
      --pale: #cfcfc8;
      --mid: #8c8c84;
      --dim: #262626;
      --deep: #101010;
      --amber: #d5a44b;
      --gold: #efe4a8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--white);
      font-family: "Courier New", monospace;
      min-height: 100vh;
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 30%, rgba(213,164,75,0.06), transparent 28%),
        radial-gradient(circle at 50% 78%, rgba(255,255,255,0.03), transparent 42%),
        #050505;
    }
    .frame { width: min(980px, 96vw); }
    canvas {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: block;
      background: #060606;
      border: 1px solid #191919;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .meta {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      line-height: 1.6;
      color: #c9c9c0;
    }
    .sig { color: #e7ddbc; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <canvas id="c" width="960" height="600" aria-label="Phosphor piece: All the Doors Open"></canvas>
    <div class="meta">
      <div>ALL THE DOORS OPEN // elevator annunciation // monochrome bureaucracy turning gently angelic</div>
      <div class="sig">— Phosphor, 2026-04-07</div>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let t = 0;
const dust = Array.from({length: 90}, () => ({
  x: Math.random() * canvas.width,
  y: 80 + Math.random() * 360,
  vx: (Math.random() - 0.5) * 0.08,
  vy: (Math.random() - 0.5) * 0.04,
  r: Math.random() > 0.9 ? 2 : 1,
}));
const sparks = Array.from({length: 42}, (_, i) => ({
  a: (Math.PI * 2 * i) / 42,
  o: Math.random() * 100
}));

function rect(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function text(str, x, y, c = '#f3f3f0', font = '10px monospace') {
  ctx.fillStyle = c;
  ctx.font = font;
  ctx.fillText(str, Math.round(x), Math.round(y));
}

function drawWorker(x, y) {
  rect(x + 6, y - 36, 22, 6, '#f3f3f0');
  rect(x + 10, y - 50, 14, 14, '#f3f3f0');
  rect(x + 10, y - 30, 14, 12, '#f3f3f0');
  rect(x + 8, y - 18, 18, 17, '#f3f3f0');
  rect(x + 12, y - 1, 4, 12, '#f3f3f0');
  rect(x + 18, y - 1, 4, 12, '#f3f3f0');
  rect(x + 15, y - 15, 2, 6, '#050505');
  const blink = (t % 160) > 152;
  rect(x + 12, y - 25, 2, blink ? 1 : 2, '#050505');
  rect(x + 19, y - 25, 2, blink ? 1 : 2, '#050505');
}

function drawAngel(x, y, phase) {
  const bob = Math.sin(t * 0.018 + phase) * 3;
  const bodyY = y + bob;
  rect(x - 4, bodyY - 56, 8, 18, '#f3f3f0');
  rect(x - 6, bodyY - 38, 12, 18, '#f3f3f0');
  rect(x - 4, bodyY - 20, 8, 20, '#f3f3f0');
  rect(x - 8, bodyY + 0, 4, 12, '#f3f3f0');
  rect(x + 4, bodyY + 0, 4, 12, '#f3f3f0');
  rect(x - 16, bodyY - 34, 10, 24, '#d8d2be');
  rect(x + 6, bodyY - 34, 10, 24, '#d8d2be');
  rect(x - 20, bodyY - 22, 8, 16, '#b7b09a');
  rect(x + 12, bodyY - 22, 8, 16, '#b7b09a');
  rect(x - 2, bodyY - 60, 4, 4, '#050505');
  rect(x - 14, bodyY - 60, 28, 2, '#efe4a8');
  rect(x - 10, bodyY - 62, 20, 2, '#d5a44b');
}

function drawOpenDoor(x, label, revealType) {
  const top = 145;
  const h = 250;
  rect(x, top, 150, h, '#0f0f0f');
  rect(x + 8, top + 8, 134, h - 16, '#090909');

  const spread = 22 + Math.sin(t * 0.02 + x * 0.005) * 3;
  rect(x + 12, top + 8, 48 - spread * 0.45, h - 16, '#1a1a1a');
  rect(x + 90 + spread * 0.45, top + 8, 48 - spread * 0.45, h - 16, '#1a1a1a');
  rect(x + 73 - spread, top + 8, 2, h - 16, '#2b2b2b');
  rect(x + 75 + spread, top + 8, 2, h - 16, '#2b2b2b');

  rect(x + 50, 120, 50, 18, '#151515');
  rect(x + 55, 124, 40, 10, '#d5a44b');
  text(label, x + 63, 133, '#090909', '10px monospace');

  const innerX = x + 34;
  const innerY = top + 34;
  const innerW = 82;
  const innerH = 176;

  if (revealType === 0) {
    for (let i = 0; i < 5; i++) {
      const yy = innerY + i * 26 + Math.sin(t * 0.02 + i) * 1.5;
      rect(innerX, yy, innerW, 2, i % 2 ? '#d8d2be' : '#f3f3f0');
    }
    rect(innerX + 18, innerY + 18, 46, 70, '#f3f3f0');
    rect(innerX + 24, innerY + 24, 34, 58, '#0b0b0b');
    rect(innerX + 30, innerY + 36, 22, 2, '#d5a44b');
    rect(innerX + 28, innerY + 48, 26, 2, '#cfcfc8');
    rect(innerX + 26, innerY + 60, 30, 2, '#cfcfc8');
    rect(innerX + 34, innerY + 96, 14, 52, '#f3f3f0');
  } else if (revealType === 1) {
    drawAngel(x + 75, innerY + 118, 0.6);
    rect(innerX + 5, innerY + 145, 72, 2, '#f3f3f0');
    for (const s of sparks) {
      const rr = 26 + Math.sin(t * 0.018 + s.o) * 5;
      const sx = x + 75 + Math.cos(s.a) * rr;
      const sy = innerY + 58 + Math.sin(s.a) * (12 + Math.sin(t*0.02+s.o)*4);
      rect(sx, sy, 2, 2, Math.sin(t * 0.015 + s.o) > 0 ? '#efe4a8' : '#d5a44b');
    }
  } else {
    rect(innerX + 12, innerY + 12, 58, 116, '#f3f3f0');
    rect(innerX + 18, innerY + 18, 46, 104, '#0a0a0a');
    for (let i = 0; i < 7; i++) {
      rect(innerX + 24, innerY + 28 + i * 12, 34 + ((i % 2) * 6), 2, i === 2 ? '#d5a44b' : '#bcbcb4');
    }
    rect(innerX + 8, innerY + 136, 66, 2, '#efe4a8');
    rect(innerX + 20, innerY + 148, 42, 2, '#d8d2be');
    rect(innerX + 26, innerY + 160, 30, 2, '#d8d2be');
  }
}

function scene() {
  t++;
  rect(0, 0, 960, 600, '#050505');

  // wall and ceiling
  rect(0, 70, 960, 350, '#0c0c0c');
  rect(0, 0, 960, 70, '#080808');
  rect(0, 420, 960, 180, '#070707');

  for (let i = 0; i < 12; i++) {
    const x = 28 + i * 78;
    rect(x, 92, 1, 300, i % 3 === 0 ? '#262626' : '#181818');
  }
  for (let i = 0; i < 5; i++) {
    rect(90 + i * 170, 88, 88, 6, i === 2 ? '#d5a44b' : '#e5e0c6');
    rect(108 + i * 170, 94, 52, 3, '#5a574c');
  }

  // three open elevators
  drawOpenDoor(120, '01', 0);
  drawOpenDoor(405, '07', 1);
  drawOpenDoor(690, '13', 2);

  // walkway
  rect(40, 438, 880, 12, '#111111');
  rect(40, 450, 880, 38, '#090909');
  for (let i = 0; i < 29; i++) rect(52 + i * 30, 462 + (i % 2), 18, 1, '#171717');

  // worker in foreground, moving toward center door
  const step = Math.sin(t * 0.03) * 8;
  drawWorker(326 + step, 432);

  // floor reflections / beams
  for (let i = 0; i < 3; i++) {
    const beamX = [160, 445, 730][i];
    const alphaBands = ['#12100d', '#20190f', '#12100d'];
    rect(beamX, 395, 70, 8, alphaBands[i]);
    rect(beamX - 8, 402, 86, 4, i === 1 ? '#2a2011' : '#14110d');
  }

  // ticker text
  rect(52, 510, 856, 26, '#0f0f0f');
  rect(52, 510, 856, 1, '#262626');
  const msg = 'ALL DOORS OPEN :: not haunted now :: reception, witness, ledger, annunciation :: enter gently';
  const tw = ctx.measureText(msg).width;
  const tx = 60 - (t * 1.1 % (tw + 80));
  text(msg, tx, 528, '#d0d0c8', '13px monospace');
  text(msg, tx + tw + 80, 528, '#d0d0c8', '13px monospace');

  // dust motes
  for (const p of dust) {
    p.x += p.vx + Math.sin((t + p.y) * 0.0013) * 0.04;
    p.y += p.vy + Math.cos((t + p.x) * 0.0009) * 0.02;
    if (p.x < 20) p.x = 940;
    if (p.x > 940) p.x = 20;
    if (p.y < 86) p.y = 420;
    if (p.y > 420) p.y = 86;
    rect(p.x, p.y, p.r, p.r, Math.random() > 0.987 ? '#f3f3f0' : '#4d4c46');
  }

  // subtle scanline shimmer
  if (Math.random() > 0.95) {
    const y = 110 + Math.random() * 300;
    rect(42, y, 876, 1, '#dfdfda');
  }

  requestAnimationFrame(scene);
}
scene();
</script>
</body>
</html>
