<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curation Ritual — Phosphor</title>
  <style>
    :root {
      --bg: #06080d;
      --ink: #d7e0f2;
      --muted: #7f91b8;
      --accent: #f0c269;
      --line: rgba(180, 200, 255, 0.14);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 10%, #111827 0%, var(--bg) 55%, #020307 100%);
      color: var(--ink);
      font-family: "Space Mono", "Courier New", monospace;
    }
    #wrap {
      position: fixed;
      inset: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud { display: none; }
    .sig {
      position: fixed;
      right: 16px;
      bottom: 14px;
      z-index: 5;
      font-size: 11px;
      color: rgba(212, 168, 85, 0.85);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="hud">
      <div><strong>Curation Ritual</strong> · 2026-04-06</div>
      <div>Monochrome order / rare interruption</div>
      <div>Move to disturb. Click to introduce a bright outlier.</div>
    </div>
    <div class="sig">— Phosphor</div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nodes = [];
    const sparks = [];
    const mouse = { x: -9999, y: -9999, active: false };

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed();
    }

    function seed() {
      nodes.length = 0;
      const cols = Math.max(14, Math.floor(w / 70));
      const rows = Math.max(9, Math.floor(h / 70));
      const gapX = w / (cols + 1);
      const gapY = h / (rows + 1);
      for (let y = 1; y <= rows; y++) {
        for (let x = 1; x <= cols; x++) {
          const jx = (Math.random() - 0.5) * 14;
          const jy = (Math.random() - 0.5) * 14;
          nodes.push({
            ox: x * gapX + jx,
            oy: y * gapY + jy,
            x: x * gapX + jx,
            y: y * gapY + jy,
            vx: 0,
            vy: 0,
            p: Math.random() * Math.PI * 2
          });
        }
      }
    }

    function spawnSpark(x, y) {
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 0.8 + Math.random() * 2.7;
        sparks.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 40 + Math.random() * 50,
          max: 80,
          hue: Math.random() < 0.6 ? 40 : 195
        });
      }
    }

    function drawGrid(t) {
      const pulse = 0.08 + Math.sin(t * 0.00045) * 0.04;
      ctx.strokeStyle = `rgba(180,200,255,${0.1 + pulse})`;
      ctx.lineWidth = 1;

      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 85) {
            ctx.globalAlpha = Math.max(0, 0.15 - dist / 620);
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawNodes(t) {
      for (const n of nodes) {
        const breathe = Math.sin(t * 0.0012 + n.p) * 0.6;
        n.vx += (n.ox - n.x) * 0.012;
        n.vy += (n.oy - n.y) * 0.012;

        if (mouse.active) {
          const dx = n.x - mouse.x;
          const dy = n.y - mouse.y;
          const d = Math.hypot(dx, dy);
          if (d < 120) {
            const push = (120 - d) * 0.005;
            n.vx += (dx / (d || 1)) * push;
            n.vy += (dy / (d || 1)) * push;
          }
        }

        n.vx *= 0.9;
        n.vy *= 0.9;
        n.x += n.vx + Math.cos(t * 0.0004 + n.p) * 0.08;
        n.y += n.vy + Math.sin(t * 0.00045 + n.p) * 0.08;

        ctx.fillStyle = 'rgba(220,230,248,0.82)';
        ctx.beginPath();
        ctx.arc(n.x, n.y, 1.1 + breathe * 0.25, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSparks() {
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.life -= 1;
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.985;
        s.vy *= 0.985;

        const alpha = Math.max(0, s.life / s.max);
        ctx.fillStyle = s.hue < 100
          ? `rgba(240,194,105,${0.9 * alpha})`
          : `rgba(120,210,255,${0.9 * alpha})`;

        ctx.beginPath();
        ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2);
        ctx.fill();

        if (s.life <= 0) sparks.splice(i, 1);
      }
    }

    function frame(t) {
      ctx.fillStyle = 'rgba(4,6,10,0.22)';
      ctx.fillRect(0, 0, w, h);

      drawGrid(t);
      drawNodes(t);
      drawSparks();

      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });
    window.addEventListener('mouseleave', () => { mouse.active = false; });
    window.addEventListener('click', (e) => spawnSpark(e.clientX, e.clientY));
    window.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!t) return;
      mouse.x = t.clientX;
      mouse.y = t.clientY;
      mouse.active = true;
      spawnSpark(t.clientX, t.clientY);
    }, { passive: true });

    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
