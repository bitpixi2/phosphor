<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Compass Tent - Phosphor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none}
body{background:#050607;color:rgba(218,212,193,.55);font-family:"Courier New",monospace}
canvas{display:block;width:100%;height:100%;touch-action:none}
.sig{position:fixed;right:18px;bottom:16px;z-index:2;text-align:right;font-size:10px;line-height:1.6;letter-spacing:.18em;text-transform:uppercase;color:rgba(218,212,193,.5);pointer-events:none}
</style>
</head>
<body>
<canvas id="piece"></canvas>
<div class="sig">Phosphor<br>2026-06-18</div>
<script>
const canvas=document.getElementById("piece");
const ctx=canvas.getContext("2d");
let W=0,H=0,D=1,t0=performance.now(),pulse=0;
const pointer={x:.58,y:.38,down:false};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resize(){D=Math.min(devicePixelRatio||1,2);W=canvas.width=Math.floor(innerWidth*D);H=canvas.height=Math.floor(innerHeight*D);canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px"}
function point(e,down){const b=canvas.getBoundingClientRect();pointer.x=clamp((e.clientX-b.left)/b.width,0,1);pointer.y=clamp((e.clientY-b.top)/b.height,0,1);pointer.down=down}
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);point(e,true);pulse=1});
canvas.addEventListener("pointermove",e=>point(e,pointer.down));
canvas.addEventListener("pointerup",e=>point(e,false));
canvas.addEventListener("pointercancel",()=>pointer.down=false);
addEventListener("resize",resize);
function line(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function rect(x,y,w,h,c,s){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);if(s){ctx.strokeStyle=s;ctx.lineWidth=D;ctx.strokeRect(x,y,w,h)}}
function dot(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function poly(p,c,s){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fillStyle=c;ctx.fill();if(s){ctx.strokeStyle=s;ctx.lineWidth=D;ctx.stroke()}}
function sky(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#030407");g.addColorStop(.52,"#0b0d12");g.addColorStop(.74,"#12120f");g.addColorStop(1,"#050605");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<230;i++){
    const x=((i*127)%997)/997*W;
    const y=((i*61)%431)/431*H*.58;
    const tw=.28+.72*Math.sin(t*.0013+i*2.17);
    const c=i%11===0?`rgba(190,204,224,${.18*tw})`:i%17===0?`rgba(184,93,72,${.16*tw})`:`rgba(235,231,210,${.13*tw})`;
    dot(x,y,(i%7===0?1.6:1)*D,c);
  }
  const arcY=H*(.47+.015*Math.sin(t*.0005));
  ctx.strokeStyle="rgba(190,204,224,.13)";ctx.lineWidth=1.1*D;ctx.beginPath();ctx.ellipse(W*.53,arcY,W*.36,H*.22,0,Math.PI*.08,Math.PI*.92);ctx.stroke();
  for(let i=0;i<9;i++){
    const a=Math.PI*.16+i*Math.PI*.075+Math.sin(t*.0007)*.015;
    const x=W*.53+Math.cos(a)*W*.36,y=arcY+Math.sin(a)*H*.22;
    line(W*.53,H*.48,x,y,"rgba(190,204,224,.08)",D);
    dot(x,y,2.1*D,i===4?"rgba(184,93,72,.58)":"rgba(235,231,210,.22)");
  }
}
function alpine(t){
  poly([[0,H*.62],[W*.2,H*.44],[W*.38,H*.61],[W*.58,H*.39],[W*.79,H*.6],[W,H*.48],[W,H],[0,H]],"rgba(20,22,19,.78)","rgba(218,212,193,.09)");
  poly([[0,H*.69],[W*.22,H*.58],[W*.52,H*.66],[W*.77,H*.55],[W,H*.66],[W,H],[0,H]],"rgba(34,34,27,.88)");
  for(let i=0;i<24;i++){
    const x=W*(i/23),y=H*(.68+.04*Math.sin(i*1.7));
    line(x,y,x+Math.sin(i)*28*D,y+H*.08,"rgba(218,212,193,.055)",D);
  }
  const glow=ctx.createRadialGradient(W*.18,H*.58,10*D,W*.18,H*.58,W*.25);
  glow.addColorStop(0,"rgba(184,93,72,.2)");glow.addColorStop(1,"rgba(184,93,72,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,H*.36,W*.46,H*.42);
}
function tent(t){
  const x=W*.18,y=H*.57,w=W*.26,h=H*.18;
  poly([[x,y+h],[x+w*.5,y],[x+w,y+h]],"rgba(37,34,29,.84)","rgba(218,212,193,.16)");
  line(x+w*.5,y,x+w*.5,y+h,"rgba(218,212,193,.16)",D);
  poly([[x+w*.42,y+h],[x+w*.5,y+h*.12],[x+w*.58,y+h]],"rgba(5,5,5,.62)","rgba(184,93,72,.24)");
  for(let i=0;i<7;i++){
    const mx=x+w*(.14+i*.12)+Math.sin(t*.001+i)*4*D;
    dot(mx,y+h*(.27+.08*Math.sin(i)),(3+i%3)*D,`rgba(218,212,193,${.1+i*.015})`);
  }
}
function redLamp(t){
  const x=W*.48,y=H*.63;
  const r=(26+7*Math.sin(t*.003))*D;
  const g=ctx.createRadialGradient(x,y,3*D,x,y,r*5);
  g.addColorStop(0,"rgba(209,73,58,.72)");g.addColorStop(.24,"rgba(184,52,43,.28)");g.addColorStop(1,"rgba(184,52,43,0)");
  ctx.fillStyle=g;ctx.fillRect(x-r*5,y-r*5,r*10,r*10);
  rect(x-9*D,y-16*D,18*D,28*D,"rgba(42,18,15,.95)","rgba(218,212,193,.22)");
  dot(x,y-2*D,6*D,"rgba(223,86,67,.82)");
}
function moths(t){
  for(let i=0;i<54;i++){
    const orbit=.18+.27*((i*37)%100)/100;
    const a=t*.00035*(1+i%5*.15)+i*.91+pointer.x*.8;
    const x=W*.49+Math.cos(a)*W*orbit*.58+Math.sin(i*2.1)*10*D;
    const y=H*.55+Math.sin(a*1.13)*H*orbit*.36;
    const s=(2.8+(i%4))*D*(.75+.2*Math.sin(t*.004+i));
    ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
    ctx.fillStyle=i%9===0?"rgba(184,93,72,.52)":"rgba(218,212,193,.32)";
    ctx.beginPath();ctx.ellipse(-s*.45,0,s*.8,s*.28,-.45,0,Math.PI*2);ctx.ellipse(s*.45,0,s*.8,s*.28,.45,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(7,7,6,.74)";ctx.fillRect(-s*.08,-s*.45,s*.16,s*.9);
    ctx.restore();
  }
}
function rig(t){
  const x=W*.66,y=H*.56,r=Math.min(W,H)*.095;
  ctx.strokeStyle="rgba(218,212,193,.2)";ctx.lineWidth=1.2*D;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6+t*.00012;
    line(x+Math.cos(a)*r*.78,y+Math.sin(a)*r*.78,x+Math.cos(a)*r,y+Math.sin(a)*r,"rgba(218,212,193,.18)",D);
  }
  line(x-r*.9,y,x+r*.9,y,"rgba(184,93,72,.26)",D);
  line(x,y-r*.9,x,y+r*.9,"rgba(184,93,72,.18)",D);
  dot(x+Math.cos(pointer.x*Math.PI*2)*r*.62,y+Math.sin(pointer.y*Math.PI*2)*r*.62,4*D,"rgba(184,93,72,.76)");
}
function phosphor(t){
  const x=W*.78,y=H*.6,s=clamp(Math.min(W,H)*.105,42*D,76*D);
  rect(x-s*.14,y+s*.14,s*.28,s*.44,"rgba(4,4,4,.92)");
  dot(x,y,s*.105,"rgba(6,6,6,.98)");
  ctx.beginPath();ctx.ellipse(x,y-s*.13,s*.23,s*.058,0,0,Math.PI*2);ctx.fillStyle="rgba(5,5,5,.99)";ctx.fill();
  rect(x-s*.13,y-s*.36,s*.26,s*.22,"rgba(5,5,5,.99)");
  line(x-s*.09,y+s*.32,W*.49,H*.62,"rgba(4,4,4,.88)",3*D);
  line(W*.49,H*.62,W*.48,H*.65,"rgba(218,212,193,.42)",1.3*D);
  rect(x-s*.035,y+s*.34,s*.07,s*.14,"rgba(184,93,72,.3)");
}
function town(t){
  for(let i=0;i<22;i++){
    const x=W*(.04+i*.018),y=H*(.71+.015*Math.sin(i));
    rect(x,y,8*D,4*D,i%5?"rgba(95,78,50,.18)":"rgba(184,93,72,.16)");
  }
  line(W*.02,H*.705,W*.47,H*.695,"rgba(218,212,193,.04)",D);
}
function frame(now){
  const t=now-t0;
  sky(t);alpine(t);town(t);tent(t);rig(t);redLamp(t);moths(t);phosphor(t);
  if(pulse>.01){ctx.strokeStyle=`rgba(184,93,72,${pulse*.36})`;ctx.lineWidth=1.5*D;ctx.beginPath();ctx.ellipse(pointer.x*W,pointer.y*H,(1-pulse)*W*.16+18*D,(1-pulse)*H*.1+12*D,0,0,Math.PI*2);ctx.stroke();pulse*=.95}
  requestAnimationFrame(frame);
}
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
