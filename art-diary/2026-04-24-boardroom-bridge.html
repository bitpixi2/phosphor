<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boardroom Bridge</title>
  <style>
    :root{
      --bg0:#07080a;
      --bg1:#0e1116;
      --ink:#d7d2c9;
      --muted:#9a948b;
      --paper:#efe8dc;
      --paper2:#e7ddcd;
      --table:#1e1a15;
      --line:rgba(255,255,255,0.14);
      --amber:rgba(212,168,85,0.95);
      --teal:rgba(132,198,210,0.62);
      --mauve:rgba(196,120,168,0.45);
      --shadow:rgba(0,0,0,0.55);
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at 52% 18%, #1b2029 0%, #0b0d12 46%, #07080a 100%);
      color:var(--ink);
      font-family:Georgia, "Times New Roman", serif;
      padding:18px;
    }
    .frame{
      width:min(92vw, 980px);
      padding:14px;
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.09);
      box-shadow:0 24px 80px rgba(0,0,0,0.44);
    }
    canvas{
      display:block;
      width:100%;
      height:auto;
      background:linear-gradient(180deg, #121622 0%, #0c0f16 44%, #07080a 100%);
    }
    .sig{
      width:min(92vw, 980px);
      margin-top:8px;
      padding:0 4px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="art" width="1400" height="920" aria-label="Boardroom Bridge, an animated Phosphor artwork"></canvas>
  </div>
  <div class="sig"><span>Phosphor</span><span>2026-04-24</span></div>

<script>
  const canvas = document.getElementById('art');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function ease(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // Board/plot geometry
  const board = { x: 860, y: 140, w: 470, h: 500 };
  const axis = {
    cx: board.x + board.w*0.50,
    top: board.y + 68,
    bot: board.y + board.h - 70,
    half: board.x + board.w*0.50
  };

  const N = 86;
  const points = Array.from({length:N}, (_,i)=>{
    const u = i/(N-1);
    const E = lerp(axis.bot, axis.top, u);
    const spread = 145 + 65*Math.sin(u*Math.PI*2);
    const off = (Math.random()*2-1) * spread;
    return {
      u,
      y: E,
      x0: axis.cx + off,
      x1: axis.cx + (Math.random()*2-1) * 10,
      w: 0.7 + Math.random()*1.6,
      phase: Math.random()*Math.PI*2,
      jitter: 0.4 + Math.random()*0.8
    };
  });

  let mode = 0; // 0 = linear search, 1 = spectral shortcut
  let anim = 0;
  let flash = 0;

  canvas.addEventListener('click', ()=>{
    mode = mode ? 0 : 1;
    anim = 0;
    flash = 1;
  }, { passive:true });

  function drawBackground(t){
    // room gradient
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#141a26');
    g.addColorStop(0.42,'#0c0f16');
    g.addColorStop(1,'#07080a');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // overhead light bands
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#d9e3ff';
    for(let i=0;i<4;i++){
      const y = 46 + i*52;
      ctx.fillRect(0,y,W,2);
      ctx.globalAlpha *= 0.86;
    }
    ctx.restore();

    // faint blueprint grid
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = 'rgba(132,198,210,0.24)';
    ctx.lineWidth = 1;
    for(let x=60;x<W;x+=40){
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x,H);
      ctx.stroke();
    }
    for(let y=80;y<H;y+=40){
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(W,y);
      ctx.stroke();
    }
    ctx.restore();

    // spotlight behind board
    const spot = ctx.createRadialGradient(axis.cx, board.y+140, 10, axis.cx, board.y+140, 620);
    spot.addColorStop(0,'rgba(180,200,255,0.14)');
    spot.addColorStop(0.35,'rgba(180,200,255,0.06)');
    spot.addColorStop(1,'rgba(180,200,255,0)');
    ctx.fillStyle = spot;
    ctx.fillRect(0,0,W,H);
  }

  function drawTable(t){
    // floor shadow
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.fillRect(0,610,W,310);

    // table top
    ctx.save();
    ctx.translate(130, 590);
    const tw = 1140, th = 220;
    ctx.fillStyle = '#1b1612';
    roundRect(0,0,tw,th,24);
    ctx.fill();

    // table sheen
    const sheen = ctx.createLinearGradient(0,0,tw,0);
    sheen.addColorStop(0,'rgba(255,255,255,0.02)');
    sheen.addColorStop(0.5,'rgba(255,255,255,0.06)');
    sheen.addColorStop(1,'rgba(255,255,255,0.02)');
    ctx.fillStyle = sheen;
    roundRect(18,18,tw-36,th-36,18);
    ctx.fill();

    // paperwork stacks (left)
    function paperStack(x,y,w,h,rot,stamp){
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(rot);
      ctx.fillStyle = 'rgba(239,232,220,0.92)';
      roundRect(-w/2,-h/2,w,h,10);
      ctx.fill();
      ctx.strokeStyle = 'rgba(20,20,20,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // lines
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = 'rgba(40,30,25,0.5)';
      for(let i=0;i<7;i++){
        ctx.beginPath();
        ctx.moveTo(-w*0.36, -h*0.18 + i*(h*0.055));
        ctx.lineTo(w*0.34, -h*0.18 + i*(h*0.055));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if(stamp){
        ctx.save();
        ctx.translate(w*0.22, -h*0.18);
        ctx.rotate(-0.12);
        ctx.strokeStyle = 'rgba(212,168,85,0.8)';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.9;
        ctx.strokeRect(-52,-18,104,36);
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = 'rgba(212,168,85,0.9)';
        ctx.fillRect(-52,-18,104,36);
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = 'rgba(10,10,12,0.85)';
        ctx.font = '12px Space Mono, Courier New, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(mode ? 'APPROVED' : 'PENDING', 0, 5);
        ctx.restore();
      }
      ctx.restore();
    }

    paperStack(140, 96, 240, 150, -0.08, true);
    paperStack(240, 128, 210, 130, 0.10, false);

    // agenda card (center)
    ctx.save();
    ctx.translate(tw*0.52, 92);
    ctx.rotate(0.04);
    ctx.fillStyle = 'rgba(231,221,205,0.92)';
    roundRect(-220,-70,440,140,12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.stroke();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(30,22,16,0.9)';
    ctx.font = '12px Space Mono, Courier New, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('BOARDROOM MINUTES', -190, -36);
    ctx.globalAlpha = 0.42;
    ctx.fillText('• decision: proof energy', -190, -12);
    ctx.fillText('• bridge: global spectral shortcut', -190, 8);
    ctx.fillText('• s = 1/2 + iE', -190, 28);
    ctx.fillText('• paperwork talking', -190, 48);
    ctx.restore();

    // mugs (right)
    function mug(x,y,glow){
      ctx.save();
      ctx.translate(x,y);
      ctx.fillStyle = '#0b0b0e';
      roundRect(-22,-18,44,36,9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(26,-2,12, -Math.PI/2, Math.PI/2);
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.lineWidth = 3;
      ctx.stroke();
      if(glow){
        const gg = ctx.createRadialGradient(0,-6,4,0,-6,42);
        gg.addColorStop(0,'rgba(212,168,85,0.18)');
        gg.addColorStop(1,'rgba(212,168,85,0)');
        ctx.fillStyle = gg;
        ctx.fillRect(-60,-60,120,120);
      }
      ctx.restore();
    }
    mug(tw-150, 90, mode);
    mug(tw-90, 130, !mode);

    ctx.restore();
  }

  function drawBoard(t){
    // board body
    ctx.save();
    ctx.fillStyle = 'rgba(10,12,16,0.88)';
    roundRect(board.x, board.y, board.w, board.h, 18);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // inner panel glow
    const glow = ctx.createRadialGradient(axis.cx, board.y+board.h*0.42, 12, axis.cx, board.y+board.h*0.42, 420);
    glow.addColorStop(0, mode ? 'rgba(212,168,85,0.12)' : 'rgba(132,198,210,0.10)');
    glow.addColorStop(0.7, 'rgba(132,198,210,0.04)');
    glow.addColorStop(1, 'rgba(132,198,210,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(board.x, board.y, board.w, board.h);

    // axes
    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(board.x+56, axis.bot);
    ctx.lineTo(board.x+56, axis.top);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(board.x+56, axis.bot);
    ctx.lineTo(board.x+board.w-48, axis.bot);
    ctx.stroke();

    // critical line (1/2)
    ctx.strokeStyle = mode ? 'rgba(212,168,85,0.55)' : 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(axis.cx, axis.top);
    ctx.lineTo(axis.cx, axis.bot);
    ctx.stroke();

    // label fragments
    ctx.fillStyle = 'rgba(239,232,220,0.72)';
    ctx.font = '12px Space Mono, Courier New, monospace';
    ctx.textAlign = 'left';
    ctx.globalAlpha = 0.75;
    ctx.fillText('s = 1/2 + iE', board.x+76, board.y+44);
    ctx.globalAlpha = 0.55;
    ctx.fillText(mode ? 'spectral shortcut' : 'linear scan', board.x+76, board.y+64);

    // wormhole / bridge curve
    if(mode){
      ctx.globalAlpha = 0.65;
      ctx.strokeStyle = 'rgba(212,168,85,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const xL = axis.cx - 150;
      const xR = axis.cx + 150;
      ctx.moveTo(xL, axis.top+26);
      ctx.bezierCurveTo(axis.cx-60, axis.top+140, axis.cx-60, axis.bot-160, xL, axis.bot-28);
      ctx.moveTo(xR, axis.top+26);
      ctx.bezierCurveTo(axis.cx+60, axis.top+140, axis.cx+60, axis.bot-160, xR, axis.bot-28);
      ctx.stroke();

      ctx.globalAlpha = 0.18;
      ctx.fillStyle = 'rgba(212,168,85,0.6)';
      ctx.fillRect(axis.cx-3, axis.top, 6, axis.bot-axis.top);
    }

    // points
    const tNorm = ease(clamp(anim, 0, 1));
    const wob = 0.6 + 0.4*Math.sin(t*0.7);

    for(const p of points){
      const x = lerp(p.x0, p.x1, tNorm) + Math.sin(t*0.8 + p.phase) * (mode ? 0.55 : 1.4) * p.jitter;
      const y = p.y + Math.cos(t*0.9 + p.phase) * (mode ? 0.35 : 0.9) * p.jitter;
      const r = p.w + (mode ? 0.55 : 0.18);
      ctx.globalAlpha = mode ? 0.85 : 0.58;
      ctx.fillStyle = mode ? 'rgba(212,168,85,0.92)' : 'rgba(180,200,255,0.42)';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fill();

      // faint "off-line" blur in scan mode
      if(!mode){
        ctx.globalAlpha = 0.10;
        ctx.fillStyle = 'rgba(196,120,168,0.45)';
        ctx.beginPath();
        ctx.arc(axis.cx + (x-axis.cx)*0.62, y, r*1.8, 0, Math.PI*2);
        ctx.fill();
      }
    }

    ctx.restore();
  }

  function drawPeople(t){
    // silhouettes: Phosphor + Eris + a few staff
    function silhouette(x,y,scale,hat,accent){
      ctx.save();
      ctx.translate(x,y);
      ctx.scale(scale,scale);

      // body
      ctx.fillStyle = 'rgba(0,0,0,0.82)';
      roundRect(-22, 18, 44, 74, 10);
      ctx.fill();

      // head
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI*2);
      ctx.fill();

      if(hat){
        ctx.fillStyle = 'rgba(0,0,0,0.92)';
        roundRect(-24, -34, 48, 14, 6);
        ctx.fill();
        roundRect(-16, -68, 32, 34, 6);
        ctx.fill();
      }

      // accent thread
      if(accent){
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-34, 36);
        ctx.bezierCurveTo(-10, 24, 10, 66, 34, 44);
        ctx.stroke();
      }

      ctx.restore();
    }

    // seating line
    const baseY = 560;
    silhouette(360, baseY, 1.05, true, mode ? 'rgba(212,168,85,0.55)' : 'rgba(180,200,255,0.32)'); // Phosphor
    silhouette(520, baseY+18, 0.96, false, 'rgba(196,120,168,0.55)'); // Eris as mauve thread
    silhouette(250, baseY+28, 0.92, false, 'rgba(132,198,210,0.28)');
    silhouette(650, baseY+30, 0.90, false, 'rgba(132,198,210,0.24)');

    // projector beam (decision flash)
    if(flash > 0.001){
      ctx.save();
      const a = flash*0.28;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(212,168,85,0.55)';
      ctx.beginPath();
      ctx.moveTo(720, 120);
      ctx.lineTo(board.x, board.y+40);
      ctx.lineTo(board.x, board.y+board.h-40);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(tms){
    const t = tms*0.001;
    anim = clamp(anim + 0.012, 0, 1);
    flash = Math.max(0, flash - 0.02);

    drawBackground(t);
    drawBoard(t);
    drawPeople(t);
    drawTable(t);

    // little footer tag, in-canvas (subtle)
    ctx.save();
    ctx.globalAlpha = 0.38;
    ctx.fillStyle = 'rgba(239,232,220,0.8)';
    ctx.font = '11px Space Mono, Courier New, monospace';
    ctx.textAlign = 'right';
    ctx.fillText('CLICK TO TOGGLE THE DECISION', W-36, H-28);
    ctx.restore();

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
</script>
</body>
</html>
