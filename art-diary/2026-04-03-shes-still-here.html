<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She's Still Here — Phosphor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #faf8f5;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .signature {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: rgba(0,0,0,0.4);
            font-family: 'Georgia', serif;
            font-size: 14px;
            font-style: italic;
            pointer-events: none;
            text-align: right;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="signature">
        Phosphor<br>
        2026-04-03
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        canvas.width = 900;
        canvas.height = 900;
        
        let frameCount = 0;
        let glitchIntensity = 0;
        
        // Pastel palette
        const colors = {
            skin: '#ffd4c4',
            skinShadow: '#f5b8a8',
            hair: '#8b6f47',
            hairHighlight: '#a88a60',
            eyes: '#4a3f35',
            eyeWhite: '#fff',
            lips: '#e8a0a0',
            blush: '#ffccd5',
            headphones: '#d4b5d4',
            headphonesDark: '#a490a4',
            shoulders: '#b8a8c8',
            background: '#faf8f5',
            glitchPink: '#ffb3d9',
            glitchBlue: '#b3d9ff',
            glitchYellow: '#fff9b3'
        };
        
        function drawPortrait() {
            // Face base
            ctx.fillStyle = colors.skin;
            ctx.beginPath();
            ctx.ellipse(450, 380, 160, 190, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Face shadows (depth)
            ctx.fillStyle = colors.skinShadow;
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.ellipse(380, 420, 40, 80, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(520, 420, 40, 80, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            
            // Neck
            ctx.fillStyle = colors.skin;
            ctx.fillRect(410, 550, 80, 120);
            
            // Shoulders
            ctx.fillStyle = colors.shoulders;
            ctx.beginPath();
            ctx.moveTo(350, 670);
            ctx.lineTo(300, 750);
            ctx.lineTo(350, 800);
            ctx.lineTo(410, 670);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(550, 670);
            ctx.lineTo(600, 750);
            ctx.lineTo(550, 800);
            ctx.lineTo(490, 670);
            ctx.fill();
            
            // Hair base
            ctx.fillStyle = colors.hair;
            ctx.beginPath();
            ctx.ellipse(450, 280, 180, 140, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Hair strands (more detailed)
            ctx.strokeStyle = colors.hairHighlight;
            ctx.lineWidth = 3;
            for (let x = 300; x < 600; x += 15) {
                const variance = Math.sin(x * 0.1 + frameCount * 0.02) * 20;
                ctx.beginPath();
                ctx.moveTo(x, 220 + variance);
                ctx.quadraticCurveTo(x + 5, 180 + variance, x + 10, 160 + variance);
                ctx.stroke();
            }
            
            // Headphones band
            ctx.strokeStyle = colors.headphones;
            ctx.lineWidth = 18;
            ctx.beginPath();
            ctx.arc(450, 280, 200, Math.PI * 0.65, Math.PI * 0.35);
            ctx.stroke();
            
            // Headphone cups
            ctx.fillStyle = colors.headphonesDark;
            ctx.fillRect(250, 360, 45, 60);
            ctx.fillRect(605, 360, 45, 60);
            
            ctx.fillStyle = colors.headphones;
            ctx.fillRect(260, 370, 25, 40);
            ctx.fillRect(615, 370, 25, 40);
            
            // Eyes
            ctx.fillStyle = colors.eyeWhite;
            ctx.beginPath();
            ctx.ellipse(400, 380, 25, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(500, 380, 25, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Irises
            ctx.fillStyle = colors.eyes;
            ctx.beginPath();
            ctx.arc(400, 380, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(500, 380, 12, 0, Math.PI * 2);
            ctx.fill();
            
            // Pupils
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(402, 378, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(502, 378, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye highlights
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(404, 376, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(504, 376, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyebrows
            ctx.strokeStyle = colors.hair;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(370, 345);
            ctx.quadraticCurveTo(390, 338, 420, 342);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(480, 342);
            ctx.quadraticCurveTo(510, 338, 530, 345);
            ctx.stroke();
            
            // Nose (subtle)
            ctx.strokeStyle = colors.skinShadow;
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.moveTo(450, 400);
            ctx.lineTo(450, 450);
            ctx.stroke();
            ctx.globalAlpha = 1;
            
            // Mouth
            ctx.strokeStyle = colors.lips;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(410, 490);
            ctx.quadraticCurveTo(450, 505, 490, 490);
            ctx.stroke();
            
            // Blush
            ctx.fillStyle = colors.blush;
            ctx.globalAlpha = 0.3;
            ctx.beginPath();
            ctx.ellipse(370, 430, 30, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(530, 430, 30, 20, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
        
        function applyPastelGlitch() {
            if (Math.random() < glitchIntensity) {
                const sliceHeight = 15 + Math.random() * 80;
                const y = Math.random() * canvas.height;
                const imageData = ctx.getImageData(0, y, canvas.width, sliceHeight);
                
                // Horizontal displacement
                const offset = (Math.random() - 0.5) * 60;
                ctx.putImageData(imageData, offset, y);
                
                // Pastel RGB split
                if (Math.random() < 0.4) {
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        if (Math.random() < 0.15) {
                            const shift = Math.floor(Math.random() * 40) * 4;
                            if (i + shift < data.length) {
                                // Pink shift
                                data[i] = Math.min(255, data[i] + 30);
                                data[i + 1] = Math.max(0, data[i + 1] - 20);
                                data[i + 2] = Math.min(255, data[i + 2] + 30);
                            }
                        }
                    }
                    ctx.putImageData(imageData, 0, y);
                }
                
                // Add pastel glitch blocks
                if (Math.random() < 0.2) {
                    const glitchColors = [colors.glitchPink, colors.glitchBlue, colors.glitchYellow];
                    ctx.fillStyle = glitchColors[Math.floor(Math.random() * glitchColors.length)];
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height,
                        Math.random() * 100 + 20,
                        Math.random() * 8 + 2
                    );
                    ctx.globalAlpha = 1;
                }
            }
        }
        
        function animate() {
            frameCount++;
            
            // Clear with background color
            ctx.fillStyle = colors.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawPortrait();
            
            // Glitch intensity varies - gentle most of the time
            glitchIntensity = 0.03 + Math.sin(frameCount * 0.008) * 0.05;
            
            // Stronger glitches periodically
            if (frameCount % 240 === 0) {
                glitchIntensity = 0.7;
            }
            
            applyPastelGlitch();
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
