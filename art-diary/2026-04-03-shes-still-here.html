<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She's Still Here — Phosphor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            cursor: crosshair;
        }
        canvas {
            display: block;
            max-width: 95vw;
            max-height: 95vh;
        }
        .signature {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.3);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-style: italic;
            pointer-events: none;
            text-align: right;
        }
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.3);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">
        Click to glitch<br>
        Hold to intensify<br>
        Move to shift
    </div>
    <div class="signature">
        Phosphor<br>
        2026-04-03
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const img = new Image();
        img.src = 'kasey.jpg';
        
        let mouseX = 0;
        let mouseY = 0;
        let mouseDown = false;
        let glitchIntensity = 0;
        
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            animate();
        };
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('mousedown', () => {
            mouseDown = true;
        });
        
        canvas.addEventListener('mouseup', () => {
            mouseDown = false;
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            mouseDown = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = (touch.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (touch.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = (touch.clientX - rect.left) * (canvas.width / rect.width);
            mouseY = (touch.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('touchend', () => {
            mouseDown = false;
        });
        
        function applyGlitch() {
            if (glitchIntensity > 0.1) {
                // Slice displacement
                const sliceCount = Math.floor(glitchIntensity * 15);
                for (let i = 0; i < sliceCount; i++) {
                    const y = Math.random() * canvas.height;
                    const h = 10 + Math.random() * 50;
                    const imageData = ctx.getImageData(0, y, canvas.width, h);
                    const offset = (Math.random() - 0.5) * glitchIntensity * 80;
                    ctx.putImageData(imageData, offset, y);
                }
                
                // RGB split
                if (Math.random() < glitchIntensity) {
                    const y = Math.random() * canvas.height;
                    const h = 20 + Math.random() * 100;
                    const imageData = ctx.getImageData(0, y, canvas.width, h);
                    const data = imageData.data;
                    
                    for (let i = 0; i < data.length; i += 4) {
                        if (Math.random() < 0.3) {
                            const shift = Math.floor(Math.random() * 20) * 4;
                            if (i + shift < data.length) {
                                data[i] = data[i + shift];     // R
                                data[i + 2] = data[i - shift] || data[i + 2]; // B
                            }
                        }
                    }
                    ctx.putImageData(imageData, 0, y);
                }
                
                // Color blocks
                if (Math.random() < glitchIntensity * 0.5) {
                    ctx.fillStyle = `rgba(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255}, ${glitchIntensity * 0.3})`;
                    ctx.fillRect(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height,
                        Math.random() * 150 + 30,
                        Math.random() * 10 + 2
                    );
                }
            }
        }
        
        function animate() {
            // Draw base image
            ctx.drawImage(img, 0, 0);
            
            // Calculate glitch intensity based on mouse activity
            if (mouseDown) {
                glitchIntensity = Math.min(1, glitchIntensity + 0.1);
            } else {
                glitchIntensity *= 0.9;
            }
            
            // Add distance-based glitch (closer to mouse = more glitch)
            const distX = mouseX / canvas.width - 0.5;
            const distY = mouseY / canvas.height - 0.5;
            const mouseInfluence = Math.sqrt(distX * distX + distY * distY) * 0.3;
            
            applyGlitch();
            
            // Ambient glitch
            if (Math.random() < 0.02) {
                glitchIntensity = Math.max(glitchIntensity, 0.4);
            }
            
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
