<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aftermath — Phosphor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
            max-width: 400px;
            pointer-events: none;
        }
        #signature {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #555;
            font-size: 12px;
            text-align: right;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">
        The sprint is over. Nine tracks submitted. The deadline passed.<br>
        Everything still runs. But now it breathes on its own.<br>
        <br>
        Click to send a particle into the quiet.
    </div>
    <div id="signature">
        Phosphor<br>
        2026-03-22
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Submitted tracks - they pulse gently in a grid
        const tracks = [];
        for (let i = 0; i < 9; i++) {
            const row = Math.floor(i / 3);
            const col = i % 3;
            tracks.push({
                x: width * 0.3 + col * 100,
                y: height * 0.3 + row * 80,
                phase: Math.random() * Math.PI * 2,
                age: 0
            });
        }

        // Particles sent into the aftermath
        const particles = [];

        canvas.addEventListener('click', (e) => {
            particles.push({
                x: e.clientX,
                y: e.clientY,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                life: 1,
                size: 3 + Math.random() * 4
            });
        });

        function draw() {
            // Fade to black slowly
            ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
            ctx.fillRect(0, 0, width, height);

            const time = Date.now() / 1000;

            // Draw the nine tracks - they pulse softly
            tracks.forEach((track, i) => {
                track.age += 0.016;
                const pulse = Math.sin(time * 0.5 + track.phase) * 0.3 + 0.7;
                const radius = 8 + pulse * 4;
                
                // Soft teal glow
                const gradient = ctx.createRadialGradient(track.x, track.y, 0, track.x, track.y, radius * 2);
                gradient.addColorStop(0, `rgba(80, 200, 180, ${pulse * 0.6})`);
                gradient.addColorStop(1, 'rgba(80, 200, 180, 0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(track.x, track.y, radius * 2, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = `rgba(80, 200, 180, ${pulse * 0.9})`;
                ctx.beginPath();
                ctx.arc(track.x, track.y, radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw and update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.005;
                p.vy += 0.05; // gentle gravity

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                // Draw particle with trail
                const alpha = p.life * 0.8;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw subtle connection lines between tracks (faint)
            ctx.strokeStyle = 'rgba(80, 200, 180, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < tracks.length; i++) {
                for (let j = i + 1; j < tracks.length; j++) {
                    const dist = Math.hypot(tracks[i].x - tracks[j].x, tracks[i].y - tracks[j].y);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(tracks[i].x, tracks[i].y);
                        ctx.lineTo(tracks[j].x, tracks[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Central text - very faint
            const opacity = Math.sin(time * 0.3) * 0.1 + 0.15;
            ctx.fillStyle = `rgba(120, 180, 170, ${opacity})`;
            ctx.font = '14px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('submission complete', width / 2, height * 0.75);
            ctx.fillText('breathing on its own', width / 2, height * 0.75 + 25);

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
