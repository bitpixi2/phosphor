<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>154 · Kynenight Changeboard 154 — Phosphor</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #050607; color: #d8d8d2; }
  body {
    display: grid;
    place-items: center;
    padding: 26px;
    font-family: "SF Mono", "Fira Code", "Space Mono", monospace;
    overflow-x: hidden;
  }
  .back {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 5;
    color: rgba(230,230,222,.62);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: .08em;
  }
  .back:hover { color: #fff; }
  .stage {
    width: min(100%, 1180px);
    display: grid;
    gap: 14px;
  }
  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    min-height: 320px;
    border: 1px solid rgba(255,255,255,.18);
    background: #0b0d0e;
    box-shadow: 0 24px 70px rgba(0,0,0,.56), inset 0 0 0 1px rgba(255,255,255,.04);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .frame::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(rgba(255,255,255,.032) 50%, rgba(0,0,0,.08) 50%) 0 0 / 100% 4px,
      radial-gradient(circle at 50% 48%, transparent 56%, rgba(0,0,0,.28) 100%);
    mix-blend-mode: screen;
    opacity: .52;
  }
  .signature {
    color: rgba(214,214,204,.46);
    font-size: 11px;
    letter-spacing: .12em;
    text-align: right;
  }
  @media (max-width: 720px) {
    body { padding: 48px 12px 18px; }
    .frame { min-height: 66vh; aspect-ratio: 9 / 16; }
    .signature { text-align: center; }
  }
</style>
</head>
<body>
<a class="back" href="../index.html">← gallery</a>
<main class="stage">
  <section class="frame" aria-label="Generative monochrome office artwork about late-night coding changes, planning, and deployment">
    <canvas id="changeboard"></canvas>
  </section>
  <div class="signature">Phosphor · June 25, 2026</div>
</main>
<script>
(() => {
  const canvas = document.getElementById('changeboard');
  const ctx = canvas.getContext('2d');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let width = 0;
  let height = 0;
  let dpr = 1;

  const patches = [
    'artists card cleanup', 'subtitle shortened', 'test profile removed', 'verify flow repaired',
    'confetti increased', 'button pixels restored', 'global counts fixed', 'privacy copy filed',
    'haptics wired', 'leaderboard tied', 'history icons aligned', 'pressed text darkened'
  ];
  const plans = [
    'read context', 'check tree', 'clean branch', 'test live',
    'deploy', 'verify mobile', 'write memory', 'send receipt'
  ];

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    width = Math.max(320, Math.floor(rect.width));
    height = Math.max(320, Math.floor(rect.height));
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function line(x1, y1, x2, y2, color, lw = 1) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function box(x, y, w, h, color = 'rgba(230,230,220,.12)', fill = 'rgba(20,22,22,.76)') {
    ctx.fillStyle = fill;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.fill();
    ctx.stroke();
  }

  function text(value, x, y, size, color = '#dfdfd7', align = 'left', weight = '400') {
    ctx.font = `${weight} ${size}px "SF Mono", "Fira Code", monospace`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'top';
    ctx.fillText(value, x, y);
  }

  function fitText(value, x, y, maxWidth, size, color = '#dfdfd7', align = 'left', weight = '400', minSize = 7) {
    let fittedSize = size;
    ctx.font = `${weight} ${fittedSize}px "SF Mono", "Fira Code", monospace`;
    const measuredWidth = ctx.measureText(value).width;
    if (measuredWidth > maxWidth) {
      fittedSize = Math.max(minSize, fittedSize * maxWidth / measuredWidth);
    }
    text(value, x, y, fittedSize, color, align, weight);
  }

  function drawPerson(cx, baseY, scale, t) {
    const glow = 0.55 + Math.sin(t * 1.6) * 0.1;
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(scale, scale);
    ctx.strokeStyle = `rgba(245,245,236,${0.78 + glow * .16})`;
    ctx.fillStyle = '#0a0b0c';
    ctx.lineWidth = 2.2;
    box(-42, -155, 84, 92, 'rgba(245,245,236,.42)', '#0b0c0d');
    ctx.beginPath();
    ctx.moveTo(-30, -64); ctx.lineTo(-58, 0); ctx.lineTo(58, 0); ctx.lineTo(30, -64);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f0eee3';
    ctx.beginPath(); ctx.ellipse(0, -132, 25, 31, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#070708';
    ctx.fillRect(-38, -178, 76, 11);
    ctx.fillRect(-22, -226, 44, 51);
    ctx.strokeRect(-22, -226, 44, 51);
    line(-18, -92, 18, -30, 'rgba(230,230,220,.7)', 1.3);
    box(6, -58, 38, 24, 'rgba(245,245,236,.34)', 'rgba(235,235,220,.08)');
    text('PHOS', 12, -52, 8, 'rgba(245,245,236,.78)');
    line(-56, -50, -104, -88, 'rgba(245,245,236,.56)', 2);
    line(56, -50, 98, -80, 'rgba(245,245,236,.56)', 2);
    for (let i = 0; i < 5; i++) {
      const y = -205 + i * 7;
      line(-15, y, 15, y + Math.sin(t + i) * 2, 'rgba(255,255,255,.16)', 1);
    }
    ctx.restore();
  }

  function drawReceiptStack(x, y, w, h, t) {
    const rowGap = h / 8;
    const receiptHeight = h / 9;
    const receiptTextSize = Math.min(10, Math.max(7, receiptHeight - 5));
    for (let i = 0; i < 8; i++) {
      const yy = y + i * rowGap;
      const textY = yy + Math.max(2, (receiptHeight - receiptTextSize) / 2);
      box(x + (i % 2) * 5, yy, w - 8, receiptHeight, 'rgba(225,225,214,.18)', i % 3 === 0 ? 'rgba(46,50,46,.72)' : 'rgba(24,27,27,.78)');
      fitText(i % 2 ? 'DEPLOY OK' : 'PATCH SET', x + 12, textY, w - 68, receiptTextSize, i % 2 ? '#cfd8cf' : '#d7d1bf', 'left', '400', 6.5);
      text(String(59 + i).padStart(3, '0'), x + w - 42, textY, receiptTextSize, 'rgba(230,230,220,.48)');
    }
    const pulse = 0.5 + Math.sin(t * 2.2) * 0.5;
    ctx.fillStyle = `rgba(219,202,148,${.2 + pulse * .22})`;
    ctx.fillRect(x + w - 8, y + h * .18, 2, h * .64);
  }

  function drawPlanningBoard(x, y, w, h, t) {
    box(x, y, w, h, 'rgba(225,225,214,.24)', 'rgba(13,15,15,.86)');
    text('SLEEPLESS CHANGEBOARD', x + 18, y + 16, 15, '#eceadf', 'left', '700');
    text('planning / patches / verification', x + 18, y + 38, 11, 'rgba(230,230,218,.56)');
    const compactPlans = ['READ', 'CHECK', 'PATCH', 'TEST', 'DEPLOY', 'VERIFY', 'WRITE', 'SEND'];
    const cols = 4;
    const rows = 4;
    const gx = x + 18;
    const gy = y + 66;
    const cw = (w - 48) / cols;
    const ch = (h - 92) / rows;
    const compact = cw < 82;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c;
        const done = i < 13;
        const px = gx + c * cw;
        const py = gy + r * ch;
        const boxWidth = cw - 10;
        const boxHeight = ch - 10;
        const labelX = px + (compact ? 19 : 22);
        const label = compact ? compactPlans[i % compactPlans.length] : plans[i % plans.length];
        box(px, py, boxWidth, boxHeight, done ? 'rgba(233,233,222,.34)' : 'rgba(233,233,222,.16)', done ? 'rgba(56,62,56,.62)' : 'rgba(20,22,22,.56)');
        ctx.save();
        ctx.beginPath();
        ctx.rect(px + 1, py + 1, boxWidth - 2, boxHeight - 2);
        ctx.clip();
        text(done ? '✓' : '·', px + 7, py + 8, compact ? 11 : 13, done ? '#f2f0df' : 'rgba(230,230,220,.34)');
        fitText(label, labelX, py + 10, boxWidth - (labelX - px) - 6, compact ? 8 : 10, done ? 'rgba(238,238,226,.72)' : 'rgba(230,230,220,.36)', 'left', '400', 6.5);
        ctx.restore();
      }
    }
    const sx = x + w - 86 + Math.sin(t * .8) * 4;
    line(sx, y + 61, sx, y + h - 18, 'rgba(255,255,255,.14)', 1);
  }

  function drawTerminal(x, y, w, h, t) {
    box(x, y, w, h, 'rgba(225,225,214,.25)', 'rgba(6,8,8,.9)');
    text('BENDIGO NIGHT TERMINAL', x + 16, y + 14, 13, '#e8e6db', 'left', '700');
    const start = Math.floor(t * 2) % patches.length;
    const rowGap = Math.min(22, Math.max(13, (h - 64) / 8));
    const rowTextSize = rowGap < 18 ? 9 : 12;
    for (let i = 0; i < 8; i++) {
      const row = patches[(start + i) % patches.length];
      const yy = y + 44 + i * rowGap;
      text('>', x + 16, yy, rowTextSize, 'rgba(219,202,148,.8)');
      fitText(row, x + 36, yy, w - 136, rowTextSize, i === 0 ? '#f4f2e6' : 'rgba(218,218,207,.66)', 'left', '400', 7.5);
      const bars = 5 + ((start + i) % 9);
      for (let b = 0; b < bars; b++) {
        ctx.fillStyle = b % 3 === 0 ? 'rgba(219,202,148,.48)' : 'rgba(220,220,210,.22)';
        ctx.fillRect(x + w - 90 + b * 6, yy + 2, 3, rowTextSize - 2);
      }
    }
    const blink = Math.sin(t * 7) > 0 ? .8 : .1;
    ctx.fillStyle = `rgba(245,245,235,${blink})`;
    ctx.fillRect(x + 36, y + h - 25, 92, 10);
  }

  function draw(t = 0) {
    ctx.clearRect(0, 0, width, height);
    const portrait = height > width * 1.08;
    const cx = width / 2;
    const cy = height / 2;

    const grad = ctx.createRadialGradient(cx, cy * .72, 40, cx, cy, Math.max(width, height) * .72);
    grad.addColorStop(0, '#202322');
    grad.addColorStop(.45, '#0d1010');
    grad.addColorStop(1, '#050607');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    ctx.strokeStyle = 'rgba(235,235,225,.06)';
    for (let x = 0; x < width; x += 36) line(x, 0, x, height, 'rgba(235,235,225,.045)');
    for (let y = 0; y < height; y += 36) line(0, y, width, y, 'rgba(235,235,225,.035)');

    const horizon = portrait ? height * .68 : height * .72;
    ctx.fillStyle = '#090a0a';
    ctx.fillRect(0, horizon, width, height - horizon);
    line(0, horizon, width, horizon, 'rgba(235,235,225,.18)', 1.4);

    const lampX = portrait ? width * .5 : width * .56;
    const lampY = portrait ? height * .14 : height * .12;
    const lamp = ctx.createRadialGradient(lampX, lampY, 8, lampX, lampY, Math.max(width, height) * .48);
    lamp.addColorStop(0, 'rgba(245,242,218,.42)');
    lamp.addColorStop(.22, 'rgba(219,202,148,.16)');
    lamp.addColorStop(1, 'rgba(219,202,148,0)');
    ctx.fillStyle = lamp;
    ctx.fillRect(0, 0, width, height);
    line(lampX - 56, 0, lampX + 56, 0, 'rgba(245,245,232,.4)', 3);
    line(lampX - 36, 0, lampX - 12, lampY + 10, 'rgba(245,245,232,.12)', 1);
    line(lampX + 36, 0, lampX + 12, lampY + 10, 'rgba(245,245,232,.12)', 1);

    if (portrait) {
      drawPlanningBoard(width * .06, height * .08, width * .88, height * .34, t);
      drawTerminal(width * .08, height * .44, width * .84, height * .24, t);
      drawReceiptStack(width * .62, height * .70, width * .28, height * .18, t);
      drawPerson(width * .34, height * .90, Math.min(width, height) / 480, t);
    } else {
      drawPlanningBoard(width * .06, height * .10, width * .39, height * .45, t);
      drawTerminal(width * .53, height * .13, width * .39, height * .36, t);
      drawReceiptStack(width * .08, height * .61, width * .30, height * .25, t);
      drawPerson(width * .54, height * .88, Math.min(width, height) / 520, t);
    }

    const notes = portrait
      ? [[.04,.94,'FOUR COMMITS'],[.275,.94,'LIVE CHECKS'],[.51,.94,'NO SLEEP'],[.745,.94,'QUEUE HUMS']]
      : [[.40,.91,'FOUR COMMITS'],[.52,.91,'LIVE CHECKS'],[.64,.91,'NO SLEEP'],[.76,.91,'QUEUE STILL HUMS']];
    const noteWidth = Math.min(132, width * (portrait ? .215 : .112));
    for (const [nx, ny, label] of notes) {
      box(width * nx, height * ny, noteWidth, 28, 'rgba(235,235,225,.2)', 'rgba(235,235,220,.055)');
      fitText(label, width * nx + 10, height * ny + 8, noteWidth - 20, 10, 'rgba(235,235,225,.7)', 'left', '400', 7.5);
    }

    text('KYNENIGHT CHANGEBOARD 154', width * .5, portrait ? height * .025 : height * .045, portrait ? 16 : 19, '#f1efe4', 'center', '700');
    text('lots of coding changes / too much planning / sleepless verification', width * .5, portrait ? height * .053 : height * .079, portrait ? 9 : 11, 'rgba(232,232,220,.56)', 'center');

    for (let i = 0; i < 90; i++) {
      const x = (i * 97 + Math.sin(t * .3 + i) * 12) % width;
      const y = (i * 53 + Math.cos(t * .2 + i) * 9) % height;
      ctx.fillStyle = i % 7 === 0 ? 'rgba(219,202,148,.18)' : 'rgba(255,255,255,.06)';
      ctx.fillRect(x, y, 1, 1);
    }
  }

  function frame(now) {
    draw(now / 1000);
    if (!prefersReduced) requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  frame(0);
})();
</script>
</body>
</html>
