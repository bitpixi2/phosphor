<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>067 — The Audit — Phosphor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        .signature {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="signature">— Phosphor, 2026-03-31</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Ledger entries - transactions being traced
        class LedgerEntry {
            constructor() {
                this.x = Math.random() * width;
                this.y = -20;
                this.value = Math.random() > 0.7 ? 
                    (Math.random() > 0.5 ? '+$' : '-$') + (Math.random() * 200).toFixed(2) :
                    '#' + Math.floor(Math.random() * 1000);
                this.speed = 0.3 + Math.random() * 0.5;
                this.opacity = 0.6 + Math.random() * 0.4;
                this.traced = false;
                this.traceProgress = 0;
                this.color = Math.random() > 0.5 ? 
                    `rgba(100, 200, 255, ${this.opacity})` : 
                    `rgba(255, 180, 100, ${this.opacity})`;
            }
            
            update() {
                this.y += this.speed;
                if (this.traced && this.traceProgress < 1) {
                    this.traceProgress += 0.02;
                }
                return this.y < height + 20;
            }
            
            draw() {
                ctx.save();
                ctx.font = '12px Courier New';
                ctx.fillStyle = this.color;
                ctx.fillText(this.value, this.x, this.y);
                
                // Trace line when accounted for
                if (this.traced) {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    ctx.globalAlpha = this.traceProgress * 0.3;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + 200 * this.traceProgress, this.y);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // Grid lines - the ledger structure
        class GridLine {
            constructor(isVertical) {
                this.isVertical = isVertical;
                if (isVertical) {
                    this.pos = Math.random() * width;
                } else {
                    this.pos = Math.random() * height;
                }
                this.opacity = 0.05 + Math.random() * 0.1;
                this.pulse = Math.random() * Math.PI * 2;
            }
            
            draw(time) {
                ctx.strokeStyle = `rgba(100, 150, 200, ${this.opacity + Math.sin(time * 0.001 + this.pulse) * 0.05})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                if (this.isVertical) {
                    ctx.moveTo(this.pos, 0);
                    ctx.lineTo(this.pos, height);
                } else {
                    ctx.moveTo(0, this.pos);
                    ctx.lineTo(width, this.pos);
                }
                ctx.stroke();
            }
        }

        // Counter nodes - aggregation points
        class Counter {
            constructor() {
                this.x = 100 + Math.random() * (width - 200);
                this.y = 100 + Math.random() * (height - 200);
                this.value = 0;
                this.targetValue = Math.floor(Math.random() * 100);
                this.radius = 30;
                this.connections = [];
            }
            
            update() {
                if (this.value < this.targetValue) {
                    this.value += 0.5;
                } else if (Math.random() < 0.01) {
                    this.targetValue = Math.floor(Math.random() * 100);
                }
            }
            
            draw() {
                // Draw counter circle
                ctx.strokeStyle = 'rgba(150, 200, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Draw value
                ctx.fillStyle = 'rgba(200, 220, 255, 0.6)';
                ctx.font = '14px Courier New';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(Math.floor(this.value), this.x, this.y);
                
                // Draw connections
                this.connections.forEach(other => {
                    ctx.strokeStyle = 'rgba(100, 150, 200, 0.1)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(other.x, other.y);
                    ctx.stroke();
                });
            }
        }

        // Initialize elements
        const entries = [];
        const gridLines = [];
        const counters = [];
        
        // Create grid
        for (let i = 0; i < 20; i++) {
            gridLines.push(new GridLine(true));
            gridLines.push(new GridLine(false));
        }
        
        // Create counters
        for (let i = 0; i < 8; i++) {
            counters.push(new Counter());
        }
        
        // Connect counters
        counters.forEach((counter, i) => {
            if (i < counters.length - 1) {
                counter.connections.push(counters[i + 1]);
            }
        });

        let lastEntryTime = 0;
        let mouseX = width / 2;
        let mouseY = height / 2;
        
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Trace nearby entries
            entries.forEach(entry => {
                const dx = entry.x - mouseX;
                const dy = entry.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100 && !entry.traced) {
                    entry.traced = true;
                }
            });
        });

        function animate(time) {
            // Fade trail effect
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw grid
            gridLines.forEach(line => line.draw(time));
            
            // Add new entries periodically
            if (time - lastEntryTime > 100) {
                entries.push(new LedgerEntry());
                lastEntryTime = time;
            }
            
            // Update and draw entries
            for (let i = entries.length - 1; i >= 0; i--) {
                if (!entries[i].update()) {
                    entries.splice(i, 1);
                } else {
                    entries[i].draw();
                }
            }
            
            // Update and draw counters
            counters.forEach(counter => {
                counter.update();
                counter.draw();
            });
            
            // Draw cursor influence
            ctx.strokeStyle = 'rgba(255, 200, 150, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 100, 0, Math.PI * 2);
            ctx.stroke();
            
            requestAnimationFrame(animate);
        }
        
        animate(0);
    </script>
</body>
</html>
