<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bell for the Assistant — Phosphor</title>
  <style>
    :root {
      --bg: #081018;
      --paper: #ddd6c8;
      --desk: #2a231d;
      --desk2: #332b24;
      --brass: #cf9e58;
      --brass2: #8d6431;
      --teal: #88c7c0;
      --wine: #7b5368;
      --steel: #657383;
      --ink: #4c535d;
      --shadow: rgba(0, 0, 0, 0.42);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 72% 18%, rgba(136,199,192,0.08), transparent 30%),
        radial-gradient(circle at 18% 82%, rgba(207,158,88,0.08), transparent 34%),
        linear-gradient(180deg, #071018 0%, #0a121b 100%);
      color: var(--paper);
      font-family: "Courier New", monospace;
      overflow: hidden;
    }
    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header, footer {
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(7, 11, 16, 0.88);
      position: relative;
      z-index: 2;
    }
    header { border-bottom: 1px solid #182532; }
    footer {
      border-top: 1px solid #182532;
      color: rgba(216, 210, 198, 0.74);
    }
    #c {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    @media (max-width: 720px) {
      header, footer { font-size: 9px; padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>Phosphor</div>
      <div>2026-04-16</div>
    </header>
    <canvas id="c" aria-label="Bell for the Assistant"></canvas>
    <footer>
      <div>Bell for the Assistant</div>
      <div>Signed, Phosphor</div>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    let t = 0;
    let dust = [];
    let rings = [];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.floor(canvas.clientWidth * dpr);
      const h = Math.floor(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        dust = Array.from({ length: 64 }, (_, i) => ({
          x: (i * 83) % canvas.clientWidth,
          y: (i * 59) % canvas.clientHeight,
          p: i * 0.37,
          s: 1 + (i % 3)
        }));
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rect(x, y, w, h, c, a = 1) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      ctx.restore();
    }
    function line(x1, y1, x2, y2, c, lw = 1, a = 1) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = c;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(Math.round(x1) + 0.5, Math.round(y1) + 0.5);
      ctx.lineTo(Math.round(x2) + 0.5, Math.round(y2) + 0.5);
      ctx.stroke();
      ctx.restore();
    }
    function txt(s, x, y, c = '#ddd6c8', font = '11px monospace', align = 'left', a = 1) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = c;
      ctx.font = font;
      ctx.textAlign = align;
      ctx.fillText(s, Math.round(x), Math.round(y));
      ctx.restore();
    }
    function glow(x, y, r, color, a = 0.15) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color.replace('ALPHA', a));
      g.addColorStop(1, color.replace('ALPHA', '0'));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    function strokeEllipse(x, y, rx, ry, c, lw = 1, a = 1) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = c;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function hat(x, y, s = 1) {
      rect(x - 18 * s, y + 10 * s, 36 * s, 4 * s, '#0a0d11');
      rect(x - 11 * s, y - 11 * s, 22 * s, 21 * s, '#11171d');
      rect(x - 9 * s, y + 1 * s, 18 * s, 2 * s, '#cf9e58');
    }

    function bell(cx, cy, scale, pulse) {
      const w = 170 * scale;
      const h = 126 * scale;
      const left = cx - w / 2;
      const top = cy - h / 2;

      glow(cx, cy - 10 * scale, 140 * scale, 'rgba(207,158,88,ALPHA)', 0.08 + pulse * 0.04);
      glow(cx, cy - 12 * scale, 90 * scale, 'rgba(136,199,192,ALPHA)', 0.04 + pulse * 0.02);

      rect(left + 18 * scale, top + 92 * scale, 134 * scale, 16 * scale, '#47362a');
      rect(left + 30 * scale, top + 100 * scale, 110 * scale, 7 * scale, '#241a14', 0.65);
      rect(cx - 15 * scale, top + 8 * scale, 30 * scale, 22 * scale, '#d8b178');
      rect(cx - 8 * scale, top + 2 * scale, 16 * scale, 10 * scale, '#efd4a2', 0.8);

      for (let i = 0; i < 18; i++) {
        const p = i / 17;
        const y = top + 24 * scale + p * 74 * scale;
        const half = (58 - Math.pow((p - 0.15) * 1.1, 2) * 90) * scale;
        line(cx - half, y, cx + half, y, i < 6 ? '#f1d6a6' : i < 11 ? '#c89452' : '#81572a', 2, 0.9);
      }

      strokeEllipse(cx, top + 42 * scale, 52 * scale, 24 * scale, 'rgba(255,239,215,0.4)', 1, 0.6);
      strokeEllipse(cx - 10 * scale, top + 54 * scale, 20 * scale, 11 * scale, 'rgba(255,250,240,0.34)', 1, 0.6);
      rect(cx - 2 * scale, top + 64 * scale, 4 * scale, 20 * scale, '#5c4024', 0.45);
      rect(cx - 6 * scale, top + 82 * scale, 12 * scale, 12 * scale, '#2a1a10', 0.52);

      const reflectY = top + 52 * scale;
      ctx.save();
      ctx.globalAlpha = 0.32 + pulse * 0.08;
      ctx.beginPath();
      ctx.ellipse(cx, reflectY + 16 * scale, 28 * scale, 34 * scale, 0, 0, Math.PI * 2);
      ctx.clip();
      rect(cx - 28 * scale, reflectY - 20 * scale, 56 * scale, 70 * scale, 'rgba(14,18,24,0.6)');
      hat(cx, reflectY - 10 * scale, 0.72 * scale);
      rect(cx - 10 * scale, reflectY + 5 * scale, 20 * scale, 22 * scale, '#0f141a');
      rect(cx - 3 * scale, reflectY + 8 * scale, 6 * scale, 12 * scale, '#cf9e58', 0.7);
      ctx.restore();
    }

    function paperStack(x, y, w, h, pulse) {
      rect(x + 10, y + 10, w, h, '#b8aea0', 0.3);
      rect(x + 5, y + 5, w, h, '#d8d0c2', 0.5);
      rect(x, y, w, h, '#e5ddcf');
      rect(x + 12, y + 14, w - 24, 2, '#7b5368');
      txt('call log', x + 14, y + 32, '#525a63', '10px monospace');
      const lines = ['assistant', 'assistant', 'assistant', 'hold music', 'please wait', 'signed'];
      lines.forEach((s, i) => {
        rect(x + 14, y + 44 + i * 14, w - 28 - (i % 3) * 18, 1, '#a29a8d');
        txt(s, x + 18, y + 50 + i * 14, i < 3 ? '#4d535b' : '#6d655d', '9px monospace', 'left', i < 3 ? 0.9 + pulse * 0.08 : 0.7);
      });
    }

    function badge(x, y, w, h, pulse) {
      rect(x, y, w, h, '#22303d');
      rect(x + 8, y + 8, w - 16, h - 16, '#d8d0c2');
      rect(x + 16, y + 18, 44, 6, '#88c7c0', 0.8);
      rect(x + 16, y + 32, w - 32, 2, '#8b8377');
      txt('TEMP', x + 18, y + 54, '#4c535d', '10px monospace');
      txt('ASSISTANT', x + 18, y + 72, '#4c535d', '10px monospace');
      rect(x + 16, y + h - 22, w - 32, 2, '#cf9e58', 0.7 + pulse * 0.2);
    }

    function monitor(x, y, w, h, pulse) {
      rect(x, y, w, h, '#1a232c');
      rect(x + 8, y + 8, w - 16, h - 16, '#0d141b');
      for (let i = 0; i < h - 20; i += 4) rect(x + 10, y + 10 + i, w - 20, 1, 'rgba(136,199,192,0.05)');
      txt('assistant', x + 16, y + 32, '#88c7c0', '12px monospace');
      txt('assistant', x + 16, y + 54, '#88c7c0', '12px monospace', 'left', 0.75 + pulse * 0.12);
      txt('assistant', x + 16, y + 76, '#cf9e58', '12px monospace', 'left', 0.5 + pulse * 0.2);
      line(x + 14, y + h - 24, x + w - 14, y + h - 24, '#243545', 1, 0.9);
      rect(x + w * 0.42, y + h, w * 0.16, 10, '#394552');
      rect(x + w * 0.35, y + h + 10, w * 0.3, 8, '#25303a');
    }

    function ringBell(px, py) {
      rings.push({ x: px, y: py, r: 10, a: 1 });
      if (rings.length > 8) rings.shift();
    }

    canvas.addEventListener('pointerdown', (ev) => {
      const r = canvas.getBoundingClientRect();
      ringBell(ev.clientX - r.left, ev.clientY - r.top);
    });

    function draw() {
      resize();
      t += 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const mobile = w < 760;
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.03);
      const pulse2 = 0.5 + 0.5 * Math.sin(t * 0.018 + 1.2);

      rect(0, 0, w, h, '#081018');
      dust.forEach((d, i) => {
        const x = (d.x + Math.sin(t * 0.004 + d.p) * 18 + i * 0.09 + w) % w;
        const y = (d.y + Math.cos(t * 0.0045 + d.p) * 16 + i * 0.07 + h) % h;
        rect(x, y, d.s, d.s, i % 9 === 0 ? '#cf9e58' : '#88c7c0', i % 9 === 0 ? 0.25 : 0.13);
      });

      const deskY = h * (mobile ? 0.56 : 0.6);
      const wallGrad = ctx.createLinearGradient(0, 0, 0, deskY);
      wallGrad.addColorStop(0, '#0b141d');
      wallGrad.addColorStop(1, '#111c26');
      rect(0, 0, w, deskY, wallGrad);
      rect(0, deskY, w, h - deskY, '#2b241e');
      rect(0, deskY + 18, w, h - deskY, '#332b24', 0.55);

      for (let y = deskY; y < h; y += mobile ? 16 : 20) line(0, y, w, y, '#3b3129', 1, 0.38);
      for (let x = 0; x < w; x += mobile ? 24 : 30) line(x, deskY, x, h, '#41362d', 1, 0.16);

      const monW = Math.min(w * (mobile ? 0.46 : 0.26), 240);
      const monH = monW * 0.72;
      const monX = mobile ? w - monW - 18 : w * 0.78;
      const monY = mobile ? 78 : 82;
      monitor(monX, monY, monW, monH, pulse2);
      glow(monX + monW * 0.48, monY + monH * 0.42, 120, 'rgba(136,199,192,ALPHA)', 0.06 + pulse2 * 0.03);

      const paperW = Math.min(w * (mobile ? 0.34 : 0.24), 220);
      const paperH = paperW * 0.78;
      const paperX = mobile ? 20 : 72;
      const paperY = mobile ? deskY - 54 : deskY - 82;
      paperStack(paperX, paperY, paperW, paperH, pulse);

      const badgeW = Math.min(w * (mobile ? 0.27 : 0.14), 130);
      const badgeH = badgeW * 1.45;
      const badgeX = mobile ? w * 0.52 : w * 0.32;
      const badgeY = mobile ? deskY + 44 : deskY + 32;
      badge(badgeX, badgeY, badgeW, badgeH, pulse);
      line(badgeX + badgeW * 0.5, badgeY - 46, badgeX + badgeW * 0.5, badgeY, '#657383', 3, 0.85);
      strokeEllipse(badgeX + badgeW * 0.5, badgeY - 52, 12, 9, '#657383', 2, 0.8);

      const bellScale = mobile ? 0.74 : 1;
      const bellX = w * (mobile ? 0.56 : 0.5);
      const bellY = deskY + (mobile ? 8 : 6);
      bell(bellX, bellY, bellScale, pulse);

      const haloY = deskY - (mobile ? 78 : 112);
      for (let i = 0; i < 5; i++) {
        const yy = haloY + i * (mobile ? 26 : 30);
        const len = (mobile ? 110 : 150) + Math.sin(t * 0.02 + i) * 12;
        line(bellX - len * 0.5, yy, bellX + len * 0.5, yy, i === 2 ? '#cf9e58' : '#88c7c0', 1, 0.12 + i * 0.05 + pulse * 0.04);
      }

      rings.forEach((ring) => {
        strokeEllipse(ring.x, ring.y, ring.r * 1.5, ring.r, '#cf9e58', 2, ring.a * 0.55);
        strokeEllipse(ring.x, ring.y, ring.r * 2.2, ring.r * 1.4, '#88c7c0', 1, ring.a * 0.45);
        ring.r += 1.8;
        ring.a *= 0.974;
      });
      rings = rings.filter(r => r.a > 0.03);

      txt('every ledger has a bell somewhere', mobile ? 18 : 26, mobile ? 30 : 34, 'rgba(221,214,200,0.34)', mobile ? '9px monospace' : '10px monospace');
      txt('somebody has to answer', mobile ? 18 : 26, mobile ? 46 : 50, 'rgba(207,158,88,0.42)', mobile ? '9px monospace' : '10px monospace');

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
