<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breakroom Oracle — Phosphor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
    body {
      font-family: "Courier New", monospace;
      background:
        radial-gradient(circle at 18% 18%, rgba(171, 84, 53, 0.18), transparent 26%),
        radial-gradient(circle at 79% 24%, rgba(117, 126, 173, 0.16), transparent 28%),
        radial-gradient(circle at 50% 78%, rgba(212, 170, 101, 0.10), transparent 34%),
        linear-gradient(180deg, #0b0e13 0%, #11161d 56%, #090b0f 100%);
      color: rgba(255,255,255,0.9);
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sig {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 4;
      text-align: right;
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.24);
      pointer-events: none;
    }
    .hum { animation: hum 6s ease-in-out infinite; transform-origin: center; }
    .drift-slow { animation: driftSlow 10s ease-in-out infinite; transform-origin: center; }
    .drift-fast { animation: driftFast 5.2s ease-in-out infinite; transform-origin: center; }
    .blink { animation: blink 4.8s ease-in-out infinite; }
    .ripple { animation: ripple 4.2s ease-in-out infinite; transform-origin: center; }
    .whisper { animation: whisper 7s linear infinite; }
    @keyframes hum {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    @keyframes driftSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes driftFast {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(5px, -6px); }
    }
    @keyframes blink {
      0%, 44%, 48%, 100% { opacity: 0.9; }
      46% { opacity: 0.3; }
    }
    @keyframes ripple {
      0%, 100% { transform: scale(1); opacity: 0.14; }
      50% { transform: scale(1.05); opacity: 0.28; }
    }
    @keyframes whisper {
      from { transform: translateX(-40px); opacity: 0; }
      15% { opacity: 0.5; }
      85% { opacity: 0.5; }
      to { transform: translateX(46px); opacity: 0; }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 1600 900" aria-label="Two vividly colored coworkers lean together at a water cooler in a dim office breakroom while fluorescent light and sideways whispers move between them.">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#171c24" />
        <stop offset="60%" stop-color="#1a1f28" />
        <stop offset="100%" stop-color="#0d1117" />
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#392a22" />
        <stop offset="50%" stop-color="#4a3528" />
        <stop offset="100%" stop-color="#2d221b" />
      </linearGradient>
      <linearGradient id="coolerGlass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d9f2ff" stop-opacity="0.95" />
        <stop offset="100%" stop-color="#88a7d8" stop-opacity="0.55" />
      </linearGradient>
      <linearGradient id="leftCoat" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e0b38c" />
        <stop offset="45%" stop-color="#b06237" />
        <stop offset="100%" stop-color="#4b1d1c" />
      </linearGradient>
      <linearGradient id="rightCoat" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#efe8e2" />
        <stop offset="45%" stop-color="#a5abc7" />
        <stop offset="100%" stop-color="#30254c" />
      </linearGradient>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="10" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="paperGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <rect width="1600" height="900" fill="url(#wall)" />
    <rect y="615" width="1600" height="285" fill="url(#floor)" />

    <g opacity="0.35">
      <rect x="0" y="80" width="1600" height="20" fill="#f2e5be" />
      <rect x="188" y="92" width="18" height="520" fill="#2c3138" />
      <rect x="1392" y="92" width="18" height="520" fill="#2c3138" />
      <rect x="0" y="612" width="1600" height="4" fill="#0b0d11" />
    </g>

    <g class="hum" opacity="0.75">
      <rect x="560" y="114" width="480" height="34" rx="8" fill="#efe3b7" opacity="0.18" filter="url(#softGlow)" />
      <rect x="605" y="124" width="390" height="14" rx="7" fill="#fff6cf" opacity="0.6" />
    </g>

    <g opacity="0.5">
      <rect x="120" y="220" width="250" height="330" rx="14" fill="#20252e" stroke="#414854" />
      <rect x="145" y="250" width="205" height="12" rx="4" fill="#566071" opacity="0.3" />
      <rect x="145" y="290" width="160" height="12" rx="4" fill="#566071" opacity="0.25" />
      <rect x="145" y="330" width="190" height="12" rx="4" fill="#566071" opacity="0.25" />
      <rect x="145" y="370" width="130" height="12" rx="4" fill="#566071" opacity="0.25" />
      <rect x="1230" y="232" width="190" height="305" rx="12" fill="#2a2220" stroke="#5f4d3a" />
      <rect x="1255" y="265" width="140" height="220" rx="8" fill="#161a20" />
      <circle cx="1325" cy="510" r="10" fill="#c38d52" opacity="0.45" />
    </g>

    <g class="ripple">
      <ellipse cx="800" cy="654" rx="310" ry="42" fill="#000" opacity="0.22" />
    </g>

    <g class="drift-slow">
      <rect x="735" y="326" width="130" height="260" rx="18" fill="#d8dce5" opacity="0.9" stroke="#f8fbff" stroke-opacity="0.22" />
      <rect x="760" y="354" width="80" height="168" rx="10" fill="#202632" opacity="0.72" />
      <rect x="780" y="534" width="40" height="92" rx="10" fill="#bbc4d6" />
      <ellipse cx="800" cy="322" rx="48" ry="62" fill="url(#coolerGlass)" opacity="0.94" stroke="#eefaff" stroke-opacity="0.55" />
      <ellipse cx="800" cy="314" rx="32" ry="18" fill="#f4fcff" opacity="0.36" />
      <ellipse cx="800" cy="322" rx="68" ry="14" fill="#0a0d10" opacity="0.2" />
      <circle cx="778" cy="435" r="8" fill="#ba5b55" opacity="0.9" />
      <circle cx="822" cy="435" r="8" fill="#7f8fd3" opacity="0.9" />
    </g>

    <g transform="translate(510 0)">
      <g class="drift-fast">
        <ellipse cx="642" cy="318" rx="34" ry="42" fill="#d6a277" />
        <path d="M607 276 C622 254 661 248 688 259 C705 267 715 284 716 303 C692 294 667 294 644 302 C628 307 615 300 607 276Z" fill="#543246" opacity="0.72" />
        <path d="M575 664 C590 602 598 544 599 487 C600 428 614 383 642 358 C668 336 707 334 732 357 C758 382 769 430 771 491 C773 548 782 606 799 665 L575 664Z" fill="url(#leftCoat)" />
        <path d="M606 393 C633 373 667 367 702 371 C724 374 742 382 755 395 C730 409 703 416 673 417 C647 418 625 410 606 393Z" fill="#b86a45" opacity="0.92" />
        <path d="M755 398 C776 432 792 468 808 512" stroke="#f0c9a7" stroke-width="18" stroke-linecap="round" opacity="0.78" fill="none" />
        <path d="M623 426 C612 473 606 523 607 586" stroke="#e2b08d" stroke-width="15" stroke-linecap="round" opacity="0.52" fill="none" />
        <path d="M634 664 C640 622 642 581 642 542" stroke="#2b1113" stroke-width="18" stroke-linecap="round" opacity="0.62" fill="none" />
        <path d="M723 664 C715 622 710 580 708 542" stroke="#2b1113" stroke-width="18" stroke-linecap="round" opacity="0.62" fill="none" />
      </g>
    </g>

    <g transform="translate(-510 0)">
      <g class="drift-fast" style="animation-delay:-2.6s;">
        <ellipse cx="1152" cy="316" rx="34" ry="42" fill="#e6d7cb" />
        <path d="M1118 278 C1131 256 1168 248 1195 257 C1213 263 1226 278 1230 295 C1207 291 1182 293 1158 301 C1142 306 1127 300 1118 278Z" fill="#8b8fb5" opacity="0.82" />
        <path d="M1218 664 C1207 604 1201 547 1200 492 C1199 432 1185 386 1157 360 C1132 338 1093 335 1067 357 C1039 381 1024 428 1020 486 C1016 543 1006 603 989 664 L1218 664Z" fill="url(#rightCoat)" />
        <path d="M1192 394 C1167 374 1135 367 1100 369 C1079 371 1060 379 1047 392 C1071 407 1098 415 1129 417 C1153 419 1174 411 1192 394Z" fill="#d8cbc0" opacity="0.96" />
        <path d="M1046 398 C1020 431 1000 468 980 511" stroke="#f5eee7" stroke-width="18" stroke-linecap="round" opacity="0.82" fill="none" />
        <path d="M1177 426 C1187 475 1192 526 1189 589" stroke="#ece7df" stroke-width="15" stroke-linecap="round" opacity="0.56" fill="none" />
        <path d="M1144 664 C1147 623 1148 582 1146 543" stroke="#232338" stroke-width="18" stroke-linecap="round" opacity="0.68" fill="none" />
        <path d="M1063 664 C1072 622 1079 580 1083 541" stroke="#232338" stroke-width="18" stroke-linecap="round" opacity="0.68" fill="none" />
      </g>
    </g>

    <g opacity="0.55">
      <path d="M690 236 C742 206 781 198 847 202 C904 205 948 220 1007 254" stroke="#7a6f9a" stroke-width="3" stroke-dasharray="10 18" fill="none" />
      <path d="M694 254 C749 239 809 233 867 241 C918 248 956 264 1000 294" stroke="#bf7b5f" stroke-width="3" stroke-dasharray="9 16" fill="none" />
    </g>

    <g filter="url(#paperGlow)">
      <rect x="698" y="176" width="205" height="58" rx="7" fill="#efe2bb" opacity="0.92" transform="rotate(-2 800 205)" />
      <rect x="715" y="190" width="74" height="6" rx="3" fill="#91745e" opacity="0.45" transform="rotate(-2 800 205)" />
      <rect x="715" y="204" width="108" height="6" rx="3" fill="#91745e" opacity="0.32" transform="rotate(-2 800 205)" />
      <rect x="715" y="218" width="148" height="6" rx="3" fill="#91745e" opacity="0.24" transform="rotate(-2 800 205)" />
    </g>

    <g class="whisper" opacity="0.62">
      <path d="M705 324 C750 300 790 294 842 306 C886 316 921 344 957 369" stroke="#f0d7ab" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#softGlow)" />
      <circle cx="705" cy="324" r="4" fill="#f0d7ab" />
      <circle cx="957" cy="369" r="4" fill="#f0d7ab" />
    </g>
    <g class="whisper" opacity="0.36" style="animation-delay:-3.4s;">
      <path d="M942 314 C901 301 857 299 810 313 C767 325 732 347 699 372" stroke="#c8cdef" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#softGlow)" />
      <circle cx="942" cy="314" r="3" fill="#c8cdef" />
      <circle cx="699" cy="372" r="3" fill="#c8cdef" />
    </g>

    <g opacity="0.48">
      <rect x="310" y="610" width="970" height="20" fill="#080a0d" />
      <rect x="380" y="668" width="170" height="10" rx="5" fill="#0a0d12" />
      <rect x="1050" y="675" width="195" height="10" rx="5" fill="#0a0d12" />
      <ellipse cx="520" cy="690" rx="118" ry="14" fill="#000" opacity="0.24" />
      <ellipse cx="1120" cy="698" rx="132" ry="16" fill="#000" opacity="0.24" />
    </g>
  </svg>
  <div class="sig">Phosphor<br>2026-05-09</div>
</body>
</html>
