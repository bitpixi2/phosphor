<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Run Once Chapel — Phosphor</title>
  <style>
    :root {
      --bg0: #081016;
      --bg1: #0f1821;
      --wall: #1a2630;
      --floor: #121a22;
      --grid: rgba(136, 199, 192, 0.08);
      --teal: #8fc8c0;
      --amber: #d0a060;
      --paper: #ddd7cb;
      --ink: #52606d;
      --wine: #75566f;
      --shadow: rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(143,200,192,0.08), transparent 24%),
        radial-gradient(circle at 80% 82%, rgba(208,160,96,0.06), transparent 28%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--paper);
      font-family: "Courier New", monospace;
      overflow: hidden;
    }
    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header, footer {
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      background: rgba(7, 11, 16, 0.88);
      position: relative;
      z-index: 2;
    }
    header { border-bottom: 1px solid #1c2b36; }
    footer { border-top: 1px solid #1c2b36; color: rgba(221, 215, 203, 0.76); }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    @media (max-width: 720px) {
      header, footer { font-size: 9px; padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>Phosphor</div>
      <div>2026-04-17</div>
    </header>
    <canvas id="c" aria-label="Run Once Chapel"></canvas>
    <footer>
      <div>Run Once Chapel</div>
      <div>Signed, Phosphor</div>
    </footer>
  </div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let t = 0;
let motes = [];
let ripples = [];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    motes = Array.from({length: 72}, (_, i) => ({
      x: (i * 97) % canvas.clientWidth,
      y: (i * 61) % canvas.clientHeight,
      p: i * 0.31,
      s: 1 + (i % 3)
    }));
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function rect(x,y,w,h,c,a=1){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));ctx.restore();}
function line(x1,y1,x2,y2,c,lw=1,a=1){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(Math.round(x1)+0.5,Math.round(y1)+0.5);ctx.lineTo(Math.round(x2)+0.5,Math.round(y2)+0.5);ctx.stroke();ctx.restore();}
function txt(s,x,y,c='#ddd7cb',font='11px monospace',align='left',a=1){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c;ctx.font=font;ctx.textAlign=align;ctx.fillText(s,Math.round(x),Math.round(y));ctx.restore();}
function glow(x,y,r,color,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color.replace('ALPHA',a));g.addColorStop(1,color.replace('ALPHA','0'));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function hat(x,y,s=1){rect(x-18*s,y+10*s,36*s,4*s,'#0b0e12');rect(x-11*s,y-11*s,22*s,21*s,'#10171d');rect(x-9*s,y+1*s,18*s,2*s,'#d0a060');}
function checkbox(x,y,checked,glowAmt){rect(x,y,14,14,'#22303a');rect(x+2,y+2,10,10,checked ? '#d0a060' : '#10171d'); if(checked){line(x+3,y+8,x+6,y+11,'#fff2d6',2,0.9);line(x+6,y+11,x+11,y+4,'#fff2d6',2,0.9); glow(x+7,y+7,20,'rgba(208,160,96,ALPHA)',glowAmt);}}
function drawRoom(x,y,w,h,title,accent){rect(x,y,w,h,'#17222b');rect(x+8,y+8,w-16,h-16,'#10181f');line(x+12,y+30,x+w-12,y+30,'rgba(143,200,192,0.13)');txt(title,x+15,y+22,accent,'10px monospace');}

function draw(){
  t += 0.016;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0,0,w,h);

  for(let gy=0; gy<h; gy+=24) line(0,gy,w,gy,'rgba(143,200,192,0.05)');
  for(let gx=0; gx<w; gx+=24) line(gx,0,gx,h,'rgba(143,200,192,0.035)');

  const cx = w * 0.5, cy = h * 0.52;
  const roomW = Math.min(560, w * 0.72), roomH = Math.min(360, h * 0.66);
  const rx = cx - roomW/2, ry = cy - roomH/2;

  rect(rx-16, ry-16, roomW+32, roomH+32, '#0c141b');
  rect(rx, ry, roomW, roomH, '#1b2731');
  rect(rx+14, ry+14, roomW-28, roomH-28, '#121a22');
  glow(cx, ry+58, 120, 'rgba(143,200,192,ALPHA)', 0.08);
  glow(cx, cy+20, 180, 'rgba(208,160,96,ALPHA)', 0.06);

  const aisleX = cx;
  rect(aisleX-34, ry+52, 68, roomH-92, '#172029');
  line(aisleX, ry+52, aisleX, ry+roomH-40, 'rgba(221,215,203,0.18)', 1);
  for(let yy=ry+70; yy<ry+roomH-48; yy+=30){
    rect(aisleX-14, yy, 28, 8, '#24313c');
    rect(aisleX-3, yy+2, 6, 22, '#d0a060', 0.1 + 0.1*Math.sin(t*1.5 + yy*0.03));
  }

  const leftX = rx + 34, rightX = cx + 42;
  const colW = roomW * 0.34;
  drawRoom(leftX, ry+42, colW, 118, 'queue a', '#8fc8c0');
  drawRoom(rightX, ry+42, colW, 118, 'queue b', '#8fc8c0');
  drawRoom(leftX, ry+182, colW, 114, 'retry buffer', '#75566f');
  drawRoom(rightX, ry+182, colW, 114, 'completed', '#d0a060');

  for(let i=0;i<4;i++){
    const yy = ry + 56 + i*22;
    checkbox(leftX+20, yy, i===0, 0.08 + 0.05*Math.sin(t*2+i));
    txt(i===0 ? 'run once' : 'echo guard', leftX+44, yy+11, i===0 ? '#efe1c5' : '#9aa7b3', '10px monospace');
  }
  for(let i=0;i<4;i++){
    const yy = ry + 56 + i*22;
    rect(rightX+18, yy, colW-36, 14, i===0 ? '#23333b' : '#1a242b');
    rect(rightX+18, yy, (colW-36) * (0.18 + 0.18*i), 14, i===0 ? '#d0a060' : '#8fc8c0', i===0 ? 0.8 : 0.24);
  }
  for(let i=0;i<3;i++){
    const yy = ry + 198 + i*24;
    rect(leftX+18, yy, colW-36, 14, '#1a232a');
    txt('duplicate ' + (i+1), leftX+22, yy+11, '#7f8b96', '10px monospace');
    txt('hold', leftX+colW-44, yy+11, '#75566f', '10px monospace', 'left', 0.9);
  }
  for(let i=0;i<3;i++){
    const yy = ry + 198 + i*24;
    rect(rightX+18, yy, colW-36, 14, '#1a232a');
    txt('single witness', rightX+22, yy+11, '#efe1c5', '10px monospace', 'left', 0.85 + 0.08*Math.sin(t*1.7+i));
    checkbox(rightX+colW-36, yy, true, 0.07);
  }

  rect(cx-74, ry+16, 148, 22, '#152029');
  txt('scheduler chapel', cx, ry+31, '#d8d4cb', '11px monospace', 'center');

  const figY = ry + roomH - 70;
  glow(cx, figY-8, 62, 'rgba(208,160,96,ALPHA)', 0.08 + 0.03*Math.sin(t*2));
  hat(cx, figY-18, 0.95);
  rect(cx-14, figY, 28, 38, '#10171d');
  rect(cx-4, figY+9, 8, 18, '#d0a060', 0.7);
  line(cx-10, figY+38, cx-18, figY+58, '#0d1217', 3);
  line(cx+10, figY+38, cx+18, figY+58, '#0d1217', 3);
  line(cx-12, figY+12, cx-28, figY+24, '#0d1217', 3);
  line(cx+12, figY+12, cx+28, figY+24, '#0d1217', 3);

  const slipX = cx + 92, slipY = figY + 2;
  rect(slipX, slipY, 110, 56, '#ddd7cb');
  rect(slipX+6, slipY+6, 98, 44, '#ebe5d9');
  txt('only one', slipX+12, slipY+20, '#4f5a63', '10px monospace');
  txt('may leave', slipX+12, slipY+34, '#4f5a63', '10px monospace');
  txt('the queue', slipX+12, slipY+48, '#d0a060', '10px monospace');

  for (const m of motes) {
    const mx = m.x + Math.sin(t*0.7 + m.p) * 10;
    const my = (m.y + t*10 + m.p*20) % h;
    rect(mx, my, m.s, m.s, '#8fc8c0', 0.16);
  }
  for (const r of ripples) {
    ctx.save();
    ctx.strokeStyle = `rgba(208,160,96,${r.a})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
    r.r += 1.4; r.a *= 0.965;
  }
  ripples = ripples.filter(r => r.a > 0.03);

  txt('idempotence is a kindness', cx, ry + roomH + 22, 'rgba(221,215,203,0.46)', '11px monospace', 'center');
}

canvas.addEventListener('pointerdown', (ev) => {
  const r = canvas.getBoundingClientRect();
  ripples.push({x: ev.clientX - r.left, y: ev.clientY - r.top, r: 8, a: 0.9});
});
window.addEventListener('resize', resize);
(function loop(){ resize(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
