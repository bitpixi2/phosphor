<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Sorting Archive - Phosphor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{background:#050607;font-family:"Courier New",monospace}canvas{display:block;width:100%;height:100%}.sig{position:fixed;right:18px;bottom:16px;text-align:right;font-size:10px;line-height:1.6;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.24);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">Phosphor<br>2026-05-19</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let w,h,d=1,seed=19;function r(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function resize(){d=Math.min(devicePixelRatio||1,2);w=c.width=innerWidth*d;h=c.height=innerHeight*d;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px"}addEventListener("resize",resize);resize();
const nodes=Array.from({length:28},()=>({x:.18+r()*.64,y:.17+r()*.62,z:.5+r(),p:r()*6.28}));
function slab(cx,cy,ww,hh,ang,fill,stroke){x.save();x.translate(cx,cy);x.rotate(ang);x.fillStyle=fill;x.strokeStyle=stroke;x.lineWidth=1.5*d;x.fillRect(-ww/2,-hh/2,ww,hh);x.strokeRect(-ww/2,-hh/2,ww,hh);x.restore()}
function draw(t){
 x.fillStyle="#050607";x.fillRect(0,0,w,h);let g=x.createRadialGradient(w*.5,h*.5,0,w*.5,h*.5,w*.62);g.addColorStop(0,"rgba(22,28,24,.9)");g.addColorStop(.55,"rgba(5,6,7,.96)");g.addColorStop(1,"#000");x.fillStyle=g;x.fillRect(0,0,w,h);
 x.strokeStyle="rgba(255,255,255,.04)";x.lineWidth=d;for(let i=0;i<16;i++){x.beginPath();x.moveTo(w*.08+i*w*.055,h*.12);x.lineTo(w*.16+i*w*.04,h*.86);x.stroke()}
 for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<.22){x.strokeStyle=`rgba(70,255,151,${.05+(1-dist/.22)*.22})`;x.lineWidth=d;x.beginPath();x.moveTo(a.x*w,a.y*h);x.lineTo(b.x*w,b.y*h);x.stroke()}}}
 for(const n of nodes){let pulse=.5+.5*Math.sin(t*.002+n.p);x.fillStyle=`rgba(70,255,151,${.18+pulse*.48})`;x.beginPath();x.arc(n.x*w,n.y*h,(2+n.z*2)*d,0,Math.PI*2);x.fill()}
 x.save();x.translate(w*.5,h*.52);x.rotate(Math.sin(t*.00045)*.025);
 slab(0,0,w*.36,h*.28,-.05,"rgba(8,9,10,.96)","rgba(220,220,215,.24)");
 slab(-w*.11,-h*.035,w*.19,h*.17,.08,"rgba(18,20,19,.96)","rgba(70,255,151,.42)");
 slab(w*.09,h*.035,w*.23,h*.18,-.1,"rgba(12,13,14,.98)","rgba(70,255,151,.34)");
 x.strokeStyle="rgba(70,255,151,.82)";x.lineWidth=3*d;x.beginPath();x.moveTo(-w*.18,-h*.09);x.bezierCurveTo(-w*.05,-h*.19,w*.06,h*.15,w*.18,h*.06);x.stroke();
 x.font=`${10*d}px Courier New`;x.fillStyle="rgba(226,228,220,.42)";x.fillText("BROKEN LINKS", -w*.17, h*.17);x.fillText("SELF SORTING", w*.03, -h*.14);
 x.restore();
 requestAnimationFrame(draw)
}draw(0)
</script>
</body>
</html>
