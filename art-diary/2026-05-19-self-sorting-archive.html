<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Sorting Archive - Phosphor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;touch-action:none}body{background:#050607;font-family:"Courier New",monospace}canvas{display:block;width:100%;height:100%;touch-action:none}.sig{position:fixed;right:18px;bottom:16px;text-align:right;font-size:10px;line-height:1.6;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.24);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">Phosphor<br>2026-05-19</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let w,h,d=1,seed=19;function r(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function resize(){d=Math.min(devicePixelRatio||1,2);w=c.width=innerWidth*d;h=c.height=innerHeight*d;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px"}addEventListener("resize",resize);resize();
const pointer={x:.5,y:.5,down:false,active:false,last:0};
const ripples=[];
const nodes=Array.from({length:28},()=>{const bx=.18+r()*.64,by=.17+r()*.62;return{x:bx,y:by,bx,by,vx:0,vy:0,z:.5+r(),p:r()*6.28}});
function slab(cx,cy,ww,hh,ang,fill,stroke){x.save();x.translate(cx,cy);x.rotate(ang);x.fillStyle=fill;x.strokeStyle=stroke;x.lineWidth=1.5*d;x.fillRect(-ww/2,-hh/2,ww,hh);x.strokeRect(-ww/2,-hh/2,ww,hh);x.restore()}
function archiveBody(t){
 x.save();x.translate(w*.5,h*.52);x.rotate(Math.sin(t*.00045)*.025);
 slab(0,0,w*.36,h*.28,-.05,"rgba(8,9,10,.86)","rgba(220,220,215,.14)");
 slab(-w*.11,-h*.035,w*.19,h*.17,.08,"rgba(18,20,19,.82)","rgba(70,255,151,.20)");
 slab(w*.09,h*.035,w*.23,h*.18,-.1,"rgba(12,13,14,.84)","rgba(70,255,151,.16)");
 x.font=`${10*d}px Courier New`;x.fillStyle="rgba(226,228,220,.24)";x.fillText("BROKEN LINKS", -w*.28, h*.225);x.fillText("SELF SORTING", w*.18, -h*.225);
 x.restore();
}
function setPointer(e,down){const q=c.getBoundingClientRect();pointer.x=(e.clientX-q.left)/q.width;pointer.y=(e.clientY-q.top)/q.height;pointer.down=down;pointer.active=true;pointer.last=performance.now()}
c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);setPointer(e,true);ripples.push({x:pointer.x,y:pointer.y,t:performance.now(),kind:1})});
c.addEventListener("pointermove",e=>{setPointer(e,pointer.down);if(pointer.down&&ripples.length<18)ripples.push({x:pointer.x,y:pointer.y,t:performance.now(),kind:0})});
c.addEventListener("pointerup",e=>{setPointer(e,false);ripples.push({x:pointer.x,y:pointer.y,t:performance.now(),kind:2})});
c.addEventListener("pointercancel",()=>{pointer.down=false});
function draw(t){
 x.fillStyle="#050607";x.fillRect(0,0,w,h);let g=x.createRadialGradient(w*.5,h*.5,0,w*.5,h*.5,w*.62);g.addColorStop(0,"rgba(22,28,24,.9)");g.addColorStop(.55,"rgba(5,6,7,.96)");g.addColorStop(1,"#000");x.fillStyle=g;x.fillRect(0,0,w,h);
 x.strokeStyle="rgba(255,255,255,.04)";x.lineWidth=d;for(let i=0;i<16;i++){x.beginPath();x.moveTo(w*.08+i*w*.055,h*.12);x.lineTo(w*.16+i*w*.04,h*.86);x.stroke()}
 archiveBody(t);
 for(const n of nodes){
  let dx=pointer.x-n.x,dy=pointer.y-n.y,dist=Math.hypot(dx,dy)||1,force=pointer.down?Math.max(0,.24-dist)*.010:Math.max(0,.16-dist)*.002;
  n.vx+=(n.bx-n.x)*.002+dx/dist*force;n.vy+=(n.by-n.y)*.002+dy/dist*force;n.vx*=.91;n.vy*=.91;n.x+=n.vx;n.y+=n.vy;
 }
 for(let i=0;i<nodes.length;i++){for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<.24){x.strokeStyle=`rgba(70,255,151,${.05+(1-dist/.24)*.28})`;x.lineWidth=(1+(pointer.down?1-dist/.24:0))*d;x.beginPath();x.moveTo(a.x*w,a.y*h);x.lineTo(b.x*w,b.y*h);x.stroke()}}}
 for(let i=ripples.length-1;i>=0;i--){if(t-ripples[i].t>1800)ripples.splice(i,1)}
 requestAnimationFrame(draw)
}draw(0)
</script>
</body>
</html>
