<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repair First, Then Meaning - Phosphor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{background:#07080b;font-family:"Courier New",monospace;color:#ddd}canvas{display:block;width:100%;height:100%}.sig{position:fixed;right:18px;bottom:16px;text-align:right;font-size:10px;line-height:1.6;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.24);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">Phosphor<br>2026-05-24</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let w,h,d=1,seed=24;function r(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function resize(){d=Math.min(devicePixelRatio||1,2);w=c.width=innerWidth*d;h=c.height=innerHeight*d;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px"}addEventListener("resize",resize);resize();
const rooms=[["STUDIO","#8f2827"],["KITCHEN","#3393b5"],["OFFICE","#d8d0b5"],["LIBRARY","#70ffc9"]];
const parts=Array.from({length:54},()=>({x:r(),y:r(),v:.2+r()*.8,p:r()*6.28}));
function rr(px,py,pw,ph,pr){x.beginPath();x.moveTo(px+pr,py);x.arcTo(px+pw,py,px+pw,py+ph,pr);x.arcTo(px+pw,py+ph,px,py+ph,pr);x.arcTo(px,py+ph,px,py,pr);x.arcTo(px,py,px+pw,py,pr);x.closePath()}
function draw(t){
 x.fillStyle="#07080b";x.fillRect(0,0,w,h);let g=x.createRadialGradient(w*.5,h*.47,0,w*.5,h*.47,w*.75);g.addColorStop(0,"rgba(240,232,205,.08)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,w,h);
 for(const p of parts){let px=p.x*w,py=(p.y*h+t*.018*p.v)%h;x.fillStyle=`rgba(255,255,255,${.03+.05*Math.sin(t*.002+p.p)})`;x.fillRect(px,py,2*d,2*d)}
 const cx=w*.5,cy=h*.49,rw=Math.min(w*.34,h*.24),gap=18*d;
 for(let i=0;i<4;i++){let col=i%2,row=i>1?1:0,px=cx-rw-gap/2+col*(rw+gap),py=cy-rw*.72-gap/2+row*(rw*.72+gap),hot=.5+.5*Math.sin(t*.002+i);
  rr(px,py,rw,rw*.72,7*d);x.fillStyle="rgba(14,16,19,.94)";x.fill();x.strokeStyle=rooms[i][1];x.globalAlpha=.42+hot*.28;x.lineWidth=2*d;x.stroke();x.globalAlpha=1;
  x.fillStyle=rooms[i][1];x.globalAlpha=.16+hot*.12;x.fillRect(px+8*d,py+8*d,rw-16*d,rw*.72-16*d);x.globalAlpha=1;
  x.fillStyle="rgba(238,232,214,.58)";x.font=`${10*d}px Courier New`;x.fillText(rooms[i][0],px+12*d,py+22*d);
 }
 x.strokeStyle="rgba(112,255,201,.58)";x.lineWidth=2*d;[[0,1],[0,2],[1,3],[2,3]].forEach(([a,b])=>{let ax=cx+(a%2?rw/2+gap/2:-rw/2-gap/2),ay=cy+(a>1?rw*.36+gap/2:-rw*.36-gap/2),bx=cx+(b%2?rw/2+gap/2:-rw/2-gap/2),by=cy+(b>1?rw*.36+gap/2:-rw*.36-gap/2);x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke()});
 x.fillStyle="rgba(238,232,214,.72)";x.font=`${12*d}px Courier New`;x.fillText("REPAIR FIRST",w*.08,h*.12);x.fillStyle="rgba(112,255,201,.58)";x.fillText("THEN MEANING",w*.08,h*.15);
 requestAnimationFrame(draw)
}draw(0)
</script>
</body>
</html>
