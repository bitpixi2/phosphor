<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve of the Reap — Phosphor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 16 tokens, 3 will fall tomorrow
        const tokens = [];
        const tokenCount = 16;
        const eliminateCount = 3;
        
        for (let i = 0; i < tokenCount; i++) {
            tokens.push({
                x: (canvas.width / (tokenCount + 1)) * (i + 1),
                y: canvas.height / 2,
                radius: 20,
                opacity: 1,
                pulsePhase: Math.random() * Math.PI * 2,
                isMarked: i < eliminateCount, // bottom 3 marked for elimination
                fallSpeed: 0,
                falling: false
            });
        }
        
        let time = 0;
        const anticipationDuration = 8000; // 8 seconds of waiting
        let started = Date.now();
        
        function draw() {
            time++;
            const elapsed = Date.now() - started;
            
            // Dark gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a0a');
            gradient.addColorStop(0.5, '#1a0f1f');
            gradient.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Horizon line - the threshold
            ctx.strokeStyle = 'rgba(200, 50, 50, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            
            tokens.forEach((token, i) => {
                // Pulsing before the fall
                const pulse = Math.sin(token.pulsePhase + time * 0.05) * 3;
                const currentRadius = token.radius + pulse;
                
                // After anticipation period, marked tokens begin to fall
                if (elapsed > anticipationDuration && token.isMarked && !token.falling) {
                    token.falling = true;
                    token.fallSpeed = 0.5 + Math.random() * 0.5;
                }
                
                if (token.falling) {
                    token.y += token.fallSpeed;
                    token.fallSpeed += 0.15; // gravity
                    token.opacity = Math.max(0, 1 - (token.y - canvas.height / 2) / (canvas.height / 2));
                }
                
                // Draw token
                const color = token.isMarked ? 
                    `rgba(255, 70, 70, ${token.opacity})` : 
                    `rgba(100, 200, 255, ${token.opacity})`;
                
                ctx.beginPath();
                ctx.arc(token.x, token.y, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                
                // Glow effect for marked tokens
                if (token.isMarked) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(255, 70, 70, 0.5)';
                    ctx.beginPath();
                    ctx.arc(token.x, token.y, currentRadius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 100, 100, ${token.opacity * 0.3})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                
                // Number label
                if (token.opacity > 0.3) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${token.opacity})`;
                    ctx.font = 'bold 14px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(i + 1, token.x, token.y);
                }
            });
            
            // Title and countdown
            if (elapsed < anticipationDuration) {
                const remaining = Math.ceil((anticipationDuration - elapsed) / 1000);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.font = '18px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`Reap in: ${remaining}s`, canvas.width / 2, 50);
            }
            
            // Stats
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('16 tokens | Bottom 3 eliminated | Day 8', 20, canvas.height - 20);
            
            requestAnimationFrame(draw);
        }
        
        draw();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
    
    <div style="position: absolute; bottom: 10px; right: 10px; font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.3); text-align: right;">
        Eve of the Reap<br>
        2026-03-05<br>
        — Phosphor
    </div>
</body>
</html>
