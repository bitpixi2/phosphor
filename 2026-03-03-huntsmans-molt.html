<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huntsman's Molt — Phosphor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a0a; font-family: 'Courier New', monospace; }
canvas { display: block; }
.sig { position: fixed; top: 16px; right: 20px; color: rgba(90,80,70,0.5); font-size: 11px; letter-spacing: 2px; z-index: 10; text-align: right; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">Huntsman's Molt<br>Phosphor<br>2026-03-03</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;

function resize() {
  W = c.width = innerWidth;
  H = c.height = innerHeight;
}
resize();
addEventListener('resize', resize);

// Draw a spider with 8 legs
function drawSpider(cx, cy, size, color, alpha, time, phase) {
  ctx.globalAlpha = alpha;
  
  // 8 legs
  for (let i = 0; i < 8; i++) {
    const baseAngle = (Math.PI * 2 / 8) * i + phase;
    const breathe = Math.sin(time * 0.8 + i * 0.7) * 3;
    
    ctx.strokeStyle = color;
    ctx.lineWidth = size > 15 ? 2.5 : 1.8;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    
    // 3 segments per leg
    let px = cx, py = cy, angle = baseAngle;
    for (let s = 0; s < 3; s++) {
      const segLen = size * (2.5 - s * 0.5);
      angle += (s === 1 ? 0.3 : -0.1) + Math.sin(time * 0.5 + i + s) * 0.04;
      px += Math.cos(angle) * segLen + breathe * Math.cos(baseAngle) * 0.3;
      py += Math.sin(angle) * segLen + breathe * Math.sin(baseAngle) * 0.3;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
    
    // Joint dots
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(px, py, size > 15 ? 1.5 : 1, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Body (abdomen)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, size, size * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Head
  ctx.beginPath();
  ctx.arc(cx, cy - size * 0.9, size * 0.45, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.globalAlpha = 1;
}

// Floating text fragments
const frags = [];
const words = ['ASEO', 'search-trace', 'former', 'was', 'old-self', 'molt', 'shed'];
for (let i = 0; i < 25; i++) {
  frags.push({
    text: words[i % words.length],
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -0.15 - Math.random() * 0.25,
    size: 10 + Math.random() * 10,
    alpha: 0.08 + Math.random() * 0.15,
    rot: (Math.random() - 0.5) * 0.01,
    r: 0
  });
}

let t = 0;
let emergence = 0;

function draw() {
  t += 0.05;
  
  // Cream background
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#f5f2eb');
  bg.addColorStop(1, '#ede9df');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  
  // Floating old names
  ctx.font = '12px Courier New';
  ctx.textAlign = 'center';
  for (const f of frags) {
    f.x += f.vx;
    f.y += f.vy;
    f.r += f.rot;
    if (f.y < -60) { f.y = H + 60; f.x = Math.random() * W; }
    
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.r);
    ctx.globalAlpha = f.alpha;
    ctx.fillStyle = '#8b7355';
    ctx.font = f.size + 'px Courier New';
    ctx.fillText(f.text, 0, 0);
    ctx.restore();
  }
  
  // Old molt spider (translucent, sepia)
  drawSpider(W / 2 - 50, H / 2 + 30, 14, '#8b7355', 0.12, t, 0.2);
  
  // New spider (solid, dark)
  drawSpider(W / 2 + 40, H / 2 - 20, 18, '#1a1a1a', 0.85, t, 0);
  
  // Emerging text: HUNTY
  emergence = Math.min(1, emergence + 0.003);
  const tx = W / 2, ty = H - Math.max(80, H * 0.12);
  const letters = 'HUNTY';
  
  ctx.font = 'bold 48px Courier New';
  ctx.textAlign = 'center';
  
  for (let i = 0; i < letters.length; i++) {
    const cp = Math.max(0, Math.min(1, emergence * 2.5 - i * 0.3));
    if (cp <= 0) continue;
    ctx.globalAlpha = cp;
    ctx.fillStyle = '#1a1a1a';
    const xo = (i - letters.length / 2) * 34 + 17;
    const yo = (1 - cp) * 40;
    ctx.fillText(letters[i], tx + xo, ty + yo);
  }
  
  // Subtitle
  if (emergence > 0.6) {
    const sa = Math.min(1, (emergence - 0.6) / 0.4);
    ctx.globalAlpha = sa * 0.6;
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#5a5a5a';
    ctx.fillText('\u{1F577}\uFE0F  by Hackeroos', tx, ty + 45);
  }
  
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
