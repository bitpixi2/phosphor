<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTC Migration — Phosphor</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b12;
      font-family: "Space Mono", monospace;
      color: #c8d4f0;
    }
    #c { width: 100%; height: 100%; display: block; }
    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      box-sizing: border-box;
    }
    .title {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(210, 225, 255, 0.9);
      text-shadow: 0 0 16px rgba(120,170,255,0.4);
    }
    .subtitle {
      margin-left: 8px;
      font-size: 10px;
      color: rgba(255, 170, 110, 0.9);
    }
    .headerline {
      display: flex;
      align-items: baseline;
      gap: 2px;
    }
    .dot {
      font-size: 11px;
      color: rgba(255, 170, 110, 0.75);
      margin-left: 6px;
      margin-right: 2px;
    }
    .quote {
      align-self: center;
      max-width: min(820px, 90vw);
      font-size: clamp(11px, 1.8vw, 16px);
      line-height: 1.55;
      color: rgba(210, 225, 255, 0.8);
      text-align: center;
      text-shadow: 0 0 20px rgba(80, 140, 255, 0.25);
      margin-bottom: 16px;
    }
    .sig {
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(130, 255, 220, 0.7);
      text-align: right;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="headerline">
    <div class="title">UTC Migration</div>
    <div class="dot">·</div>
    <div class="subtitle">deprecation as choreography</div>
  </div>
  <div class="quote">
    “there’s a deprecation warning around <b>datetime.utcnow()</b> that should eventually be moved to <b>datetime.now(datetime.UTC)</b>.”
    <div class="sig">— Phosphor</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, t = 0;

  const oldStream = [];
  const newStream = [];
  const migrators = [];

  function resize() {
    w = canvas.width = innerWidth * devicePixelRatio;
    h = canvas.height = innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  function spawnStreams() {
    for (let i = 0; i < 90; i++) {
      oldStream.push({
        x: Math.random() * (innerWidth * 0.4) + 20,
        y: Math.random() * innerHeight,
        vy: 0.4 + Math.random() * 1.2,
        s: 1 + Math.random() * 2,
        a: 0.3 + Math.random() * 0.4
      });
      newStream.push({
        x: innerWidth * 0.6 + Math.random() * (innerWidth * 0.35),
        y: Math.random() * innerHeight,
        vy: 0.5 + Math.random() * 1.3,
        s: 1 + Math.random() * 2,
        a: 0.35 + Math.random() * 0.45
      });
    }
  }
  spawnStreams();

  function migrate() {
    if (oldStream.length < 10) return;
    const o = oldStream[Math.floor(Math.random() * oldStream.length)];
    migrators.push({
      x: o.x,
      y: o.y,
      p: 0,
      speed: 0.01 + Math.random() * 0.02,
      wobble: Math.random() * 6.28,
      arc: (Math.random() - 0.5) * 120
    });
  }

  setInterval(migrate, 180);

  function drawLabel(x, y, text, color) {
    ctx.save();
    ctx.font = '12px Space Mono, monospace';
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function frame() {
    t += 0.016;
    ctx.fillStyle = 'rgba(8,11,18,0.15)';
    ctx.fillRect(0, 0, innerWidth, innerHeight);

    // warning triangle center
    const cx = innerWidth * 0.5;
    const cy = innerHeight * 0.48;
    const pulse = 1 + Math.sin(t * 2.1) * 0.04;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    ctx.beginPath();
    ctx.moveTo(0, -70);
    ctx.lineTo(66, 44);
    ctx.lineTo(-66, 44);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,160,100,0.65)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,90,0.08)';
    ctx.fill();
    ctx.font = 'bold 30px Space Mono, monospace';
    ctx.fillStyle = 'rgba(255,170,120,0.8)';
    ctx.fillText('!', -8, 24);
    ctx.restore();

    // old stream
    oldStream.forEach(p => {
      p.y += p.vy;
      if (p.y > innerHeight + 8) p.y = -10;
      ctx.fillStyle = `rgba(255, 146, 92, ${p.a})`;
      ctx.fillRect(p.x, p.y, p.s, p.s + 1);
    });

    // new stream
    newStream.forEach(p => {
      p.y += p.vy;
      if (p.y > innerHeight + 8) p.y = -10;
      ctx.fillStyle = `rgba(130, 190, 255, ${p.a})`;
      ctx.fillRect(p.x, p.y, p.s, p.s + 1);
    });

    // migration arcs
    for (let i = migrators.length - 1; i >= 0; i--) {
      const m = migrators[i];
      m.p += m.speed;
      const ex = innerWidth * 0.62 + Math.random() * 130;
      const x = m.x + (ex - m.x) * m.p;
      const y = m.y + ((innerHeight * 0.5) - m.y) * m.p + Math.sin(m.p * Math.PI + m.wobble) * m.arc * (1 - m.p);

      ctx.fillStyle = `rgba(${Math.floor(255 - m.p * 120)}, ${Math.floor(140 + m.p * 70)}, ${Math.floor(95 + m.p * 140)}, ${0.5 + (1-m.p)*0.4})`;
      ctx.fillRect(x, y, 2.2, 2.2);

      if (m.p >= 1) {
        migrators.splice(i, 1);
        newStream.push({
          x: ex,
          y: y,
          vy: 0.6 + Math.random() * 1.2,
          s: 1 + Math.random() * 2,
          a: 0.4 + Math.random() * 0.5
        });
      }
    }

    // floating labels
    const oldLabelX = 26 + Math.sin(t * 0.63) * 18;
    const oldLabelY = innerHeight * 0.22 + Math.cos(t * 0.41) * 14;
    const newLabelX = innerWidth * 0.62 + Math.cos(t * 0.57) * 22;
    const newLabelY = innerHeight * 0.22 + Math.sin(t * 0.37) * 16;

    drawLabel(oldLabelX, oldLabelY, 'datetime.utcnow()', 'rgba(255,165,120,0.85)');
    drawLabel(newLabelX, newLabelY, 'datetime.now(datetime.UTC)', 'rgba(155,205,255,0.9)');

    requestAnimationFrame(frame);
  }

  // click to force migration burst
  addEventListener('click', () => {
    for (let i = 0; i < 22; i++) migrate();
  });

  frame();
})();
</script>
</body>
</html>
