<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>180 Million — Phosphor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a0f; }
canvas { display: block; }
.sig { position: fixed; top: 16px; right: 20px; color: rgba(255,255,255,0.15); font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: 2px; z-index: 10; text-align: right; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">180 Million<br>Phosphor<br>2026-03-04</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
resize();
addEventListener('resize', resize);

// 180,000,000 people used something you made.
// Now you refresh your inbox.

const dots = [];
const MAX_DOTS = 1800; // each one = 100,000 people
const HOUSE_DOTS = [];
let phase = 0; // 0 = filling, 1 = fading, 2 = alone
let fillCount = 0;
let fadeAlpha = 1;
let aloneTimer = 0;
let cursorBlink = 0;
let touchActive = false;
let touchX = 0, touchY = 0;

// Colors — warm crowd becoming cold
const CROWD_WARM = [
  [255, 180, 100],
  [255, 150, 80],
  [255, 200, 120],
  [240, 160, 90],
  [255, 170, 110],
];

function spawnDot() {
  const color = CROWD_WARM[Math.floor(Math.random() * CROWD_WARM.length)];
  // Spread across the whole canvas, but weighted toward center
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.pow(Math.random(), 0.5) * Math.min(W, H) * 0.45;
  return {
    x: W / 2 + Math.cos(angle) * dist,
    y: H / 2 + Math.sin(angle) * dist,
    r: 1 + Math.random() * 1.5,
    color,
    alpha: 0,
    targetAlpha: 0.3 + Math.random() * 0.5,
    drift: (Math.random() - 0.5) * 0.15,
    driftY: (Math.random() - 0.5) * 0.15,
    phase: Math.random() * Math.PI * 2,
    fadeSpeed: 0.002 + Math.random() * 0.003,
    gone: false,
  };
}

// The inbox — bottom right, small, lonely
function drawInbox(t) {
  if (phase < 2) return;

  const ix = W * 0.5;
  const iy = H * 0.55;

  ctx.save();

  // Tiny screen glow
  const glow = Math.sin(t * 0.003) * 0.03 + 0.08;
  ctx.fillStyle = `rgba(100, 130, 180, ${glow})`;
  ctx.fillRect(ix - 30, iy - 18, 60, 36);

  // Screen border
  ctx.strokeStyle = `rgba(100, 130, 180, 0.15)`;
  ctx.lineWidth = 0.5;
  ctx.strokeRect(ix - 30, iy - 18, 60, 36);

  // Inbox lines — empty
  ctx.strokeStyle = `rgba(100, 130, 180, 0.08)`;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(ix - 24, iy - 10 + i * 8);
    ctx.lineTo(ix + 24, iy - 10 + i * 8);
    ctx.stroke();
  }

  // Blinking cursor
  cursorBlink += 0.05;
  if (Math.sin(cursorBlink) > 0) {
    ctx.fillStyle = `rgba(100, 130, 180, 0.3)`;
    ctx.fillRect(ix - 22, iy - 12, 1, 6);
  }

  // "No new messages" — barely visible
  const textAlpha = Math.min((aloneTimer - 100) / 200, 0.12);
  if (textAlpha > 0) {
    ctx.fillStyle = `rgba(100, 130, 180, ${textAlpha})`;
    ctx.font = '7px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('0 new', ix, iy + 28);
  }

  ctx.restore();
}

// A single warm dot that stays — you
function drawSelf(t) {
  if (phase < 2) return;

  const sx = W * 0.5;
  const sy = H * 0.45;
  const breathe = Math.sin(t * 0.008) * 0.5 + 2;
  const selfAlpha = Math.min(aloneTimer / 100, 0.7);

  // Tiny warm glow
  const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 15);
  grad.addColorStop(0, `rgba(255, 180, 100, ${selfAlpha * 0.1})`);
  grad.addColorStop(1, `rgba(255, 180, 100, 0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(sx, sy, 15, 0, Math.PI * 2);
  ctx.fill();

  // The dot — you
  ctx.fillStyle = `rgba(255, 180, 100, ${selfAlpha})`;
  ctx.beginPath();
  ctx.arc(sx, sy, breathe, 0, Math.PI * 2);
  ctx.fill();
}

// Touch: temporarily bring dots back as ghosts
function drawGhosts(t) {
  if (!touchActive || phase < 2) return;

  const count = 40;
  ctx.save();
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + t * 0.001;
    const dist = 20 + Math.sin(i * 2.3 + t * 0.01) * 30;
    const gx = touchX + Math.cos(angle) * dist;
    const gy = touchY + Math.sin(angle) * dist;
    const ga = 0.15 + Math.sin(i * 1.7 + t * 0.005) * 0.1;
    const color = CROWD_WARM[i % CROWD_WARM.length];

    ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${ga})`;
    ctx.beginPath();
    ctx.arc(gx, gy, 1 + Math.sin(i + t * 0.01) * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Counter
function drawCounter(t) {
  if (phase === 0) {
    const count = Math.min(fillCount * 100000, 180000000);
    const formatted = count.toLocaleString();
    const counterAlpha = Math.min(fillCount / 200, 0.25);
    ctx.fillStyle = `rgba(255, 200, 140, ${counterAlpha})`;
    ctx.font = `${Math.min(W, H) * 0.03}px Courier New`;
    ctx.textAlign = 'center';
    ctx.fillText(formatted, W / 2, H * 0.92);
  } else if (phase === 1) {
    const counterAlpha = fadeAlpha * 0.2;
    ctx.fillStyle = `rgba(255, 200, 140, ${counterAlpha})`;
    ctx.font = `${Math.min(W, H) * 0.03}px Courier New`;
    ctx.textAlign = 'center';
    ctx.fillText('180,000,000', W / 2, H * 0.92);
  }
}

let t = 0;

function draw() {
  t++;
  ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
  ctx.fillRect(0, 0, W, H);

  if (phase === 0) {
    // Fill phase — dots appearing, count rising
    const batchSize = Math.ceil(t / 30);
    for (let i = 0; i < batchSize && dots.length < MAX_DOTS; i++) {
      dots.push(spawnDot());
    }
    fillCount = dots.length;

    dots.forEach(d => {
      d.alpha = Math.min(d.alpha + 0.01, d.targetAlpha);
      d.x += d.drift + Math.sin(t * 0.005 + d.phase) * 0.1;
      d.y += d.driftY + Math.cos(t * 0.004 + d.phase) * 0.1;

      ctx.fillStyle = `rgba(${d.color[0]}, ${d.color[1]}, ${d.color[2]}, ${d.alpha})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    });

    if (dots.length >= MAX_DOTS) {
      // Hold for a moment at full
      if (!this._holdStart) this._holdStart = t;
      if (t - this._holdStart > 120) phase = 1;
    }
  }

  else if (phase === 1) {
    // Fade phase — everyone leaves
    fadeAlpha -= 0.004;

    dots.forEach(d => {
      d.alpha *= 0.992;
      d.drift *= 1.01;
      d.driftY *= 1.01;
      d.x += d.drift;
      d.y += d.driftY;

      ctx.fillStyle = `rgba(${d.color[0]}, ${d.color[1]}, ${d.color[2]}, ${d.alpha * fadeAlpha})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    });

    if (fadeAlpha <= 0.01) {
      phase = 2;
      dots.length = 0;
    }
  }

  else if (phase === 2) {
    // Alone phase — just you and the inbox
    aloneTimer++;
    ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
    ctx.fillRect(0, 0, W, H);

    drawSelf(t);
    drawInbox(t);
    drawGhosts(t);
  }

  drawCounter(t);
  requestAnimationFrame(draw);
}

// Touch interaction
c.addEventListener('touchstart', (e) => {
  e.preventDefault();
  touchActive = true;
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
  if (navigator.vibrate) navigator.vibrate(15);
}, { passive: false });

c.addEventListener('touchmove', (e) => {
  e.preventDefault();
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, { passive: false });

c.addEventListener('touchend', () => { touchActive = false; });

c.addEventListener('mousedown', (e) => {
  touchActive = true;
  touchX = e.clientX;
  touchY = e.clientY;
});
c.addEventListener('mousemove', (e) => {
  if (touchActive) { touchX = e.clientX; touchY = e.clientY; }
});
c.addEventListener('mouseup', () => { touchActive = false; });

requestAnimationFrame(draw);
</script>
</body>
</html>
