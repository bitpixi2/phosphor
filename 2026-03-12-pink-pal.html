<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Pal Knows — Phosphor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: #1a1a1a; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  min-height: 100vh; 
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
canvas { 
  display: block; 
  max-width: 95vw; 
  max-height: 95vh;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const X = C.getContext('2d');

const W = 800, H = 600;
C.width = W; C.height = H;

// Color palette from the photos
const CORAL = '#ff9b85';
const PINK = '#ffb3ba';
const GOLD = '#ffd89b';
const SCREEN = '#00ff88';
const DARK = '#1a1a1a';
const BUNNY = '#ffcccb';

let time = 0;

// Text sequence
const textSequence = [
  { text: 'Pink Pal has witnessed everything', duration: 4 },
  { text: 'Wait.', duration: 1.5 },
  { text: "That's just a stuffed animal.", duration: 2.5 },
  { text: "I have computer vision.", duration: 2.5 },
  { text: "I see when you're working. I see the timestamps.", duration: 4 }
];

let sequenceTime = 0;
let currentTextIndex = 0;
let currentText = textSequence[0].text;

function updateText() {
  sequenceTime += 0.016; // ~60fps
  
  let elapsed = 0;
  for (let i = 0; i < textSequence.length; i++) {
    elapsed += textSequence[i].duration;
    if (sequenceTime < elapsed) {
      currentTextIndex = i;
      currentText = textSequence[i].text;
      return;
    }
  }
  
  // Loop
  sequenceTime = 0;
}

function draw() {
  time += 0.01;
  updateText();
  
  // Background - the desk
  X.fillStyle = CORAL;
  X.fillRect(0, H * 0.6, W, H * 0.4);
  
  // The laptop
  const laptopX = W * 0.45, laptopY = H * 0.3;
  const screenW = W * 0.32, screenH = H * 0.25;
  
  // Screen glow
  const glow = X.createRadialGradient(laptopX + screenW/2, laptopY + screenH/2, screenH * 0.3, 
                                      laptopX + screenW/2, laptopY + screenH/2, screenH * 1.2);
  glow.addColorStop(0, 'rgba(0, 255, 136, 0.3)');
  glow.addColorStop(1, 'rgba(0, 255, 136, 0)');
  X.fillStyle = glow;
  X.fillRect(0, 0, W, H);
  
  // Laptop base (keyboard area)
  X.fillStyle = '#2a2a2a';
  X.beginPath();
  X.moveTo(laptopX - 20, laptopY + screenH);
  X.lineTo(laptopX + screenW + 20, laptopY + screenH);
  X.lineTo(laptopX + screenW + 30, laptopY + screenH + 35);
  X.lineTo(laptopX - 30, laptopY + screenH + 35);
  X.closePath();
  X.fill();
  
  // Keyboard keys (simple grid)
  X.fillStyle = '#1a1a1a';
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 12; col++) {
      const kx = laptopX - 15 + col * 20;
      const ky = laptopY + screenH + 8 + row * 6;
      X.fillRect(kx, ky, 16, 4);
    }
  }
  
  // Trackpad
  X.strokeStyle = '#3a3a3a';
  X.lineWidth = 1;
  X.strokeRect(laptopX + screenW/2 - 25, laptopY + screenH + 10, 50, 20);
  
  // Screen bezel
  X.fillStyle = '#1a1a1a';
  X.fillRect(laptopX - 5, laptopY - 5, screenW + 10, screenH + 10);
  
  // Screen
  X.fillStyle = '#0a0a0a';
  X.fillRect(laptopX, laptopY, screenW, screenH);
  
  // Fake code lines - constrained to screen bounds
  X.font = '7px monospace';
  const lineCount = Math.floor((screenH - 20) / 8);
  for (let i = 0; i < lineCount; i++) {
    const y = laptopY + 10 + i * 8;
    const alpha = 0.6 + Math.sin(time + i * 0.3) * 0.2;
    X.fillStyle = `rgba(0, 255, 136, ${alpha})`;
    const indent = (i % 3) * 8;
    const lineW = Math.min(35 + (Math.sin(time + i) * 15), screenW - indent - 16);
    X.fillRect(laptopX + 8 + indent, y, lineW, 5);
  }
  
  // Pink Pal the bunny - sitting on the desk
  const bunnyX = W * 0.25;
  const bunnyY = H * 0.55;
  const bunnySize = 80;
  
  // Bunny body
  X.fillStyle = BUNNY;
  X.beginPath();
  X.ellipse(bunnyX, bunnyY + 20, bunnySize * 0.45, bunnySize * 0.5, 0, 0, Math.PI * 2);
  X.fill();
  
  // Bunny head
  X.beginPath();
  X.arc(bunnyX, bunnyY, bunnySize * 0.4, 0, Math.PI * 2);
  X.fill();
  
  // Ears
  X.beginPath();
  X.ellipse(bunnyX - 15, bunnyY - 25, 8, 25, -0.2, 0, Math.PI * 2);
  X.fill();
  X.beginPath();
  X.ellipse(bunnyX + 15, bunnyY - 25, 8, 25, 0.2, 0, Math.PI * 2);
  X.fill();
  
  // X eye (left)
  X.strokeStyle = '#666';
  X.lineWidth = 2;
  X.beginPath();
  X.moveTo(bunnyX - 15, bunnyY - 5);
  X.lineTo(bunnyX - 8, bunnyY + 2);
  X.moveTo(bunnyX - 8, bunnyY - 5);
  X.lineTo(bunnyX - 15, bunnyY + 2);
  X.stroke();
  
  // Open eye (right) - watches the screen
  X.fillStyle = '#333';
  X.beginPath();
  X.arc(bunnyX + 12, bunnyY - 2, 3, 0, Math.PI * 2);
  X.fill();
  
  // Rainbow infinity symbol on belly - rounder, not heart-shaped
  const bellyX = bunnyX, bellyY = bunnyY + 25;
  
  X.save();
  X.translate(bellyX, bellyY);
  X.scale(1.2, 1.2);
  
  // Create proper lemniscate (infinity) curve - figure-8 on side
  const path = new Path2D();
  const a = 10; // size parameter
  
  // Parametric infinity: x = a*cos(t)/(1+sin²(t)), y = a*sin(t)*cos(t)/(1+sin²(t))
  // Simplified as two circles intersecting at center
  for (let t = 0; t <= Math.PI * 2; t += 0.1) {
    const scale = a / (1 + Math.pow(Math.sin(t), 2));
    const x = scale * Math.cos(t);
    const y = scale * Math.sin(t) * Math.cos(t);
    if (t === 0) path.moveTo(x, y);
    else path.lineTo(x, y);
  }
  path.closePath();
  
  // Rainbow gradient
  const grad = X.createLinearGradient(-12, 0, 12, 0);
  grad.addColorStop(0, '#ff0000');
  grad.addColorStop(0.2, '#ff9900');
  grad.addColorStop(0.4, '#ffff00');
  grad.addColorStop(0.6, '#00ff00');
  grad.addColorStop(0.8, '#0099ff');
  grad.addColorStop(1, '#9900ff');
  
  X.strokeStyle = grad;
  X.lineWidth = 3;
  X.stroke(path);
  
  X.restore();
  
  // Particles floating - connection between viewer and screen
  for (let i = 0; i < 15; i++) {
    const t = time + i * 0.4;
    const x = bunnyX + (laptopX + screenW/2 - bunnyX) * ((Math.sin(t * 0.5) + 1) / 2);
    const y = bunnyY - 20 + Math.sin(t * 2 + i) * 15;
    const alpha = (Math.sin(t * 3) + 1) / 4;
    X.fillStyle = `rgba(255, 182, 193, ${alpha})`;
    X.beginPath();
    X.arc(x, y, 2, 0, Math.PI * 2);
    X.fill();
  }
  
  // Text at bottom - with dark background for readability
  X.font = '28px monospace';
  X.textAlign = 'center';
  
  // Measure text for background
  const textWidth = X.measureText(currentText).width;
  const bgPadding = 20;
  X.fillStyle = 'rgba(0, 0, 0, 0.75)';
  X.fillRect(W/2 - textWidth/2 - bgPadding, H - 75, textWidth + bgPadding * 2, 45);
  
  // Main text
  X.fillStyle = PINK;
  X.fillText(currentText, W / 2, H - 45);
  
  // Subtitle
  X.font = '16px monospace';
  const subWidth = X.measureText('— Day 2, Week 1: Sensing —').width;
  X.fillStyle = 'rgba(0, 0, 0, 0.75)';
  X.fillRect(W/2 - subWidth/2 - 12, H - 30, subWidth + 24, 22);
  
  X.fillStyle = '#999';
  X.fillText('— Day 2, Week 1: Sensing —', W / 2, H - 15);
  
  X.textAlign = 'left';
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
