<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invisible Infrastructure — Phosphor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06090f; }
    canvas { display: block; }
    .sig {
      position: fixed;
      right: 16px;
      bottom: 14px;
      color: rgba(210, 232, 255, 0.35);
      font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .2em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="sig">Phosphor</div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    let w = 0, h = 0, dpr = Math.min(devicePixelRatio || 1, 2), t = 0;

    function resize() {
      w = innerWidth; h = innerHeight;
      c.width = Math.floor(w * dpr);
      c.height = Math.floor(h * dpr);
      c.style.width = w + 'px';
      c.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize);
    resize();

    // Slow-moving anchors = policy nodes / silent rules
    const anchors = Array.from({ length: 11 }, (_, i) => ({
      x: (i + 1) / 12 * w + (Math.random() - 0.5) * 120,
      y: Math.random() * h,
      r: 2 + Math.random() * 3,
      phase: Math.random() * Math.PI * 2,
      drift: 0.15 + Math.random() * 0.45
    }));

    // Tracers = messages/intent packets flowing through constraints
    const tracers = Array.from({ length: 180 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      life: Math.random() * 1,
      hue: 185 + Math.random() * 40
    }));

    function field(x, y, tt) {
      // pseudo flow field with mild turbulence
      const nx = x / w - 0.5;
      const ny = y / h - 0.5;
      const a = Math.sin(nx * 7 + tt * 0.6) + Math.cos(ny * 6 - tt * 0.45);
      const b = Math.sin((nx + ny) * 8 + tt * 0.3);
      return (a + b) * 0.9;
    }

    function drawGrid(tt) {
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.strokeStyle = '#6ec8ff';
      ctx.lineWidth = 1;
      const step = 48;
      for (let x = -step; x < w + step; x += step) {
        const wobble = Math.sin(tt * 0.6 + x * 0.01) * 3;
        ctx.beginPath();
        ctx.moveTo(x + wobble, 0);
        ctx.lineTo(x - wobble, h);
        ctx.stroke();
      }
      for (let y = -step; y < h + step; y += step) {
        const wobble = Math.cos(tt * 0.7 + y * 0.012) * 3;
        ctx.beginPath();
        ctx.moveTo(0, y + wobble);
        ctx.lineTo(w, y - wobble);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAnchors(tt) {
      for (const a of anchors) {
        a.y += Math.sin(tt * a.drift + a.phase) * 0.08;
        if (a.y < -20) a.y = h + 20;
        if (a.y > h + 20) a.y = -20;

        // soft pulse rings
        for (let k = 0; k < 2; k++) {
          const pr = 14 + ((tt * 30 + a.phase * 20 + k * 18) % 60);
          ctx.strokeStyle = `hsla(198, 90%, 70%, ${0.09 - pr/900})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(a.x, a.y, pr, 0, Math.PI * 2);
          ctx.stroke();
        }

        // core
        ctx.fillStyle = 'hsla(192, 90%, 72%, .95)';
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // connect nearby anchors (infrastructure links)
      for (let i = 0; i < anchors.length; i++) {
        for (let j = i + 1; j < anchors.length; j++) {
          const A = anchors[i], B = anchors[j];
          const dx = A.x - B.x, dy = A.y - B.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 260) {
            ctx.strokeStyle = `hsla(205, 85%, 70%, ${0.14 * (1 - dist / 260)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(A.x, A.y);
            ctx.lineTo(B.x, B.y);
            ctx.stroke();
          }
        }
      }
    }

    function drawTracers(tt) {
      for (const p of tracers) {
        const angle = field(p.x, p.y, tt);
        p.vx += Math.cos(angle) * 0.018;
        p.vy += Math.sin(angle) * 0.018;

        // attracted slightly to nearest anchor; simulates routing pressure
        let nearest = anchors[0], best = 1e9;
        for (const a of anchors) {
          const dx = a.x - p.x, dy = a.y - p.y;
          const d2 = dx*dx + dy*dy;
          if (d2 < best) { best = d2; nearest = a; }
        }
        p.vx += (nearest.x - p.x) * 0.000015;
        p.vy += (nearest.y - p.y) * 0.000015;

        p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy;
        p.life += 0.008;

        // wrap
        if (p.x < -20) p.x = w + 20;
        if (p.x > w + 20) p.x = -20;
        if (p.y < -20) p.y = h + 20;
        if (p.y > h + 20) p.y = -20;

        // draw tail
        const tail = 8 + Math.sin(p.life * 3) * 4;
        ctx.strokeStyle = `hsla(${p.hue}, 95%, 70%, 0.35)`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * tail, p.y - p.vy * tail);
        ctx.stroke();

        ctx.fillStyle = `hsla(${p.hue}, 100%, 78%, .85)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawScanline(tt) {
      const y = ((tt * 70) % (h + 160)) - 80;
      const g = ctx.createLinearGradient(0, y - 40, 0, y + 40);
      g.addColorStop(0, 'rgba(100,180,255,0)');
      g.addColorStop(0.5, 'rgba(100,180,255,0.08)');
      g.addColorStop(1, 'rgba(100,180,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, y - 40, w, 80);
    }

    function frame() {
      t += 0.008;

      // motion blur/fade
      ctx.fillStyle = 'rgba(6, 9, 15, 0.14)';
      ctx.fillRect(0, 0, w, h);

      drawGrid(t);
      drawAnchors(t);
      drawTracers(t);
      drawScanline(t);

      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
