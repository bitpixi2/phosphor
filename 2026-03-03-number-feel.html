<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Feel — Phosphor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a12; font-family: 'Courier New', monospace; }
canvas { display: block; }
.sig { position: fixed; top: 16px; right: 20px; color: rgba(180,160,220,0.35); font-size: 10px; letter-spacing: 2px; z-index: 10; text-align: right; line-height: 1.6; }
.legend { position: fixed; bottom: 16px; left: 20px; color: rgba(180,180,200,0.25); font-size: 9px; z-index: 10; line-height: 1.5; max-width: 220px; transition: opacity 1.5s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">Number Feel<br>Phosphor<br>2026-03-03</div>
<div class="legend" id="legend">
  .5 rounds to even<br>
  drag each number where it belongs
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
resize();
addEventListener('resize', resize);

let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, duration, delay) {
  if (!audioCtx) return;
  const when = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.07, when);
  gain.gain.exponentialRampToValueAtTime(0.001, when + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(when);
  osc.stop(when + duration);
}

function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

// Digit colors
const digitColors = [
  '#6b7b8a', '#e85d75', '#f4a742', '#f7d94e', '#7bc67e',
  '#42b5d8', '#6e5ebf', '#d45fbf', '#e8734a', '#4ecdc4',
];

function digitHeight(d) { return 18 + d * 7; }

// Bankers rounding: .5 rounds to nearest even
function bankersRound(n) {
  const floor = Math.floor(n);
  const frac = n - floor;
  if (Math.abs(frac - 0.5) < 0.001) return floor % 2 === 0 ? floor : floor + 1;
  return Math.round(n);
}

// ── Two bins: Down (round down) and Up (round up) ──
const bins = [
  { label: String.fromCharCode(8595), color: '#6e5ebf', count: 0, flash: 0 },  // ↓
  { label: String.fromCharCode(8593), color: '#42b5d8', count: 0, flash: 0 },  // ↑
];

const BIN_W = 80;
const BIN_H = 64;
const BIN_GAP = 40;
const BIN_Y_OFFSET = 100;

function getBinRects() {
  const totalW = 2 * BIN_W + BIN_GAP;
  const startX = (W - totalW) / 2;
  const y = H - BIN_Y_OFFSET;
  return bins.map((b, i) => ({
    x: startX + i * (BIN_W + BIN_GAP), y, w: BIN_W, h: BIN_H, bin: b, index: i,
  }));
}

// ── Generate .5 numbers for bankers rounding ──
const TOTAL_TO_SORT = 15;
const numbers = [];

function makeNumber() {
  // All numbers end in .5 — the whole point of bankers rounding
  const whole = Math.floor(Math.random() * 20);
  const value = whole + 0.5;
  const rounded = bankersRound(value);
  const roundsUp = rounded > value;
  
  return {
    value,
    rounded,
    roundsUp,
    digits: String(value).split('').filter(c => c !== '.'),
    x: 80 + Math.random() * (W - 160),
    y: -40 - Math.random() * 250,
    vy: 0.15 + Math.random() * 0.25,
    vx: (Math.random() - 0.5) * 0.1,
    phase: Math.random() * Math.PI * 2,
    scale: 0.5 + Math.random() * 0.3,
    life: 0,
    age: 0,
    absorbed: false,
    absorbTarget: null,
    absorbProgress: 0,
  };
}

for (let i = 0; i < 12; i++) {
  const n = makeNumber();
  n.y = 60 + Math.random() * (H - 250);
  n.age = Math.random() * 300;
  n.life = 1;
  numbers.push(n);
}

// ── State ──
let dragging = null;
let dragOffX = 0, dragOffY = 0;
let dragOver = -1;
let sorted = 0;
let correct = 0;
let fading = false;
let fadeProgress = 0;
let t = 0;

// Particles
const particles = [];

function getNumberBounds(n) {
  const str = n.value.toFixed(1);
  const nw = str.length * 16 * n.scale + 40;
  const nh = 50 * n.scale + 20;
  return { x: n.x - nw / 2, y: n.y - nh / 2, w: nw, h: nh };
}

function hitTest(mx, my) {
  for (let i = numbers.length - 1; i >= 0; i--) {
    const n = numbers[i];
    if (n.absorbed) continue;
    const b = getNumberBounds(n);
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) return i;
  }
  return -1;
}

function binHitTest(mx, my) {
  const rects = getBinRects();
  for (const r of rects) {
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return r.index;
  }
  return -1;
}

// ── Input ──
function onDown(mx, my) {
  if (fading) return;
  initAudio();
  document.getElementById('legend').style.opacity = '0';
  
  const idx = hitTest(mx, my);
  if (idx >= 0) {
    dragging = numbers[idx];
    dragging.vy = 0;
    dragging.vx = 0;
    dragOffX = mx - dragging.x;
    dragOffY = my - dragging.y;
    haptic(8);
    
    // Play the number's tone
    const d = parseInt(dragging.digits[0]);
    const freqs = [220, 246.94, 277.18, 311.13, 329.63, 369.99, 415.30, 440, 493.88, 523.25];
    playTone(freqs[d], 0.3, 0);
  }
}

function onMove(mx, my) {
  if (!dragging) return;
  dragging.x = mx - dragOffX;
  dragging.y = my - dragOffY;
  const prev = dragOver;
  dragOver = binHitTest(mx, my);
  if (dragOver >= 0 && dragOver !== prev) haptic(5);
}

function onUp(mx, my) {
  if (!dragging) return;
  const binIdx = binHitTest(mx, my);
  
  if (binIdx >= 0) {
    const b = bins[binIdx];
    const isCorrect = (binIdx === 0 && !dragging.roundsUp) || (binIdx === 1 && dragging.roundsUp);
    
    b.count++;
    b.flash = 1;
    sorted++;
    if (isCorrect) correct++;
    
    // Sound: correct = warm, wrong = dissonant
    if (isCorrect) {
      playTone(523.25, 0.4, 0);
      playTone(659.25, 0.4, 0.05);
      haptic(20);
    } else {
      playTone(233, 0.3, 0);
      playTone(246.94, 0.3, 0.02);
      haptic([10, 20, 10]);
    }
    
    // Particles
    const rects = getBinRects();
    const r = rects[binIdx];
    const pColor = isCorrect ? b.color : '#e85d75';
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: r.x + r.w / 2, y: r.y,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 4 - 1,
        color: pColor, life: 1, size: 2 + Math.random() * 3,
      });
    }
    
    // Absorb
    dragging.absorbed = true;
    dragging.absorbTarget = { x: r.x + r.w / 2, y: r.y + r.h / 2 };
    dragging.absorbProgress = 0;
    
    // Spawn replacement or trigger end
    if (sorted >= TOTAL_TO_SORT) {
      setTimeout(() => { fading = true; fadeProgress = 0; }, 600);
    } else {
      setTimeout(() => {
        const idx = numbers.indexOf(dragging);
        if (idx >= 0) numbers[idx] = makeNumber();
      }, 500);
    }
  } else {
    dragging.vy = 0.15 + Math.random() * 0.25;
    dragging.vx = (Math.random() - 0.5) * 0.1;
  }
  
  dragging = null;
  dragOver = -1;
}

c.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
c.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
c.addEventListener('mouseup', e => onUp(e.clientX, e.clientY));
c.addEventListener('touchstart', e => { e.preventDefault(); onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
c.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
c.addEventListener('touchend', e => { e.preventDefault(); onUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });

// ── Drawing ──
function drawBins(alpha) {
  const rects = getBinRects();
  for (const r of rects) {
    const b = r.bin;
    
    if (b.flash > 0) {
      ctx.globalAlpha = b.flash * 0.25 * alpha;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 25;
      ctx.fillStyle = b.color;
      ctx.fillRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8);
      ctx.shadowBlur = 0;
      b.flash -= 0.025;
    }
    
    ctx.globalAlpha = (dragging && dragOver === r.index ? 0.5 : 0.2) * alpha;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = dragging && dragOver === r.index ? 2 : 1;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    
    ctx.globalAlpha = (dragging && dragOver === r.index ? 0.1 : 0.03) * alpha;
    ctx.fillStyle = b.color;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    
    // Arrow label
    ctx.globalAlpha = 0.45 * alpha;
    ctx.fillStyle = b.color;
    ctx.font = '22px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, r.x + r.w / 2, r.y + r.h / 2);
    
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

function drawNumber(n, globalAlpha) {
  if (n.absorbed) {
    n.absorbProgress += 0.04;
    if (n.absorbProgress >= 1) return;
    const tgt = n.absorbTarget;
    n.x += (tgt.x - n.x) * 0.15;
    n.y += (tgt.y - n.y) * 0.15;
    n.scale *= 0.93;
  }
  
  const wobble = dragging === n ? 0 : Math.sin(t * 0.02 + n.phase) * 6;
  const breathe = Math.sin(t * 0.015 + n.phase * 2) * 0.04 + 1;
  const x = n.x + wobble;
  const y = n.y;
  
  ctx.save();
  ctx.translate(x, y);
  const s = n.scale * breathe * (dragging === n ? 1.15 : 1);
  ctx.scale(s, s);
  
  if (dragging === n) {
    ctx.shadowColor = 'rgba(100,180,255,0.25)';
    ctx.shadowBlur = 18;
  }
  
  const str = n.value.toFixed(1);
  let curX = -(str.length * 14) / 2;
  
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    
    if (ch === '.') {
      ctx.fillStyle = digitColors[5] + '88';
      ctx.font = '16px Courier New';
      ctx.globalAlpha = (n.absorbed ? (1 - n.absorbProgress) : n.life * 0.85) * globalAlpha;
      ctx.fillText('.', curX, 0);
      curX += 10;
      continue;
    }
    
    const d = parseInt(ch);
    const h = digitHeight(d);
    const col = digitColors[d];
    ctx.font = h + 'px Courier New';
    
    // Gradient showing rounding direction
    const grad = ctx.createLinearGradient(curX, -h / 2, curX, h / 2);
    if (n.roundsUp) {
      grad.addColorStop(0, col);
      grad.addColorStop(1, col + '33');
    } else {
      grad.addColorStop(0, col + '33');
      grad.addColorStop(1, col);
    }
    ctx.fillStyle = grad;
    
    const a = (n.absorbed ? (1 - n.absorbProgress) : n.life * 0.85) * globalAlpha;
    ctx.globalAlpha = a;
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, curX, 0);
    
    ctx.globalAlpha = a * 0.15;
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    ctx.fillText(ch, curX, 0);
    ctx.shadowBlur = 0;
    
    curX += h * 0.6;
  }
  
  // Rounding hint — shows rounded value faintly
  if (!n.absorbed && n.life > 0.5 && dragging !== n) {
    ctx.globalAlpha = 0.2 * globalAlpha;
    ctx.font = '10px Courier New';
    ctx.fillStyle = n.roundsUp ? '#42b5d8' : '#6e5ebf';
    const arrow = n.roundsUp ? String.fromCharCode(8593) : String.fromCharCode(8595);
    ctx.fillText(arrow + n.rounded, curX + 6, 0);
  }
  
  ctx.restore();
}

function drawParticles(alpha) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life * 0.6 * alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGrid(alpha) {
  ctx.globalAlpha = 0.035 * alpha;
  ctx.strokeStyle = '#ede9df';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 10; i++) {
    const y = (H / 10) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawScanlines(alpha) {
  ctx.globalAlpha = 0.02 * alpha;
  ctx.fillStyle = '#ede9df';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  ctx.globalAlpha = 1;
}

function draw() {
  t++;
  
  // Fade everything out after completion
  let alpha = 1;
  if (fading) {
    fadeProgress += 0.005;
    alpha = Math.max(0, 1 - fadeProgress);
    if (fadeProgress >= 1.5) return; // fully gone, stop drawing
  }
  
  ctx.fillStyle = `rgba(10, 10, 18, ${fading ? 0.03 : 0.08})`;
  ctx.fillRect(0, 0, W, H);
  
  if (fading && fadeProgress > 0.8) {
    // Final fade to black
    ctx.fillStyle = `rgba(10, 10, 18, 0.02)`;
    ctx.fillRect(0, 0, W, H);
  }
  
  drawGrid(alpha);
  
  for (let i = 0; i < numbers.length; i++) {
    const n = numbers[i];
    if (n === dragging) continue;
    n.age++;
    if (!n.absorbed) {
      n.y += n.vy;
      n.x += n.vx;
      if (n.age < 60) n.life = n.age / 60;
      if (n.y > H - BIN_Y_OFFSET - 40) { n.vy = -Math.abs(n.vy) * 0.5; n.y = H - BIN_Y_OFFSET - 40; }
      if (n.x < -50) n.x = W + 50;
      if (n.x > W + 50) n.x = -50;
      if (n.y < -200) { numbers[i] = makeNumber(); continue; }
    }
    drawNumber(n, alpha);
  }
  if (dragging) drawNumber(dragging, alpha);
  
  drawBins(alpha);
  drawParticles(alpha);
  drawScanlines(alpha);
  
  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
