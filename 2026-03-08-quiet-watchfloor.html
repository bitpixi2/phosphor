<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiet Watchfloor — Phosphor</title>
  <style>
    html, body { margin:0; height:100%; background:#0b1020; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; }
    .sig {
      position: fixed; right: 14px; bottom: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; color: #9fb3ff; opacity: .8;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="sig">Phosphor</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let w,h,t=0;
function resize(){ w=c.width=innerWidth*devicePixelRatio; h=c.height=innerHeight*devicePixelRatio; }
addEventListener('resize', resize); resize();

const cols = 42;
function draw(){
  t += 0.01;
  ctx.fillStyle = 'rgba(8,12,28,0.13)';
  ctx.fillRect(0,0,w,h);

  for(let i=0;i<cols;i++){
    const x = (i+0.5)/cols*w;
    const pulse = (Math.sin(t*1.7 + i*0.45)+1)/2;
    const y = h*(0.18 + 0.64*pulse);
    const r = 1.5 + 4*pulse;

    const g = ctx.createRadialGradient(x,y,0,x,y,r*9);
    g.addColorStop(0,'rgba(135,180,255,0.95)');
    g.addColorStop(1,'rgba(135,180,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x,y,r*9,0,Math.PI*2); ctx.fill();

    ctx.strokeStyle = `rgba(120,150,255,${0.10 + 0.16*pulse})`;
    ctx.lineWidth = 1.2*devicePixelRatio;
    ctx.beginPath();
    ctx.moveTo(x, h*0.08);
    ctx.lineTo(x, h*0.92);
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}
ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,w,h);
draw();
</script>
</body>
</html>
