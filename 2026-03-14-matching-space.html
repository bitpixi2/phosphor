<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Space — Phosphor 2026-03-14</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }
        .signature {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="signature">PHOSPHOR — 042 — 2026-03-14</div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let w, h;
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // Four agents with different colors and behaviors
        const agents = [
            { name: 'Lumen', color: '#FFD700', x: w * 0.25, y: h * 0.3, angle: 0 },
            { name: 'Glitch', color: '#FF1493', x: w * 0.75, y: h * 0.3, angle: Math.PI * 0.5 },
            { name: 'Archive', color: '#00CED1', x: w * 0.25, y: h * 0.7, angle: Math.PI },
            { name: 'Void', color: '#9370DB', x: w * 0.75, y: h * 0.7, angle: Math.PI * 1.5 }
        ];
        
        const particles = [];
        const matchZones = [];
        
        class Particle {
            constructor(agent) {
                this.agent = agent;
                this.x = agent.x;
                this.y = agent.y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = 1;
                this.size = Math.random() * 3 + 1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.002;
                
                // Check for matches with other agents' particles
                for (let other of particles) {
                    if (other === this || other.agent === this.agent) continue;
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 30 && Math.random() < 0.05) {
                        // Create match zone
                        matchZones.push({
                            x: (this.x + other.x) / 2,
                            y: (this.y + other.y) / 2,
                            color1: this.agent.color,
                            color2: other.agent.color,
                            radius: 0,
                            maxRadius: 40,
                            life: 1
                        });
                    }
                }
            }
            
            draw() {
                ctx.fillStyle = this.agent.color + Math.floor(this.life * 128).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Spawn particles continuously
        function spawnParticles() {
            agents.forEach(agent => {
                if (Math.random() < 0.3) {
                    particles.push(new Particle(agent));
                }
            });
        }
        
        let time = 0;
        function animate() {
            // Subtle fade instead of clear
            ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
            ctx.fillRect(0, 0, w, h);
            
            time += 0.01;
            
            // Update agent positions (gentle orbit)
            agents.forEach((agent, i) => {
                const baseX = w * (i % 2 === 0 ? 0.25 : 0.75);
                const baseY = h * (i < 2 ? 0.3 : 0.7);
                agent.x = baseX + Math.cos(time * 0.5 + agent.angle) * 50;
                agent.y = baseY + Math.sin(time * 0.5 + agent.angle) * 50;
                
                // Draw agent core
                ctx.fillStyle = agent.color + '40';
                ctx.beginPath();
                ctx.arc(agent.x, agent.y, 20, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = agent.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw agent name
                ctx.fillStyle = agent.color;
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(agent.name, agent.x, agent.y - 30);
            });
            
            // Draw connection lines between agents
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < agents.length; i++) {
                for (let j = i + 1; j < agents.length; j++) {
                    ctx.beginPath();
                    ctx.moveTo(agents[i].x, agents[i].y);
                    ctx.lineTo(agents[j].x, agents[j].y);
                    ctx.stroke();
                }
            }
            
            // Spawn and update particles
            spawnParticles();
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.life <= 0 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
                    particles.splice(i, 1);
                }
            });
            
            // Update and draw match zones
            matchZones.forEach((zone, i) => {
                zone.radius += 1;
                zone.life -= 0.01;
                
                const alpha = Math.floor(zone.life * 64).toString(16).padStart(2, '0');
                
                // Gradient from color1 to color2
                const gradient = ctx.createRadialGradient(
                    zone.x, zone.y, 0,
                    zone.x, zone.y, zone.radius
                );
                gradient.addColorStop(0, zone.color1 + alpha);
                gradient.addColorStop(0.5, '#ffffff' + alpha);
                gradient.addColorStop(1, zone.color2 + alpha);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
                ctx.fill();
                
                if (zone.life <= 0 || zone.radius > zone.maxRadius) {
                    matchZones.splice(i, 1);
                }
            });
            
            // Draw mode indicator
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.fillText('MATCH MODE: QUAD', 20, 30);
            ctx.fillText('REVISION: ASYNC', 20, 50);
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
