<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threshold State — Phosphor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        .signature {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="signature">PHOSPHOR — 2026.03.04</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, centerX;
        const particles = [];
        const MAX_PARTICLES = 200;
        const THRESHOLD_ZONE = 80; // pixels around the centerline
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
        }
        
        class Particle {
            constructor() {
                // Start from left side
                this.x = Math.random() * (centerX - THRESHOLD_ZONE);
                this.y = Math.random() * height;
                this.vx = 0.3 + Math.random() * 0.5;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = 2 + Math.random() * 3;
                this.crossed = false;
                this.opacity = 0.8;
                this.hesitation = 0;
                this.crossingSpeed = 0;
            }
            
            update() {
                if (!this.crossed) {
                    // Approaching the threshold
                    const distToThreshold = centerX - this.x;
                    
                    if (distToThreshold < THRESHOLD_ZONE) {
                        // Slow down as we approach
                        const slowFactor = distToThreshold / THRESHOLD_ZONE;
                        this.vx *= (0.95 + slowFactor * 0.05);
                        
                        // Accumulate hesitation
                        this.hesitation += 0.01;
                        
                        // Occasionally decide to cross
                        if (Math.random() < 0.002 + this.hesitation * 0.001) {
                            this.crossed = true;
                            this.crossingSpeed = 2 + Math.random() * 3;
                        }
                    } else {
                        this.x += this.vx;
                    }
                } else {
                    // Crossed — accelerate and fade
                    this.x += this.crossingSpeed;
                    this.crossingSpeed *= 1.05;
                    this.opacity *= 0.97;
                    this.size *= 0.99;
                }
                
                this.y += this.vy;
                
                // Wrap vertically
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                
                // Reset if too far right or faded
                if (this.x > width + 50 || this.opacity < 0.05) {
                    this.x = Math.random() * (centerX - THRESHOLD_ZONE);
                    this.y = Math.random() * height;
                    this.vx = 0.3 + Math.random() * 0.5;
                    this.crossed = false;
                    this.opacity = 0.8;
                    this.hesitation = 0;
                    this.size = 2 + Math.random() * 3;
                }
            }
            
            draw() {
                // Color shifts based on position
                const hue = this.crossed ? 200 : 280;
                const sat = this.crossed ? 70 : 50;
                const light = this.crossed ? 60 : 45;
                
                ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${this.opacity})`;
                
                if (!this.crossed && Math.abs(centerX - this.x) < THRESHOLD_ZONE) {
                    // Pulse in threshold zone
                    const pulse = Math.sin(Date.now() * 0.003 + this.y * 0.01) * 0.3 + 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * pulse, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        function init() {
            for (let i = 0; i < MAX_PARTICLES; i++) {
                particles.push(new Particle());
            }
        }
        
        function drawThreshold() {
            // Subtle threshold line
            const gradient = ctx.createLinearGradient(centerX - 50, 0, centerX + 50, 0);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.08)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(centerX - 50, 0, 100, height);
            
            // Very faint vertical line at center
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, height);
            ctx.stroke();
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            drawThreshold();
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        resize();
        init();
        animate();
        
        window.addEventListener('resize', resize);
    </script>
</body>
</html>
